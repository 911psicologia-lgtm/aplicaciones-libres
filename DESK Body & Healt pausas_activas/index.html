function migrateState(s){const base=structuredClone(DEFAULT_STATE); const out={...base,...s,ui:{...base.ui,...(s.ui||{})}}; out.users=Array.isArray(out.users)?out.users:[]; out.records=Array.isArray(out.records)?out.records:[]; out.version=APP_VERSION; if(out.ui.inAppNotifications===undefined) out.ui.inAppNotifications=true; if(out.ui.browserNotifications===undefined) out.ui.browserNotifications=false; const ALL_DAYS=['lun','mar','mié','jue','vie','sáb','dom']; out.users.forEach(u=>{if(!u.profile) u.profile=makeDefaultProfile(u.name||'Usuario'); if(u.profile.notify===undefined) u.profile.notify=true; if(u.profile?.workBlocks){u.profile.workBlocks.forEach(b=>{if(!b.days)b.days=[...ALL_DAYS];if(!b.emotionalLoad)b.emotionalLoad='media';if(b.intervalMin===undefined)b.intervalMin=null;});} if(!Array.isArray(u.profile?.diagnosedConditions)) u.profile.diagnosedConditions=[]; if(!Array.isArray(u.profile?.painZones)) u.profile.painZones=[]; if(!Array.isArray(u.profile?.goals)) u.profile.goals=[]; if(!Array.isArray(u.profile?.restrictions)) u.profile.restrictions=[]; if(!u.plan) u.plan={status:'none',items:[],fingerprint:'',createdAt:null,updatedAt:null,nextDueAt:null}; if(!Array.isArray(u.plan.items)) u.plan.items=[];}); return out;}
function saveState(){try{localStorage.setItem(STORAGE_KEY, JSON.stringify(state));return true;}catch(e){console.error('saveState failed',e);return false;}}
function currentUser(){return state.users.find(u=>u.id===state.activeUserId)||null;}
function setTheme(t){state.ui.theme=t; saveState(); document.documentElement.setAttribute('data-theme',t); const app=$('#app'); if(app) app.setAttribute('data-theme',t);}
function makeDefaultProfile(name='Usuario'){const ALL_DAYS=['lun','mar','mié','jue','vie','sáb','dom']; return {name, occupation:'', workMode:'pantalla', posture:'sentado', screenHours:6, movementLevel:'bajo', painZones:[], goals:['prevenir dolor'], pausePreference:'suave', alertStyle:'visual', notify:true, intervalMin:35, longBreakEveryMin:150, workBlocks:[{id:uid('block'),label:'Bloque flexible de trabajo',start:'08:00',end:'12:00',activity:'pantalla',intensity:'media',days:[...ALL_DAYS],emotionalLoad:'media',intervalMin:null},{id:uid('block'),label:'Bloque flexible de tarde',start:'14:00',end:'17:30',activity:'escritura',intensity:'media',days:[...ALL_DAYS],emotionalLoad:'media',intervalMin:null}], diagnosedConditions:[], restrictions:[], createdAt:nowIso(), updatedAt:nowIso()};}
function createUser(name){const u={id:uid('user'), name:name.trim()||'Usuario', createdAt:nowIso(), profile:makeDefaultProfile(name), plan:{status:'none',items:[],fingerprint:'',createdAt:null,updatedAt:null,nextDueAt:null}, settings:{firstRun:true}}; state.users.push(u); state.activeUserId=u.id; state.ui.tab='profile'; state.ui.tourSeen=false; saveState(); render(); openTour();}
function deleteUser(id){const u=state.users.find(x=>x.id===id); if(!u) return; if(!confirm('¿Eliminar este usuario y sus registros? Esta acción no se puede deshacer.')) return; state.users=state.users.filter(x=>x.id!==id); state.records=state.records.filter(r=>r.userId!==id); if(state.activeUserId===id) state.activeUserId=state.users[0]?.id||null; saveState(); render();}
function switchUser(id){state.activeUserId=id; state.ui.tab='home'; saveState(); render();}

function render(){try{setTheme(state.ui.theme||'light'); const u=currentUser(); $('#app').innerHTML = `${topbar(u)}${u?mainApp(u):loginScreen()}${drawer(u)}${modalShell()}<div class="toast-stack" id="toasts"></div><footer class="footer wrap">${APP_NAME} v${APP_VERSION} &middot; Offline-first &middot; Datos locales</footer>`; bindCommon(); if(u) { bindApp(u); startAlertEngine(); startCountdownUpdater(); }}catch(err){console.error('render failed',err); const app=$('#app'); if(app) app.innerHTML=`<main class="wrap"><div class="card"><h2>No se pudo abrir esta vista</h2><p class="text-sm text-muted">La app detectó un error de renderizado. Vuelve al inicio para continuar sin perder datos.</p><button class="btn btn-primary" id="safeHomeBtn">Volver al inicio</button></div></main><div class="toast-stack" id="toasts"></div>`; $('#safeHomeBtn')?.addEventListener('click',()=>{state.ui.tab='home';saveState();render();});}}

function topbar(u){return `<header class="topbar"><div class="wrap topbar-inner"><div class="brand"><div class="logo">🌿</div><div><span class="brand-name">${APP_NAME}</span><span class="brand-sub">Cuidado Inteligente</span></div></div><div class="nav-actions">${u?`<button class="btn btn-secondary btn-sm" data-action="install" aria-label="Instalar app">Instalar</button><button class="iconbtn" title="Cambiar tema" aria-label="Cambiar tema" data-action="theme">${state.ui.theme==='dark'?'☀️':'🌙'}</button><button class="iconbtn" title="Menú" aria-label="Abrir menú" data-action="menu">☰</button>`:''}</div></div></header>`}

function loginScreen(){return `<main class="wrap hero"><section class="card login-card"><h1>Pausas activas que se adaptan a ti</h1><p class="subtitle">Configura tu perfil y recibe sugerencias inteligentes según tu actividad.</p><div class="grid two"><div><div class="field"><label>Crear usuario</label><input id="newUserName" placeholder="Nombre" /></div><button class="btn btn-primary btn-block" id="createUserBtn">Crear y comenzar</button></div><div><h2>Usuarios guardados</h2><div class="userlist">${state.users.length?state.users.map(u=>`<div class="useritem"><div><b>${esc(u.name)}</b><br><small>${esc(u.profile?.occupation||'Sin ocupación')}</small></div><div style="display:flex;gap:6px"><button class="btn btn-secondary btn-sm" data-switch="${u.id}">Entrar</button><button class="btn btn-danger btn-sm" data-deluser="${u.id}">✕</button></div></div>`).join(''):'<div class="empty">Sin usuarios.</div>'}</div></div></div></section></main>`}

function mainApp(u){const tab=state.ui.tab||'home';return `<main class="wrap"><section class="hero"><h1>Hola, ${esc(u.name)}</h1><p class="muted">${dailyGreeting(u)}</p></section><nav class="tabs no-print">${[['home','Inicio'],['profile','Perfil'],['library','Pausas'],['history','Historial'],['analysis','Análisis'],['settings','Ajustes']].map(t=>`<button class="tab ${tab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</nav><section>${tab==='home'?homeView(u):tab==='profile'?profileView(u):tab==='library'?libraryView(u):tab==='history'?historyView(u):tab==='analysis'?analysisView(u):settingsView(u)}</section></main><nav class="bottom-nav no-print"><div class="bottom-nav-inner">${[['home','🏠','Inicio'],['profile','👤','Perfil'],['library','🧘','Pausas'],['history','📊','Historial'],['analysis','📈','Análisis'],['settings','⚙️','Ajustes']].map(t=>`<button class="bnav-item ${tab===t[0]?'active':''}" data-tab="${t[0]}"><span class="bnav-icon">${t[1]}</span><span class="bnav-label">${t[2]}</span></button>`).join('')}</div></nav>`}

function dailyGreeting(u){const h=new Date().getHours(); const rec=recommendPause(u); if(h<12) return `Sugerido: ${rec.title.toLowerCase()}`; if(h<18) return `Revisa tensión y vista. Sugerido: ${rec.title.toLowerCase()}.`; return `Cierra la jornada suavemente.`;}
function profilePills(u){const p=u.profile;return [`${esc(p.workMode||'—')}`,`${esc(p.posture||'—')}`,`${p.screenHours||0}h pantalla`,`${p.intervalMin||35}min`];}
function dailyProgressHtml(u){const recs=state.records.filter(r=>r.userId===u.id&&r.createdAt.slice(0,10)===todayKey()&&r.completed); const target=Math.max(1,Math.round(((u.profile.screenHours||6)*60)/(u.profile.intervalMin||35))); const pct=Math.min(100,Math.round(recs.length/target*100)); const color=pct>=80?'var(--primary)':pct>=50?'var(--accent)':'var(--secondary)'; return `<div class="day-prog-wrap"><div class="day-prog-meta"><span>${recs.length}/${target} hoy</span><span>${pct}%</span></div><div class="day-prog"><div class="day-prog-bar" style="width:${pct}%;background:${color}"></div></div></div>`;}
function quickPausesHtml(u){const top3=rankPauses(u).slice(0,3); return `<div class="quick-row">${top3.map(p=>`<button class="quick-btn" data-startpause="${p.id}"><small class="text-muted">${esc(p.zone)}</small><b>${esc(p.title)}</b><small class="text-muted">${Math.round(p.duration/60)||1} min</small></button>`).join('')}</div>`;}

function profileFingerprint(u){const p=u.profile||{}; return JSON.stringify({workMode:p.workMode,posture:p.posture,screenHours:p.screenHours,movementLevel:p.movementLevel,painZones:p.painZones||[],goals:p.goals||[],restrictions:p.restrictions||[],diagnosedConditions:p.diagnosedConditions||[],blocks:(p.workBlocks||[]).map(b=>({activity:b.activity,intensity:b.intensity,emotionalLoad:b.emotionalLoad,intervalMin:b.intervalMin,start:b.start,end:b.end,days:Array.isArray(b.days)?b.days:[]}))});}
function getRecReason(u,p){const prof=u.profile||{}, bits=[]; if((prof.painZones||[]).some(z=>p.zone.includes(z)||p.tags.includes(z))) bits.push('zona de cuidado'); if(p.tags.includes(prof.workMode)) bits.push(prof.workMode); if((prof.diagnosedConditions||[]).length){const conds=(prof.diagnosedConditions||[]).map(id=>DIAG_CONDITIONS.find(c=>c.id===id)).filter(Boolean); const hit=conds.find(c=>(c.zones||[]).some(z=>p.zone.includes(z)||p.tags.includes(z))||(c.tags||[]).some(t=>p.tags.includes(t)||p.title.toLowerCase().includes(t))); if(hit) bits.push(hit.label);} const activeB=getActiveBlock(u); if(activeB&&p.tags.includes(activeB.activity)) bits.push('bloque activo'); if(p.type==='regulacion'&&((prof.goals||[]).join(' ').includes('estrés')||activeB?.emotionalLoad==='alta')) bits.push('regulación'); return bits.length?'Recomendada por: '+bits.slice(0,3).join(' + '):'Recomendada por tu perfil preventivo.';}

function hasConfiguredBlocks(u){return Array.isArray(u?.profile?.workBlocks)&&u.profile.workBlocks.length>0;}
function planCanRunNow(u){return !hasConfiguredBlocks(u)||!!getActiveBlock(u);}
function currentPriorityPauseId(u){const due=duePlanItem(u); if(due) return due.pauseId; const plan=ensureSuggestedPlan(u); const active=(plan.items||[]).filter(x=>x.active!==false); if(active.length) return active[0].pauseId; const ranked=rankPauses(u); return ranked[0]?.id||null;}
function quickContextChips(u){const plan=ensureSuggestedPlan(u); const block=getActiveBlock(u); const due=duePlanItem(u); const activeCount=(plan.items||[]).filter(x=>x.active!==false).length; const notifOn=state.ui.inAppNotifications!==false; return `<div class="quick-context-chips no-print"><button class="chip-action primary" data-startpause="${esc((due?.pauseId)||currentPriorityPauseId(u)||recommendPause(u).id)}">Pausa sugerida</button><button class="chip-action" data-tab="profile">Bloques: ${esc(block?block.label||block.activity:'fuera de horario')}</button><button class="chip-action" data-action="${plan.status==='active'?'editPlan':'acceptPlan'}">${plan.status==='active'?'Plan activo':'Activar plan'} · ${activeCount}</button><button class="chip-action ${notifOn?'notify-on':'notify-off'}" data-action="toggleNotify">${notifOn?'Notificaciones activas':'Notificaciones pausadas'}</button></div>`;}
function openPlanReviewModal(u){const plan=ensureSuggestedPlan(u); const items=(plan.items||[]).filter(x=>x.active!==false).slice(0,5); openModal(`<h2>Plan organizado para ti</h2><p class="text-sm text-muted mt-8">Con tu perfil actual, la app preparó estas pausas. Aprueba el plan para que empiece a correr, mejóralo o quítalo si prefieres usar la biblioteca manual.</p><div class="plan-modal-list">${items.map((it,i)=>`<div class="plan-item ${i===0?'priority-pulse':''}"><div><b>${esc(it.title)}</b><small>Cada ${it.frequencyMin} min · prioridad ${esc(it.priority)} · ${esc(it.motive||'perfil')}</small></div><button class="btn btn-secondary btn-sm" data-startpause="${it.pauseId}">Probar</button></div>`).join('')}</div><div class="plan-actions"><button class="btn btn-primary" id="acceptPlanFromModal">Aceptar y activar</button><button class="btn btn-secondary" id="editPlanFromModal">Mejorar / editar</button><button class="btn btn-danger" id="rejectPlanFromModal">Quitar</button></div>`); document.querySelectorAll('#modalBox [data-startpause]').forEach(b=>b.onclick=()=>startPause(b.dataset.startpause)); $('#acceptPlanFromModal').onclick=()=>{closeModal(); activatePlan(u);}; $('#editPlanFromModal').onclick=()=>{closeModal(); openEditPlan(u);}; $('#rejectPlanFromModal').onclick=()=>{closeModal(); rejectPlan(u);};}

function generateSuggestedPlan(u){const fingerprint=profileFingerprint(u); const ranked=rankPauses(u).filter(p=>p.score>=0).slice(0,6); const baseInterval=Number(u.profile.intervalMin||35); const items=ranked.map((p,i)=>({id:uid('plan'),pauseId:p.id,title:p.title,duration:p.duration,frequencyMin:i<2?Math.max(20,Math.min(baseInterval,45)):Math.max(baseInterval,60),priority:p.score>=55?'alta':p.score>=25?'media':'baja',motive:getRecReason(u,p).replace('Recomendada por: ','').replace('Recomendada por tu perfil preventivo.','perfil preventivo'),active:true,lastPromptAt:null,nextDueAt:null})); return {status:'suggested',items,fingerprint,createdAt:nowIso(),updatedAt:nowIso(),nextDueAt:null};}
function ensureSuggestedPlan(u){if(!u.plan||!Array.isArray(u.plan.items)) u.plan={status:'none',items:[],fingerprint:'',createdAt:null,updatedAt:null,nextDueAt:null}; const fp=profileFingerprint(u); if(u.plan.status==='active'&&u.plan.fingerprint===fp) return u.plan; if(u.plan.status==='rejected'&&u.plan.fingerprint===fp) return u.plan; if(!u.plan.items.length||u.plan.fingerprint!==fp||u.plan.status==='none'){u.plan=generateSuggestedPlan(u); saveState();} return u.plan;}
function planStatusLabel(status){return status==='active'?'Plan activo':status==='rejected'?'Plan rechazado':'Plan sugerido';}
function planSuggestedHtml(u){const plan=ensureSuggestedPlan(u); if(plan.status==='rejected') return `<div class="card plan-card"><div class="plan-header"><div><span class="plan-badge">Plan manual</span><h2 class="mt-8">Sin plan activo</h2><p class="text-sm text-muted">Puedes explorar pausas manualmente o reactivar un plan sugerido cuando quieras.</p></div></div><div class="plan-actions"><button class="btn btn-primary btn-sm" data-action="regeneratePlan">Generar plan sugerido</button><button class="btn btn-secondary btn-sm" data-tab="library">Ver pausas</button></div></div>`; const items=(plan.items||[]).filter(x=>x.active!==false).slice(0,5); return `<div class="card plan-card"><div class="plan-header"><div><span class="plan-badge">${planStatusLabel(plan.status)}</span><h2 class="mt-8">Tu plan sugerido de pausas activas</h2><p class="text-sm text-muted">Este es el siguiente paso: revisa la propuesta, actívala o ajústala antes de trabajar. Cuando el plan esté activo, la app te avisará en el momento de hacer cada pausa.</p></div></div><div class="plan-list">${items.map((it,i)=>`<div class="plan-item ${plan.status==='active'&&i===0?'priority-pulse':''}"><div><b>${esc(it.title)}</b><small>Cada ${it.frequencyMin} min · prioridad ${esc(it.priority)} · ${esc(it.motive||'perfil')}</small></div><button class="btn btn-secondary btn-sm" data-startpause="${it.pauseId}">Probar</button></div>`).join('')}</div><div class="plan-actions">${plan.status==='active'?`<button class="btn btn-secondary btn-sm" data-action="editPlan">Mejorar / editar plan</button><button class="btn btn-danger btn-sm" data-action="rejectPlan">Pausar plan</button>`:`<button class="btn btn-primary btn-sm" data-action="acceptPlan">Aceptar y activar plan</button><button class="btn btn-secondary btn-sm" data-action="editPlan">Mejorar / editar</button><button class="btn btn-danger btn-sm" data-action="rejectPlan">Quitar / rechazar</button>`}</div></div>`;}
function planMiniPromptHtml(u){const plan=ensureSuggestedPlan(u); const active=(plan.items||[]).filter(x=>x.active!==false).slice(0,3); if(plan.status==='active') return `<div class="card plan-card"><div class="plan-header"><div><span class="plan-badge">Plan activo</span><h2 class="mt-8">Tu plan ya está en marcha</h2><p class="text-sm text-muted">Puedes seguir trabajando. La app mostrará una pausa emergente cuando corresponda.</p></div></div><div class="plan-actions"><button class="btn btn-secondary btn-sm" data-action="editPlan">Mejorar / editar</button><button class="btn btn-danger btn-sm" data-action="rejectPlan">Pausar plan</button></div></div>`; if(plan.status==='rejected') return `<div class="card plan-card"><div class="plan-header"><div><span class="plan-badge">Plan manual</span><h2 class="mt-8">Plan sugerido desactivado</h2><p class="text-sm text-muted">Puedes usar las pausas manualmente o generar una nueva propuesta.</p></div></div><div class="plan-actions"><button class="btn btn-primary btn-sm" data-action="regeneratePlan">Generar plan sugerido</button></div></div>`; return `<div class="card plan-card"><div class="plan-header"><div><span class="plan-badge">Siguiente paso</span><h2 class="mt-8">Activa tu plan sugerido</h2><p class="text-sm text-muted">Según tu perfil, la app priorizó ${active.length?active.map(x=>esc(x.title)).join(', '):'algunas pausas'}. Puedes aceptar el plan, mejorarlo o quitarlo.</p></div></div><div class="plan-actions"><button class="btn btn-primary btn-sm" data-action="acceptPlan">Aceptar y activar plan</button><button class="btn btn-secondary btn-sm" data-action="editPlan">Mejorar / editar</button><button class="btn btn-danger btn-sm" data-action="rejectPlan">Quitar / rechazar</button></div></div>`;}
function activatePlan(u){if(state.ui.tab==='profile'&&document.getElementById('pf_name')){saveProfile(u,{silent:true,rerender:false});}const plan=ensureSuggestedPlan(u); plan.status='active'; plan.updatedAt=nowIso(); const t=Date.now(); plan.items.forEach((it,i)=>{if(it.active!==false){it.lastPromptAt=t; it.nextDueAt=t+((i===0?1:it.frequencyMin)*60000);}}); plan.nextDueAt=Math.min(...plan.items.filter(it=>it.active!==false).map(it=>it.nextDueAt||Infinity)); saveState(); toast('Plan activo',planCanRunNow(u)?'Las pausas emergerán según tu horario y perfil.':'El plan queda activo, pero pausado hasta entrar en un bloque de trabajo.'); render();}
function rejectPlan(u){u.plan=u.plan||generateSuggestedPlan(u); u.plan.status='rejected'; u.plan.fingerprint=profileFingerprint(u); u.plan.updatedAt=nowIso(); saveState(); toast('Plan pausado','Puedes usar las pausas manualmente o generar otro plan.'); render();}
function openEditPlan(u){const plan=ensureSuggestedPlan(u); openModal(`<h2>Editar plan sugerido</h2><p>Ajusta frecuencia o desactiva pausas. El plan sigue siendo orientativo y editable.</p><div class="plan-modal-list">${plan.items.map(it=>`<div class="plan-edit-row" data-planitem="${it.id}"><div><b>${esc(it.title)}</b><small>${esc(it.motive||'perfil')}</small></div><div class="field"><label>Min</label><input type="number" min="10" max="180" step="5" data-planfreq value="${it.frequencyMin}"></div><label class="check"><input type="checkbox" data-planactive ${it.active!==false?'checked':''}> Activa</label></div>`).join('')}</div><div class="plan-actions"><button class="btn btn-primary" id="savePlanEdit">Guardar plan</button><button class="btn btn-secondary" id="closePlanEdit">Cerrar</button></div>`); $('#closePlanEdit').onclick=closeModal; $('#savePlanEdit').onclick=()=>{document.querySelectorAll('[data-planitem]').forEach(row=>{const it=plan.items.find(x=>x.id===row.dataset.planitem); if(!it) return; it.frequencyMin=Math.max(10,parseInt(row.querySelector('[data-planfreq]').value||it.frequencyMin)); it.active=row.querySelector('[data-planactive]').checked;}); plan.updatedAt=nowIso(); saveState(); closeModal(); toast('Plan actualizado','Tus recordatorios usarán esta configuración.'); render();};}
function duePlanItem(u){const plan=u.plan; if(!plan||plan.status!=='active') return null; if(!planCanRunNow(u)) return null; const active=(plan.items||[]).filter(it=>it.active!==false); if(!active.length) return null; const t=Date.now(); return active.filter(it=>(it.nextDueAt||0)<=t).sort((a,b)=>(a.nextDueAt||0)-(b.nextDueAt||0))[0]||null;}
function schedulePlanItem(u,item,extraMin=0){const plan=u.plan; if(!plan||!item) return; const t=Date.now(); item.lastPromptAt=t; item.nextDueAt=t+((extraMin||item.frequencyMin||u.profile.intervalMin||35)*60000); plan.nextDueAt=Math.min(...(plan.items||[]).filter(it=>it.active!==false).map(it=>it.nextDueAt||Infinity)); plan.updatedAt=nowIso(); saveState();}
function recordPlanEvent(u,item,status,pause){state.records.push({id:uid('rec'),userId:u.id,pauseId:pause?.id||item.pauseId,title:pause?.title||item.title,zone:pause?.zone||'',duration:status==='pospuesta'||status==='omitida'?0:(pause?.duration||0),completed:status==='realizada',status,createdAt:nowIso(),noteAfter:status==='pospuesta'?'Pospuesta desde plan':status==='omitida'?'Omitida desde plan':'Registrada desde plan'});}

function homeView(u){const stats=getStats(u.id); const rec=recommendPause(u);return `${quickContextChips(u)}<div class="grid two"><div class="card"><div class="section-title"><h2>Pausa sugerida</h2></div>${dailyProgressHtml(u)}<div class="pause-hero">${getPauseAnimationHtml(rec)}<h3>${esc(rec.title)}</h3><div class="pill-row">${pillHtml(rec.zone)}${pillHtml(rec.duration+'s')}${pillHtml(rec.intensity)}</div><p class="rec-reason">${esc(rec.why||getRecReason(u,rec))}</p></div><div class="pause-actions"><button class="btn btn-primary" data-startpause="${rec.id}">Iniciar pausa</button><button class="btn btn-secondary btn-sm" data-action="quickNote">Registrar estado</button></div><div class="mt-16"><h3 class="mb-8">Acceso rápido</h3>${quickPausesHtml(u)}</div></div><div class="grid"><div class="card"><div class="stats-row"><div class="stat"><b>${stats.todayCount}</b><span>Hoy</span></div><div class="stat"><b>${stats.minutes}</b><span>Min</span></div><div class="stat"><b>${stats.streak}</b><span>Racha</span></div></div></div><div class="card"><h3 class="mb-8">Bloques activos</h3>${activeBlockInfo(u)}<p class="text-xs text-muted mt-8" id="next-alert-live">${nextAlertText(u)}</p></div></div></div><div class="mt-16">${planSuggestedHtml(u)}</div>`}

function pillHtml(text){return `<span class="pill">${esc(text)}</span>`;}
function weeklyHeatmap(userId){const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb']; const now=new Date(); const cells=Array.from({length:7},(_,i)=>{const d=new Date(now); d.setDate(d.getDate()-6+i); const key=d.toISOString().slice(0,10); const count=state.records.filter(r=>r.userId===userId&&(r.createdAt||'').slice(0,10)===key&&(r.completed||r.status==='realizada')).length; const pct=Math.min(100,count*25); return `<div style="text-align:center"><div style="font-size:11px;color:var(--muted)">${days[d.getDay()]}</div><div class="heatmap-cell" style="background:color-mix(in srgb,var(--primary) ${pct}%,var(--line));" title="${count} pausas"></div></div>`;}); return `<div class="heatmap-row">${cells.join('')}</div>`;}
function trendChart(userId){const recs=state.records.filter(r=>r.userId===userId&&(r.completed||r.status==='realizada')).slice(-14); if(recs.length<2) return '<p class="text-muted text-sm">Mínimo 2 registros para mostrar tendencias.</p>'; const vals=recs.map((r,i)=>Number(r.energyAfter ?? r.painAfter ?? Math.min(10,5+i%5))); const W=320,H=84,n=vals.length; const px=i=>Math.round(i/(Math.max(1,n-1))*(W-24)+12); const py=v=>Math.round(H-12-(Math.max(0,Math.min(10,v))/10)*(H-24)); const path=vals.map((v,i)=>`${i===0?'M':'L'}${px(i)},${py(v)}`).join(' '); return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:360px;overflow:visible"><path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="3" fill="var(--primary)"><title>Registro ${i+1}</title></circle>`).join('')}</svg><div class="trend-legend"><span><span class="trend-dot" style="background:var(--primary)"></span>Registros recientes</span></div>`;}

function conditionSummaryHtml(p){const selected=DIAG_CONDITIONS.filter(c=>(p.diagnosedConditions||[]).includes(c.id)); if(!selected.length) return ''; const actions=[...new Set(selected.flatMap(c=>c.actions))].slice(0,9); return `<div class="diag-summary"><b>Pausas priorizadas por diagnóstico:</b> ${esc(actions.join(' · '))}. <br>La app usará estas pistas para ordenar las pausas; no constituye diagnóstico ni tratamiento médico.</div>`;}
function profileView(u){const p=u.profile; const zones=['ojos','cuello','hombros','espalda alta','lumbar','cadera','manos','muñecas','codos','mandíbula','piernas','rodillas','tobillos','pies','mente','voz','respiración','general']; const goals=['prevenir dolor','descansar vista','mejorar postura','activar circulación','regular estrés','reducir fatiga mental','aumentar energía','mejorar adherencia','cuidar manos','prevenir molestias por digitación','prevenir molestias por sedestación','hacer pausa breve','regular ansiedad laboral','cuidar la voz','cierre saludable']; const restr=['evitar movimientos bruscos','evitar impacto','evitar flexión lumbar profunda','evitar carga sobre muñecas','evitar elevación sostenida de brazos','evitar ejercicios de rodilla','evitar movimientos cervicales rápidos','evitar pausas con sonido','evitar ejercicios de pie','evitar ejercicios sentado','no puedo levantarme','estoy en reunión','necesito pausa silenciosa','dolor lumbar/cadera','fatiga visual','trabajo emocional intenso','poco espacio','dolor activo','recomendación médica de precaución','conducción']; const activities=['pantalla','digitación intensa','escritura','docencia','consulta','reuniones','atención a público','foco profundo','oficina compartida','trabajo desde casa','trabajo de pie','desplazamientos frecuentes','pantalla intensa','jornada larga','poco movimiento','estrés alto','conducción','trabajo físico','mixto']; return `<div class="card profile-compact"><div class="section-title"><div><h2>Perfil</h2><p>Configura datos básicos para personalizar las pausas activas.</p></div><div class="profile-head-actions"><span class="save-status" id="profileSaveStatus"></span><button class="btn btn-primary btn-sm" id="saveProfileBtn">Guardar</button></div></div><div class="grid two"><div><div class="field"><label class="with-tip">Nombre ${labelTip('Nombre','Sirve para personalizar la experiencia y mostrar recomendaciones más cercanas a tu rutina.')}</label><input id="pf_name" value="${esc(u.name)}"></div><div class="field"><label>Ocupación</label><input id="pf_occupation" value="${esc(p.occupation||'')}" placeholder="Docente, terapeuta..."></div><div class="field"><label>Actividad principal</label><select id="pf_workMode">${activities.map(x=>`<option ${p.workMode===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Postura</label><select id="pf_posture">${['sentado','de pie','alternante','caminando','conduciendo','mixta'].map(x=>`<option ${p.posture===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Pantalla</label><div class="rangegrid"><input type="range" min="0" max="14" step=".5" id="pf_screenHours" value="${p.screenHours||0}"><b id="screenVal">${p.screenHours||0}h</b></div></div></div><div><div class="field"><label>Intervalo</label><select id="pf_interval">${[20,25,30,35,40,45,50,60,75,90].map(n=>`<option value="${n}" ${(p.intervalMin||35)==n?'selected':''}>${n} min</option>`).join('')}</select></div><div class="field"><label>Preferencia</label><select id="pf_preference">${['suave','moderada','energizante','discreta','silenciosa','guiada'].map(x=>`<option ${p.pausePreference===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Alertas</label><select id="pf_alertStyle">${['visual','sonora suave','silenciosa','insistente'].map(x=>`<option ${p.alertStyle===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Movimiento</label><select id="pf_movement">${['bajo','medio','alto','variable'].map(x=>`<option ${p.movementLevel===x?'selected':''}>${x}</option>`).join('')}</select></div></div></div>${sectionKicker('Zonas de cuidado','Son partes del cuerpo o áreas de bienestar que necesitan atención durante tus pausas activas.')}<div class="checks dense">${optionChecks('zone',zones,p.painZones)}</div>${sectionKicker('Objetivos','Indican qué quieres lograr con tus pausas: aliviar tensión, descansar la vista, moverte más o regular el estrés.')}<div class="checks dense">${optionChecks('goal',goals,p.goals)}</div>${sectionKicker('Restricciones','Permiten evitar ejercicios que no sean adecuados para tu condición, dolor actual o contexto de trabajo.')}<div class="checks dense">${optionChecks('restr',restr,p.restrictions)}</div>${sectionKicker('Enfermedades o condiciones diagnosticadas','Selecciona solo condiciones diagnosticadas por un profesional. La app no diagnostica; solo adapta sugerencias de pausas activas.')}<div class="profile-note">Selecciona únicamente condiciones diagnosticadas por un profesional. Esta app no reemplaza atención médica, fisioterapia ni valoración clínica. Las sugerencias son pausas activas preventivas y de autocuidado laboral.</div><div class="checks conditions mt-8">${DIAG_CONDITIONS.map(c=>`<label class="check"><input type="checkbox" name="diag" value="${c.id}" ${(p.diagnosedConditions||[]).includes(c.id)?'checked':''}> <span>${esc(c.label)}</span></label>`).join('')}</div>${conditionSummaryHtml(p)}${sectionKicker('Bloques de actividad','Describen el tipo de jornada o actividad que realizas. La app usa esta información para sugerir pausas más pertinentes.')}<div id="blocksBox">${(p.workBlocks||[]).map(blockHtml).join('')}</div><button class="btn btn-secondary btn-sm mt-8" id="addBlockBtn">+ Bloque</button><div class="profile-bottom-actions"><span class="save-status" id="profileSaveStatusBottom"></span><button class="btn btn-primary btn-sm" id="saveProfileBtnBottom">Guardar y revisar plan</button></div><div class="mt-16">${planMiniPromptHtml(u)}</div></div>`}
function blockHtml(b){const ALL_DAYS=['lun','mar','mié','jue','vie','sáb','dom'];const dayLabels={lun:'Lun',mar:'Mar',mié:'Mié',jue:'Jue',vie:'Vie',sáb:'Sáb',dom:'Dom'};const selDays=Array.isArray(b.days)?b.days:ALL_DAYS;const activities=['pantalla','digitación intensa','escritura','docencia','consulta','reuniones','atención a público','foco profundo','oficina compartida','trabajo desde casa','trabajo de pie','desplazamientos frecuentes','pantalla intensa','jornada larga','poco movimiento','estrés alto','conducción','trabajo físico','descanso activo','mixto'];return `<div class="block" data-block="${b.id}"><div class="block-compact-title"><b>Bloque de actividad</b><button class="btn btn-danger btn-sm" data-removeblock="${b.id}">✕</button></div><div class="field"><label>Nombre</label><input data-bfield="label" value="${esc(b.label||'')}"></div><div class="field"><label>Actividad</label><select data-bfield="activity">${activities.map(x=>`<option ${b.activity===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Inicio</label><input type="time" data-bfield="start" value="${b.start||'08:00'}"></div><div class="field"><label>Fin</label><input type="time" data-bfield="end" value="${b.end||'12:00'}"></div><div class="field"><label>Intensidad</label><select data-bfield="intensity">${['baja','media','alta','variable'].map(x=>`<option ${b.intensity===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Carga emocional</label><select data-bfield="emotionalLoad">${['baja','media','alta'].map(x=>`<option ${(b.emotionalLoad||'media')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Intervalo</label><select data-bfield="intervalMin"><option value="global" ${!b.intervalMin?'selected':''}>Global</option>${[20,25,30,35,40,45,50,55,60,75,90].map(n=>`<option value="${n}" ${b.intervalMin==n?'selected':''}>${n} min</option>`).join('')}</select></div><div class="field wide"><label>Días</label><div class="day-checks">${ALL_DAYS.map(d=>`<label class="day-chk"><input type="checkbox" data-bday="${d}" ${selDays.includes(d)?'checked':''}> ${dayLabels[d]}</label>`).join('')}</div></div></div>`}
function libraryView(u){const zones=['todas','ojos','cuello','hombros','manos','muñecas','codos','lumbar','cadera','piernas','rodillas','pies','mente','voz','general']; const ranked=rankPauses(u); const suggested=ranked.slice(0,8); const suggestedIds=suggested.map(x=>x.id); return `<div class="mb-16">${planMiniPromptHtml(u)}</div><div class="card"><div class="section-title"><div><h2>Banco de pausas</h2><p>Primero aparecen las que la app considera compatibles con tu perfil. La biblioteca completa queda disponible para uso manual.</p></div></div><div class="recommend-block"><div class="section-title"><div><h3>Recomendadas para ti</h3><p>Resaltadas según perfil, bloques, zonas de cuidado, restricciones y diagnósticos seleccionados.</p></div></div><div class="grid three">${suggested.slice(0,6).map(pause=>pauseCard(pause,true,getRecReason(u,pause))).join('')}</div></div><div class="field"><select id="pauseFilter">${zones.map(z=>`<option>${z}</option>`).join('')}</select></div><div class="grid three" id="pauseList">${PAUSES.map(pause=>pauseCard(pause,suggestedIds.includes(pause.id),suggestedIds.includes(pause.id)?getRecReason(u,pause):'')).join('')}</div></div>`}
function pauseCard(p,sug=false,reason=''){const u=currentUser(); const priorityId=u?currentPriorityPauseId(u):null; return `<article class="card pause-card ${sug?'recommended-card':''} ${p.id===priorityId?'priority-pulse':''}" data-pausezone="${esc(p.zone)}"><div class="pause-card-top"><div class="anim-preview anim-preview-sm">${getPauseAnimationHtml(p).replace(/<div class="anim-preview">|<\/div>\s*<div class="anim-label">.*?<\/div>/g,'')}</div><div class="pause-card-info"><h3>${esc(p.title)}</h3><div class="pill-row">${sug?'<span class="rec-label">✦ Sugerida</span>':''}${pillHtml(p.zone)}${pillHtml(p.type)}${pillHtml((Math.round(p.duration/60)||1)+' min')}</div>${reason?`<div class="rec-reason">${esc(reason)}</div>`:''}</div></div><p class="text-xs text-muted mt-8">${esc(p.avoid||'Realizar de forma suave y sin dolor.')}</p><div class="pause-card-footer"><button class="btn btn-primary btn-sm" data-startpause="${p.id}">Iniciar</button><button class="btn btn-secondary btn-sm" data-detailpause="${p.id}">Pasos</button></div></article>`}
function historyView(u){const allRows=state.records.filter(r=>r.userId===u.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)); const rows=allRows.slice(0,historyPage*HISTORY_PER_PAGE); const hasMore=allRows.length>rows.length; const groups={}; rows.forEach(r=>{const k=(r.createdAt||nowIso()).slice(0,10); (groups[k]=groups[k]||[]).push(r);}); const dateLabel=k=>{const today=todayKey(); const d=new Date(k+'T12:00:00'); const y=new Date(); y.setDate(y.getDate()-1); if(k===today) return 'Hoy — '+d.toLocaleDateString('es-CO',{day:'numeric',month:'long'}); if(k===y.toISOString().slice(0,10)) return 'Ayer — '+d.toLocaleDateString('es-CO',{day:'numeric',month:'long'}); return d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}; const statusOf=r=>r.status||(r.completed?'realizada':'omitida'); return `<div class="card"><div class="section-title"><div><h2>Historial</h2><p>Organizado por fechas para leer avances, pausas pospuestas y omisiones sin saturación.</p></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-secondary btn-sm" data-action="exportCsv">CSV</button><button class="btn btn-secondary btn-sm" data-action="exportHtml">Informe</button></div></div>${rows.length?Object.keys(groups).sort().reverse().map((k,idx)=>{const g=groups[k]; const done=g.filter(r=>statusOf(r)==='realizada').length; const post=g.filter(r=>statusOf(r)==='pospuesta').length; const skip=g.filter(r=>statusOf(r)==='omitida').length; return `<details class="history-date" ${idx===0?'open':''}><summary><b>${esc(dateLabel(k))}</b><small>${g.length} sugeridas · ${done} realizadas · ${post} pospuestas · ${skip} omitidas</small></summary><div class="history-records">${g.map(r=>{const st=statusOf(r);return `<div class="record status-${st}"><div class="record-header"><b>${esc(r.title)}</b><small>${st==='realizada'?'✓ realizada':st==='pospuesta'?'⏱ pospuesta':'⊘ omitida'}</small></div><div class="record-meta">${fmtDate(r.createdAt)} · ${Math.round((r.duration||0)/60)||0} min · ${esc(r.zone||'general')}</div>${r.noteAfter?`<div class="record-meta">${esc(r.noteAfter)}</div>`:''}</div>`}).join('')}</div></details>`}).join(''):'<div class="empty">Aún no hay pausas registradas.</div>'}${hasMore?'<button class="btn btn-secondary btn-block mt-16" data-action="historyMore">Ver más</button>':''}</div>`}
function analysisView(u){const a=analyzeUser(u); const priorityId=currentPriorityPauseId(u);return `<div class="grid two"><div class="card analysis-box"><div class="section-title"><h2 class="analysis-help-title">Análisis ${labelTip('Análisis','Resume señales de pantalla, postura, carga mental, adherencia y zonas corporales a partir del perfil y los registros de pausas.')}</h2></div>${scoreLine('Pantalla',a.screen)}${scoreLine('Postura',a.posture)}${scoreLine('Mental',a.mental)}${scoreLine('Adherencia',a.adherence)}${scoreLine('Corporal',a.body)}<div class="microwarn"><b>Perfil:</b> ${esc(a.profileLabel)}</div><h3 class="mt-12 mb-8 analysis-help-title">Adherencia semanal ${labelTip('Adherencia semanal','Muestra qué días registraste pausas realizadas, pospuestas u omitidas. Sirve para observar continuidad, no para calificarte.')}</h3>${weeklyHeatmap(u.id)}</div><div class="grid"><div class="card"><h3 class="mb-8 analysis-help-title">Recomendación ${labelTip('Recomendación','Texto orientativo que interpreta tu perfil, horarios y uso de pausas para sugerir el siguiente cuidado.')}</h3><p class="text-sm">${esc(a.recommendation)}</p><h3 class="mt-12 mb-8 analysis-help-title">Prioritarias ${labelTip('Prioritarias','La pausa con pulso suave es la más conveniente ahora; cuando la realices, la siguiente toma prioridad.')}</h3><div class="pause-actions">${rankPauses(u).slice(0,5).map(p=>`<button class="btn btn-secondary btn-sm ${p.id===priorityId?'priority-pulse':''}" data-startpause="${p.id}">${esc(p.title)}</button>`).join('')}</div></div><div class="card"><h3 class="mb-8 analysis-help-title">Tendencia ${labelTip('Tendencia','Visualiza la evolución reciente de tus registros. Ayuda a ver si sostienes o abandonas las pausas con el paso de los días.')}</h3>${trendChart(u.id)}</div></div></div>`}
function scoreLine(label,val){return `<div class="score-line"><div class="score-line-header"><span>${label}</span><span>${val}/100</span></div><div class="scorebar"><span style="width:${Math.max(0,Math.min(100,val))}%"></span></div></div>`}
function settingsView(u){return `<div class="grid two"><div class="card"><h2 class="mb-8">Ajustes</h2><div style="display:grid;gap:8px"><button class="btn btn-primary btn-block" data-action="install">Instalar app</button><button class="btn btn-secondary btn-block" data-action="toggleNotify">Activar/pausar notificaciones en pantalla</button><button class="btn btn-secondary btn-block" data-action="notify">Permiso de notificación del navegador</button><button class="btn btn-secondary btn-block" data-action="tour">Tour</button><button class="btn btn-secondary btn-block" data-action="manual">Manual</button><button class="btn btn-secondary btn-block" data-action="exportCsv">Exportar CSV</button></div><div class="field mt-16"><label>Tema</label><select id="themeSelect"><option value="light">Claro</option><option value="dark" ${state.ui.theme==='dark'?'selected':''}>Oscuro</option></select></div></div><div class="card"><h2 class="mb-8">Datos</h2><div style="display:grid;gap:8px"><button class="btn btn-primary btn-block" data-action="exportJson">Exportar backup</button><label class="btn btn-secondary btn-block">Importar JSON<input type="file" id="importJson" accept="application/json" class="hidden"></label><button class="btn btn-danger btn-block" data-action="wipeAll">Borrar todo</button></div></div></div>`}
function drawer(u){return `<div class="menu ${state.ui.menu?'open':''}" id="menu"><aside class="drawer"><button class="iconbtn" style="float:right" data-action="menu">✕</button><h3>Menú</h3>${u?`<button class="btn btn-secondary btn-block" data-tab="home">Inicio</button><button class="btn btn-secondary btn-block" data-tab="profile">Perfil</button><button class="btn btn-secondary btn-block" data-tab="library">Pausas</button><button class="btn btn-secondary btn-block" data-tab="history">Historial</button><button class="btn btn-secondary btn-block" data-tab="analysis">Análisis</button><button class="btn btn-secondary btn-block" data-tab="settings">Ajustes</button><hr style="border:none;border-top:1px solid var(--line);margin:12px 0"><button class="btn btn-secondary btn-block" data-action="tour">Tour</button><button class="btn btn-secondary btn-block" data-action="theme">${state.ui.theme==='dark'?'☀️ Claro':'🌙 Oscuro'}</button><button class="btn btn-secondary btn-block" data-action="logout">Cambiar usuario</button>`:''}</aside></div>`}
function modalShell(){return `<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>`}

function bindCommon(){$('#createUserBtn')?.addEventListener('click',()=>createUser($('#newUserName').value));$('#newUserName')?.addEventListener('keydown',e=>{if(e.key==='Enter') createUser($('#newUserName').value);});document.querySelectorAll('[data-switch]').forEach(b=>b.addEventListener('click',()=>switchUser(b.dataset.switch)));document.querySelectorAll('[data-deluser]').forEach(b=>b.addEventListener('click',()=>deleteUser(b.dataset.deluser)));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>handleAction(b.dataset.action)));document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{autoSaveProfileIfOpen();state.ui.tab=b.dataset.tab;state.ui.menu=false;historyPage=1;saveState();render();}));$('#menu')?.addEventListener('click',e=>{if(e.target.id==='menu'){state.ui.menu=false;saveState();render();}});$('#modal')?.addEventListener('click',e=>{if(e.target.id==='modal'){if(activeTimer?.running){toast('Temporizador activo','Detén la pausa antes de cerrar.');return;} closeModal();}});}
function bindApp(u){document.querySelectorAll('[data-startpause]').forEach(b=>b.addEventListener('click',()=>startPause(b.dataset.startpause)));document.querySelectorAll('[data-detailpause]').forEach(b=>b.addEventListener('click',()=>showPauseDetail(b.dataset.detailpause)));$('#saveProfileBtn')?.addEventListener('click',()=>saveProfile(u));$('#saveProfileBtnBottom')?.addEventListener('click',()=>saveProfile(u,{reviewPlan:true}));$('#pf_screenHours')?.addEventListener('input',e=>$('#screenVal').textContent=e.target.value+'h');$('#addBlockBtn')?.addEventListener('click',()=>{u.profile.workBlocks.push({id:uid('block'),label:'Nuevo bloque',start:'09:00',end:'10:30',activity:'pantalla',intensity:'media',days:['lun','mar','mié','jue','vie','sáb','dom'],emotionalLoad:'media',intervalMin:null});saveState();render();});document.querySelectorAll('[data-removeblock]').forEach(b=>b.addEventListener('click',()=>{u.profile.workBlocks=u.profile.workBlocks.filter(x=>x.id!==b.dataset.removeblock);saveState();render();}));$('#pauseFilter')?.addEventListener('change',e=>{const val=e.target.value; document.querySelectorAll('[data-pausezone]').forEach(card=>card.style.display=(val==='todas'||card.dataset.pausezone.includes(val))?'grid':'none')});$('#themeSelect')?.addEventListener('change',e=>{setTheme(e.target.value);render();});$('#importJson')?.addEventListener('change',importJson);}
function autoSaveProfileIfOpen(){const u=currentUser(); if(!u||state.ui.tab!=='profile'||!document.getElementById('pf_name')) return; saveProfile(u,{silent:true,rerender:false});}
function handleAction(action){const u=currentUser();if(action==='menu'){state.ui.menu=!state.ui.menu;saveState();render();}if(action==='theme'){setTheme(state.ui.theme==='dark'?'light':'dark');render();}if(action==='logout'){state.activeUserId=null;state.ui.menu=false;saveState();render();}if(action==='tour') openTour();if(action==='manual') openManual();if(action==='install') installApp();if(action==='notify') requestNotifications();if(action==='toggleNotify') toggleNotifications();if(action==='exportJson') exportJson();if(action==='exportHtml') exportHtml();if(action==='wipeAll') wipeAll();if(action==='quickNote') openQuickNote();if(action==='historyMore'){historyPage++;render();}if(action==='exportCsv') exportCsv();if(action==='acceptPlan'&&u) activatePlan(u);if(action==='rejectPlan'&&u) rejectPlan(u);if(action==='editPlan'&&u) openEditPlan(u);if(action==='regeneratePlan'&&u){u.plan=generateSuggestedPlan(u);saveState();toast('Plan generado','Revisa la propuesta y decide si la aceptas.');render();}}
function saveProfile(u,opts={}){try{const p=structuredClone(u.profile||makeDefaultProfile(u.name)); u.profile=p; const nameEl=$('#pf_name'); if(!nameEl) return; u.name=nameEl.value.trim()||u.name||'Usuario'; p.name=u.name; p.occupation=$('#pf_occupation')?.value.trim()||''; p.workMode=$('#pf_workMode')?.value||p.workMode||'pantalla'; p.posture=$('#pf_posture')?.value||p.posture||'sentado'; p.screenHours=parseFloat($('#pf_screenHours')?.value||p.screenHours||6); p.intervalMin=parseInt($('#pf_interval')?.value||p.intervalMin||35); p.pausePreference=$('#pf_preference')?.value||p.pausePreference||'suave'; p.alertStyle=$('#pf_alertStyle')?.value||p.alertStyle||'visual'; p.movementLevel=$('#pf_movement')?.value||p.movementLevel||'bajo'; p.painZones=[...document.querySelectorAll('input[name="zone"]:checked')].map(x=>x.value); p.goals=[...document.querySelectorAll('input[name="goal"]:checked')].map(x=>x.value); p.restrictions=[...document.querySelectorAll('input[name="restr"]:checked')].map(x=>x.value); p.diagnosedConditions=[...document.querySelectorAll('input[name="diag"]:checked')].map(x=>x.value); const blocks=[...document.querySelectorAll('[data-block]')].map(el=>{const obj={id:el.dataset.block||uid('block')}; el.querySelectorAll('[data-bfield]').forEach(f=>{let v=f.value; if(f.dataset.bfield==='intervalMin'){v=(v==='global'||v==='')?null:parseInt(v,10);} obj[f.dataset.bfield]=v;}); const days=[...el.querySelectorAll('[data-bday]:checked')].map(c=>c.dataset.bday); obj.days=days; if(!obj.label)obj.label='Bloque de actividad'; if(!obj.activity)obj.activity='pantalla'; if(!obj.start)obj.start='08:00'; if(!obj.end)obj.end='12:00'; if(!obj.intensity)obj.intensity='media'; if(!obj.emotionalLoad)obj.emotionalLoad='media'; return obj;}); p.workBlocks=blocks.length?blocks:(p.workBlocks||[]); p.updatedAt=nowIso(); try{const fp=profileFingerprint(u); if(!u.plan||u.plan.fingerprint!==fp||u.plan.status!=='active'){u.plan=generateSuggestedPlan(u);}}catch(planErr){console.warn('plan function openTimer(p){activeTimer.running=true; activeTimer.start=Date.now(); const C=252, r=110, circ=2*Math.PI*r; openModal(`<div class="timer-wrap"><svg class="timer-ring" viewBox="0 0 ${C} ${C}"><circle class="timer-bg" cx="${C/2}" cy="${C/2}" r="${r}"/><circle class="timer-fg" id="timerRing" cx="${C/2}" cy="${C/2}" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${circ}"/></svg><div class="timer-text" id="timerText">${formatTime(p.duration)}</div></div><h3 style="text-align:center;font-weight:600">${esc(p.title)}</h3><div class="timer-controls"><button class="btn btn-secondary" id="pauseTimerBtn">Pausar</button><button class="btn btn-primary" id="finishTimerBtn">Finalizar</button><button class="btn btn-danger" id="omitTimerBtn">Omitir</button></div>`); const tick=()=>{if(!activeTimer?.running)return; const elapsed=Math.floor((Date.now()-activeTimer.start)/1000); activeTimer.elapsed=elapsed; const remain=Math.max(0,p.duration-elapsed); const pct=Math.min(1,elapsed/p.duration); const timerText=$('#timerText'),timerRing=$('#timerRing'); if(!timerText||!timerRing)return; timerText.textContent=formatTime(remain); timerRing.setAttribute('stroke-dashoffset', circ*(1-pct)); if(remain<=0){activeTimer.running=false; playCompletionSound(); finishPauseForm(true);} else {requestAnimationFrame(tick)}}; requestAnimationFrame(tick); $('#pauseTimerBtn').onclick=()=>{activeTimer.running=!activeTimer.running; if(activeTimer.running){activeTimer.start=Date.now()-activeTimer.elapsed*1000; $('#pauseTimerBtn').textContent='Pausar'; requestAnimationFrame(tick);} else $('#pauseTimerBtn').textContent='Continuar';}; $('#finishTimerBtn').onclick=()=>finishPauseForm(true); $('#omitTimerBtn').onclick=()=>finishPauseForm(false);}
function finishPauseForm(completed){const p=activeTimer.pause; activeTimer.running=false; openModal(`<h2>${completed?'Pausa completada':'Pausa omitida'}</h2><p class="text-sm text-muted mt-8">Registra el efecto para mejorar sugerencias.</p><div class="mt-16"><div class="grid two"><div class="field"><label>Dolor <b id="painAfterVal">${activeTimer.before.pain}</b>/10</label><input type="range" min="0" max="10" value="${activeTimer.before.pain}" id="painAfter"></div><div class="field"><label>Energía <b id="energyAfterVal">${activeTimer.before.energy}</b>/10</label><input type="range" min="0" max="10" value="${activeTimer.before.energy}" id="energyAfter"></div></div><div class="field"><label>Nota</label><textarea id="noteAfter" placeholder="¿Qué cambió?" rows="2"></textarea><button class="btn btn-secondary btn-sm mt-8" data-mic="noteAfter">🎙️ Dictar</button></div><div class="pause-actions mt-16"><button class="btn btn-primary" id="saveRecordBtn">Guardar</button></div></div>`); bindRangeLabels(); bindMicButtons(); $('#saveRecordBtn').onclick=()=>{const u=currentUser(); state.records.push({id:uid('rec'),userId:u.id,pauseId:p.id,title:p.title,zone:p.zone,duration:activeTimer.elapsed||p.duration,completed,status:completed?'realizada':'omitida',createdAt:nowIso(),painBefore:activeTimer.before.pain,energyBefore:activeTimer.before.energy,noteBefore:activeTimer.before.note,painAfter:+$('#painAfter').value,energyAfter:+$('#energyAfter').value,noteAfter:$('#noteAfter').value}); if(activeTimer.planItemId&&u.plan){const it=(u.plan.items||[]).find(x=>x.id===activeTimer.planItemId); if(it){it.lastPromptAt=Date.now(); it.nextDueAt=Date.now()+((it.frequencyMin||u.profile.intervalMin||35)*60000); u.plan.updatedAt=nowIso();}} state.ui.lastAlertAt=Date.now(); saveState(); activeTimer=null; closeModal(); toast('Guardado', completed?'Pausa completada.':'Omisión registrada.'); render();};}

function openTour(){

    {tab:'library', sel:'.recommend-block', title:'6. Revisa las recomendadas para ti', text:'En Pausas, la biblioteca sigue completa, pero arriba aparecen las pausas que el sistema prioriza según tu perfil, horario y restricciones.'},
    {tab:'analysis', sel:'.analysis-box', title:'7. Comprende tu análisis', text:'Aquí se interpretan barras, adherencia, tendencia y prioridades. Los íconos de ayuda explican qué significa cada dato.'},
    {tab:'home', sel:'.quick-context-chips', title:'8. Accesos rápidos móviles', text:'Estos chips compactos ayudan a ver pausa sugerida, bloques activos, plan activo y notificaciones sin desplazarte demasiado.'}
  ];
  let i=0;
  function clear(){
    document.querySelectorAll('.tour-bubble-backdrop,.tour-bubble').forEach(x=>x.remove());
    document.querySelectorAll('.tour-target-highlight').forEach(x=>x.classList.remove('tour-target-highlight'));
  }
  function goToStep(index){
    i=Math.max(0,Math.min(index,steps.length-1));
    const st=steps[i];
    if(state.ui.tab!==st.tab){
      state.ui.tab=st.tab;
      saveState();
      render();
      setTimeout(show,90);
    }else{
      show();
    }
  }
  function findTarget(st){
    return document.querySelector(st.sel) || document.querySelector('main .card') || document.querySelector('main') || document.body;
  }
  function placeBubble(bubble, rect){
    const bw=Math.min(340, window.innerWidth-24);
    bubble.style.maxWidth=bw+'px';
    const below = rect.bottom + 12;
    const above = rect.top - 12;
    let top = below;
    if(below + 190 > window.innerHeight && above > 220) top = Math.max(76, above - 190);
    top = Math.min(window.innerHeight-210, Math.max(76, top));
    let left = rect.left;
    if(left + bw > window.innerWidth - 12) left = window.innerWidth - bw - 12;
    left = Math.max(12,left);
    bubble.style.top=top+'px';
    bubble.style.left=left+'px';
  }
  function show(){

      document.body.append(back,bubble);
      placeBubble(bubble,r);
      $('#tourSkip').onclick=()=>{clear(); state.ui.tourSeen=true; saveState();};
      $('#tourPrev').onclick=()=>goToStep(i-1);

    },260);

function dictateTo(id,btn){const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){toast('Micrófono','No disponible en este navegador.');return;} const rec=new SR(); rec.lang='es-CO'; rec.interimResults=false; rec.continuous=false; btn.textContent='🎙️ Escuchando...'; rec.onresult=e=>{const txt=e.results[0][0].transcript; const area=$('#'+id); area.value=(area.value?area.value+' ':'')+txt;}; rec.onerror=()=>toast('Error','Revisa permisos del micrófono.'); rec.onend=()=>btn.textContent='🎙️ Dictar'; rec.start();}
function analyzeUser(u){const p=u.profile, recs=state.records.filter(r=>r.userId===u.id), today=recs.filter(r=>r.createdAt.slice(0,10)===todayKey()); const activeB=getActiveBlock(u); const screen=Math.min(100,Math.round((p.screenHours||0)*9 + (p.workMode==='pantalla'?18:0))); const posture=Math.min(100,35+(p.posture==='sentado'?25:0)+(p.movementLevel==='bajo'?20:0)+(p.painZones?.includes('lumbar')?15:0)); const mental=Math.min(100,30+(['consulta','docencia','reuniones','escritura'].includes(p.workMode)?20:0)+(p.restrictions?.includes('trabajo emocional intenso')?25:0)+(activeB?.emotionalLoad==='alta'?15:0)+(activeB?.emotionalLoad==='media'?5:0)); const target=Math.max(1,Math.round(((p.screenHours||6)*60)/(p.intervalMin||35))); const adherence=Math.min(100,Math.round(today.filter(r=>r.completed).length/target*100)); const avgPain=recs.slice(-8).reduce((a,r)=>a+(+r.painAfter||+r.painBefore||0),0)/Math.max(1,recs.slice(-8).length); const body=Math.min(100,Math.round(avgPain*10 + (p.painZones?.length||0)*5)); const labels=[]; if(screen>60)labels.push('pantalla prolongada'); if(posture>60)labels.push('carga postural'); if(mental>60)labels.push('carga mental'); if(activeB?.emotionalLoad==='alta')labels.push('carga emocional activa'); if(body>55)labels.push('señales corporales'); const profileLabel=labels.join(' + ')||'perfil preventivo'; const recommendation=`Pausas ${p.pausePreference||'suaves'} cada ${activeB?.intervalMin||p.intervalMin||35} min, priorizando ${rankPauses(u).slice(0,3).map(x=>x.zone).join(', ')}.`; const narrative=`Perfil: ${p.workMode}, postura ${p.posture}, ${p.screenHours}h pantalla, zonas: ${(p.painZones||[]).join(', ')||'ninguna'}${activeB?`. Bloque activo: ${activeB.label} (${activeB.activity}, emocional ${activeB.emotionalLoad||'media'})`:''}. Lectura: ${profileLabel}.`; return {screen,posture,mental,adherence,body,profileLabel,recommendation,narrative};}
function rankPauses(u){const p=u.profile;const activeB=getActiveBlock(u);const selected=(p.diagnosedConditions||[]).map(id=>DIAG_CONDITIONS.find(c=>c.id===id)).filter(Boolean);return [...PAUSES].map(x=>{let s=0;if(p.painZones?.some(z=>x.zone.includes(z)||x.tags.includes(z)))s+=35;if(x.tags.includes(p.workMode))s+=20;if(p.restrictions?.includes('no puedo levantarme')&&x.posture.includes('sentado'))s+=18;if(p.restrictions?.includes('estoy en reunión')&&x.tags.includes('reunión'))s+=22;if(p.restrictions?.includes('fatiga visual')&&x.zone==='ojos')s+=25;if(p.pausePreference==='discreta'&&x.tags.includes('discreta'))s+=18;if(p.posture==='sentado'&&['lumbar','cadera','piernas','ojos','cuello'].includes(x.zone))s+=10;selected.forEach(c=>{if(c.zones?.some(z=>x.zone.includes(z)||x.tags.includes(z)))s+=34;if(c.tags?.some(t=>x.tags.includes(t)||x.title.toLowerCase().includes(t)||x.steps.join(' ').toLowerCase().includes(t)))s+=18;if(c.actions?.some(a=>x.steps.join(' ').toLowerCase().includes(a.toLowerCase().split(' ')[0])))s+=6;});if((p.restrictions||[]).some(r=>r.includes('muñeca') && x.zone.includes('manos')))s-=25;if((p.restrictions||[]).some(r=>r.includes('rodilla') && x.zone.includes('piernas')))s-=15;if((p.restrictions||[]).some(r=>r.includes('de pie') && x.posture.includes('de pie')))s-=20;if((p.restrictions||[]).some(r=>r.includes('sentado') && x.posture.includes('sentado')))s-=15;if(activeB){if(x.tags.includes(activeB.activity))s+=15;if(activeB.emotionalLoad==='alta'&&(x.type==='regulacion'||x.tags.includes('carga emocional')||x.tags.includes('consulta')))s+=30;if(activeB.emotionalLoad==='alta'&&x.type==='relajacion')s+=20;if(activeB.emotionalLoad==='media'&&(x.type==='regulacion'||x.tags.includes('estrés')))s+=10;}return{...x,score:s};}).sort((a,b)=>b.score-a.score||a.duration-b.duration);}
function recommendPause(u){const r=rankPauses(u)[0]||PAUSES[0]; const a=analyzeUser(u); const dx=(u.profile.diagnosedConditions||[]).length?' Incluye condiciones diagnosticadas seleccionadas.':''; return {...r, reason:a.profileLabel, why:`Sugerida por tu perfil de ${u.profile.workMode}, zonas de cuidado y restricciones.${dx}`};}
function getStats(userId){const recs=state.records.filter(r=>r.userId===userId); const today=recs.filter(r=>r.createdAt.slice(0,10)===todayKey()&&r.completed); const minutes=Math.round(today.reduce((a,r)=>a+(r.duration||0),0)/60); const days=[...new Set(recs.filter(r=>r.completed).map(r=>r.createdAt.slice(0,10)))].sort().reverse(); let streak=0; let d=new Date(); while(days.includes(d.toISOString().slice(0,10))){streak++; d.setDate(d.getDate()-1);} const deltas=recs.filter(r=>r.completed && r.painBefore!=null && r.painAfter!=null).slice(-5); const avgDelta=deltas.reduce((a,r)=>a+(r.painBefore-r.painAfter),0)/Math.max(1,deltas.length); return {todayCount:today.length, minutes, streak, deltaText:deltas.length?`Cambio promedio de tensión: ${avgDelta.toFixed(1)} pts.`:'Sin registros suficientes.'};}
function getActiveBlock(u){const blocks=u.profile.workBlocks||[]; return blocks.find(isWithinBlock)||null;}
function getPauseAnimationHtml(p){let anim='',label='';if(p.type==='regulacion'||p.tags.includes('estrés')||p.tags.includes('ansiedad')||p.zone==='mente'||p.zone==='rostro'){anim='<div class="anim-breathe"></div>';label='Inhala... Exhala...';}else if(p.zone==='ojos'||p.type==='visual'||p.zone.includes('ojo')){anim='<div class="anim-eye"><div class="anim-iris"></div></div>';label='Mira lejos... Mira cerca...';}else if(p.zone==='cuello'){anim='<div class="anim-neck"><div class="anim-head-c"></div><div class="anim-neck-l"></div></div>';label='Inclina suave';}else if(p.zone.includes('hombro')){anim='<div class="anim-shoulders"><div class="anim-sh anim-sh-l"></div><div class="anim-torso-l"></div><div class="anim-sh anim-sh-r"></div></div>';label='Sube y suelta';}else if(p.zone==='manos'||p.zone.includes('mano')){anim='<div class="anim-hands"><div class="anim-hand"><div class="anim-fing"></div><div class="anim-fing"></div><div class="anim-fing"></div><div class="anim-fing"></div><div class="anim-palm"></div></div></div>';label='Abre y cierra';}else if(p.zone==='piernas'&&(p.type==='activacion'||p.type==='circulacion')){anim='<div class="anim-legs"><div class="anim-leg"></div><div class="anim-leg"></div></div>';label='Marcha suave';}else if(p.tags.includes('carga emocional')||p.tags.includes('consulta')||p.zone==='mente/cuerpo'){anim='<div class="anim-heart"></div>';label='Regula tu estado';}else if(p.type==='postural'||p.zone==='pecho'||p.zone==='tronco'||p.zone==='postura'||p.zone==='cadera'){anim='<div class="anim-stretch"></div>';label='Estira suave';}else{anim='<div class="anim-breathe"></div>';label='Respira y mueve';}return `<div class="anim-preview">${anim}</div><div class="anim-label">${label}</div>`;}
function isWithinBlock(block){const n=new Date();const dayNames=['dom','lun','mar','mié','jue','vie','sáb'];const todayName=dayNames[n.getDay()];if(block.days&&block.days.length&&!block.days.includes(todayName))return false;const hh=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');return block.start<=hh&&hh<=block.end;}
function activeBlockInfo(u){const blocks=u.profile.workBlocks||[];const active=blocks.filter(isWithinBlock);if(!active.length)return '<p class="text-muted text-sm">Sin bloque activo.</p>';const dayLabels={lun:'Lun',mar:'Mar',mié:'Mié',jue:'Jue',vie:'Vie',sáb:'Sáb',dom:'Dom'};return active.map(b=>`<div class="block-info"><b>${esc(b.label)}</b><span>${b.start}–${b.end} · ${esc(b.activity)}${b.emotionalLoad?` · emocional ${esc(b.emotionalLoad)}`:''} · ${((b.days||[]).length?(b.days||[]).map(d=>dayLabels[d]||d).join(' '):'sin días activos')}</span></div>`).join('');}
function canUseBrowserNotification(){return ('Notification' in window) && Notification.permission==='granted' && state.ui.browserNotifications===true;}
function fireBrowserNotification(title,body){try{if(canUseBrowserNotification()) new Notification(title,{body,icon:'icon-192.svg',tag:'pausa-activa'});}catch(e){console.warn('browser notification failed',e);}}
function triggerDeviceFeedback(){try{const u=currentUser(); const style=u?.profile?.alertStyle||'visual'; if(navigator.vibrate && style!=='silenciosa') navigator.vibrate(style==='insistente'?[220,80,220]:[120]); if(style==='sonora suave'||style==='insistente') playCompletionSound();}catch(e){}}
function showScreenAlert(p,planItem=null){if(state.ui.inAppNotifications===false) return; if(document.querySelector('.screen-alert')) return; const el=document.createElement('div'); el.className='screen-alert'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite'); el.innerHTML=`<h3>Pausa activa sugerida</h3><p>${esc(p.title)} · ${esc(planItem?('Plan: cada '+(planItem.frequencyMin||'varios')+' min'):'Según tu perfil actual')}</p><div class="screen-alert-actions"><button class="btn btn-primary btn-sm" data-alertstart="${p.id}">Iniciar</button><button class="btn btn-secondary btn-sm" data-alertopen>Ver opciones</button><button class="btn btn-secondary btn-sm" data-alertclose>Ahora no</button></div>`; document.body.appendChild(el); el.querySelector('[data-alertstart]').onclick=()=>{el.remove(); startPause(p.id,planItem?.id||null);}; el.querySelector('[data-alertopen]').onclick=()=>{el.remove(); openAlertModal(p,planItem);}; el.querySelector('[data-alertclose]').onclick=()=>{const u=currentUser(); if(planItem&&u){recordPlanEvent(u,planItem,'pospuesta',p); schedulePlanItem(u,planItem,10); saveState(); toast('Pausa pospuesta','Volverá a sugerirse en 10 minutos.'); render();} else {state.ui.lastAlertAt=Date.now(); saveState(); toast('Pausa pausada','Volverá a sugerirse más adelante.');} el.remove();}; setTimeout(()=>{ if(el.isConnected) el.remove(); },22000);}
function toggleNotifications(){state.ui.inAppNotifications=state.ui.inAppNotifications===false?true:false; saveState(); toast('Notificaciones en pantalla',state.ui.inAppNotifications?'Activas. La app mostrará avisos internos.':'Pausadas. Puedes activarlas de nuevo desde los chips o ajustes.'); render();}
function nextAlertText(u){if(u.plan&&u.plan.status==='active'){const due=duePlanItem(u); if(due) return 'Pausa del plan disponible.'; const active=(u.plan.items||[]).filter(it=>it.active!==false&&it.nextDueAt); if(active.length){const next=Math.min(...active.map(it=>it.nextDueAt)); const remain=Math.max(0,Math.ceil((next-Date.now())/60000)); return remain?`Próxima pausa del plan en ${remain} min.`:'Pausa del plan disponible.';}}const activeB=getActiveBlock(u);const last=state.ui.lastAlertAt||Date.now();const interval=(activeB?.intervalMin||u.profile.intervalMin||35)*60000;const remain=Math.max(0,Math.ceil((last+interval-Date.now())/60000));if(!activeB)return 'Sin bloque activo.';return remain?`Próxima alerta en ${remain} min.`:'Alerta disponible.';}
function startAlertEngine(){if(runtime.alertInterval)clearInterval(runtime.alertInterval);runtime.alertInterval=setInterval(()=>{if($('#modal')?.classList.contains('open')||document.querySelector('.screen-alert'))return;const u=currentUser();if(!u)return; const dueItem=duePlanItem(u); if(dueItem){const p=PAUSES.find(x=>x.id===dueItem.pauseId)||recommendPause(u);toast('Pausa activa sugerida',p.title);triggerDeviceFeedback();fireBrowserNotification(APP_NAME+' · Pausa activa',`Pausa sugerida: ${p.title}`);showScreenAlert(p,dueItem);return;} const activeB=getActiveBlock(u);if(!activeB)return;const last=state.ui.lastAlertAt||Date.now();const interval=(activeB?.intervalMin||u.profile.intervalMin||35)*60000;const due=Date.now()-last>interval;if(due){const rec=recommendPause(u);state.ui.lastAlertAt=Date.now();saveState();toast('Pausa sugerida',rec.title);triggerDeviceFeedback();fireBrowserNotification(APP_NAME+' · Pausa activa',`Pausa sugerida: ${rec.title}`);showScreenAlert(rec,null);}} ,15000);}
function openAlertModal(p,planItem=null){openModal(`<h2>Pausa activa sugerida</h2><h3>${esc(p.title)}</h3><p class="text-sm text-muted">${esc(planItem?('Han pasado '+(planItem.frequencyMin||'varios')+' minutos según tu plan. '+(planItem.motive||'')):(p.why||'Sugerida por tu perfil actual.'))}</p><div class="pause-actions mt-16"><button class="btn btn-primary" data-startpause="${p.id}">Iniciar pausa</button><button class="btn btn-secondary" id="postponeBtn">Posponer 10 min</button><button class="btn btn-danger" id="skipBtn">Omitir por ahora</button></div>`); $('#modalBox [data-startpause]').onclick=()=>{startPause(p.id,planItem?.id||null);}; $('#postponeBtn').onclick=()=>{const u=currentUser(); if(planItem){recordPlanEvent(u,planItem,'pospuesta',p); schedulePlanItem(u,planItem,10);} else {state.ui.lastAlertAt=Date.now()-(u.profile.intervalMin-10)*60000;} saveState(); closeModal(); toast('Pausa pospuesta','Volverá a sugerirse en 10 minutos.'); render();}; $('#skipBtn').onclick=()=>{const u=currentUser(); if(planItem){recordPlanEvent(u,planItem,'omitida',p); schedulePlanItem(u,planItem);} else {state.records.push({id:uid('rec'),userId:u.id,pauseId:p.id,title:p.title,zone:p.zone,duration:0,completed:false,status:'omitida',createdAt:nowIso(),noteAfter:'Omitida desde alerta'});state.ui.lastAlertAt=Date.now();} saveState(); closeModal(); render();};}
function requestNotifications(){if(!('Notification' in window)){toast('Notificaciones del navegador','Este navegador no permite notificaciones externas. Los avisos internos siguen funcionando.');return;} Notification.requestPermission().then(p=>{state.ui.browserNotifications=(p==='granted'); state.ui.inAppNotifications=true; saveState(); toast('Permiso del navegador',p==='granted'?'Concedido. Además quedan activos los avisos internos.':'No concedido. La app usará avisos internos en pantalla.'); render();}).catch(()=>toast('Notificaciones','No se pudo solicitar el permiso.'));}
function installApp(){if(deferredInstallPrompt){deferredInstallPrompt.prompt(); deferredInstallPrompt.userChoice.finally(()=>deferredInstallPrompt=null);} else toast('Instalación','Usa el menú del navegador o "Agregar a pantalla de inicio".');}
function exportJson(){downloadFile(`activacare_backup_${todayKey()}.json`, JSON.stringify(state,null,2),'application/json');}
function importJson(e){const file=e.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=()=>{try{const data=JSON.parse(reader.result); if(!data.users||!Array.isArray(data.users)) throw new Error('Formato inválido'); if(!confirm('Esto reemplazará los datos actuales. ¿Continuar?'))return; state=migrateState(data); saveState(); render(); toast('Importado','Datos recuperados.');}catch(err){toast('Error','Archivo no válido.');}}; reader.readAsText(file);}
function exportHtml(){const u=currentUser(), a=analyzeUser(u), recs=state.records.filter(r=>r.userId===u.id); const html=`<!doctype html><meta charset="utf-8"><title>Informe ActivaCare · Cuidado Inteligente</title><style>body{font-family:sans-serif;padding:28px;color:#212121}h1{color:#006B54}.box{border:1px solid #E5E7EB;border-radius:12px;padding:14px;margin:12px 0}</style><h1>Informe ActivaCare</h1><p><b>${esc(u.name)}</b> · ${fmtDate(nowIso())}</p><div class="box"><h2>Análisis</h2><p>${esc(a.narrative)}</p></div><div class="box"><h2>Registros</h2>${recs.map(r=>`<p><b>${esc(r.title)}</b> · ${fmtDate(r.createdAt)} · ${r.completed?'✓':'⊘'}</p>`).join('')}</div>`; downloadFile(`informe_activacare_${todayKey()}.html`,html,'text/html');}
function downloadFile(name,content,type){const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function playCompletionSound(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)(); const notes=[261.6,329.6,392.0]; notes.forEach((freq,i)=>{const o=ctx.createOscillator(); const g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=freq; g.gain.setValueAtTime(0.25,ctx.currentTime+i*0.18); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.18+0.35); o.start(ctx.currentTime+i*0.18); o.stop(ctx.currentTime+i*0.18+0.4);}); }catch(e){} if(navigator.vibrate) navigator.vibrate([180,90,180]);}
function exportCsv(){const u=currentUser(); if(!u) return; const rows=state.records.filter(r=>r.userId===u.id); const bom='\uFEFF'; const header='Fecha,Pausa,Zona,Completada,Duracion_seg,Dolor_antes,Energia_antes,Dolor_despues,Energia_despues,Nota_antes,Nota_despues'; const csv=rows.map(r=>[r.createdAt,`"${(r.title||'').replace(/"/g,'""')}"`,r.zone||'',r.completed?'si':'no',r.duration||0,r.painBefore??'',r.energyBefore??'',r.painAfter??'',r.energyAfter??'',`"${(r.noteBefore||'').replace(/"/g,'""')}"`,`"${(r.noteAfter||'').replace(/"/g,'""')}"`].join(',')).join('\n'); downloadFile(`activacare_${u.name.replace(/\s+/g,'_')}_${todayKey()}.csv`,bom+header+'\n'+csv,'text/csv;charset=utf-8');}
function startCountdownUpdater(){if(runtime.countdownInterval)clearInterval(runtime.countdownInterval); runtime.countdownInterval=setInterval(()=>{const el=$('#next-alert-live'); if(!el)return; const u=currentUser(); if(!u)return; el.textContent=nextAlertText(u);},5000);}
function wipeAll(){if(confirm('¿Borrar todos los datos?')){localStorage.removeItem(STORAGE_KEY); state=structuredClone(DEFAULT_STATE); render();}}

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstallPrompt = e; });
window.addEventListener('keydown', e => { if(e.key==='Escape' && $('#modal')?.classList.contains('open')){ if(activeTimer?.running){toast('Temporizador activo','Detén la pausa antes de cerrar.'); return;} closeModal(); } });
render();
})();
</script>
