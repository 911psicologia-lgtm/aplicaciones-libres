<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#006B54" />
  <meta name="description" content="ActivaCare · Cuidado Inteligente: pausas activas adaptativas, offline-first, instalable y con análisis heurístico." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>ActivaCare · Cuidado Inteligente v2.5.1</title>
  <style>
    /* ─── Design Tokens ─── */
    :root {
      --bg: #F8F9FA;
      --panel: #FFFFFF;
      --surface: #F1F5F9;
      --text: #212121;
      --muted: #6C757D;
      --primary: #006B54;
      --primary-light: #00A885;
      --primary-bg: #E0F7F6;
      --secondary: #FF5A5F;
      --secondary-bg: #FFF1F1;
      --accent: #F59E0B;
      --accent-bg: #FFFBEB;
      --line: #E5E7EB;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
      --shadow-md: 0 4px 12px rgba(0,0,0,.1);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --font: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      --topbar-h: 60px;
      --bottomnav-h: 64px;
    }
    [data-theme="dark"] {
      --bg: #0F172A;
      --panel: #1E293B;
      --surface: #273548;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --primary: #34D399;
      --primary-light: #6EE7B7;
      --primary-bg: #064E3B;
      --secondary: #FB7185;
      --secondary-bg: #4C1D2B;
      --accent: #FBBF24;
      --accent-bg: #422006;
      --line: #334155;
      --shadow: 0 2px 8px rgba(0,0,0,.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,.4);
    }

    /* ─── Reset & Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: var(--primary); text-decoration: none; }

    /* ─── Layout ─── */
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .wrap { width: min(960px, calc(100% - 32px)); margin: 0 auto; }

    /* ─── Topbar ─── */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      height: var(--topbar-h);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .brand-sub { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
    .logo {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      background: var(--primary);
      display: grid; place-items: center;
      color: #fff; font-size: 18px;
    }
    .nav-actions { display: flex; align-items: center; gap: 6px; }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      font-size: 14px; font-weight: 600;
      border: 1px solid transparent;
      transition: all .15s ease;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-secondary { background: var(--panel); color: var(--text); border-color: var(--line); }
    .btn-secondary:hover { background: var(--surface); }
    .btn-danger { background: var(--secondary); color: #fff; }
    .btn-danger:hover { opacity: .9; }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-ghost:hover { color: var(--text); background: var(--surface); }
    .btn:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
    .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 6px; }
    .btn-block { width: 100%; }
    .iconbtn {
      width: 38px; height: 38px;
      display: grid; place-items: center;
      border-radius: var(--radius-sm);
      background: var(--panel);
      border: 1px solid var(--line);
      font-size: 16px;
      transition: background .15s;
    }
    .iconbtn:hover { background: var(--surface); }

    /* ─── Hero ─── */
    .hero { padding: 24px 0 8px; }
    .hero h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
    .hero .muted { color: var(--muted); font-size: 14px; margin-top: 4px; }

    /* ─── Tabs ─── */
    .tabs {
      display: flex; gap: 4px; overflow-x: auto;
      padding: 12px 0 20px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 8px 16px; border-radius: var(--radius-full);
      font-size: 13px; font-weight: 600;
      background: var(--panel); color: var(--muted);
      border: 1px solid var(--line);
      white-space: nowrap; transition: all .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ─── Bottom Navigation ─── */
    .bottom-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 25;
      background: var(--panel);
      border-top: 1px solid var(--line);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    }
    .bottom-nav-inner {
      display: flex; justify-content: space-around; align-items: center;
    }
    .bnav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 4px; border-radius: var(--radius-sm);
      color: var(--muted); font-size: 10px; font-weight: 500;
      transition: color .15s;
      min-width: 48px;
    }
    .bnav-icon { font-size: 20px; line-height: 1; }
    .bnav-label { font-size: 10px; }
    .bnav-item.active { color: var(--primary); }
    .bnav-item:hover { color: var(--text); }

    /* ─── Grid ─── */
    .grid { display: grid; gap: 16px; }
    .grid.two { grid-template-columns: 1.3fr .7fr; }
    .grid.three { grid-template-columns: repeat(3, 1fr); }

    /* ─── Card ─── */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    /* ─── Section Title ─── */
    .section-title {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 16px;
    }
    .section-title h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .section-title p { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* ─── Pills ─── */
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid var(--primary);
      border-radius: var(--radius-full);
      padding: 4px 10px;
      background: transparent;
      color: var(--primary);
      font-size: 12px; font-weight: 600;
    }
    [data-theme="dark"] .pill { border-color: var(--primary); color: var(--primary); }

    /* ─── Form Elements ─── */
    .field { display: grid; gap: 6px; margin: 10px 0; }
    .field label { font-size: 13px; font-weight: 600; color: var(--text); }
    .field small { font-size: 12px; color: var(--muted); }
    input[type="text"], input[type="number"], input[type="password"],
    input[type="time"], input[type="email"], select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    textarea { min-height: 80px; resize: vertical; }
    .rangegrid { display: grid; grid-template-columns: 1fr 60px; gap: 8px; align-items: center; }
    .rangegrid b { font-size: 14px; font-weight: 600; text-align: center; }

    /* ─── Checks ─── */
    .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 6px; }
    .check {
      display: flex; gap: 8px; align-items: center;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 8px 10px; background: var(--panel);
      font-size: 13px; cursor: pointer; transition: border-color .15s;
    }
    .check:hover { border-color: var(--primary); }
    .check input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
    .profile-compact { display: grid; gap: 12px; }
    .profile-head-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .section-kicker { display:flex; align-items:center; gap:7px; margin: 14px 0 8px; font-size:15px; font-weight:700; letter-spacing:-0.2px; }
    .info-tip { position:relative; display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; border:1px solid var(--line); color:var(--muted); font-size:11px; font-weight:700; background:var(--panel); cursor:help; }
    .info-tip:focus { outline:2px solid color-mix(in srgb, var(--primary) 35%, transparent); outline-offset:2px; }
    .info-tip:hover::after, .info-tip:focus::after { content: attr(data-tip); position:absolute; left:50%; top: calc(100% + 8px); transform:translateX(-50%); width:min(280px, 78vw); z-index:90; background:var(--text); color:var(--bg); border-radius:10px; padding:9px 11px; font-size:12px; line-height:1.35; font-weight:500; box-shadow:var(--shadow-md); }
    .field label.with-tip { display:flex; align-items:center; gap:6px; }
    .profile-note { padding:10px 12px; border-radius:var(--radius); background:var(--primary-bg); border:1px solid color-mix(in srgb, var(--primary) 25%, transparent); color:var(--text); font-size:12px; line-height:1.45; }
    .diag-summary { margin-top:10px; padding:10px 12px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--line); font-size:12px; color:var(--muted); }
    .diag-summary b { color:var(--text); }
    .checks.dense { grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); }
    .checks.conditions { grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); }
    .checks.conditions .check { align-items:flex-start; line-height:1.3; }
    .save-status { font-size:12px; color:var(--primary); font-weight:600; min-height:18px; }
    .block-compact-title { display:flex; justify-content:space-between; gap:8px; align-items:center; grid-column:1 / -1; }
    .block-compact-title b { font-size:13px; }
    .block input, .block select { padding:8px 10px; font-size:13px; }
    .block .field { margin:4px 0; gap:4px; }
    .block .field label { font-size:12px; }


    /* ─── Personalized Plan / Recommendation Layer ─── */
    .plan-card { border-color: color-mix(in srgb, var(--primary) 28%, var(--line)); background: linear-gradient(135deg, color-mix(in srgb, var(--primary-bg) 72%, var(--panel)), var(--panel)); }
    .plan-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .plan-badge { display:inline-flex; align-items:center; gap:6px; border-radius:var(--radius-full); padding:4px 10px; background:var(--primary); color:#fff; font-size:12px; font-weight:700; }
    .plan-list { display:grid; gap:8px; margin-top:12px; }
    .plan-item { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius); background:color-mix(in srgb, var(--panel) 82%, transparent); }
    .plan-item b { font-size:13px; }
    .plan-item small { display:block; margin-top:2px; color:var(--muted); font-size:12px; }
    .plan-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .recommend-block { margin-bottom:16px; padding:14px; border:1px solid color-mix(in srgb, var(--primary) 30%, var(--line)); border-radius:var(--radius-lg); background:color-mix(in srgb, var(--primary-bg) 55%, var(--panel)); }
    .recommended-card { position:relative; border-color: color-mix(in srgb, var(--primary) 46%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--primary) 18%, transparent), 0 0 22px color-mix(in srgb, var(--primary) 16%, transparent); background:linear-gradient(145deg, color-mix(in srgb, var(--primary-bg) 52%, var(--panel)), var(--panel)); }
    .recommended-card.priority-pulse, .plan-item.priority-pulse { animation: softPulse 1.9s ease-in-out infinite; border-color: color-mix(in srgb, var(--primary) 72%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--primary) 28%, transparent), 0 0 28px color-mix(in srgb, var(--primary) 30%, transparent); }
    @keyframes softPulse { 0%,100% { transform: translateY(0); filter: brightness(1); } 50% { transform: translateY(-1px); filter: brightness(1.05); } }
    .quick-context-chips { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
    .quick-context-chips .chip-action { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:999px; padding:8px 11px; font-size:12px; font-weight:700; cursor:pointer; box-shadow:var(--shadow-sm); }
    .quick-context-chips .chip-action.primary { border-color: color-mix(in srgb, var(--primary) 40%, var(--line)); background: color-mix(in srgb, var(--primary-bg) 80%, var(--panel)); color:var(--primary); }
    .quick-context-chips .chip-action.notify-on { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); background: color-mix(in srgb, var(--primary-bg) 70%, var(--panel)); color:var(--primary); }
    .quick-context-chips .chip-action.notify-off { opacity:.72; }
    .screen-alert { position:fixed; left:50%; bottom:92px; transform:translateX(-50%); width:min(94vw,520px); z-index:580; border:1px solid color-mix(in srgb, var(--primary) 45%, var(--line)); background:var(--panel); border-radius:22px; box-shadow:0 18px 50px rgba(15,23,42,.22); padding:14px; animation: alertSlide .22s ease-out both; }
    .screen-alert h3 { margin:0 0 4px; font-size:15px; }
    .screen-alert p { margin:0 0 10px; color:var(--muted); font-size:13px; }
    .screen-alert-actions { display:flex; gap:8px; flex-wrap:wrap; }
    @keyframes alertSlide { from{opacity:0; transform:translateX(-50%) translateY(18px);} to{opacity:1; transform:translateX(-50%) translateY(0);} }
    .profile-bottom-actions { position:sticky; bottom:70px; z-index:20; display:flex; justify-content:flex-end; gap:8px; margin-top:18px; padding:10px; border:1px solid var(--line); border-radius:var(--radius); background:color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px); }
    .analysis-help-title { display:flex; align-items:center; gap:6px; }
    .tour-bubble-backdrop { position:fixed; inset:0; z-index:600; background:rgba(2,6,23,.38); pointer-events:auto; }
    .tour-bubble { position:fixed; z-index:610; max-width:min(320px,88vw); background:var(--panel); color:var(--text); border:1px solid color-mix(in srgb, var(--primary) 35%, var(--line)); border-radius:18px; box-shadow:var(--shadow-lg); padding:14px; }
    .tour-bubble h3 { margin:0 0 6px; font-size:15px; }
    .tour-bubble p { margin:0 0 12px; color:var(--muted); font-size:13px; line-height:1.4; }
    .tour-bubble-actions { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .tour-target-highlight { position:relative; z-index:605; box-shadow:0 0 0 4px color-mix(in srgb, var(--primary) 24%, transparent), 0 0 28px color-mix(in srgb, var(--primary) 28%, transparent) !important; border-radius:16px; }
    @media(max-width:640px){ .quick-context-chips{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}.quick-context-chips .chip-action{white-space:nowrap}.profile-bottom-actions{bottom:74px;justify-content:stretch}.profile-bottom-actions .btn{flex:1} }
    .rec-label { display:inline-flex; align-items:center; gap:4px; border-radius:var(--radius-full); padding:3px 8px; background:var(--primary); color:#fff; font-size:11px; font-weight:700; }
    .rec-reason { margin-top:6px; font-size:12px; color:var(--muted); line-height:1.35; }
    .history-date { border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--panel); }
    .history-date + .history-date { margin-top:10px; }
    .history-date summary { list-style:none; cursor:pointer; padding:12px 14px; display:flex; justify-content:space-between; gap:10px; align-items:center; background:var(--surface); }
    .history-date summary::-webkit-details-marker { display:none; }
    .history-date summary b { font-size:14px; }
    .history-date summary small { color:var(--muted); font-size:12px; text-align:right; }
    .history-records { display:grid; gap:8px; padding:10px; }
    .record.status-pospuesta { border-left-color:var(--accent); }
    .record.status-omitida { border-left-color:var(--secondary); }
    .record.status-realizada { border-left-color:var(--primary); }
    .plan-modal-list { display:grid; gap:8px; margin:12px 0; }
    .plan-edit-row { display:grid; grid-template-columns:1fr 96px auto; gap:8px; align-items:end; padding:10px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); }
    @media(max-width:640px){ .plan-item, .plan-edit-row { grid-template-columns:1fr; } }

    /* ─── Stats ─── */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat { text-align: center; }
    .stat b { display: block; font-size: 28px; font-weight: 700; letter-spacing: -1px; color: var(--text); }
    .stat span { font-size: 12px; color: var(--muted); font-weight: 500; }

    /* ─── Daily Progress ─── */
    .day-prog-wrap { margin: 12px 0; }
    .day-prog-meta { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
    .day-prog { height: 6px; background: var(--line); border-radius: var(--radius-full); overflow: hidden; }
    .day-prog-bar { height: 100%; border-radius: var(--radius-full); transition: width .4s ease; }

    /* ─── Pause Hero ─── */
    .pause-hero { margin: 16px 0; }
    .pause-hero h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .pause-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    /* ─── Quick Row ─── */
    .quick-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .quick-btn {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 12px; text-align: left;
      font-size: 13px; transition: all .15s; cursor: pointer;
    }
    .quick-btn:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .quick-btn small { display: block; }
    .quick-btn b { display: block; font-size: 13px; margin: 4px 0; }

    /* ─── Pause Card ─── */
    .pause-card { display: grid; gap: 12px; }
    .pause-card-top { display: flex; gap: 12px; align-items: flex-start; }
    .pause-card-info { flex: 1; min-width: 0; }
    .pause-card-info h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .pause-card-info small { font-size: 12px; color: var(--muted); display: block; }
    .pause-card-footer { display: flex; gap: 6px; }

    /* ─── Block Info ─── */
    .block-info { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; }
    .block-info + .block-info { border-top: 1px solid var(--line); }
    .block-info b { font-size: 14px; font-weight: 600; }
    .block-info span { font-size: 12px; color: var(--muted); }

    /* ─── Record ─── */
    .record {
      border-left: 3px solid var(--primary);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--primary);
    }
    .record-header { display: flex; justify-content: space-between; align-items: center; }
    .record-header b { font-size: 14px; font-weight: 600; }
    .record-header small { font-size: 12px; color: var(--muted); }
    .record-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ─── Block Form ─── */
    .block {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      align-items: end;
      border: 1px solid var(--line); padding: 12px;
      border-radius: var(--radius); background: var(--surface);
    }
    .block .wide { grid-column: 1 / -1; }
    .day-checks { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    .day-chk {
      display: flex; align-items: center; gap: 3px;
      font-size: 12px; border: 1px solid var(--line);
      border-radius: 6px; padding: 4px 8px;
      background: var(--panel); cursor: pointer;
    }
    .day-chk input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--primary); cursor: pointer; }

    /* ─── Score Bar ─── */
    .analysis-box { display: grid; gap: 16px; }
    .scorebar { height: 6px; background: var(--line); border-radius: var(--radius-full); overflow: hidden; }
    .scorebar span { display: block; height: 100%; background: var(--primary); border-radius: var(--radius-full); transition: width .3s; }
    .score-line { margin-bottom: 12px; }
    .score-line-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    .score-line-header span:last-child { font-weight: 700; }

    /* ─── Heatmap ─── */
    .heatmap-row { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
    .heatmap-cell { width: 28px; height: 28px; border-radius: 6px; background: var(--line); }
    .trend-legend { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .trend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }

    /* ─── Steps ─── */
    .steps { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
    .step { display: flex; align-items: flex-start; gap: 12px; }
    .step-num {
      width: 26px; height: 26px; min-width: 26px;
      border-radius: 50%; background: var(--primary); color: #fff;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 600;
    }
    .step span:last-child { font-size: 14px; line-height: 1.5; padding-top: 2px; }

    /* ─── Timer (Circular SVG) ─── */
    .timer-wrap {
      display: flex; justify-content: center; align-items: center;
      position: relative; padding: 28px 0 12px;
    }
    .timer-ring {
      width: 220px; height: 220px;
      transform: rotate(-90deg);
    }
    .timer-bg { fill: none; stroke: var(--line); stroke-width: 8; }
    .timer-fg {
      fill: none; stroke: var(--primary); stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset .3s linear;
    }
    .timer-text {
      position: absolute;
      font-size: 44px; font-weight: 700; letter-spacing: -1px;
      color: var(--text);
    }
    .timer-controls {
      display: flex; justify-content: center; gap: 10px;
      padding: 16px 0;
    }

    /* ─── Menu / Drawer ─── */
    .menu { position: fixed; inset: 0; display: none; z-index: 40; background: rgba(0,0,0,.3); }
    .menu.open { display: block; }
    .drawer {
      position: absolute; right: 0; top: 0;
      width: min(340px, 88vw); height: 100%;
      background: var(--panel); padding: 20px;
      box-shadow: -4px 0 20px rgba(0,0,0,.15);
      overflow-y: auto;
    }
    .drawer h3 { font-size: 16px; font-weight: 700; margin: 12px 0 8px; }
    .drawer .btn-secondary { width: 100%; text-align: left; margin: 4px 0; }

    /* ─── Modal ─── */
    .modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      z-index: 50; background: rgba(0,0,0,.4); padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-box {
      width: min(520px, 100%);
      max-height: 88vh; overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 24px;
    }
    .modal-box h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.3px; }
    .modal-box h3 { font-size: 16px; font-weight: 600; margin: 16px 0 8px; }
    .modal-box p { font-size: 14px; color: var(--muted); line-height: 1.5; }

    /* ─── Toast ─── */
    .toast-stack {
      position: fixed; right: 12px; bottom: 12px; z-index: 80;
      display: grid; gap: 8px;
      width: min(320px, calc(100vw - 24px));
    }
    .toast {
      background: var(--panel); border: 1px solid var(--line);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      box-shadow: var(--shadow-md);
      font-size: 13px;
    }
    .toast b { display: block; font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .toast p { margin: 0; font-size: 12px; color: var(--muted); }

    /* ─── Microwarn ─── */
    .microwarn {
      padding: 8px 12px; border-radius: var(--radius-sm);
      background: var(--accent-bg);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      font-size: 12px; color: var(--text);
    }

    /* ─── Empty State ─── */
    .empty {
      border: 1px dashed var(--line); border-radius: var(--radius);
      padding: 24px; text-align: center; color: var(--muted); font-size: 14px;
    }

    /* ─── User List ─── */
    .userlist { display: grid; gap: 8px; }
    .useritem {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 12px; background: var(--panel);
    }
    .useritem b { font-size: 14px; }
    .useritem small { font-size: 12px; color: var(--muted); }

    /* ─── KBD ─── */
    .kbd { font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; padding: 2px 6px; border-radius: 4px; background: var(--surface); font-family: monospace; }

    /* ─── Footer ─── */
    .footer {
      padding: 20px 0; margin-bottom: var(--bottomnav-h);
      color: var(--muted); font-size: 12px; text-align: center;
    }

    /* ─── Utility ─── */
    .hidden { display: none !important; }
    .text-muted { color: var(--muted); }
    .text-sm { font-size: 13px; }
    .text-xs { font-size: 12px; }
    .fw-600 { font-weight: 600; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mb-8 { margin-bottom: 8px; }
    .gap-8 { gap: 8px; }

    /* ─── Pause Animations ─── */
    .anim-preview {
      width: 120px; height: 120px;
      margin: 0 auto; position: relative;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--primary-bg);
      flex-shrink: 0;
    }
    .anim-preview-sm { width: 64px; height: 64px; }
    .anim-preview-sm .anim-breathe { width: 36px; height: 36px; }
    .anim-preview-sm .anim-breathe::after { width: 14px; height: 14px; margin: 4px auto 0; }
    .anim-preview-sm .anim-eye { width: 48px; height: 22px; }
    .anim-preview-sm .anim-iris { width: 10px; height: 10px; }
    .anim-preview-sm .anim-head-c { width: 24px; height: 24px; }
    .anim-preview-sm .anim-neck-l { width: 2px; height: 12px; }
    .anim-preview-sm .anim-sh { width: 10px; height: 24px; }
    .anim-preview-sm .anim-torso-l { width: 2px; height: 18px; }
    .anim-preview-sm .anim-shoulders { width: 40px; height: 30px; }
    .anim-preview-sm .anim-palm { width: 14px; height: 16px; }
    .anim-preview-sm .anim-fing { width: 3px; height: 8px; }
    .anim-preview-sm .anim-hand { gap: 2px; }
    .anim-preview-sm .anim-leg { width: 4px; height: 20px; }
    .anim-preview-sm .anim-heart { width: 24px; height: 22px; }
    .anim-preview-sm .anim-heart::before, .anim-preview-sm .anim-heart::after { width: 14px; height: 20px; border-radius: 14px 14px 0 0; }
    .anim-preview-sm .anim-heart::before { left: 12px; }
    .anim-preview-sm .anim-heart::after { left: 0; }
    .anim-preview-sm .anim-stretch { width: 2px; height: 28px; }
    .anim-preview-sm .anim-stretch::before { width: 14px; height: 2px; }

    .anim-label { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; min-height: 18px; }

    .anim-breathe { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--primary); animation: abreathe 4s ease-in-out infinite; }
    .anim-breathe::after { content: ''; display: block; width: 26px; height: 26px; border-radius: 50%; background: color-mix(in srgb, var(--primary) 15%, transparent); margin: 6px auto 0; animation: abreatheIn 4s ease-in-out infinite; }
    @keyframes abreathe { 0%, 100% { transform: scale(.5); opacity: .3; } 50% { transform: scale(1); opacity: .9; } }
    @keyframes abreatheIn { 0%, 100% { transform: scale(.6); } 50% { transform: scale(1.4); } }

    .anim-eye { width: 80px; height: 38px; border: 3px solid var(--primary); border-radius: 50%; position: relative; background: color-mix(in srgb, var(--primary) 5%, transparent); overflow: hidden; }
    .anim-iris { width: 16px; height: 16px; border-radius: 50%; background: var(--primary); position: absolute; top: 50%; left: 50%; animation: aeyeFocus 4s ease-in-out infinite; }
    @keyframes aeyeFocus { 0%, 100% { transform: translate(-50%, -50%) translateX(-12px) scale(.7); opacity: .5; } 50% { transform: translate(-50%, -50%) translateX(12px) scale(1.15); opacity: 1; } }

    .anim-neck { display: flex; flex-direction: column; align-items: center; animation: aneckTilt 3s ease-in-out infinite; transform-origin: bottom center; }
    .anim-head-c { width: 38px; height: 38px; border: 3px solid var(--primary); border-radius: 50%; }
    .anim-neck-l { width: 3px; height: 18px; background: var(--primary); margin-top: 2px; }
    @keyframes aneckTilt { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-18deg); } 75% { transform: rotate(18deg); } }

    .anim-shoulders { position: relative; width: 64px; height: 48px; }
    .anim-sh { width: 14px; height: 38px; border: 3px solid var(--primary); border-radius: 6px; position: absolute; top: 0; }
    .anim-sh-l { left: 0; animation: ashUp 2.5s ease-in-out infinite; }
    .anim-sh-r { right: 0; animation: ashUp 2.5s ease-in-out infinite .15s; }
    .anim-torso-l { width: 3px; height: 28px; background: var(--primary); position: absolute; top: 12px; left: 50%; transform: translateX(-50%); border-radius: 2px; }
    @keyframes ashUp { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .anim-hands { display: flex; gap: 12px; justify-content: center; align-items: flex-end; }
    .anim-hand { display: flex; gap: 2px; align-items: flex-end; }
    .anim-palm { width: 22px; height: 26px; border: 3px solid var(--primary); border-radius: 3px 3px 6px 6px; }
    .anim-fing { width: 4px; height: 14px; border: 2px solid var(--primary); border-radius: 2px; animation: afingFlex 2.5s ease-in-out infinite; }
    .anim-fing:nth-child(2) { animation-delay: .1s; }
    .anim-fing:nth-child(3) { animation-delay: .2s; }
    .anim-fing:nth-child(4) { animation-delay: .3s; }
    @keyframes afingFlex { 0%, 100% { transform: scaleY(.7); opacity: .6; } 50% { transform: scaleY(1.2); opacity: 1; } }

    .anim-legs { display: flex; gap: 8px; align-items: flex-end; justify-content: center; }
    .anim-leg { width: 6px; height: 34px; border: 3px solid var(--primary); border-radius: 3px; animation: awalk 1.2s ease-in-out infinite; }
    .anim-leg:nth-child(2) { animation-delay: .6s; }
    @keyframes awalk { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }

    .anim-heart { width: 40px; height: 36px; position: relative; animation: aheartP 1.4s ease-in-out infinite; }
    .anim-heart::before, .anim-heart::after { content: ''; position: absolute; top: 0; width: 22px; height: 32px; border-radius: 22px 22px 0 0; background: var(--primary); }
    .anim-heart::before { left: 20px; transform: rotate(-45deg); transform-origin: 0 100%; }
    .anim-heart::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }
    @keyframes aheartP { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

    .anim-stretch { position: relative; width: 3px; height: 44px; background: var(--primary); margin: 0 auto; border-radius: 2px; animation: astrLean 3s ease-in-out infinite; transform-origin: bottom center; }
    .anim-stretch::before { content: ''; position: absolute; top: 0; right: 0; width: 24px; height: 3px; background: var(--primary); border-radius: 2px; transform-origin: left center; animation: astrArm 3s ease-in-out infinite; }
    @keyframes astrLean { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(14deg); } }
    @keyframes astrArm { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-70deg); } }

    /* ─── Login Card ─── */
    .login-card { max-width: 560px; margin: 0 auto; }
    .login-card h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
    .login-card .subtitle { color: var(--muted); font-size: 14px; margin: 8px 0 20px; }
    .login-card .grid.two { grid-template-columns: 1fr 1fr; }
    .login-card h2 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }

    /* ─── Responsive ─── */
    @media (max-width: 768px) {
      .bottom-nav { display: block; }
      .tabs { display: none; }
      .grid.two, .grid.three { grid-template-columns: 1fr; }
      .topbar-inner { height: auto; min-height: var(--topbar-h); padding: 6px 0; }
      .brand-sub { display: none; }
      .nav-actions .btn-secondary { display: none; }
      .card { padding: 16px; }
      .block { grid-template-columns: 1fr; }
      .checks.conditions, .checks.dense { grid-template-columns: 1fr; }
      .info-tip:hover::after, .info-tip:focus::after { left:auto; right:0; transform:none; }
      .block .wide { grid-column: auto; }
      .section-title { flex-direction: column; align-items: flex-start; }
      .quick-row { grid-template-columns: 1fr; }
      #pauseList { grid-template-columns: 1fr; }
      .hero { padding: 16px 0 4px; }
      .hero h1 { font-size: 22px; }
      .pause-card-top { flex-direction: column; }
      .footer { margin-bottom: calc(var(--bottomnav-h) + 8px); }
      .login-card .grid.two { grid-template-columns: 1fr; }
      .modal-box { padding: 18px; }
      .timer-ring { width: 180px; height: 180px; }
      .timer-text { font-size: 36px; }
    }
    @media (min-width: 769px) {
      .footer { margin-bottom: 0; }
    }

    /* ─── Print ─── */
    @media print {
      .topbar, .tabs, .bottom-nav, .menu, .modal, .toast-stack, .footer, .no-print { display: none !important; }
      body { background: #fff; }
      .wrap { width: 100%; }
      .card { box-shadow: none; break-inside: avoid; border: 1px solid #ddd; }
    }

    /* ────────────────────────────────────────────────
       FASE 3 · Capa visual premium preservativa v2.5.0
       Solo estilos: no altera lógica, guardado, plan ni navegación.
    ───────────────────────────────────────────────── */
    :root {
      --bg: #F5F9F7;
      --panel: rgba(255,255,255,.86);
      --surface: rgba(236,248,244,.86);
      --line: rgba(0,107,84,.14);
      --line-strong: rgba(0,107,84,.26);
      --primary: #006B54;
      --primary-light: #00B894;
      --primary-bg: rgba(224,247,246,.88);
      --accent: #F59E0B;
      --accent-bg: rgba(255,251,235,.9);
      --glow-primary: rgba(0,184,148,.22);
      --glow-secondary: rgba(245,158,11,.18);
      --shadow: 0 10px 30px rgba(5,71,59,.08);
      --shadow-md: 0 18px 44px rgba(5,71,59,.14);
      --shadow-lg: 0 28px 70px rgba(5,71,59,.18);
      --radius: 16px;
      --radius-sm: 12px;
      --radius-lg: 22px;
    }
    [data-theme="dark"] {
      --bg: #071411;
      --panel: rgba(18,34,31,.86);
      --surface: rgba(24,51,45,.82);
      --line: rgba(110,231,183,.14);
      --line-strong: rgba(110,231,183,.28);
      --primary: #6EE7B7;
      --primary-light: #A7F3D0;
      --primary-bg: rgba(6,78,59,.78);
      --glow-primary: rgba(110,231,183,.20);
      --glow-secondary: rgba(251,191,36,.16);
    }
    html { background: var(--bg); }
    body {
      background:
        radial-gradient(circle at 8% -12%, color-mix(in srgb, var(--primary-light) 24%, transparent), transparent 34vw),
        radial-gradient(circle at 94% 6%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 30vw),
        radial-gradient(circle at 50% 115%, color-mix(in srgb, var(--primary) 12%, transparent), transparent 40vw),
        var(--bg);
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background-image:
        linear-gradient(120deg, rgba(255,255,255,.08), transparent 32%, rgba(255,255,255,.05)),
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.09) 0 1px, transparent 1px);
      background-size: auto, 34px 34px;
      opacity: .55;
    }
    .wrap { width: min(1040px, calc(100% - 28px)); }
    .topbar {
      background: color-mix(in srgb, var(--panel) 76%, transparent);
      box-shadow: 0 8px 28px rgba(5,71,59,.06);
      border-bottom-color: var(--line);
    }
    .logo {
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      box-shadow: 0 10px 24px var(--glow-primary), inset 0 1px 0 rgba(255,255,255,.34);
    }
    .brand-name { letter-spacing: -.45px; }
    .brand-sub { color: color-mix(in srgb, var(--muted) 78%, var(--primary)); }
    .hero { padding-top: 28px; }
    .hero h1, .login-card h1 {
      letter-spacing: -.75px;
      background: linear-gradient(135deg, var(--text) 20%, color-mix(in srgb, var(--primary) 64%, var(--text)) 88%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .tabs { gap: 8px; padding-bottom: 18px; }
    .tab {
      background: color-mix(in srgb, var(--panel) 82%, transparent);
      border-color: var(--line);
      box-shadow: 0 8px 20px rgba(5,71,59,.04);
    }
    .tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      box-shadow: 0 10px 24px var(--glow-primary);
      transform: translateY(-1px);
    }
    .card, .login-card, .modal-box, .menu-panel {
      background: linear-gradient(145deg, color-mix(in srgb, var(--panel) 96%, white), color-mix(in srgb, var(--surface) 38%, var(--panel)));
      border-color: var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .card {
      position: relative;
      overflow: hidden;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--primary-light) 48%, transparent), transparent);
      opacity: .75;
      pointer-events: none;
    }
    .card:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .section-title h2 { letter-spacing: -.45px; }
    .btn, .iconbtn, .quick-btn, .chip-action, .tab, .bnav-item {
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease, color .18s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      box-shadow: 0 12px 28px var(--glow-primary);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 16px 36px var(--glow-primary); }
    .btn-secondary, .iconbtn {
      background: color-mix(in srgb, var(--panel) 90%, transparent);
      border-color: var(--line);
    }
    .btn-secondary:hover, .iconbtn:hover { transform: translateY(-1px); border-color: var(--line-strong); }
    .pill, .tag, .badge {
      background: color-mix(in srgb, var(--primary-bg) 68%, transparent);
      border-color: color-mix(in srgb, var(--primary) 28%, var(--line));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
    }
    input[type="text"], input[type="number"], input[type="password"],
    input[type="time"], input[type="email"], select, textarea {
      background: color-mix(in srgb, var(--panel) 76%, white);
      border-color: var(--line);
      border-radius: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
    }
    input:focus, select:focus, textarea:focus {
      border-color: color-mix(in srgb, var(--primary) 62%, var(--line));
      box-shadow: 0 0 0 4px var(--glow-primary), inset 0 1px 0 rgba(255,255,255,.35);
      outline: none;
    }
    .quick-context-chips {
      position: sticky;
      top: calc(var(--topbar-h) + 6px);
      z-index: 15;
      padding: 8px 0;
      margin-bottom: 10px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 88%, transparent), color-mix(in srgb, var(--bg) 34%, transparent));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .quick-context-chips .chip-action {
      border-radius: 999px;
      padding: 9px 13px;
      background: color-mix(in srgb, var(--panel) 84%, transparent);
      border-color: var(--line);
    }
    .quick-context-chips .chip-action:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(5,71,59,.08); }
    .quick-context-chips .chip-action.primary,
    .quick-context-chips .chip-action.notify-on {
      background: linear-gradient(135deg, color-mix(in srgb, var(--primary-bg) 90%, var(--panel)), color-mix(in srgb, var(--panel) 70%, var(--primary-bg)));
      border-color: color-mix(in srgb, var(--primary) 36%, var(--line));
      box-shadow: 0 10px 24px var(--glow-primary);
