//  SETUP

const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W, H;

function resize() {
  const vv = window.visualViewport;
  const cssW = Math.max(1, Math.floor(vv ? vv.width : window.innerWidth));
  const cssH = Math.max(1, Math.floor(vv ? vv.height : window.innerHeight));
  const dpr = Math.min(2, window.devicePixelRatio || 1);

  cv.style.width = cssW + 'px';
  cv.style.height = cssH + 'px';

  cv.width = Math.floor(cssW * dpr);
  cv.height = Math.floor(cssH * dpr);

  // Mantiene el sistema lógico en píxeles CSS para que la jugabilidad no se acelere por DPR.
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = cssW;
  H = cssH;

  const landscape = W >= H;
  document.body.classList.toggle('is-landscape', landscape);
  document.body.classList.toggle('is-portrait', !landscape);
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 240));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
document.addEventListener('DOMContentLoaded', () => {
  const portraitBtn = document.getElementById('playPortraitBtn');
  if (portraitBtn) portraitBtn.addEventListener('click', () => document.body.classList.add('allow-portrait'));
});

const TAU = Math.PI * 2;
const IS_DESKTOP = window.matchMedia('(pointer:fine)').matches;
const PERF = { desktopLite: IS_DESKTOP, bgDensity: IS_DESKTOP ? 0.72 : 1, particleMult: IS_DESKTOP ? 0.68 : 1 };
// Performance: cap shadowBlur to reduce GPU load
const MAX_SHADOW = IS_DESKTOP ? 12 : 0;
// Performance helper: only glow on desktop
function glow(col, blur) {
  cx.shadowColor = col;
  cx.shadowBlur  = IS_DESKTOP ? Math.min(blur, MAX_SHADOW) : 0;
}
function noGlow() { cx.shadowBlur = 0; }
(()=>{ const d=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,'shadowBlur'); if(d&&d.set){ const orig=d.set; Object.defineProperty(CanvasRenderingContext2D.prototype,'shadowBlur',{ set(v){ orig.call(this,Math.min(v,MAX_SHADOW)); }, get:d.get, configurable:true }); } })();
const LEVEL_BEAM_COLORS = ['#d8b4ff','#b28cff','#ffffff','#6cb6ff','#6dffb3'];
const rnd  = (a,b) => a + Math.random()*(b-a);
const rndI = (a,b) => Math.floor(a + Math.random()*(b-a+1));
const clamp= (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const lerp = (a,b,t) => a+(b-a)*t;
const dist2= (ax,ay,bx,by) => (bx-ax)**2+(by-ay)**2;
const ang  = (ax,ay,bx,by) => Math.atan2(by-ay,bx-ax);
const isLandscapeMode = () => W >= H;
const isPortraitMobile = () => W < H && Math.min(W,H) < 700;
const uiScale = () => clamp(Math.min(W / 960, H / 540), 0.72, 1.18);
const safeTop = () => 8;
const safeBottom = () => Math.max(8, H * 0.018);
const gameplayBottomLimit = () => H - (isLandscapeMode() ? 46 : 74);

function requestGameFullscreen() {
  const el = document.documentElement;
  const c = document.getElementById('c');
  try {
    const target = el.requestFullscreen ? el : (c && c.requestFullscreen ? c : el);
    if (!document.fullscreenElement && target.requestFullscreen) target.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
    else if (!document.webkitFullscreenElement && target.webkitRequestFullscreen) target.webkitRequestFullscreen();
    if (screen.orientation && screen.orientation.lock && window.innerWidth < 900) {
      screen.orientation.lock('landscape').catch(()=>{});
    }
    document.body.classList.add('fullscreen-on');
    setTimeout(resize, 160);
    return true;
  } catch(e) {
    try { if (c && c.requestFullscreen) c.requestFullscreen(); } catch(_) {}
    notify('Pantalla completa no disponible', '#ffcc66', 120);
    return false;
  }
}
function exitGameFullscreen() {
  try {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  } catch(e) {}
  document.body.classList.remove('fullscreen-on');
  setTimeout(resize, 120);
}
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('fullscreen-on', !!document.fullscreenElement);
  setTimeout(resize, 120);
});
document.addEventListener('webkitfullscreenchange', () => {
  document.body.classList.toggle('fullscreen-on', !!document.webkitFullscreenElement);
  setTimeout(resize, 120);
});



// ═══════════════════════════════════════════════════════════════
//  AUDIO ENGINE (Web Audio API — sin archivos externos)
// ═══════════════════════════════════════════════════════════════
let AC = null;
function getAC() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}

function playTone(freq, type, dur, vol=0.18, delay=0, detune=0) {
  const ac = getAC(); if (!ac) return;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.connect(gain); gain.connect(ac.destination);
  osc.type = type; osc.frequency.value = freq;
  if (detune) osc.detune.value = detune;
  const t = ac.currentTime + delay;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.start(t); osc.stop(t + dur);
}

function playNoise(dur, vol=0.12, lpFreq=2000, delay=0) {
  const ac = getAC(); if (!ac) return;
  const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  const filt = ac.createBiquadFilter();
  const gain = ac.createGain();
  src.buffer = buf;
  filt.type = 'lowpass'; filt.frequency.value = lpFreq;
  src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
  const t = ac.currentTime + delay;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.start(t);
}

      case 'ionic':     playTone(1600,'sine',0.08,0.1); playNoise(0.07,0.07,5000); playTone(400,'square',0.1,0.08,0.01); break;

      case 'cryo':      playTone(1800,'sine',0.06,0.1); playTone(2200,'sine',0.04,0.08,0.02); break;
      case 'napalm':    playNoise(0.2,0.12,300); playTone(120,'sawtooth',0.12,0.1); break;
      case 'gravity':   playTone(80,'sine',0.25,0.3); playTone(60,'sine',0.2,0.3,0.1); break;
      case 'antimatter':playTone(2000,'sine',0.18,0.15); playTone(500,'square',0.12,0.12,0.02); playNoise(0.1,0.08,3000); break;
      case 'quantum':   playTone(1200,'sine',0.08,0.1); playTone(1600,'sine',0.06,0.08,0.015); break;

  },
  hit() {

  },
  enemyDie() {

  save() {

// Boss ambient hum (looping)
let bossHum = null;
function startBossHum(type) {
  stopBossHum();
  const ac = getAC(); if (!ac || SFX._muted) return;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.connect(gain); gain.connect(ac.destination);
  osc.type = 'sawtooth';
  osc.frequency.value = type==='hivemind'?55 : type==='broodqueen'?45 : 35;
  gain.gain.setValueAtTime(0.04, ac.currentTime);
  osc.start(); bossHum = {osc, gain};
}
function stopBossHum() {
  if (bossHum) { try { bossHum.osc.stop(); } catch(e){} bossHum=null; }
}

// ═══════════════════════════════════════════════════════════════
//  JUICE ENGINE — Screen shake, CRT, Combos, Damage numbers
// ═══════════════════════════════════════════════════════════════

// ── Screen shake
const CAM = { x:0, y:0, trauma:0 };
function shake(amount) { CAM.trauma = Math.min(1, CAM.trauma + amount); }
function updateCam() {
  CAM.trauma = Math.max(0, CAM.trauma - 0.04);
  const s = CAM.trauma * CAM.trauma;
  CAM.x = rnd(-18,18)*s; CAM.y = rnd(-14,14)*s;
}
function applyShake() { if(CAM.trauma>0.01) { cx.save(); cx.translate(CAM.x,CAM.y); return true; } return false; }
function restoreShake(applied) { if(applied) cx.restore(); }

// ── Chromatic aberration (hit flash)
let chromaTimer = 0;
function triggerChroma() { chromaTimer = 12; }
function drawChroma() {
  if(chromaTimer <= 0) return;
  chromaTimer--;
  const str = chromaTimer * 2;
  cx.save(); cx.globalCompositeOperation='screen'; cx.globalAlpha=0.08;
  cx.drawImage(cv, str, 0, W, H, 0, 0, W, H);
  cx.drawImage(cv, -str, 0, W, H, 0, 0, W, H);
  cx.restore();
}

// ── Screen flash
let flashTimer=0, flashCol='#ffffff';
function flash(col='#ffffff', dur=8) { flashTimer=dur; flashCol=col; }
function drawFlash() {
  if(flashTimer<=0) return;
  flashTimer--;
  cx.fillStyle=flashCol; cx.globalAlpha=(flashTimer/8)*0.35;
  cx.fillRect(0,0,W,H); cx.globalAlpha=1;
}

// ── CRT overlay


function drawFloatingPowerStatus() {
  // Indicador discreto: no es botón, solo informa el poder o arma temporal activa.
  cx.save();
  const active = [];
  if (G.weapon && WEAPONS[G.weapon]) {
    const wd = WEAPONS[G.weapon];
    active.push({icon: wd.icon || '⚡', name: wd.name || G.weapon, col: wd.color || '#66ffee'});
  }
  if (G.beamTimer && G.beamTimer > 0) {
    active.push({icon:'✦', name:'LÁSER X '+Math.ceil(G.beamTimer/60)+'s', col:G.beamColor||'#d8b4ff'});
  }
  if (G.magnetTimer && G.magnetTimer > 0) {
    active.push({icon:'🧲', name:'IMÁN '+Math.ceil(G.magnetTimer/60)+'s', col:'#66ffee'});
  }
  if (G.bossEntryShield && G.bossEntryShield > 0) {
    active.push({icon:'🛡', name:'ESCUDO JEFE '+Math.ceil(G.bossEntryShield/60)+'s', col:'#88bbff'});
  }

  const max = Math.min(active.length, 3);
  let x = 8, y = (typeof isLandscapeMode==='function' && isLandscapeMode()) ? 8 : 48;
  for (let i=0;i<max;i++) {
    const a = active[i];
    const w = Math.min(150, 50 + a.name.length*7);
    cx.globalAlpha = 0.78;
    cx.fillStyle = 'rgba(0,0,0,0.48)';
    cx.strokeStyle = a.col;
    cx.lineWidth = 1;
    if (cx.roundRect) {
      cx.beginPath(); cx.roundRect(x, y, w, 24, 8); cx.fill(); cx.stroke();
    } else {
      cx.fillRect(x, y, w, 24); cx.strokeRect(x, y, w, 24);
    }
    cx.globalAlpha = 1;
    cx.fillStyle = a.col;
    cx.font = 'bold 11px Courier New';
    cx.textAlign = 'left';
    cx.fillText(a.icon + ' ' + a.name.slice(0,16), x+8, y+16);
    x += w + 6;
  }
  cx.restore();
}

function drawOrientationBadge() {
  if (isLandscapeMode()) return;
  if (document.body.classList.contains('allow-portrait')) {
    cx.save();
    cx.globalAlpha = 0.9;
    cx.fillStyle = 'rgba(0,0,0,0.58)';
    cx.fillRect(10, H-54, Math.min(W-20, 330), 38);
    cx.strokeStyle = 'rgba(0,255,220,0.35)';
    cx.strokeRect(10, H-54, Math.min(W-20, 330), 38);
    cx.fillStyle = '#9fffea';
    cx.font = 'bold 12px Courier New';
    cx.fillText('TIP: en horizontal tendrás más campo visual', 18, H-31);
    cx.restore();
  }
}

function drawCRT() {
  // Scanlines
  cx.save(); cx.globalAlpha=0.04;
  for(let y=0;y<H;y+=2){ cx.fillStyle='#000'; cx.fillRect(0,y,W,1); }
  cx.globalAlpha=1;
  // Vignette
  const vg = cx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.82);
  vg.addColorStop(0,'transparent'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  cx.fillStyle=vg; cx.fillRect(0,0,W,H);
  // Corner glow (green phosphor)
  cx.globalAlpha=0.03; cx.fillStyle='#00ff88'; cx.fillRect(0,0,W,H);
  cx.globalAlpha=1;
  // Subtle pixel grid
  cx.globalAlpha=0.012; cx.strokeStyle='#00ff88'; cx.lineWidth=0.5;
  for(let x=0;x<W;x+=4){ cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke(); }
  cx.globalAlpha=1;
  cx.restore();
}

// ── Neon phosphor haze on background
function drawPhosphorHaze() {
  const t=Date.now()*0.0004;
  cx.save(); cx.globalAlpha=0.06;

  haze.addColorStop(0,'#00ff88'); haze.addColorStop(1,'transparent');
  cx.fillStyle=haze; cx.fillRect(0,0,W,H);
  cx.globalAlpha=1; cx.restore();
}

// ── Combo system
const COMBO = {
  count: 0, mult: 1, timer: 0, maxTimer: 220,
  lastKillTime: 0, peak: 0,
  streakLabels: ['','DOUBLE!','TRIPLE!','QUAD!!','PENTA!!','ULTRA!!!','XENO-KILL!!','⚡LEGENDARY⚡'],
  streakSFX:    [0,0,0,0,0,0,0,0],
  add() {
    const now=Date.now();
    if(now-this.lastKillTime<1800) this.count++;
    else this.count=1;
    this.lastKillTime=now;
    this.timer=this.maxTimer;
    this.mult=Math.min(8, 1+Math.floor(this.count/2));
    this.peak=Math.max(this.peak,this.count);
    if(this.count>=2) {
      const label=this.streakLabels[Math.min(this.count-1,7)]||'x'+this.count;
      notify(label, this.count>=5?'#ff00ff':this.count>=3?'#ffdd00':'#00ffcc', 100);
      SFX.pickup();
      if(this.count>=4) shake(0.25);
      // Combo rewards
      if(this.count===3){ G.gold+=5; G.runGold+=5; spawnPickup(G.px+60,G.py,'gold'); }
      if(this.count===5){ G.gold+=15; G.runGold+=15; notify('+15 ORO COMBO','#ffd54a',120); saveMetaProgress(); }
      if(this.count===7){ G.php=Math.min(G.pmaxhp,G.php+20); notify('+20 HP COMBO REWARD','#ff4488',120); }
      if(this.count===10){ G.atomicCharges=(G.atomicCharges||0)+1; notify('☢ CARGA ATÓMICA COMBO','#ff8800',160); flash('#ff8800',10); }
      if(this.count>0 && this.count%12===0){ G.gold+=25; G.runGold+=25; notify('+25 ORO MEGA COMBO','#ffdd00',180); saveMetaProgress(); flash('#ffdd00',8); }
    }
  },
  tick() { if(this.timer>0){this.timer--; if(this.timer<=0){this.count=0;this.mult=1;}} },
  reset() { this.count=0; this.mult=1; this.timer=0; this.peak=0; }
};

// ── Damage numbers
const DMG_NUMS = [];
function spawnDmgNum(x, y, val, col='#ffffff', big=false) {
  const display = typeof val === 'number' ? Math.round(val) : val;
  DMG_NUMS.push({x, y, val:display, col, t:0, vy:-1.4-Math.random()*0.8, vx:rnd(-0.5,0.5), big});
}
function updateDrawDmgNums() {
  for(let i=DMG_NUMS.length-1;i>=0;i--){
    const d=DMG_NUMS[i]; d.t++; d.x+=d.vx; d.y+=d.vy; d.vy*=0.94;
    const life=1-d.t/45; if(life<=0){DMG_NUMS.splice(i,1);continue;}
    cx.save(); cx.globalAlpha=life;
    cx.font=`bold ${d.big?18:12}px 'Courier New'`;
    cx.fillStyle=d.col; cx.shadowColor=d.col; cx.shadowBlur=6;
    cx.textAlign='center'; cx.fillText((d.big?'✦':'')+d.val, d.x, d.y);
    cx.textAlign='left'; cx.restore();
  }
}

// ── Kill streak announcer
let streakDisplay = null;
function showStreak(text, col) {
  streakDisplay = {text, col, t:0, dur:100};
}
function drawStreakDisplay() {
  if(!streakDisplay) return;
  streakDisplay.t++;
  if(streakDisplay.t>=streakDisplay.dur){streakDisplay=null;return;}
  const life=streakDisplay.t<10?streakDisplay.t/10:1-(streakDisplay.t-70)/30;
  cx.save(); cx.globalAlpha=Math.max(0,life);
  const sz=Math.min(44,W*0.07);
  cx.font=`bold ${sz}px 'Courier New'`;
  cx.fillStyle=streakDisplay.col; cx.shadowColor=streakDisplay.col;
  cx.shadowBlur=28+Math.sin(streakDisplay.t*0.3)*8;
  cx.textAlign='center';
  const yoff=H*0.42-Math.sin(streakDisplay.t*0.08)*8;
  cx.fillText(streakDisplay.text, W/2, yoff);
  cx.textAlign='left'; cx.restore();
}

// ── Retro parallax background layers
const PARALLAX = { layers: [] };
function initParallax() {
  PARALLAX.layers = [];
  // Layer 1: distant debris/grid
  const pts1=[];
  for(let i=0;i<30;i++) pts1.push({x:rnd(0,W),y:rnd(0,H),w:rnd(40,120),h:rnd(1,3),spd:0.12,col:'#112233'});
  PARALLAX.layers.push({type:'lines',pts:pts1,spd:0.12});
  // Layer 2: mid debris
  const pts2=[];
  for(let i=0;i<16;i++) pts2.push({x:rnd(0,W),y:rnd(0,H),r:rnd(1,4),spd:0.4,col:'#0a1a0a'});
  PARALLAX.layers.push({type:'dots',pts:pts2,spd:0.4});
  // Layer 3: near asteroids
  const pts3=[];
  for(let i=0;i<6;i++) pts3.push({x:rnd(0,W),y:rnd(0,H),r:rnd(6,18),spd:1.1,rot:rnd(0,TAU),col:'#1a1208'});
  PARALLAX.layers.push({type:'rocks',pts:pts3,spd:1.1});
}

function drawParallaxLayer(px, py) {
  PARALLAX.layers.forEach((layer,li) => {
    const shift = li===0?0.02:li===1?0.06:0.1;
    const offx = -(px-W/2)*shift, offy = -(py-H/2)*shift*0.5;
    cx.save(); cx.translate(offx,offy);
    layer.pts.forEach(p => {
      p.x -= layer.spd*0.4; if(p.x<-60) {p.x=W+60; p.y=rnd(0,H);}
      if(layer.type==='lines'){
        cx.fillStyle=p.col; cx.globalAlpha=0.5; cx.fillRect(p.x,p.y,p.w,p.h);
      } else if(layer.type==='dots'){
        cx.fillStyle=p.col; cx.globalAlpha=0.6; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,TAU); cx.fill();
      } else if(layer.type==='rocks'){
        p.rot+=0.004; cx.fillStyle=p.col; cx.globalAlpha=0.7; cx.save();
        cx.translate(p.x,p.y); cx.rotate(p.rot);
        cx.beginPath();
        for(let i=0;i<7;i++){const a=i/7*TAU,rr=p.r*(0.7+Math.sin(a*2.3)*0.3);cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
        cx.closePath(); cx.fill(); cx.restore();
      }
      cx.globalAlpha=1;
    });
    cx.restore();
  });
}

// ── Weapon charge bar (tiny arc around player)
function drawWeaponCharge() {
  const wd = WEAPONS[G.weapon]; if(!wd) return;
  const charge = 1-(G.weapTimer/wd.rate);
  if(charge>=1||charge<=0) return;
  cx.save(); cx.strokeStyle=wd.color; cx.lineWidth=2.5;
  cx.shadowColor=wd.color; cx.shadowBlur=6; cx.globalAlpha=0.6;
  cx.beginPath(); cx.arc(G.px,G.py,34,-Math.PI/2,-Math.PI/2+TAU*charge); cx.stroke();
  cx.restore();
}

// ── Electric spark trail for laser
const LASER_SPARKS = [];
function addLaserSparks(x,y,col) {
  for(let i=0;i<2;i++) LASER_SPARKS.push({x:x+rnd(-3,3),y:y+rnd(-6,6),vx:rnd(1,4),vy:rnd(-2,2),life:1,col});
}
function updateDrawLaserSparks() {
  for(let i=LASER_SPARKS.length-1;i>=0;i--){
    const s=LASER_SPARKS[i]; s.x+=s.vx; s.y+=s.vy; s.vy*=0.9; s.life-=0.12;
    if(s.life<=0){LASER_SPARKS.splice(i,1);continue;}
    cx.save(); cx.globalAlpha=s.life*0.8;
    cx.fillStyle=s.col; cx.shadowColor=s.col; cx.shadowBlur=4;
    cx.beginPath(); cx.arc(s.x,s.y,s.life*2.5,0,TAU); cx.fill();
    cx.restore();
  }
}

// ── Danger edge indicator (boss bullets near player)
function drawDangerEdges() {
  const WARN_DIST=90;
  G.eBullets.forEach(b=>{
    const d=Math.hypot(b.x-G.px,b.y-G.py);
    if(d<WARN_DIST){
      const a=Math.atan2(b.y-G.py,b.x-G.px);
      const alpha=(1-d/WARN_DIST)*0.7;
      cx.save(); cx.globalAlpha=alpha;
      cx.strokeStyle='#ff2200'; cx.lineWidth=3; cx.shadowColor='#ff2200'; cx.shadowBlur=10;
      cx.beginPath(); cx.arc(G.px,G.py,46,a-0.4,a+0.4); cx.stroke();
      cx.restore();
    }
  });
}


// Special weapons activated from slots
function triggerAtomicBomb() {
  // Destroy ALL enemies, clear all bullets, massive screen shake
  const killed = G.enemies.length + (G.boss && !G.boss.dead ? 1 : 0);
  G.enemies.forEach(e => {
    if(!e.dead){ e.dead=true; COMBO.add(); G.score+=Math.round(e.score*COMBO.mult);
      spawnEx(e.x,e.y,'#ff8800',24,e.sz*0.5,8);
      spawnEx(e.x,e.y,'#ffffff',12,e.sz*0.3,5); }
  });
  G.enemies = [];
  if(G.boss && !G.boss.dead){
    G.boss.hp -= G.boss.maxhp * 0.6;
    spawnEx(G.boss.x,G.boss.y,'#ffdd00',50,10,12);
    if(G.boss.hp<=0) killBoss();
  }
  G.eBullets=[]; G.killCount = Math.min(G.killCount+killed, G.killGoal);
  shake(1.0); flash('#ff8800',20);
  for(let i=0;i<6;i++) setTimeout(()=>{
    spawnEx(rnd(W*0.1,W*0.9),rnd(H*0.1,H*0.9),'#ff8800',30,8,14);
    spawnEx(rnd(W*0.1,W*0.9),rnd(H*0.1,H*0.9),'#ffdd00',20,6,10);
    shake(0.5);
  },i*120);
  SFX.bigExplosion();
  notify(`☢ BOMBA ATÓMICA — ${killed} DESTRUIDOS`, '#ff8800', 200);
  G.atomicCharges = Math.max(0,(G.atomicCharges||1)-1);
}

function pointerToCanvas(e) {
  const r = cv.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
  return { x: src.clientX - r.left, y: src.clientY - r.top };
}

let touchId = null;

function pauseRect() { return {x:W-58, y:6, w:52, h:36}; }
function muteRect()  { return {x:W-116, y:6, w:52, h:36}; }
function isTap(x,y,r) { return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }

function handleTap(x, y) {
  if (G.screen === 'PROFILE') { handleProfileTap(x, y); return; }
  if (G.screen === 'MENU')    { handleMenuTap(x, y);    return; }
  if (G.screen === 'MANUAL') { G.screen='MENU'; return; }
  if (G.screen === 'LEADERBOARD') {
    // Tap on difficulty buttons
    G.diffNames.forEach((dn,di)=>{
      const bx=W/2+(di-1.5)*85, bw=80, bh=22, by=H*0.13;
      if(x>=bx-bw/2&&x<=bx+bw/2&&y>=by&&y<=by+bh) G.difficulty=di;
    });
    if(y>H*0.85) G.screen='MENU';
    return;
  }
  if (G.screen === 'STORE')       { handleStoreTap(x, y); return; }
  if (G.screen === 'INTERMISSION') { handleIntermissionTap(x, y); return; }
  if (G.screen === 'DEAD')    { handleDeadTap(x, y); return; }
  if (G.screen === 'TRAINING') { if(y>H-40||x>W-80){ G.screen='MENU'; trainingStep=0; } return; }
  if (G.screen === 'BONUS_TRACK'){
    const btnW2=Math.min(240,W*0.55), btnY2=18, btnH2=34;
    if(x>W/2-btnW2/2&&x<W/2+btnW2/2&&y>btnY2&&y<btnY2+btnH2) endBonusTrack();
    return;
  }
  if (G.screen === 'WIN')     { G.screen = 'MENU'; return; }
  if (G.screen === 'PAUSED')  { handlePauseTap(x, y);   return; }
  if ((G.screen === 'MENU' || G.screen === 'GAME') && G.tourActive) { advanceTour(); return; }
  if (G.screen === 'GAME') {
    if (isTap(x,y,pauseRect())) { G.paused=true; G.touching=false; G.screen='PAUSED'; SFX.pause(); return; }
    if (isTap(x,y,muteRect()))  { SFX.toggle(); return; }
    checkWeaponTap(x, y);
  }
}

cv.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const p = pointerToCanvas(e);
  touchId = t.identifier;
  G.touching = true; G.tx = p.x; G.ty = p.y;
  if (G.screen === 'GAME') {
    // Movimiento relativo: el dedo no tiene que caer exactamente sobre la nave.
    G.touchOffsetX = p.x - G.px;
    G.touchOffsetY = p.y - G.py;
  }
  handleTap(p.x, p.y);
  getAC();
}, {passive:false});

cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (let t of e.changedTouches) {
    if (t.identifier === touchId || touchId === null) {
      if((G.screen==='INTERMISSION'||G.screen==='STORE') && shopDragStart){
        const maxScroll3=Math.max(0,(G.shopContentH||600)-H+200);
        G.shopScroll=Math.max(0,Math.min(maxScroll3,(shopDragStart.scroll||0)+(shopDragStart.y-t.clientY)));
      }
      const r1 = cv.getBoundingClientRect();
      const sx1 = cv.width/r1.width, sy1 = cv.height/r1.height;
      G.touching = true;
      G.tx = (t.clientX - r1.left)*sx1; G.ty = (t.clientY - r1.top)*sy1;
    }
  }
}, {passive:false});

cv.addEventListener('touchend', e => { e.preventDefault(); G.touching = false; G.touchOffsetX=0; G.touchOffsetY=0; }, {passive:false});

cv.addEventListener('mousedown', e => {
  const p = pointerToCanvas(e);
  G.touching = true;

  handleTap(G.tx, G.ty);

});

// ── MENU
function handleMenuTap(x, y) {
  // Top area (ship select): left half=prev, right half=next
  if (y > H*0.28 && y < H*0.56) {
    if (x < W*0.4) G.shipSel = Math.max(0, G.shipSel - 1);
    if (x > W*0.6) G.shipSel = Math.min(G.ships.length-1, G.shipSel+1);
  }
  // Difficulty row: at H*0.60
  if (y > H*0.58 && y < H*0.68) {
    G.difficulty = Math.floor(x / W * 4);
    G.difficulty = clamp(G.difficulty, 0, 3);
  }
  // Leaderboard button
  if (y > H*0.70 && y < H*0.78 && x > W*0.5) { G.screen = 'LEADERBOARD'; return; }
  // START button
  if (y > H*0.82) {
    applyShip(); resetGame(); G.screen = 'GAME'; SFX.gameStart();
  }
}

// ── DEAD SCREEN
function handleDeadTap(x, y) {
  const bw=Math.min(250,W*0.46), bh=42, bx=W/2-bw/2;
  const y1=H*0.58-bh*0.5, y2=H*0.66-bh*0.5, y3=H*0.74-bh*0.5;
  if(y>=y1&&y<=y1+bh && !G.reviveUsed){ if(revivePlayer()) SFX.powerUp(); return; }
  if(y>=y2&&y<=y2+bh && G.checkpoint){ if(restoreCheckpoint()) SFX.gameStart(); return; }
  if(y>=y3&&y<=y3+bh){ resetGame(true); G.screen='GAME'; SFX.gameStart(); return; }
  const y4=H*0.82-bh*0.5;
  if(y>=y4&&y<=y4+bh){ saveGame(); G.screen='MENU'; G.shopScroll=0; SFX.pause(); return; }
}

// ── PAUSE SCREEN
function handlePauseTap(x, y) {
  if (y > H*0.36 && y < H*0.48) { G.paused=false; G.screen='GAME'; G.touching=false; SFX.pause(); }
  if (y > H*0.48 && y < H*0.60) { saveGame(); }
  if (y > H*0.60 && y < H*0.72) { G.screen='STORE'; }
  if (y > H*0.72 && y < H*0.84) { G.paused=false; stopBossHum(); G.screen='MENU'; }
}
function handleStoreTap(x, y) {
  // Close button top-right
  if(x > W-80 && y < 50) { G.screen='MENU'; G.shopScroll=0; return; }
  shopDragStart={y, scroll:G.shopScroll||0};
  shopItemRects().forEach((r,idx)=>{
    const sCardY = r.y + 120;
    if(x>=r.x && x<=r.x+r.w && y>=sCardY && y<=sCardY+r.h) tryBuyUpgrade(SHOP_ITEMS[idx].id);
  });
}
// ── INTERMISSION SCROLL & TAP
let shopDragStart=null;
function handleIntermissionTap(x, y) {
  // Close/skip button (top right)
  if(x > W-60 && y < 50) {
    G.level++; G.screen='GAME'; SFX.gameStart();
    notify(`NIVEL ${G.level} — PREPARADO`, '#00ffaa', 200);
    resetGame(false); return;
  }
  // Continue button (bottom)
  const btnW=Math.min(260,W*0.48), btnH=46, btnX=W/2-btnW/2, btnY=H-54;
  if(y >= btnY && y <= btnY+btnH) {
    G.level++; G.screen='GAME'; SFX.gameStart();
    notify(`NIVEL ${G.level} — PREPARADO`, '#00ffaa', 200);
    resetGame(false); return;
  }
  // Shop scroll drag on touch
  shopDragStart={y, scroll:G.shopScroll||0};
  // Tap shop items
  const hdrH2=148;
  shopItemRects().forEach((r,idx)=>{
    const cardY = r.y + hdrH2;
    if(cardY > H-54 || cardY+r.h < hdrH2) return; // clipped
    if(x>=r.x && x<=r.x+r.w && y>=cardY && y<=cardY+r.h){
      tryBuyUpgrade(SHOP_ITEMS[idx].id);
    }
  });
}
function shopItemRects() {
  const scroll = G.shopScroll||0;
  const cols = W >= 640 ? 2 : 1;
  const cardW = cols===2 ? Math.min(W*0.44,300) : Math.min(W*0.90,360);
  const cardH = 78, cardGap = 8, catLabelH = 20, catGap = 10;
  const startX = W/2 - (cols===2 ? cardW+cardGap/2 : cardW/2);
  const rects = [];
  // Group items by category
  let y = 0;
  let lastCat = null;
  let colInRow = 0;
  let rowStartY = 0;
  SHOP_ITEMS.forEach((it, idx) => {
    if(it.cat !== lastCat){
      // Flush last row before starting new cat
      if(lastCat !== null) y = rowStartY + cardH + cardGap + catGap;
      else y = 0;
      y += catLabelH;
      lastCat = it.cat;
      colInRow = 0;
      rowStartY = y;
    }
    if(colInRow > 0 && colInRow % cols === 0){
      rowStartY += cardH + cardGap;
    }
    const col = colInRow % cols;
    rects.push({
      x: startX + col*(cardW+cardGap),
      y: rowStartY - scroll,
      w: cardW, h: cardH, cat: it.cat
    });
    colInRow++;
  });
  // Store total content height for scroll clamping
  G.shopContentH = rowStartY + cardH + 20;
  return rects;
}

function saveGame() {
  const save = {
    level:G.level, score:G.score, shipSel:G.shipSel,
    php:G.php, pmaxhp:G.pmaxhp, pshield:G.pshield, pmaxsh:G.pmaxsh,
    companions:G.companions, weapSlots:[...G.weapSlots], slotSel:G.slotSel,
    difficulty:G.difficulty, activePowers:G.activePowers.map(p=>({...p})),
    beamCharges:G.beamCharges, checkpoint:G.checkpoint, gold:G.gold, upgrades:G.upgrades, tutorialSeen:G.tutorialSeen
  };
  localStorage.setItem('xs3_save', JSON.stringify(save));
  SFX.save();
  notify('PARTIDA GUARDADA 💾', '#00ffaa', 180);
}
function loadGame() {
  const raw = localStorage.getItem('xs3_save');
  if(!raw) return false;
  try{
    const s = JSON.parse(raw);
    G.level=s.level||1; G.score=s.score||0; G.shipSel=s.shipSel||0;
    applyShip();
    G.php=s.php||G.pmaxhp; G.pmaxhp=s.pmaxhp||G.pmaxhp;
    G.pshield=s.pshield||G.pmaxsh; G.pmaxsh=s.pmaxsh||G.pmaxsh;
    G.companions=s.companions||0; G.lives=s.lives||3; G.nextLifeScore=s.nextLifeScore||50000;
    G.weapSlots=s.weapSlots||['laser','trishot'];
    G.slotSel=s.slotSel||0; G.difficulty=s.difficulty||0;
    G.activePowers=s.activePowers||[]; G.beamCharges=s.beamCharges||1; G.checkpoint=s.checkpoint||null; G.gold=s.gold||G.gold; G.upgrades=s.upgrades||G.upgrades; G.tutorialSeen=!!s.tutorialSeen;
    saveMetaProgress();
    resetGame();
    return true;
  }catch(e){ return false; }
}

// ── RANKING
function submitScore() {
  if (!G.gamerName) return;
  const entry = {name:G.gamerName, score:G.score, level:G.level, diff:G.diffNames[G.difficulty], date:new Date().toLocaleDateString()};
  if (!G.ranking[G.difficulty]) G.ranking[G.difficulty]=[];
  G.ranking[G.difficulty].push(entry);
  G.ranking[G.difficulty].sort((a,b)=>b.score-a.score);
  G.ranking[G.difficulty] = G.ranking[G.difficulty].slice(0,10);
  localStorage.setItem('xs3_rank', JSON.stringify(G.ranking));
  if (G.score > G.hiScore) { G.hiScore=G.score; localStorage.setItem('xs3_hi',G.hiScore); }
}

// ── NOTIFICATIONS
function notify(text, color='#ffdd00', dur=120) {
  G.notifications = G.notifications || [];
  G.notifications.push({text, color, t:0, dur});
}

function saveMetaProgress() {
  localStorage.setItem('xs3_gold', String(G.gold||0));
  localStorage.setItem('xs3_upg', JSON.stringify(G.upgrades||{}));
  localStorage.setItem('xs3_tour_seen', G.tutorialSeen ? '1' : '0');
}

function itemCost(id){ const item = SHOP_ITEMS.find(s=>s.id===id); if(!item) return 0; if(item.max<=1) return item.cost; const lvl = G.upgrades[id]||0; return item.cost + lvl*40; }
function getMaxCompanions(){ return Math.min(6, 3 + (G.upgrades.allies||0)); }
function getDamageBoost(){ return 1 + (G.upgrades.damage||0)*0.12; }
function getMagnetRadius(){ return 240 + (G.upgrades.magnet||0)*45; }
function getBeamDuration(){ return 600 + (G.upgrades.beam||0)*120; }
function applyPersistentUpgrades() {
  const s = G.ships[G.shipSel];
  G.speed = s.speed + (G.upgrades.speed||0)*0.35;
  G.pmaxhp = s.hp + (G.upgrades.shield||0)*14;
  G.pmaxsh = s.sh + (G.upgrades.shield||0)*8;
  G.php = Math.min(G.php || G.pmaxhp, G.pmaxhp);
  G.pshield = Math.min(G.pshield || G.pmaxsh, G.pmaxsh);
  G.beamCharges = Math.max(1 + Math.floor((G.upgrades.beam||0)/2), G.beamCharges||1);
  // New upgrades
  G.regenRate = (G.upgrades.regen||0)*0.8;   // HP/s regen
  G.critChance = (G.upgrades.crit||0)*0.10;  // crit probability
  G.shieldRechargeBonus = (G.upgrades.shield_r||0)*0.15;
  G.comboWindow = 1800 + (G.upgrades.combo_ext||0)*500;
  G.goldPct = 1 + (G.upgrades.gold_pct||0)*0.10;
  G.aoeBoost = 1 + (G.upgrades.aoe_boost||0)*0.18;
  COMBO.maxTimer = G.comboWindow || 220;
  // Atomic recharge bonus
  if((G.upgrades.atomic_r||0)>0) G.atomicCharges = Math.max(G.atomicCharges||2, 2+(G.upgrades.atomic_r||0));
}
function tryBuyUpgrade(id) {
  const item = SHOP_ITEMS.find(s=>s.id===id);
  if(!item) return;
  const lvl = G.upgrades[id] || 0;
  if(lvl >= item.max) { notify('MEJORA AL MÁXIMO', '#66ffee', 90); SFX.hit(); return; }
  const cost = itemCost(id);
  if(G.gold < cost) { notify(`ORO INSUFICIENTE (necesitas ${cost})`, '#ff6677', 120); SFX.hit(); return; }
  G.gold -= cost;
  G.upgrades[id] = lvl + 1;
  if(item.shipUnlock !== undefined) {
    G.shipSel = item.shipUnlock;
    notify('¡NAVE '+G.ships[item.shipUnlock].name+' DESBLOQUEADA!', '#ffdd00', 200);
  }
  if(item.weapUnlock) {
    // Put unlocked weapon into an empty slot
    const emptySlot = G.weapSlots.findIndex(w=>!w||w==='atomic');
    const slot = emptySlot>=0 ? emptySlot : 4;
    G.weapSlots[slot] = item.weapUnlock;
    const wd2=WEAPONS[item.weapUnlock];
    notify((wd2?wd2.icon+' ':'')+item.name.toUpperCase()+' DESBLOQUEADA', wd2?wd2.color:'#ffdd00', 180);
  }
  applyShip();
  applyPersistentUpgrades();
  saveMetaProgress();
  notify(`✔ ${item.name.toUpperCase()} LV ${G.upgrades[id]}`, '#ffdd00', 120);
  SFX.powerUp();
}

function beginNewCampaign() {
  stopBossHum();
  G.level=1; G.score=0; G.runGold=0; G.missionGold=0; G.companions=0;
  G.shipParts=[];
  // First-time bonus
  if(!G.firstTimeDone) {
    G.firstTimeDone=true;
    G.gold += 300;
    localStorage.setItem('xs3_ftd','1');
    saveMetaProgress();
    setTimeout(()=>notify('🎁 BONO INICIAL: +300 ORO — VISITA LA TIENDA', '#ffd54a', 260), 2000);
  }
  G.speed=G.ships[G.shipSel].speed;
  G.lives=5; G.maxLives=7; G.nextLifeScore=65000;
  G.weapSlots=['laser','trishot','viral','shrapnel','blackhole','atomic']; G.slotSel=0; G.atomicCharges=2; G.empWaves=[]; G.rhizomeActive=[];
  G.activePowers=[];
  G.reviveUsed=false;
  G.checkpoint=null;
  applyShip();
  resetGame(false);
}

function resetGame(fromDead) {
  stopBossHum();
  if (fromDead) {
    G.score = Math.max(0, Math.floor((G.score||0) * 0.9));
    G.runGold = Math.max(0, Math.floor((G.runGold||0) * 0.85));
    G.activePowers=[];
    G.weapSlots = G.weapSlots && G.weapSlots.length ? G.weapSlots : ['laser','trishot'];
    G.slotSel = clamp(G.slotSel||0, 0, Math.max(0,(G.weapSlots||['laser']).length-1));
    applyShip();
  }
  G.frame=0; G.scroll=0;
  G.px=isLandscapeMode()?W*0.14:W*0.20; G.py=H/2;
  G.pvx=0; G.pvy=0;
  G.php=G.pmaxhp; G.pshield=G.pmaxsh;
  G.shieldTimer=0; G.invTimer=0; G.weapTimer=0;
  const loadout = getLevelLoadout(G.level);
  // Keep existing slots but ensure 6 slots exist
  while(G.weapSlots.length < 6) G.weapSlots.push(loadout.pool[G.weapSlots.length % loadout.pool.length]||'laser');
  G.weapSlots = G.weapSlots.slice(0,6);
  if(!G.weapSlots[0]) G.weapSlots[0]='laser';
  G.weapon=G.weapSlots[G.slotSel]||'laser';
  G.atomicCharges = 2;
  G.beamTimer=0; G.beamColor=getLevelBeamColor(); G.beamCharges = Math.max(1, G.beamCharges||1);
  G.enemies=[]; G.bullets=[]; G.eBullets=[];
  G.pickups=[]; G.particles=[]; G.notifications=[];
  G.spawnTimer=0; G.killCount=0;
  G.killGoal=30+G.level*20;
  applyPersistentUpgrades();
  G.boss=null; G.bossSpawned=false; G.preBossGift=false;
  G.partSpawned=false; G.missionGold=0; if(!fromDead) G.shipParts=G.shipParts||[];
  G.atomicCharges=Math.max(G.atomicCharges||1,1); G.empWaves=[]; G.rhizomeActive=[]; G.lives=G.lives||5; G.maxLives=7; G.nextLifeScore=G.nextLifeScore||65000;
  G.bossPhase=null; G.bossCollectTimer=0;
  G.bossExpQueue=[]; G.bossDropQueue=[];
  G.posHist=[];
  G.rolling=false; G.rollTimer=0; G.deadTimer=0; G.paused=false;
  CAM.trauma=0; CAM.x=0; CAM.y=0;
  DMG_NUMS.length=0; LASER_SPARKS.length=0;
  if(fromDead) COMBO.reset();
  setCheckpoint('START');
  initStars();
  initParallax();
  initObstacles();
}


function initStars() {
  G.stars = [];
  for (let i = 0; i < Math.floor(180*PERF.bgDensity); i++) {
    G.stars.push({x:rnd(0,W), y:rnd(0,H), r:rnd(0.3,2), spd:rnd(0.2,1.8), bright:rnd(0.3,1), tw:rnd(0,TAU)});
  }
}
initStars();
initParallax();

const STAGE = { corridorTimer:0, meteorTimer:0, bombTimer:0, mountainTimer:0, lastCue:0 };
function resetStageDirector(){
  STAGE.corridorTimer = 110;
  STAGE.meteorTimer = 160;
  STAGE.bombTimer = 220;
  STAGE.mountainTimer = 260;
  STAGE.lastCue = 0;
}
function stageIntensity(){
  const lv = G.level || 1;
  const df = (G.difficulty||1) * 0.12;
  return clamp(0.72 + lv*0.13 + df, 0.75, 2.25);
}
function announceHazard(text,col='#ffaa22'){
  if((G.frame||0) - (STAGE.lastCue||0) > 120){ notify(text,col,110); STAGE.lastCue = G.frame||0; }
}
function spawnMazeGate(){
  const lv = G.level || 1;
  const intensity = stageIntensity();
  const gap = clamp(H*(0.50 - lv*0.018), Math.max(96,H*0.24), H*0.52);
  const center = rnd(gap*0.55 + 52, H-gap*0.55-56);
  const w = rnd(46, 76 + lv*2);
  OBSTACLES.push({
    type:'mazeGate', x:W+40, w, topH:center-gap/2, bottomY:center+gap/2,
    spd:rnd(2.0,2.6+intensity*0.42), dmg:28+lv*3,
    col: lv%3===0?'#2d4367':lv%3===1?'#5a361f':'#2f4b3c',
    accent: lv%3===0?'#7dc6ff':lv%3===1?'#ff9b42':'#79ffaa',
    teeth: rndI(4,8), t:0
  });
  announceHazard('RUTA ESTRECHA — ZIGZAG','#ffdd66');
}
function spawnSpaceMountain(forceFrom=null){
  const lv = G.level || 1;
  const from = forceFrom || (Math.random()<0.5?'bottom':'top');
  const w = rnd(135, 230 + lv*8);
  const h = rnd(H*0.18, H*(0.34 + Math.min(0.12,lv*0.01)));
  OBSTACLES.push({
    type:'spaceMountain', from, x:W+60, w, h,
    spd:rnd(1.7,2.4+lv*0.08), dmg:32+lv*3,
    seed:rnd(0,1000), col:from==='bottom'?'#873113':'#33244d',
    col2:from==='bottom'?'#ff6a24':'#7b5cff', lava:Math.random()<0.38
  });
}
function spawnFugitiveMeteor(){
  const lv = G.level || 1;
  const fromTop = Math.random()<0.55;
  const r = rnd(12, 26+lv*1.2);
  OBSTACLES.push({
    type:'fugitiveMeteor', x:rnd(W*0.45,W+160), y:fromTop?-r-20:H+r+20,
    vx:-rnd(4.5,7.5+lv*0.35), vy:(fromTop?1:-1)*rnd(2.2,4.8+lv*0.18),
    r, rot:rnd(0,TAU), rotSpd:rnd(-0.12,0.12), dmg:24+lv*2,
    col:'#b35420', hot:Math.random()<0.7
  });
  if(lv>=2) announceHazard('METEORO CRUZANDO','#ff8844');
}
function spawnFallingBomb(){
  const lv = G.level || 1;
  const tx = clamp(G.px + rnd(120,W*0.62), W*0.28, W-45);
  OBSTACLES.push({
    type:'fallingBomb', x:tx, y:-24, r:12+rnd(0,6), vy:rnd(3.2,4.8+lv*0.28),
    warn:58, t:0, dmg:28+lv*4, blast:52+lv*3, state:'warn', col:'#ffdd44'
  });
  announceHazard('BOMBA ORBITAL','#ffcc44');
}
function spawnDebrisWall(){
  const lv=G.level||1;
  const slots=rndI(2,3);
  const gapIndex=rndI(0,slots-1);
  const segH=H/slots;
  for(let s=0;s<slots;s++){
    if(s===gapIndex) continue;
    OBSTACLES.push({
      type:'debrisBlock', x:W+40+rnd(-20,20), y:s*segH+rnd(8,22), w:rnd(56,92), h:segH-rnd(54,88),
      spd:rnd(2.0,2.8+lv*0.12), dmg:22+lv*2, rot:rnd(-0.08,0.08),
      col:'#46505a', accent:'#9fb4c5', t:0
    });
  }
  announceHazard('RESTOS ESPACIALES','#aaccff');
}
function updateStageDirector(){
  if(G.screen!=='GAME' || G.bossPhase==='collect') return;
  const lv=G.level||1, intensity=stageIntensity();
  const bossActive = !!(G.boss && !G.boss.dead);
  STAGE.corridorTimer--;
  STAGE.meteorTimer--;
  STAGE.bombTimer--;
  STAGE.mountainTimer--;

  const corridorBase = Math.max(126, 360 - lv*18 - (G.difficulty||1)*22);
  if(STAGE.corridorTimer<=0 && !bossActive){
    if(Math.random()<0.64) spawnMazeGate(); else spawnDebrisWall();
    STAGE.corridorTimer = Math.round(corridorBase / clamp(intensity,1,1.85));
  }
  const mountainBase = Math.max(160, 430 - lv*22);
  if(STAGE.mountainTimer<=0 && !bossActive){
    spawnSpaceMountain();
    if(lv>=3 && Math.random()<0.45) spawnSpaceMountain(Math.random()<0.5?'top':'bottom');
    STAGE.mountainTimer = Math.round(mountainBase / clamp(intensity,1,1.75));
  }
  const meteorBase = Math.max(75, 260 - lv*15 - (G.difficulty||1)*18);
  if(STAGE.meteorTimer<=0){
    spawnFugitiveMeteor();
    if(lv>=4 && Math.random()<0.45) spawnFugitiveMeteor();
    STAGE.meteorTimer = Math.round(meteorBase / clamp(intensity,1,2.05));
  }
  const bombBase = Math.max(105, 330 - lv*17 - (G.difficulty||1)*14);
  if(STAGE.bombTimer<=0){
    spawnFallingBomb();
    if(lv>=5 && Math.random()<0.32) spawnFallingBomb();
    STAGE.bombTimer = Math.round(bombBase / clamp(intensity,1,2.0));
  }
}
function advancedHitPlayer(dmg,x,y,col='#ff8844'){
  if(G.invTimer>0) return;
  damagePlayer(dmg);
  spawnEx(x||G.px,y||G.py,col,12,4,6);
  G.invTimer=54;
  shake(0.25);
}
function updateAdvancedObstacle(o,i){
  if(!o || !o.type) return false;
  if(o.type==='mazeGate'){
    o.t=(o.t||0)+1; o.x-=o.spd;
    if(o.x+o.w<-40){OBSTACLES.splice(i,1); return true;}
    const inX = G.px+15>o.x && G.px-15<o.x+o.w;
    if(inX && (G.py-15<o.topH || G.py+15>o.bottomY)) advancedHitPlayer(o.dmg,G.px,G.py,o.accent);
    return true;
  }
  if(o.type==='spaceMountain'){
    o.x-=o.spd; o.t=(o.t||0)+1;
    if(o.x+o.w<-70){OBSTACLES.splice(i,1); return true;}
    const lx=(G.px-o.x)/o.w;
    if(lx>=0&&lx<=1){
      const shape=o.h*(0.15 + Math.sin(Math.PI*lx)*0.85) + Math.sin(lx*22+o.seed)*10;
      if(o.from==='bottom'){
        const boundary=H-shape;
        if(G.py+16>boundary) advancedHitPlayer(o.dmg,G.px,boundary,o.col2);
      } else {
        const boundary=shape;
        if(G.py-16<boundary) advancedHitPlayer(o.dmg,G.px,boundary,o.col2);
      }
    }
    return true;
  }
  if(o.type==='debrisBlock'){
    o.t=(o.t||0)+1; o.x-=o.spd; o.rot+=(o.rotSpd||0.01);
    if(o.x+o.w<-40){OBSTACLES.splice(i,1); return true;}
    if(G.px+15>o.x && G.px-15<o.x+o.w && G.py+15>o.y && G.py-15<o.y+o.h) advancedHitPlayer(o.dmg,G.px,G.py,o.accent);
    return true;
  }
  if(o.type==='fugitiveMeteor'){
    o.x+=o.vx; o.y+=o.vy; o.rot=(o.rot||0)+(o.rotSpd||0);
    if(o.x<-90||o.y<-90||o.y>H+90){OBSTACLES.splice(i,1); return true;}
    if(dist2(o.x,o.y,G.px,G.py)<(o.r+17)**2) advancedHitPlayer(o.dmg,o.x,o.y,'#ff6a22');
    return true;
  }
  if(o.type==='fallingBomb'){
    o.t=(o.t||0)+1;
    if(o.state==='warn'){
      o.warn--;
      if(o.warn<=0) o.state='fall';
    } else if(o.state==='fall'){
      o.y+=o.vy;
      if(o.y>H-34 || o.t>260){
        o.type='bombBlast'; o.life=24; o.hit=false; o.y=clamp(o.y,34,H-34); SFX.bigExplosion(); shake(0.42); flash('#ffcc44',7);
      }
    }
    return true;
  }
  if(o.type==='bombBlast'){
    o.life--;
    if(!o.hit && dist2(o.x,o.y,G.px,G.py)<(o.blast+15)**2){ o.hit=true; advancedHitPlayer(o.dmg,o.x,o.y,'#ffcc44'); }
    if(o.life<=0) OBSTACLES.splice(i,1);
    return true;
  }
  return false;
}
function drawAdvancedObstacle(o){
  if(!o || !o.type) return false;
  if(o.type==='mazeGate'){
    const pulse=0.55+Math.sin((o.t||0)*0.12)*0.15;
    cx.save();
    cx.shadowBlur=0;
    const gradTop=cx.createLinearGradient(o.x,0,o.x+o.w,0);
    gradTop.addColorStop(0,o.col); gradTop.addColorStop(1,'#0b1118');
    cx.fillStyle=gradTop;
    cx.fillRect(o.x,0,o.w,o.topH);
    cx.fillRect(o.x,o.bottomY,o.w,H-o.bottomY);
    cx.strokeStyle=o.accent; cx.globalAlpha=0.55+pulse*0.25; cx.lineWidth=2;
    cx.strokeRect(o.x,0,o.w,o.topH); cx.strokeRect(o.x,o.bottomY,o.w,H-o.bottomY);
    cx.fillStyle=o.accent; cx.globalAlpha=0.45;
    for(let k=0;k<(o.teeth||5);k++){
      const yy=(k+0.5)*(o.topH/(o.teeth||5));
      cx.beginPath(); cx.moveTo(o.x+o.w,yy-8); cx.lineTo(o.x+o.w+16,yy); cx.lineTo(o.x+o.w,yy+8); cx.fill();
      const by=o.bottomY+(k+0.5)*((H-o.bottomY)/(o.teeth||5));
      cx.beginPath(); cx.moveTo(o.x+o.w,by-8); cx.lineTo(o.x+o.w+16,by); cx.lineTo(o.x+o.w,by+8); cx.fill();
    }
    cx.globalAlpha=1; cx.restore(); return true;
  }
  if(o.type==='spaceMountain'){
    cx.save(); cx.shadowBlur=0;
    const n=9, pts=[];
    for(let k=0;k<=n;k++){
      const lx=k/n;
      const h=o.h*(0.15+Math.sin(Math.PI*lx)*0.85)+Math.sin(lx*22+o.seed)*10;
      const x=o.x+lx*o.w;
      const y=o.from==='bottom'?H-h:h;
      pts.push([x,y]);
    }
    const grad = o.from==='bottom'?cx.createLinearGradient(0,H-o.h,0,H):cx.createLinearGradient(0,0,0,o.h);
    grad.addColorStop(0,o.col2); grad.addColorStop(0.42,o.col); grad.addColorStop(1,'#120804');
    cx.fillStyle=grad;
    cx.beginPath();
    if(o.from==='bottom'){
      cx.moveTo(o.x,H); pts.forEach(([x,y])=>cx.lineTo(x,y)); cx.lineTo(o.x+o.w,H);
    }else{
      cx.moveTo(o.x,0); pts.forEach(([x,y])=>cx.lineTo(x,y)); cx.lineTo(o.x+o.w,0);
    }
    cx.closePath(); cx.fill();
    cx.strokeStyle=o.col2; cx.globalAlpha=0.55; cx.lineWidth=2;
    cx.beginPath(); pts.forEach(([x,y],idx)=> idx?cx.lineTo(x,y):cx.moveTo(x,y)); cx.stroke();
    if(o.lava){
      cx.strokeStyle='rgba(255,210,30,0.42)'; cx.lineWidth=1;
      for(let k=1;k<5;k++){ const px=o.x+o.w*(k/5); const py=pts[Math.floor(k*n/5)]?.[1]||H/2; cx.beginPath(); cx.moveTo(px,py); cx.lineTo(px+rnd(-8,8), o.from==='bottom'?H:0); cx.stroke(); }
    }
    cx.globalAlpha=1; cx.restore(); return true;
  }
  if(o.type==='debrisBlock'){
    cx.save(); cx.translate(o.x+o.w/2,o.y+o.h/2); cx.rotate(o.rot||0); cx.shadowBlur=0;
    cx.fillStyle=o.col; cx.strokeStyle=o.accent; cx.lineWidth=2;
    cx.beginPath();
    cx.moveTo(-o.w/2+rnd(-1,1),-o.h/2); cx.lineTo(o.w/2,-o.h/2+rnd(-1,1)); cx.lineTo(o.w/2-8,o.h/2); cx.lineTo(-o.w/2+5,o.h/2-6);
    cx.closePath(); cx.fill(); cx.globalAlpha=0.45; cx.stroke();
    cx.globalAlpha=0.35; cx.strokeStyle='#ffffff'; cx.lineWidth=1;
    for(let k=0;k<3;k++){ cx.beginPath(); cx.moveTo(-o.w/2+8,k*o.h/4-o.h/4); cx.lineTo(o.w/2-8,k*o.h/4-o.h/4+rnd(-4,4)); cx.stroke(); }
    cx.restore(); return true;
  }
  if(o.type==='fugitiveMeteor'){
    cx.save();
    const a=Math.atan2(o.vy,o.vx);
    cx.translate(o.x,o.y); cx.rotate(a);
    const tail=cx.createLinearGradient(0,0,90,0);
    tail.addColorStop(0,'rgba(255,180,80,0.65)'); tail.addColorStop(1,'rgba(255,80,0,0)');
    cx.fillStyle=tail; cx.beginPath(); cx.moveTo(o.r,0); cx.lineTo(92,o.r*0.9); cx.lineTo(92,-o.r*0.9); cx.closePath(); cx.fill();
    cx.rotate(o.rot||0); cx.shadowColor='#ff6a22'; cx.shadowBlur=IS_DESKTOP?12:0;
    cx.fillStyle=o.hot?'#cf4f1f':'#6b4a36';
    cx.beginPath();
    for(let k=0;k<8;k++){ const aa=k/8*TAU, rr=o.r*(0.72+Math.sin(k*2.3+o.rot)*0.22); k?cx.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr):cx.moveTo(Math.cos(aa)*rr,Math.sin(aa)*rr); }
    cx.closePath(); cx.fill();
    cx.fillStyle='rgba(255,220,90,0.75)'; cx.beginPath(); cx.arc(-o.r*0.15,-o.r*0.2,o.r*0.22,0,TAU); cx.fill();
    cx.restore(); return true;
  }
  if(o.type==='fallingBomb'){
    cx.save();
    if(o.state==='warn'){
      const a=0.25+Math.sin((o.t||0)*0.35)*0.25;
      cx.globalAlpha=a; cx.strokeStyle='#ffdd44'; cx.lineWidth=2;
      cx.setLineDash([8,8]); cx.beginPath(); cx.moveTo(o.x,0); cx.lineTo(o.x,H); cx.stroke(); cx.setLineDash([]);
      cx.globalAlpha=0.95; cx.fillStyle='#ffdd44'; cx.font='bold 13px Courier New'; cx.textAlign='center'; cx.fillText('⚠',o.x,24); cx.textAlign='left';
    } else {
      cx.translate(o.x,o.y); cx.shadowColor='#ffdd44'; cx.shadowBlur=12;
      cx.fillStyle='#2a2a2a'; cx.beginPath(); cx.arc(0,0,o.r,0,TAU); cx.fill();
      cx.fillStyle='#ffdd44'; cx.beginPath(); cx.arc(-o.r*0.25,-o.r*0.25,o.r*0.32,0,TAU); cx.fill();
      cx.strokeStyle='#ff8844'; cx.lineWidth=2; cx.beginPath(); cx.arc(0,0,o.r+4+Math.sin((o.t||0)*0.3)*2,0,TAU); cx.stroke();
    }
    cx.restore(); return true;
  }
  if(o.type==='bombBlast'){
    const p=o.life/24;
    cx.save(); cx.globalAlpha=Math.max(0,p);
    const rg=cx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.blast);
    rg.addColorStop(0,'rgba(255,255,255,0.95)'); rg.addColorStop(0.25,'rgba(255,210,60,0.75)'); rg.addColorStop(1,'rgba(255,80,0,0)');
    cx.fillStyle=rg; cx.beginPath(); cx.arc(o.x,o.y,o.blast*(1.1-p*0.2),0,TAU); cx.fill();
    cx.strokeStyle='rgba(255,230,120,0.8)'; cx.lineWidth=3; cx.beginPath(); cx.arc(o.x,o.y,o.blast*(1-p*0.1),0,TAU); cx.stroke();
    cx.restore(); return true;
  }
  return false;
}

function initObstacles() {
  OBSTACLES.length = 0;
  if(typeof resetStageDirector==='function') resetStageDirector();
  const lv = G.level || 1;
  // ── Asteroids (always)
  for(let i=0;i<4+lv;i++){
    OBSTACLES.push({
      type:'asteroid', x:rnd(W*0.25,W+280), y:rnd(40,H-40),
      r:rnd(14,32), rot:rnd(0,TAU), rotSpd:rnd(-0.012,0.012),
      spd:rnd(0.5,1.3+lv*0.08), col:'#3a2a18', col2:'#5a4a2a',
      pts: Array.from({length:8},()=>rnd(0.6,1.0)),
      verts: 8+Math.floor(rnd(0,3)), dmg:20
    });
  }
  // ── Moons
  for(let i=0;i<Math.min(3,1+Math.floor(lv/3));i++){
    OBSTACLES.push({
      type:'moon', x:rnd(W*0.4,W+350), y:rnd(60,H-60),
      r:rnd(22,42), rot:rnd(0,TAU), rotSpd:rnd(-0.006,0.006),
      spd:rnd(0.15,0.45), col:'#4a3a3a', col2:'#6a5a5a',
      craters: Array.from({length:(rnd(3,7)|0)},()=>({
        x:rnd(-0.5,0.5), y:rnd(-0.5,0.5), r:rnd(0.08,0.20)
      })), dmg:30
    });
  }
  // ── Planets (1-3 depending on level)
  const nPlanets = Math.min(3, 1 + Math.floor(lv/3));
  for(let i=0;i<nPlanets;i++){
    const pd = PLANET_DEFS[rndI(0, PLANET_DEFS.length-1)];
    const sz = rnd(pd.minSz, pd.maxSz);
    OBSTACLES.push({
      type: pd.type, subtype:'planet',
      x: rnd(W*0.5, W+450), y: rnd(sz+40, H-sz-40),
      r: sz, rot:rnd(0,TAU), rotSpd:rnd(-0.004,0.004),
      spd: rnd(0.06, 0.22),
      col: pd.colors[rndI(0,pd.colors.length-1)],
      col2: pd.colors[0],
      rings: !!pd.rings, lava: !!pd.lava, dark: !!pd.dark,
      dmg: pd.lava||pd.dark ? 35 : 0   // only dangerous planets deal damage
    });
  }
  // ── Comets (every 2 levels)
  if(lv >= 2){
    const nComets = 1 + Math.floor(lv/4);
    for(let i=0;i<nComets;i++){
      OBSTACLES.push({
        type:'comet', x:W+60+i*120, y:rnd(50,H-50),
        r:12, spd:rnd(1.8,3.5), rot:0, rotSpd:0.05,
        vy:rnd(-0.8,0.8), dmg:18
      });
    }
  }
  // ── Debris clusters (level 4+)
  if(lv >= 4){
    const nDebris = 3 + lv;
    for(let i=0;i<nDebris;i++){
      OBSTACLES.push({
        type:'debris', x:rnd(W*0.3,W+250), y:rnd(20,H-20),
        r:rnd(5,12), spd:rnd(0.4,1.4), rot:rnd(0,TAU), rotSpd:rnd(-0.08,0.08),
        pts: Array.from({length:6},()=>rnd(0.55,1.0)), dmg:12
      });
    }
  }
}

function updateObstacles() {
  for(let i=OBSTACLES.length-1;i>=0;i--){
    const o=OBSTACLES[i];
    if(updateAdvancedObstacle(o,i)) continue;
    o.x -= o.spd;
    o.rot = (o.rot||0) + (o.rotSpd||0);
    // Comets move diagonally and get removed when off-screen
    if(o.type==='comet'){
      o.y += (o.vy||0);
      if(o.x < -60 || o.y < -60 || o.y > H+60){
        OBSTACLES.splice(i,1); continue;
      }
    }
    // Planets + debris: remove when off left, don't wrap (too big/jarring)
    else if(o.subtype==='planet' || o.type==='debris'){
      if(o.x < -o.r*3){ OBSTACLES.splice(i,1); continue; }
    }
    // Asteroids + moons: wrap back to right side
    else {
      if(o.x < -o.r*3){
        o.x = W + o.r + rnd(0,200);
        o.y = rnd(o.r+10, H-o.r-10);
      }
    }
    // Collision with player (skip dangerous-zero-dmg planets)
    const oDmg = o.dmg||0;
    if(oDmg>0 && G.invTimer<=0 && dist2(o.x,o.y,G.px,G.py)<(o.r+14)**2){
      damagePlayer(oDmg);
      spawnEx(G.px,G.py,'#8a6a3a',8,3,5);
      G.invTimer=60;
    }
    // Bullets destroy asteroids and debris
    if(o.type==='asteroid' || o.type==='debris'){
      let hit=false;
      for(let bi=G.bullets.length-1;bi>=0;bi--){
        const b=G.bullets[bi];
        if(dist2(b.x,b.y,o.x,o.y)<(o.r+5)**2){
          spawnEx(o.x,o.y,'#8a6a3a',8,3,4);
          spawnEx(o.x,o.y,'#5a4a2a',5,2,3);
          if(!b.pierce) G.bullets.splice(bi,1);
          if(o.type==='asteroid') OBSTACLES.splice(i,1);
          else o.r=Math.max(0,o.r-4); // debris shrinks
          if(Math.random()<0.3) spawnPickup(o.x,o.y,'gold',null);
          hit=true; break;
        }
      }
      if(hit && o.r<=0){ OBSTACLES.splice(i,1); }
    }
  }
}

function drawObstacle(o) {
  if(drawAdvancedObstacle(o)) return;
  if(o.x > W+o.r*2+10 || o.x < -o.r*2-10) return; // off-screen skip
  cx.save(); cx.translate(o.x,o.y); cx.rotate(o.rot||0);
  const fr = G.frame;

  // ── ASTEROID
  if(o.type==='asteroid'){
    cx.shadowBlur=0; // no shadow = faster
    cx.fillStyle=o.col||'#3a2a18';
    cx.beginPath();
    const n=o.verts||8;
    for(let i=0;i<n;i++){
      const a=i/n*TAU, rr=o.r*(o.pts[i]||0.8);
      i===0?cx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr):cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    cx.closePath(); cx.fill();
    cx.strokeStyle=o.col2||'#5a4a2a'; cx.lineWidth=1; cx.globalAlpha=0.4;
    cx.beginPath();
    for(let i=0;i<2;i++){
      const a=i*1.4, rr=o.r*0.42;
      cx.moveTo(Math.cos(a)*rr*0.25,Math.sin(a)*rr*0.25);
      cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    cx.stroke(); cx.globalAlpha=1;

  // ── MOON
  } else if(o.type==='moon'){
    cx.shadowBlur=0;
    cx.fillStyle=o.col||'#4a3a3a';
    cx.beginPath(); cx.arc(0,0,o.r,0,TAU); cx.fill();
    cx.fillStyle='rgba(0,0,0,0.3)';
    (o.craters||[]).forEach(c=>{
      cx.beginPath(); cx.arc(c.x*o.r,c.y*o.r,c.r*o.r,0,TAU); cx.fill();
    });
    cx.strokeStyle=o.col2||'#6a5a5a'; cx.lineWidth=1.5; cx.globalAlpha=0.35;
    cx.beginPath(); cx.arc(-o.r*0.1,-o.r*0.1,o.r*0.8,TAU*0.6,TAU*1.1); cx.stroke();
    cx.globalAlpha=1;

  // ── PLANETS (gas giant, ice, lava, crystal, void)
  } else if(o.subtype==='planet'){
    const c=o.col||'#ff8844', c2=o.col2||c;
    // Radial gradient sphere
    const pg=cx.createRadialGradient(-o.r*0.3,-o.r*0.3,o.r*0.04,0,0,o.r);
    if(o.dark){ pg.addColorStop(0,'#9900cc'); pg.addColorStop(1,'#110022'); }
    else if(o.lava){ pg.addColorStop(0,'#ff9900'); pg.addColorStop(0.5,c); pg.addColorStop(1,'#330800'); }
    else { pg.addColorStop(0,'rgba(255,255,255,0.28)'); pg.addColorStop(0.3,c); pg.addColorStop(1,c2); }
    cx.fillStyle=pg; cx.shadowBlur=0;
    cx.beginPath(); cx.arc(0,0,o.r,0,TAU); cx.fill();
    // Gas giant bands
    if(o.type==='gas_giant'){
      cx.save(); cx.beginPath(); cx.arc(0,0,o.r,0,TAU); cx.clip();
      cx.globalAlpha=0.12;
      for(let bi=0;bi<4;bi++){
        cx.fillStyle=bi%2?'rgba(255,180,80,0.5)':'rgba(0,0,0,0.25)';
        cx.fillRect(-o.r,-o.r+bi*(o.r*0.5),o.r*2,o.r*0.25);
      }
      cx.restore(); cx.globalAlpha=1;
    }
    // Lava cracks (animated)
    if(o.lava){
      cx.strokeStyle='rgba(255,230,0,'+(0.25+Math.sin(fr*0.04)*0.15)+')';
      cx.lineWidth=1.2; cx.globalAlpha=0.5;
      for(let li=0;li<4;li++){
        const la=li/4*TAU;
        cx.beginPath(); cx.moveTo(0,0);
        cx.lineTo(Math.cos(la)*o.r*0.72,Math.sin(la)*o.r*0.72);
        cx.stroke();
      }
      cx.globalAlpha=1;
    }
    // Crystal facets
    if(o.type==='crystal'){
      cx.strokeStyle='rgba(200,255,240,0.4)'; cx.lineWidth=0.8;
      for(let fi=0;fi<6;fi++){
        const fa=fi/6*TAU;
        cx.beginPath(); cx.moveTo(0,0);
        cx.lineTo(Math.cos(fa)*o.r,Math.sin(fa)*o.r); cx.stroke();
      }
    }
    // Rings (gas giant only)
    if(o.rings){
      cx.strokeStyle='rgba(210,150,70,0.28)'; cx.lineWidth=4;
      cx.beginPath(); cx.ellipse(0,0,o.r*1.72,o.r*0.32,0.18,0,TAU); cx.stroke();
      cx.strokeStyle='rgba(180,120,50,0.18)'; cx.lineWidth=8;
      cx.beginPath(); cx.ellipse(0,0,o.r*2.05,o.r*0.42,0.18,0,TAU); cx.stroke();
    }
    // Void aura
    if(o.dark){
      cx.strokeStyle='rgba(160,0,255,'+(0.15+Math.sin(fr*0.05)*0.08)+')';
      cx.lineWidth=3;
      cx.beginPath(); cx.arc(0,0,o.r+4+Math.sin(fr*0.07)*2,0,TAU); cx.stroke();
    }

  // ── COMET
  } else if(o.type==='comet'){
    // Tail (drawn unrotated in world space, pointing right)
    cx.restore(); cx.save(); cx.translate(o.x,o.y);
    const tailLen=o.r*7;
    const tailAngle=Math.atan2(o.vy||0,o.spd||2);
    cx.rotate(tailAngle);
    const tg=cx.createLinearGradient(0,0,tailLen,0);
    tg.addColorStop(0,'rgba(180,230,255,0.55)');
    tg.addColorStop(1,'rgba(180,230,255,0)');
    cx.fillStyle=tg;
    cx.beginPath();
    cx.moveTo(o.r,o.r*0.5); cx.lineTo(tailLen,0); cx.lineTo(o.r,-o.r*0.5);
    cx.closePath(); cx.fill();
    // Core
    cx.shadowBlur=0;
    cx.fillStyle='#ddeeff';
    cx.beginPath(); cx.arc(0,0,o.r,0,TAU); cx.fill();
    cx.fillStyle='rgba(255,255,255,0.7)';
    cx.beginPath(); cx.arc(-o.r*0.3,-o.r*0.3,o.r*0.4,0,TAU); cx.fill();

  // ── DEBRIS
  } else if(o.type==='debris'){
    cx.shadowBlur=0;
    cx.fillStyle='#4a3a2a'; cx.strokeStyle='#665544'; cx.lineWidth=0.8;
    cx.beginPath();
    const np=o.pts||[1,0.8,1,0.7,0.9,0.8];
    const nd=np.length;
    for(let i=0;i<nd;i++){
      const a=i/nd*TAU, rr=o.r*(np[i]||0.8);
      i===0?cx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr):cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    cx.closePath(); cx.fill(); cx.stroke();
  }

  cx.restore();
}

function drawShipUpgrades(x, y) {
  const up = G.upgrades || {};
  const t = G.frame * 0.04;
  cx.save(); cx.translate(x, y);

  // DAMAGE — extra cannon barrels (1-8 upgrades = 0 to 4 barrels on top/bottom)
  const dmgLvl = up.damage || 0;
  if(dmgLvl >= 2) {
    cx.fillStyle='#ffaa22'; cx.shadowColor='#ff8800'; cx.shadowBlur=8;
    // Upper barrel
    cx.fillRect(12,-18,16+dmgLvl*2,4);
    cx.fillStyle='rgba(255,200,50,0.8)';
    cx.beginPath(); cx.arc(28+dmgLvl*2,-16,3,0,TAU); cx.fill();
  }
  if(dmgLvl >= 4) {
    cx.fillStyle='#ffaa22';
    cx.fillRect(12,14,16+dmgLvl*2,4);
    cx.fillStyle='rgba(255,200,50,0.8)';
    cx.beginPath(); cx.arc(28+dmgLvl*2,16,3,0,TAU); cx.fill();
  }
  if(dmgLvl >= 6) {
    cx.fillStyle='#ff4400'; cx.shadowColor='#ff2200'; cx.shadowBlur=6;
    cx.fillRect(6,-24,12,3);
    cx.fillRect(6,21,12,3);
  }
  if(dmgLvl >= 8) {
    // Maxed: glowing gun ports
    cx.shadowColor='#ff8800'; cx.shadowBlur=14;
    cx.strokeStyle='rgba(255,150,0,0.7)'; cx.lineWidth=1;
    cx.beginPath(); cx.arc(30,-16,5+Math.sin(t*4)*1,0,TAU); cx.stroke();
    cx.beginPath(); cx.arc(30,16,5+Math.sin(t*4+Math.PI)*1,0,TAU); cx.stroke();
  }

  // SHIELD — glowing hex plates on wings
  const shLvl = up.shield || 0;
  if(shLvl >= 2) {
    cx.strokeStyle=`rgba(68,136,255,${0.35+Math.sin(t*1.2)*0.15})`; cx.lineWidth=2;
    cx.beginPath(); cx.arc(0,-16,8,0,Math.PI); cx.stroke();
    cx.beginPath(); cx.arc(0,16,8,Math.PI,TAU); cx.stroke();
  }
  if(shLvl >= 4) {
    // Extra hex ring
    cx.strokeStyle=`rgba(100,180,255,${0.25+Math.sin(t*0.8)*0.1})`; cx.lineWidth=1.5;
    cx.beginPath(); cx.ellipse(0,0,34,20,0,0,TAU); cx.stroke();
  }
  if(shLvl >= 6) {
    // Armor bolts on hull
    cx.fillStyle='rgba(68,136,255,0.6)';
    [[-10,-10],[-10,10],[4,-12],[4,12]].forEach(([bx2,by2])=>{
      cx.beginPath(); cx.arc(bx2,by2,2.5,0,TAU); cx.fill();
    });
  }
  if(shLvl >= 8) {
    // Full shield aura
    cx.strokeStyle=`rgba(0,100,255,${0.2+Math.sin(t)*0.08})`; cx.lineWidth=4;
    cx.shadowColor='#4488ff'; cx.shadowBlur=12;
    cx.beginPath(); cx.ellipse(0,0,38,24,0,0,TAU); cx.stroke();
  }

  // SPEED — extra engine pods
  const spdLvl = up.speed || 0;
  if(spdLvl >= 1) {
    const ep=0.6+Math.sin(t*4)*0.4;
    cx.fillStyle=`rgba(0,200,255,${ep})`; cx.shadowColor='#00ccff'; cx.shadowBlur=10;
    cx.beginPath(); cx.ellipse(-20,-8,3+spdLvl*0.4,5,0,0,TAU); cx.fill();
    cx.beginPath(); cx.ellipse(-20,8,3+spdLvl*0.4,5,0,0,TAU); cx.fill();
  }
  if(spdLvl >= 3) {
    // Third central engine
    cx.fillStyle=`rgba(0,255,200,${0.7+Math.sin(t*5)*0.3})`;
    cx.beginPath(); cx.ellipse(-22,0,3,7,0,0,TAU); cx.fill();
  }
  if(spdLvl >= 5) {
    // Speed streaks on wing tips
    cx.strokeStyle=`rgba(0,255,200,0.5)`; cx.lineWidth=1.5;
    cx.setLineDash([4,6]);
    cx.beginPath(); cx.moveTo(-5,-22); cx.lineTo(-22,-22); cx.stroke();
    cx.beginPath(); cx.moveTo(-5,22); cx.lineTo(-22,22); cx.stroke();
    cx.setLineDash([]);
  }

  // ALLIES — escort mount pylons
  const allLvl = up.allies || 0;
  if(allLvl >= 1) {
    cx.fillStyle='rgba(255,220,50,0.6)'; cx.strokeStyle='rgba(255,200,0,0.5)'; cx.lineWidth=1;
    cx.beginPath(); cx.rect(-2,-26,5,6); cx.fill();
    cx.beginPath(); cx.rect(-2,20,5,6); cx.fill();
  }
  if(allLvl >= 3) {
    cx.fillStyle='rgba(255,180,0,0.55)';
    cx.beginPath(); cx.arc(0,-28,3,0,TAU); cx.fill();
    cx.beginPath(); cx.arc(0,28,3,0,TAU); cx.fill();
  }

  // REGEN — medical cross symbol
  if((up.regen||0) >= 1) {
    cx.fillStyle=`rgba(0,255,100,${0.45+Math.sin(t*0.8)*0.15})`;
    cx.fillRect(6,-1.5,4,3); cx.fillRect(7.5,-3,1,6);
  }

  // CRIT — targeting reticle overlay
  if((up.crit||0) >= 1) {
    const cr=0.4+Math.sin(t*1.5)*0.1;
    cx.strokeStyle=`rgba(255,80,80,${cr})`; cx.lineWidth=1;
    cx.beginPath(); cx.arc(26,0,6,0,TAU); cx.stroke();
    cx.beginPath(); cx.moveTo(20,0); cx.lineTo(32,0); cx.moveTo(26,-6); cx.lineTo(26,6); cx.stroke();
  }

  // BEAM — antenna array on top
  if((up.beam||0) >= 1) {
    const bl=up.beam; cx.fillStyle=`rgba(212,179,255,${0.5+Math.sin(t*2)*0.2})`; cx.shadowColor='#d4b3ff'; cx.shadowBlur=6;
    cx.fillRect(-4,-6-bl*1.5,2,6+bl*1.5);
    cx.beginPath(); cx.arc(-3,-6-bl*1.5,3,0,TAU); cx.fill();
  }

  cx.restore();
}

function drawShip(x, y, idx, sc=1, alpha=1) {
  const shipIdx = (idx !== undefined && idx !== null) ? idx : G.shipSel;
  const s = G.ships[shipIdx] || G.ships[0];
  const c = s.color, a = s.accent;
  cx.save();
  cx.translate(x, y);
  cx.scale(sc, sc);
  cx.globalAlpha = alpha;

  if (shipIdx === 4) {
    // DREADNOUGHT — massive fortress battleship
    cx.shadowColor = c; cx.shadowBlur = 14;
    cx.fillStyle = c;
    // Wide main hull
    cx.beginPath();
    cx.moveTo(28,0); cx.lineTo(10,-20); cx.lineTo(-10,-24); cx.lineTo(-28,-16); cx.lineTo(-28,16); cx.lineTo(-10,24); cx.lineTo(10,20);
    cx.closePath(); cx.fill();
    // Top/bottom weapon pods
    cx.globalAlpha=alpha*0.8; cx.fillStyle=c;
    cx.beginPath(); cx.moveTo(12,-20); cx.lineTo(28,-36); cx.lineTo(16,-36); cx.lineTo(2,-20); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(12,20); cx.lineTo(28,36); cx.lineTo(16,36); cx.lineTo(2,20); cx.closePath(); cx.fill();
    cx.globalAlpha=alpha;
    // Armor bolts
    cx.fillStyle='rgba(255,180,50,0.4)';
    for(let bi2=0;bi2<6;bi2++){ cx.beginPath(); cx.arc(-20+bi2*8,(bi2%2)*8-4,2,0,TAU); cx.fill(); }
    // Cockpit slab
    cx.fillStyle=a; cx.beginPath(); cx.ellipse(14,0,10,7,0,0,TAU); cx.fill();
    // Quad engines
    cx.fillStyle='#ff8800'; cx.shadowColor='#ff8800';
    [[-28,-8],[-28,0],[-28,8],[-28,-16],[-28,16]].forEach(([ex,ey])=>{
      cx.beginPath(); cx.ellipse(ex,ey,4,3,0,0,TAU); cx.fill();

    // Battle ring
    cx.strokeStyle=`rgba(255,160,30,0.4)`; cx.lineWidth=2;
    cx.beginPath(); cx.ellipse(0,0,32,22,0,0,TAU); cx.stroke();
  } else if (shipIdx === 3) {
    // SPECTER — sleek stealth, very thin, angular
    cx.shadowColor = c; cx.shadowBlur = 10;
    cx.fillStyle = c;
    cx.beginPath();
    cx.moveTo(36,0); cx.lineTo(8,-5); cx.lineTo(-30,-2); cx.lineTo(-30,2); cx.lineTo(8,5);
    cx.closePath(); cx.fill();
    cx.globalAlpha=alpha*0.65; cx.fillStyle=c;
    // Swept delta wings
    cx.beginPath(); cx.moveTo(10,-4); cx.lineTo(-22,-28); cx.lineTo(-28,-6); cx.lineTo(-10,-4); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(10,4);  cx.lineTo(-22,28);  cx.lineTo(-28,6);  cx.lineTo(-10,4);  cx.closePath(); cx.fill();
    cx.globalAlpha=alpha;
    // Cockpit
    cx.fillStyle=a; cx.fillRect(16,-2,18,4);
    // Stealth coating shimmer
    cx.strokeStyle=`rgba(136,255,170,0.4)`; cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(30,0); cx.lineTo(-26,-24); cx.lineTo(-26,24); cx.closePath(); cx.stroke();
    // Single engine
    cx.fillStyle='#00ff88'; cx.shadowColor='#00ff88'; cx.shadowBlur=12;
    cx.beginPath(); cx.ellipse(-30,0,4,8,0,0,TAU); cx.fill();
  } else if (shipIdx === 2) {
    // TITAN — heavy cruiser with thick armor
    cx.shadowColor = c; cx.shadowBlur = 16;
    cx.fillStyle = c;
    cx.beginPath();
    cx.moveTo(26,0); cx.lineTo(-4,-16); cx.lineTo(-22,-10); cx.lineTo(-18,0); cx.lineTo(-22,10); cx.lineTo(-4,16);
    cx.closePath(); cx.fill();
    // Heavy armor plates
    cx.globalAlpha = alpha*0.7; cx.fillStyle = c;
    cx.beginPath(); cx.moveTo(4,-10); cx.lineTo(-14,-28); cx.lineTo(-20,-16); cx.lineTo(-4,-10); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(4,10);  cx.lineTo(-14,28);  cx.lineTo(-20,16);  cx.lineTo(-4,10);  cx.closePath(); cx.fill();
    cx.globalAlpha = alpha;
    // Thick center body
    cx.fillStyle = a; cx.beginPath(); cx.ellipse(6,0,12,8,0,0,TAU); cx.fill();
    // Dual engines
    cx.shadowColor='#cc44ff'; cx.shadowBlur=14; cx.fillStyle='#cc44ff';
    cx.beginPath(); cx.ellipse(-20,-5,4,7,0,0,TAU); cx.fill();
    cx.beginPath(); cx.ellipse(-20,5,4,7,0,0,TAU); cx.fill();
    // Armor glow
    cx.strokeStyle='rgba(200,100,255,0.5)'; cx.lineWidth=1.5;
    cx.beginPath(); cx.ellipse(0,0,28,18,0,0,TAU); cx.stroke();
  } else if (shipIdx === 1) {
    // PHANTOM — angular swept wings
    cx.shadowColor = c; cx.shadowBlur = 14;
    cx.fillStyle = c;
    cx.beginPath();
    cx.moveTo(32,0); cx.lineTo(0,-8); cx.lineTo(-24,-3); cx.lineTo(-16,0); cx.lineTo(-24,3); cx.lineTo(0,8);
    cx.closePath(); cx.fill();
    cx.globalAlpha = alpha*0.75; cx.fillStyle = c;
    cx.beginPath(); cx.moveTo(8,-4); cx.lineTo(-8,-32); cx.lineTo(-22,-9); cx.lineTo(-8,-4); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(8,4);  cx.lineTo(-8,32);  cx.lineTo(-22,9);  cx.lineTo(-8,4);  cx.closePath(); cx.fill();
    cx.globalAlpha = alpha;
    cx.fillStyle = a; cx.fillRect(8,-3,16,6);
    cx.shadowColor='#ff4400'; cx.shadowBlur=10; cx.fillStyle='#ff6600';
    cx.beginPath(); cx.ellipse(-24,-2,3,2,0,0,TAU); cx.fill();
    cx.beginPath(); cx.ellipse(-24, 2,3,2,0,0,TAU); cx.fill();
  } else {
    // VIPER — classic interceptor
    cx.shadowColor = c; cx.shadowBlur = 14;
    cx.fillStyle = c;
    cx.beginPath();
    cx.moveTo(30,0); cx.lineTo(-8,-11); cx.lineTo(-18,-5); cx.lineTo(-14,0); cx.lineTo(-18,5); cx.lineTo(-8,11);
    cx.closePath(); cx.fill();
    cx.globalAlpha = alpha*0.82; cx.fillStyle = c;
    cx.beginPath(); cx.moveTo(5,-5); cx.lineTo(5,-24); cx.lineTo(-13,-14); cx.lineTo(-13,-5); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(5,5);  cx.lineTo(5,24);  cx.lineTo(-13,14);  cx.lineTo(-13,5);  cx.closePath(); cx.fill();
    cx.globalAlpha = alpha;
    cx.fillStyle = a; cx.beginPath(); cx.ellipse(10,0,9,5,0,0,TAU); cx.fill();
    cx.shadowColor='#ff8800'; cx.shadowBlur=10; cx.fillStyle='#ffaa44';
    cx.beginPath(); cx.ellipse(-18,0,3,5,0,0,TAU); cx.fill();
  }
  cx.restore();
}

// Draw installed ship parts as visual enhancements
function drawShipParts(x, y) {
  const parts = G.shipParts || [];
  if(!parts.length) return;
  parts.forEach((p, i) => {
    const t = G.frame*0.04 + i*1.1;
    cx.save(); cx.translate(x, y); cx.globalAlpha=0.72;
    switch(p.id) {
      case 'engine':
        // Extra thruster glow
        cx.shadowColor='#00aaff'; cx.shadowBlur=12;
        cx.fillStyle='#00aaff';
        cx.beginPath(); cx.ellipse(-20,-6+Math.sin(t)*1.5,4,6,0,0,TAU); cx.fill();
        cx.beginPath(); cx.ellipse(-20,6+Math.sin(t)*1.5,4,6,0,0,TAU); cx.fill();
        break;
      case 'armor':
        // Side armor plates
        cx.strokeStyle='rgba(100,200,255,0.6)'; cx.lineWidth=2.5;
        cx.beginPath(); cx.moveTo(-8,-16); cx.lineTo(4,-20); cx.lineTo(4,-8); cx.stroke();
        cx.beginPath(); cx.moveTo(-8,16); cx.lineTo(4,20); cx.lineTo(4,8); cx.stroke();
        break;
      case 'cannon':
        // Extra gun barrel
        cx.fillStyle='#ff8800'; cx.shadowColor='#ff6600'; cx.shadowBlur=8;
        cx.fillRect(14,-2,16,4);
        break;
      case 'wing':
        // Extended wing tips glow
        cx.strokeStyle=`rgba(0,255,200,${0.4+Math.sin(t)*0.2})`; cx.lineWidth=2;
        cx.beginPath(); cx.moveTo(0,-22); cx.lineTo(8,-30); cx.moveTo(0,22); cx.lineTo(8,30); cx.stroke();
        break;
      case 'reactor':
        // Central energy core
        cx.fillStyle=`rgba(180,100,255,${0.5+Math.sin(t*2)*0.3})`; cx.shadowColor='#aa44ff'; cx.shadowBlur=14;
        cx.beginPath(); cx.arc(0,0,5+Math.sin(t*3)*1,0,TAU); cx.fill();
        break;
      case 'core':
        // Full body glow aura
        cx.strokeStyle=`rgba(255,220,80,${0.15+Math.sin(t)*0.08})`; cx.lineWidth=4;
        cx.shadowColor='#ffcc00'; cx.shadowBlur=18;
        cx.beginPath(); cx.ellipse(0,0,28+Math.sin(t)*2,16+Math.sin(t)*1,0,0,TAU); cx.stroke();
        break;
    }
    cx.restore();
  });
}

// Companion (mini escort)
function getCompanionPositions() {
  const count = Math.max(0, Math.min(getMaxCompanions(), G.companions||0));
  const baseR = 42 + G.level * 3;
  const t = G.frame*0.045;
  const arr = [];
  for(let i=0;i<count;i++){
    const a = t + (i/count)*TAU;
    const ring = baseR + Math.floor(i/3)*18;
    arr.push({x:G.px + Math.cos(a)*ring, y:G.py + Math.sin(a*1.04)*ring*0.9});
  }
  return arr;
}

function drawCompanion(x, y, idx=0) {
  const colors = ['#00d4ff','#ffdd00','#ff4488','#44ff88','#cc44ff','#ff8800'];
  const c = colors[idx % colors.length];
  cx.save(); cx.translate(x,y); cx.globalAlpha = 0.85;
  cx.shadowColor = c; cx.shadowBlur = 10; cx.fillStyle = c;
  if(idx % 3 === 0) {
    // Arrow style
    cx.beginPath();
    cx.moveTo(18,0); cx.lineTo(-6,-7); cx.lineTo(-12,-3); cx.lineTo(-9,0); cx.lineTo(-12,3); cx.lineTo(-6,7);
    cx.closePath(); cx.fill();
  } else if(idx % 3 === 1) {
    // Diamond style
    cx.beginPath();
    cx.moveTo(16,0); cx.lineTo(0,-9); cx.lineTo(-10,-4); cx.lineTo(-8,0); cx.lineTo(-10,4); cx.lineTo(0,9);
    cx.closePath(); cx.fill();
  } else {
    // Compact style
    cx.beginPath();
    cx.moveTo(14,0); cx.lineTo(-4,-10); cx.lineTo(-10,-5); cx.lineTo(-8,0); cx.lineTo(-10,5); cx.lineTo(-4,10);
    cx.closePath(); cx.fill();
  }
  cx.shadowColor='rgba(255,100,0,0.8)'; cx.shadowBlur=6; cx.fillStyle='rgba(255,150,60,0.9)';
  cx.beginPath(); cx.ellipse(-11,0,2,3,0,0,TAU); cx.fill();
  // Index badge
  cx.fillStyle='rgba(255,255,255,0.7)'; cx.font='bold 8px Courier New';
  cx.textAlign='center'; cx.fillText(idx+1, 0, -10);
  cx.restore();
}

  cx.fillStyle='#ff4400'; cx.shadowColor='#ff4400'; cx.shadowBlur=6;
  cx.beginPath(); cx.arc(sz*0.65,0,sz*0.1,0,TAU); cx.fill();
}
function drawBeetleEnemy(e, t) {

}
function drawFireflyEnemy(e, t) {

  cx.beginPath(); cx.ellipse(-sz*0.3,0,sz*0.22,sz*0.22,0,0,TAU); cx.fill();
  cx.globalAlpha=0.5; cx.strokeStyle='rgba(255,220,100,0.6)'; cx.lineWidth=1.5;
  const wt2=Math.sin(t*12)*7;
  cx.beginPath(); cx.ellipse(-sz*0.05,-sz*0.5+wt2,sz*0.32,sz*0.15,0.3,0,TAU); cx.stroke();
  cx.beginPath(); cx.ellipse(-sz*0.05,sz*0.5-wt2,sz*0.32,sz*0.15,-0.3,0,TAU); cx.stroke();

}
function drawCentipedeEnemy(e, t) {
  const sz=e.sz, c=ENEMIES.centipede.col;
  cx.shadowColor=c; cx.shadowBlur=8;
  for(let s3=0;s3<5;s3++){
    const sx=sz*0.55-s3*sz*0.22, sy=Math.sin(t*5+s3*0.7)*sz*0.25;
    cx.fillStyle=s3===0?'#55ff55':c;
    cx.beginPath(); cx.ellipse(sx,sy,sz*0.18,sz*0.14,0,0,TAU); cx.fill();
    if(s3>0){ cx.strokeStyle=c; cx.lineWidth=1.5; cx.globalAlpha=0.7;
      cx.beginPath(); cx.moveTo(sx,sy-sz*0.14); cx.lineTo(sx+sz*0.05,sy-sz*0.35); cx.stroke();
      cx.beginPath(); cx.moveTo(sx,sy+sz*0.14); cx.lineTo(sx+sz*0.05,sy+sz*0.35); cx.stroke();
      cx.globalAlpha=1; }

function drawViperMk2Enemy(e, t) {

  cx.closePath(); cx.fill();
  cx.globalAlpha=0.6; cx.fillStyle=c;

  cx.beginPath(); cx.moveTo(sz*0.15,sz*0.18); cx.lineTo(sz*0.15,sz*0.75); cx.lineTo(-sz*0.4,sz*0.5); cx.lineTo(-sz*0.4,sz*0.22); cx.closePath(); cx.fill();

function drawEnemy(e) {
  if(!IS_DESKTOP){ cx.shadowBlur=0; }
  cx.save();
  cx.translate(e.x, e.y);
  cx.scale(-1,1); // face left
  const t = e.t * 0.05;
  const f = e.flashTimer > 0;
  if (f) { cx.filter = 'brightness(4) saturate(0)'; }

  switch(e.drawType || e.key) {
    case 'dodger':   drawDodgerEnemy(e,t); break;
    case 'kamikaze': drawKamikazeEnemy(e,t); break;
    case 'sniper':   drawSniperEnemy(e,t); break;
    case 'leech':    drawLeechEnemy(e,t); break;
    case 'scout': drawScout(t); break;
    case 'stalker': drawStalker(t); break;
    case 'warrior': drawWarrior(t); break;
    case 'spitter': drawSpitter(t); break;
    case 'phantom': drawPhantomEnemy(t); break;
    case 'crusher': drawCrusher(t); break;
    case 'hive_node': drawHiveNode(t); break;
    case 'mantis':    drawMantisEnemy(e, t); break;
    case 'scorpion':  drawScorpionEnemy(e, t); break;
    case 'hornet':    drawHornetEnemy(e, t); break;
    case 'wasp':      drawHornetEnemy(e, t); break;
    case 'beetle':    drawBeetleEnemy(e, t); break;
    case 'firefly':   drawFireflyEnemy(e, t); break;
    case 'centipede': drawCentipedeEnemy(e, t); break;
    case 'viper_mk2': drawViperMk2Enemy(e, t); break;
    case 'hivemind':   drawHivemind(t); break;
    case 'broodqueen': drawBroodqueen(t); break;
    case 'xenoking':   drawXenoking(t); break;
  }

  cx.filter = 'none';
  cx.restore();
  if(ENEMIES[e.key]?.boss) drawBossPersonalityAura(e);

  // Name tag + HP bar
  const def = ENEMIES[e.key];
  const bw = e.sz * 2.4, bh = 5;
  const bx = e.x - bw/2, by = e.y - e.sz - 14;
  cx.fillStyle = '#111'; cx.fillRect(bx, by, bw, bh);
  const hpColor = e.hp/e.maxhp > 0.5 ? '#00ff44' : e.hp/e.maxhp > 0.25 ? '#ffaa00' : '#ff2200';
  cx.fillStyle = hpColor; cx.fillRect(bx, by, bw*(e.hp/e.maxhp), bh);
  cx.strokeStyle='#333'; cx.lineWidth=1; cx.strokeRect(bx,by,bw,bh);

  if (def.boss || e.sz > 25) {
    cx.fillStyle = '#aaa'; cx.font = `bold ${Math.min(11, e.sz*0.4)}px 'Courier New'`;
    cx.textAlign = 'center';
    cx.fillText(def.name + ' [' + def.rank + ']', e.x, by - 3);
    cx.textAlign = 'left';
  }
}


function drawBossPersonalityAura(e){
  cx.save();
  const t=(e.t||0)*0.05;
  if(e.shieldTimer>0){
    const a=0.28+Math.sin(t*7)*0.16;
    cx.strokeStyle=`rgba(120,220,255,${a})`; cx.lineWidth=4; cx.shadowColor='#66ddff'; cx.shadowBlur=IS_DESKTOP?18:0;
    cx.beginPath(); cx.ellipse(e.x,e.y,e.sz*1.28,e.sz*1.02,Math.sin(t)*0.2,0,TAU); cx.stroke();
    cx.fillStyle=`rgba(80,180,255,${a*0.13})`; cx.beginPath(); cx.ellipse(e.x,e.y,e.sz*1.22,e.sz*0.96,0,0,TAU); cx.fill();
  }
  if(e.tauntTimer>0){
    cx.textAlign='center'; cx.font=`bold ${Math.min(18,Math.max(12,e.sz*0.18))}px Courier New`;
    cx.fillStyle='#ffdd66'; cx.shadowColor='#ff8800'; cx.shadowBlur=8;
    cx.fillText('JA... JA...', e.x, e.y-e.sz-30-Math.sin(t*6)*8);
    cx.textAlign='left';
  }
  cx.restore();
}

function drawScout(t) {
  cx.shadowColor='#44ff44'; cx.shadowBlur=8;
  cx.fillStyle='#334422';
  cx.beginPath(); cx.ellipse(0,0,12,7,0,0,TAU); cx.fill();
  cx.fillStyle='#223311';
  cx.beginPath(); cx.ellipse(14,0,10,5,0,0,TAU); cx.fill();
  cx.fillStyle='#112200';
  cx.beginPath(); cx.moveTo(21,2); cx.lineTo(27,5); cx.lineTo(23,7); cx.closePath(); cx.fill();
  cx.strokeStyle='#446633'; cx.lineWidth=1.5;
  for(let i=0;i<3;i++){
    const oy=-5+i*5;
    cx.beginPath(); cx.moveTo(-4,oy); cx.quadraticCurveTo(-10,oy-5+Math.sin(t+i)*2,-16,oy-2); cx.stroke();
    cx.beginPath(); cx.moveTo(-4,oy); cx.quadraticCurveTo(-10,oy+5+Math.sin(t+i)*2,-16,oy+2); cx.stroke();

}

  cx.fillStyle='#0d1a0d';
  cx.beginPath(); cx.moveTo(0,-12); cx.bezierCurveTo(5,-18,7,-28,3,-34); cx.bezierCurveTo(0,-38,-3,-34,-3,-28);

  cx.strokeStyle='#336633'; cx.lineWidth=1.5;
  [0,1,2,3].forEach(i => { cx.beginPath(); cx.moveTo(i*2-3,-14-i*4); cx.lineTo(i*3-4,-22-i*4); cx.stroke(); });

}

function drawWarrior(t) {
  cx.shadowColor='#224422'; cx.shadowBlur=12;

  cx.fillStyle='#142214';
