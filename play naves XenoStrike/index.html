  const cardGap = 12;
  const cardH = isWide ? 86 : 68;
  const cols = isWide ? 2 : 1;
  const innerPad = 18;
  const cardW = cols===2 ? (panelW - innerPad*2 - cardGap)/2 : (panelW - innerPad*2);
  const startY = panelY + 86;

  SHOP_ITEMS.forEach((it, idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const rx = panelX + innerPad + col * (cardW + cardGap);
    const ry = startY + row * (cardH + cardGap);
    const lvl = G.upgrades[it.id] || 0;
    const maxed = lvl >= it.max;
    const costNum = itemCost(it.id);
    const cost = maxed ? 'MAX' : costNum.toLocaleString() + ' oro';

    cx.fillStyle='rgba(0,0,0,0.32)';
    cx.strokeStyle=maxed ? '#557777' : (G.gold >= costNum ? '#7affb0' : '#aa6670');
    cx.lineWidth=1.5;
    rrect(rx, ry, cardW, cardH, 12);

    cx.textAlign='left';
    // Icon circle
    cx.fillStyle=`rgba(${maxed?'100,130,120':G.gold>=costNum?'0,200,100':'180,60,70'},0.18)`;
    cx.beginPath(); cx.arc(rx+22, ry+cardH/2, 18, 0, TAU); cx.fill();
    cx.font='16px sans-serif'; cx.textAlign='center';
    cx.fillText(it.icon||'◆', rx+22, ry+cardH/2+6);
    cx.textAlign='left';

    cx.fillStyle='#d9fff0'; cx.font=`bold ${Math.min(13,cardW*0.042)}px Courier New`;
    cx.fillText(it.name, rx+46, ry+22);
    cx.fillStyle='#8aa79b'; cx.font='10px Courier New';
    cx.fillText(it.desc, rx+46, ry+38);

    // Level progress pips
    const pipW=7, pipGap=3;
    for(let pi=0;pi<it.max&&pi<10;pi++){
      cx.fillStyle = pi < lvl ? '#7affb0' : 'rgba(80,100,80,0.4)';
      cx.fillRect(rx+46+pi*(pipW+pipGap), ry+48, pipW, 5);
    }
    cx.fillStyle='#66d9ff'; cx.font='9px Courier New';
    cx.fillText(`LV ${lvl}/${it.max}`, rx+46, ry+64);

    cx.textAlign='right';
    cx.fillStyle=maxed ? '#889999' : '#ffd54a';
    cx.font=`bold ${Math.min(12,cardW*0.04)}px Courier New`;
    cx.fillText(cost, rx+cardW-12, ry+24);

    cx.fillStyle=maxed ? '#889999' : (G.gold >= costNum ? '#7affb0' : '#ff7d8a');
    cx.font='bold 11px Courier New';
    cx.fillText(maxed ? '✔ COMPLETO' : G.gold>=costNum ? 'TOCA → COMPRAR' : 'ORO INSUF.', rx+cardW-12, ry+57);
  });

  const footerY = panelY + panelH - 26;
  cx.textAlign='center';
  cx.fillStyle='#66d9ff';
  cx.font='12px Courier New';
  cx.fillText('TOCA UNA TARJETA PARA COMPRAR  •  TOCA ARRIBA O ABAJO PARA VOLVER', W/2, footerY);

  cx.textAlign='left';
}

//  SCREEN — INTERMISSION (post-mission shop)
// ═══════════════════════════════════════════════════════════════
function drawIntermission() {
  menuFrame++;
  drawBG();
  const scroll = G.shopScroll || 0;
  const lvlNames = ['ESTACION DERELICTA','COLMENA XENOMORFA','SANTUARIO REINA','NEBULOSA FRACTAL','FORJA MAGMATICA','ABISMO VIOLETA','NIDO ESTELAR','CUPULA GLACIAL','ORBITA ECLIPSE','TRONO OMNI'];
  cx.textAlign='center';

  cx.fillStyle='rgba(0,0,0,0.9)'; cx.fillRect(0,0,W,hdrH);
  cx.strokeStyle='#7affb0'; cx.lineWidth=1.5;
  cx.beginPath(); cx.moveTo(0,hdrH); cx.lineTo(W,hdrH); cx.stroke();
  cx.font=`bold ${Math.min(20,W*0.035)}px Courier New`;
  cx.fillStyle='#ffdd00'; cx.shadowColor='#ffaa00'; cx.shadowBlur=12;
  cx.fillText('MISION '+G.level+' COMPLETADA', W/2, 30);
  cx.shadowBlur=0; cx.fillStyle='#556'; cx.font='11px Courier New';
  cx.fillText(lvlNames[G.level-1]||'', W/2, 48);
  const stats=[
    {l:'PUNTOS',v:G.score.toLocaleString(),c:'#ffdd00'},
    {l:'ORO GANADO',v:'+'+G.missionGold,c:'#ffd54a'},
    {l:'ORO TOTAL',v:G.gold,c:'#ffd54a'},
    {l:'PIEZAS',v:'x'+(G.shipParts||[]).length,c:'#ff9900'},
  ];
  const sw=Math.min(W*0.22,130);
  const ssX=W/2-stats.length*sw/2;
  stats.forEach((s,i)=>{
    const sx=ssX+i*sw+sw/2;
    cx.fillStyle='rgba(0,0,0,0.6)'; cx.strokeStyle=s.c; cx.lineWidth=1;
    rrect(ssX+i*sw+2,56,sw-4,44,7);
    cx.fillStyle=s.c; cx.font=`bold ${Math.min(13,sw*0.1)}px Courier New`;
    cx.fillText(s.v,sx,78); cx.fillStyle='#556'; cx.font='9px Courier New'; cx.fillText(s.l,sx,90);
  });
  cx.fillStyle='#7affb0'; cx.font=`bold ${Math.min(13,W*0.021)}px Courier New`;
  cx.shadowColor='#7affb0'; cx.shadowBlur=7;
  cx.fillText('ARMERIA — ORO: '+G.gold+'  | desliza/rueda para ver | toca para comprar', W/2, 118);
  cx.shadowBlur=0;
  cx.fillStyle='rgba(255,80,80,0.9)'; cx.shadowColor='#ff4444'; cx.shadowBlur=6;
  cx.font='bold 13px Courier New'; cx.fillText('[X] SALTAR', W-40, 22); cx.shadowBlur=0;
  cx.fillStyle='#335'; cx.font='9px Courier New';
  cx.fillText('Rueda raton / arrastrar = desplazar', W/2, 136);
  cx.save();
  cx.beginPath(); cx.rect(0, hdrH, W, H-hdrH-54); cx.clip();
  const rects = shopItemRects();
  let lastCatDraw2='';
  const catColors2={armas:'#ff8844',naves:'#44aaff',mejoras:'#44ff88',sistemas:'#ffdd44',especial:'#ff88ff'};
  const catIcons2={armas:'⚔',naves:'🚀',mejoras:'💪',sistemas:'⚙',especial:'✨'};
  const catNames2={armas:'ARMAMENTO',naves:'NAVES',mejoras:'MEJORAS',sistemas:'SISTEMAS',especial:'ESPECIAL'};
  SHOP_ITEMS.forEach((it,idx)=>{
    const r=rects[idx];
    const ry2=r.y+hdrH;
    if(ry2+r.h<hdrH-32||ry2>H-54) return;
    if(it.cat && it.cat!==lastCatDraw2){
      lastCatDraw2=it.cat;
      const cc2=catColors2[it.cat]||'#aaa';
      const catLabelY=ry2-14;
      if(catLabelY>hdrH && catLabelY<H-54){
        cx.fillStyle=cc2; cx.font='bold 10px Courier New'; cx.textAlign='left';
        cx.shadowColor=cc2; cx.shadowBlur=4;
        cx.fillText((catIcons2[it.cat]||'•')+' '+catNames2[it.cat], r.x, catLabelY);
        cx.shadowBlur=0;
      }
    }
    const lvl=G.upgrades[it.id]||0, maxed=lvl>=it.max;
    const costNum=itemCost(it.id), canBuy=!maxed&&G.gold>=costNum;
    cx.fillStyle=maxed?'rgba(0,30,20,0.55)':'rgba(0,0,0,0.6)';
    cx.strokeStyle=maxed?'#335544':canBuy?'#7affb0':'#664455';
    cx.lineWidth=canBuy?2:1;
    if(canBuy){cx.shadowColor='rgba(122,255,176,0.35)';cx.shadowBlur=6;}
    rrect(r.x,ry2,r.w,r.h,10); cx.shadowBlur=0;
    cx.fillStyle=`rgba(${canBuy?'0,180,100':maxed?'80,100,80':'120,60,60'},0.22)`;
    cx.beginPath(); cx.arc(r.x+28,ry2+r.h/2,20,0,TAU); cx.fill();
    cx.font='17px sans-serif'; cx.textAlign='center';
    cx.fillText(it.icon||'?',r.x+28,ry2+r.h/2+6);
    cx.textAlign='left';
    cx.fillStyle='#d9fff0'; cx.font=`bold ${Math.min(13,r.w*0.038)}px Courier New`;
    cx.fillText(it.name,r.x+56,ry2+18);
    cx.fillStyle='#8aa79b'; cx.font='10px Courier New';
    cx.fillText(it.desc.slice(0,38),r.x+56,ry2+32);
    if(it.max>1){ for(let p=0;p<Math.min(it.max,10);p++){
      cx.fillStyle=p<lvl?'#7affb0':'rgba(80,100,80,0.3)';
      cx.fillRect(r.x+56+p*8,ry2+42,6,4);
    }}
    cx.fillStyle='#66d9ff'; cx.font='9px Courier New';
    cx.fillText(it.max>1?'Lv '+lvl+'/'+it.max:maxed?'ACTIVO':'',r.x+56,ry2+58);
    cx.textAlign='right';
    cx.fillStyle=maxed?'#556':canBuy?'#ffd54a':'#ff7d8a';
    cx.font=`bold ${Math.min(12,r.w*0.036)}px Courier New`;
    cx.fillText(maxed?'✔':costNum+'monedas',r.x+r.w-10,ry2+20);
    cx.fillStyle=maxed?'#334':canBuy?'#7affb0':'#886';
    cx.font='11px Courier New';
    cx.fillText(maxed?'LISTO':canBuy?'TOCA->COMPRAR':'falta oro',r.x+r.w-10,ry2+56);
  });
  cx.restore();
  const cols2=W>=700?2:1, rows2=Math.ceil(SHOP_ITEMS.length/cols2);
  const listH=rows2*(80+10)+20, viewH=H-hdrH-54;
  if(listH>viewH){
    const tH=Math.max(30,viewH*viewH/listH);
    const tY=hdrH+scroll/(listH-viewH)*(viewH-tH);
    cx.fillStyle='rgba(0,0,0,0.5)'; cx.fillRect(W-7,hdrH,5,viewH);
    cx.fillStyle='rgba(122,255,176,0.55)'; cx.fillRect(W-7,tY,5,tH);
  }
  cx.fillStyle='rgba(0,0,0,0.9)'; cx.fillRect(0,H-54,W,54);
  cx.strokeStyle='#334'; cx.lineWidth=1;
  cx.beginPath(); cx.moveTo(0,H-54); cx.lineTo(W,H-54); cx.stroke();
  const btnW=Math.min(260,W*0.46), btnH=40, btnX=W/2-btnW/2, btnY=H-50;
  const pulse3=0.7+Math.sin(menuFrame*0.07)*0.3;
  cx.textAlign='center';
  cx.fillStyle=`rgba(0,255,136,${pulse3*0.22})`; cx.strokeStyle=`rgba(0,255,136,${pulse3})`; cx.lineWidth=2;
  cx.shadowColor='#00ff88'; cx.shadowBlur=14*pulse3;
  rrect(btnX,btnY,btnW,btnH,10);
  cx.shadowBlur=0; cx.fillStyle=`rgba(0,255,136,${pulse3})`;
  cx.font=`bold ${Math.min(14,W*0.023)}px Courier New`;
  const nxt2=lvlNames[G.level]||'FIN';
  cx.fillText('SIGUIENTE: LVL '+(G.level+1)+' - '+nxt2.slice(0,14), W/2, btnY+btnH*0.64);
  cx.textAlign='left';
}

  cx.shadowColor='#ffdd00'; cx.shadowBlur=14; cx.fillStyle='#ffdd00';
  cx.fillText('🏆 RANKING — '+G.diffNames[G.difficulty].toUpperCase(),W/2,H*0.08+16);
  cx.shadowBlur=0;
  // Difficulty selector
  cx.font='11px Courier New';
  G.diffNames.forEach((dn,di)=>{
    const bx=W/2+(di-1.5)*85, bw=80, bh=22, by=H*0.13;
    cx.fillStyle=di===G.difficulty?'rgba(100,200,100,0.3)':'rgba(0,0,0,0.4)';
    cx.strokeStyle=di===G.difficulty?'#7affb0':'#334'; cx.lineWidth=1;
    rrect(bx-bw/2,by,bw,bh,5);
    cx.fillStyle=di===G.difficulty?'#7affb0':'#445'; cx.fillText(dn,bx,by+15);
  });
  cx.fillStyle='#445'; cx.font='10px Courier New'; cx.fillText('(toca para cambiar)',W/2,H*0.19);
  const entries=G.ranking[G.difficulty]||[];
  if(!entries.length){
    cx.fillStyle='#aaaaaa'; cx.font='14px Courier New';
    cx.fillText('Sin partidas registradas aún',W/2,H*0.5);
    cx.font='11px Courier New'; cx.fillStyle='#556';
    cx.fillText('Completa una campaña para aparecer aquí',W/2,H*0.57);
  } else {
    const metals=['🥇','🥈','🥉'];
    const rowH=Math.min(48, (H*0.6)/entries.length);
    entries.forEach((en,i)=>{
      const ey=H*0.22+i*rowH+rowH*0.5;
      if(ey>H*0.88) return;
      const rowCol=i<3?['#ffdd00','#cccccc','#cc8844'][i]:'#778877';
      cx.fillStyle=i%2===0?'rgba(50,80,50,0.22)':'rgba(20,40,20,0.12)';
      cx.fillRect(W*0.06,ey-rowH*0.45,W*0.88,rowH*0.9);
      cx.globalAlpha=1-i*0.05; cx.fillStyle=rowCol;
      cx.font=`bold ${Math.min(13,W*0.022)}px Courier New`;
      const medal=metals[i]||'#'+(i+1);
      cx.textAlign='left';  cx.fillText(medal+' '+en.name,W*0.1,ey+4);
      cx.textAlign='center'; cx.fillStyle='#fff';
      cx.font=`${Math.min(12,W*0.02)}px Courier New`;
      cx.fillText(en.score.toLocaleString(),W/2,ey+4);
      cx.textAlign='right'; cx.fillStyle=rowCol;
      cx.fillText('LVL'+en.level+'  '+en.diff,W*0.92,ey+4);
      cx.globalAlpha=1; cx.textAlign='center';
    });
  }
  const pulse=0.65+Math.sin(menuFrame*0.06)*0.35;
  cx.fillStyle=`rgba(122,255,176,${pulse})`; cx.font='bold 12px Courier New';
  cx.fillText('◀  TOCA PARA VOLVER',W/2,H*0.93);
  cx.textAlign='left';
}

// ═══════════════════════════════════════════════════════════════
//  SCREEN — GAME
// ═══════════════════════════════════════════════════════════════
function renderGame() {
  cx.shadowBlur = 0; // global reset at frame start
  const shook = applyShake();

  drawBG();
  OBSTACLES.forEach(drawObstacle);
  drawParticles();
  // EMP wave rings
  (G.empWaves||[]).forEach(ew=>{
    const prog=ew.r/ew.maxR;
    cx.save();
    cx.strokeStyle=`rgba(0,255,220,${(1-prog)*0.8})`; cx.lineWidth=3+prog*4;
    cx.shadowBlur=0;
    cx.beginPath(); cx.arc(ew.x,ew.y,ew.r,0,TAU); cx.stroke();
    // Inner ring
    cx.strokeStyle=`rgba(0,200,180,${(1-prog)*0.35})`; cx.lineWidth=1.5;
    cx.beginPath(); cx.arc(ew.x,ew.y,Math.max(0,ew.r-12),0,TAU); cx.stroke();
    cx.restore();
  });
  // Rhizome connections
  (G.rhizomeActive||[]).forEach(rh=>{
    if(rh.targets.length<2) return;
    const prog=rh.t/rh.maxT, alpha=(1-prog)*0.85;
    cx.save(); cx.lineWidth=2; cx.shadowBlur=0;
    cx.strokeStyle=`rgba(255,136,255,${alpha})`;
    cx.beginPath();
    // Draw from player to each target
    rh.targets.forEach(({e,x,y})=>{
      cx.moveTo(G.px, G.py); cx.lineTo(x,y);
    });
    // Connect targets to each other (chain)
    for(let i=0;i<rh.targets.length-1;i++){
      cx.moveTo(rh.targets[i].x,rh.targets[i].y);
      cx.lineTo(rh.targets[i+1].x,rh.targets[i+1].y);
    }
    cx.stroke();
    // Node dots
    cx.fillStyle=`rgba(255,200,255,${alpha*0.9})`;
    rh.targets.forEach(({x,y})=>{
      cx.beginPath(); cx.arc(x,y,5,0,TAU); cx.fill();
    });
    cx.restore();
  });
  G.enemies.forEach(e=>{ if(!e.dead) drawEnemy(e); });
  if(G.boss&&!G.boss.dead) drawEnemy(G.boss);
  G.pickups.forEach(drawPickup);

  // Laser sparks layer (behind bullets)
  updateDrawLaserSparks();

  G.eBullets.forEach(drawBullet);
  G.bullets.forEach(drawBullet);

  // Companions orbitando la nave principal
  if(G.companions>0){
    const cps = getCompanionPositions().slice(0,G.companions);
    cps.forEach((cp,ci)=>drawCompanion(cp.x,cp.y,ci));
  }

  // Player
  if(G.invTimer<=0||Math.floor(G.invTimer/5)%2===0){
    drawShip(G.px,G.py,G.shipSel,1,1);
    drawShipUpgrades(G.px,G.py);
    drawShipParts(G.px, G.py);
    drawWeaponCharge();
    drawDangerEdges();
    if(G.pshield>0){
      const sa=G.pshield/G.pmaxsh;
      const shieldPulse=0.3+Math.sin(G.frame*0.15)*0.1;
      cx.save(); cx.globalAlpha=sa*shieldPulse*1.3; cx.strokeStyle='#4488ff';
      cx.lineWidth=2.5; cx.shadowColor='#4488ff'; cx.shadowBlur=14;
      cx.beginPath(); cx.arc(G.px,G.py,30+Math.sin(G.frame*0.1)*2,0,TAU); cx.stroke();
      cx.globalAlpha=sa*0.08; cx.fillStyle='#4488ff';
      cx.beginPath(); cx.arc(G.px,G.py,30,0,TAU); cx.fill();
      cx.restore();
    }
    if(G.beamTimer>0){
      const beamCol = G.beamColor || getLevelBeamColor();
      const beamLen = W - G.px - 10;
      const beamW = 18 + Math.sin(G.frame*0.25)*4;
      cx.save();
      cx.globalCompositeOperation='screen';
      cx.shadowColor=beamCol; cx.shadowBlur=34;
      const grad = cx.createLinearGradient(G.px+20, G.py, G.px+beamLen, G.py);
      grad.addColorStop(0,'#ffffff'); grad.addColorStop(0.14,beamCol); grad.addColorStop(0.4,'rgba(255,255,255,0.45)'); grad.addColorStop(1,'rgba(255,255,255,0)');
      cx.strokeStyle=grad; cx.lineWidth=beamW;
      cx.beginPath(); cx.moveTo(G.px+16,G.py); cx.lineTo(G.px+beamLen,G.py); cx.stroke();
      cx.strokeStyle='rgba(255,255,255,0.95)'; cx.lineWidth=4;
      cx.beginPath(); cx.moveTo(G.px+16,G.py); cx.lineTo(G.px+beamLen,G.py); cx.stroke();
      for(let s=0;s<3;s++){
        cx.strokeStyle=s===0? 'rgba(255,255,255,0.85)' : beamCol;
        cx.lineWidth=Math.max(1.6, 3-s);
        cx.beginPath();
        for(let x=G.px+16;x<G.px+beamLen;x+=18){
          const y=G.py + Math.sin((x+G.frame*8)*(0.02+s*0.006))*((beamW*0.18)/(s+1));
          if(x===G.px+16) cx.moveTo(x,y); else cx.lineTo(x,y);
        }
        cx.stroke();
      }
      const cps=getCompanionPositions().slice(0,G.companions);
      cps.forEach((cp,idx)=>{
        const len=beamLen*(0.76+idx*0.06);
        cx.strokeStyle=beamCol; cx.lineWidth=Math.max(6,beamW*0.42);
        cx.beginPath(); cx.moveTo(cp.x+8,cp.y); cx.lineTo(cp.x+len,cp.y); cx.stroke();
        cx.strokeStyle='rgba(255,255,255,0.68)'; cx.lineWidth=2.5;
        cx.beginPath(); cx.moveTo(cp.x+8,cp.y); cx.lineTo(cp.x+len,cp.y); cx.stroke();
      });
      cx.restore();
    }
  }

  // Floating damage numbers
  updateDrawDmgNums();

  // Kill streak display (center, behind HUD)
  drawStreakDisplay();

  // Screen restore before HUD (HUD never shakes)
  restoreShake(shook);

  // Post-process effects
  drawFlash();
  drawChroma();
  if(!PERF.desktopLite) drawCRT();
  drawOrientationBadge();
  drawFloatingPowerStatus();

  // Combo bar (top-left corner, subtle)
  if(COMBO.count>=2){
    cx.save();
    const cw=Math.min(120,W*0.18), ch=5, cx2=10, cy2=H-64;
    const cf=COMBO.timer/COMBO.maxTimer;
    const cCol=COMBO.count>=5?'#ff00ff':COMBO.count>=3?'#ffdd00':'#00ffcc';
    cx.fillStyle='#111'; cx.fillRect(cx2,cy2,cw,ch);
    cx.fillStyle=cCol; cx.shadowColor=cCol; cx.shadowBlur=4;
    cx.fillRect(cx2,cy2,cw*cf,ch);
    cx.shadowBlur=0; cx.font=`bold 10px Courier New`; cx.fillStyle=cCol;
    cx.fillText(`COMBO ×${COMBO.mult}  [${COMBO.count} kills]`,cx2,cy2-2);
    cx.restore();

function wrapText(text, centerX, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '', yy = y;
  for(let n=0;n<words.length;n++){
    const test = line + words[n] + ' ';
    const m = cx.measureText(test).width;
    if(m > maxWidth && n > 0){
      cx.fillText(line.trim(), centerX, yy);
      line = words[n] + ' ';
      yy += lineHeight;
    } else line = test;
  }
  cx.fillText(line.trim(), centerX, yy);
}

function updateBullets(){
  const spd2=G.speed||5;
  for(let bi=G.bullets.length-1;bi>=0;bi--){
    const b=G.bullets[bi];
    b.x+=b.vx||10; b.y+=(b.vy||0);
    if(b.x>W+60||b.x<-60||b.y<-60||b.y>H+60) G.bullets.splice(bi,1);
  }
  // Fire weapon in training
  if(!G.weapTimer||G.weapTimer<=0){
    const wd=WEAPONS[G.weapon||'laser']||WEAPONS.laser;
    G.bullets.push({x:G.px+50,y:G.py,vx:wd.spd||10,vy:0,dmg:wd.dmg||20,wtype:G.weapon||'laser',w:18,h:6,ang:0});
    G.weapTimer=wd.rate||12;
  }
  if(G.weapTimer>0) G.weapTimer--;
}

function updatePlayerMovement(){
  const spd = G.speed || 5;
  let targetX = G.px, targetY = G.py;

  if(G.touching){
    if(IS_DESKTOP){
      // PC: la nave sigue el cursor de forma directa, sin sensación de retraso.
      targetX = G.tx;
      targetY = G.ty;
    } else {
      // Móvil: control relativo para evitar "salto" cuando el dedo no toca el centro.
      targetX = G.tx - (G.touchOffsetX || 0);
      targetY = G.ty - (G.touchOffsetY || 0);
    }

    const dx = targetX - G.px;
    const dy = targetY - G.py;
    const d = Math.hypot(dx,dy);

    if(d > 1.5){
      const nx = dx / d, ny = dy / d;
      const desired = Math.min(spd * (IS_DESKTOP ? 1.25 : 1.05), d * (IS_DESKTOP ? 0.45 : 0.34));
      const follow = IS_DESKTOP ? 0.92 : 0.72;
      G.pvx = lerp(G.pvx, nx * desired, follow);
      G.pvy = lerp(G.pvy, ny * desired, follow);
    } else {
      G.pvx *= 0.45; G.pvy *= 0.45;
    }
  } else {
    G.pvx *= IS_DESKTOP ? 0.62 : 0.80;
    G.pvy *= IS_DESKTOP ? 0.62 : 0.80;
  }

  G.pvx = clamp(G.pvx, -spd*1.12, spd*1.12);
  G.pvy = clamp(G.pvy, -spd*1.12, spd*1.12);
  G.px = clamp(G.px + G.pvx, 24, W - 24);
  G.py = clamp(G.py + G.pvy, 38, (typeof gameplayBottomLimit === 'function' ? gameplayBottomLimit() : H - 54));
}

function updateTraining(){
  trainingTimer++;
  const step=TRAINING_STEPS[trainingStep]||TRAINING_STEPS[0];
  // Move player
  updatePlayerMovement();
  // Invincible in training
  G.invTimer=10;
  // Spawn practice targets
  if(step.phase==='shoot'||step.phase==='combo'){
    if(trainingTimer%90===0&&trainingTargets.length<6)
      trainingTargets.push({x:rnd(W*0.5,W-60),y:rnd(50,H-50),hp:30,maxhp:30,t:0,dead:false,sz:20,col:'#44ffaa'});
  }
  // Practice targets drift
  trainingTargets.forEach(t=>{t.t++; t.x-=1.2; if(t.x<-40) t.dead=true;});
  // Bullet hits on targets
  G.bullets.forEach(b=>{ trainingTargets.forEach(t=>{
    if(!t.dead&&Math.abs(b.x-t.x)<t.sz&&Math.abs(b.y-t.y)<t.sz){
      t.hp-=b.dmg; b.dead=true; spawnEx(t.x,t.y,'#44ffaa',5,2,3);
      if(t.hp<=0){t.dead=true; trainingKills++; COMBO.add(); spawnEx(t.x,t.y,'#ffdd00',10,3,5);}
    }
  });});
  trainingTargets=trainingTargets.filter(t=>!t.dead);
  G.bullets=G.bullets.filter(b=>!b.dead);
  // Simulate dodge bullets
  if(step.phase==='dodge'&&trainingTimer%120===0)
    trainingBullets2.push({x:W,y:rnd(60,H-60),vx:-4,vy:rnd(-1,1),t:0});
  trainingBullets2.forEach(b=>{b.x+=b.vx; b.y+=b.vy; b.t++;});

  // Spawn pickups
  if(step.phase==='pickup'&&trainingTimer%180===0&&G.pickups.length<4)
    spawnPickup(rnd(W*0.4,W-80),rnd(50,H-50),'gold');
  // Check goals
  let stepDone=false;
  if(step.phase==='move'&&trainingTimer>280) stepDone=true;
  if(step.phase==='shoot'&&trainingKills>=5) stepDone=true;
  if(step.phase==='dodge'&&trainingTimer>600) stepDone=true;
  if(step.phase==='pickup'&&(G.gold>0&&trainingTimer>120)) stepDone=true;
  if(step.phase==='combo'&&COMBO.count>=3) stepDone=true;
  if(stepDone){
    trainingStep++;
    trainingKills=0; trainingTimer=0; trainingPickups=0;
    if(trainingStep>=TRAINING_STEPS.length){
      notify('✅ ENTRENAMIENTO COMPLETO — ¡A COMBATIR!','#00ffaa',300);
      G.tutorialSeen=true; saveMetaProgress();
      G.screen='MENU'; trainingStep=0;
    } else {
      notify('SIGUIENTE: '+TRAINING_STEPS[trainingStep].title,'#ffdd00',180);
    }
  }
  updateBullets(); updateParticles();
}

function updatePlayerMovement(){
  const baseSpd = G.speed || 5.5;
  const fast = IS_DESKTOP ? 2.55 : 1.72;
  const maxStep = Math.max(IS_DESKTOP ? 13 : 9, baseSpd * fast);

  if(G.touching){
    const dx = G.tx - G.px, dy = G.ty - G.py;
    const d = Math.hypot(dx,dy);
    if(d > 1.5){
      const ease = IS_DESKTOP ? 0.72 : 0.48;
      const step = Math.min(maxStep, Math.max(1.8, d * ease));
      G.pvx = (dx / d) * step;
      G.pvy = (dy / d) * step;
    } else {
      G.pvx *= 0.25; G.pvy *= 0.25;
      G.px = G.tx; G.py = G.ty;
    }
  } else {
    G.pvx *= IS_DESKTOP ? 0.55 : 0.72;
    G.pvy *= IS_DESKTOP ? 0.55 : 0.72;
  }
  G.px = clamp(G.px + G.pvx, 22, W-22);
  G.py = clamp(G.py + G.pvy, 38, H-52);
}

function handleMenuTap(x, y) {

    if (x > W*0.6) G.shipSel=Math.min(G.ships.length-1,G.shipSel+1);
  }

    const dw=Math.min(W*0.2,88), dGap=6, dTotal=4*(dw+dGap), dStart=W/2-dTotal/2;

  const centers=[W*0.20,W*0.40,W*0.60,W*0.80];

  }

}

// ── Recomendación de compra: ayuda visual, no bloquea la decisión del jugador.
function getRecommendedUpgrade(){
  const next = Math.min((G.level||1)+1, G.maxLevel||10);
  const priorities = next<=2 ? ['speed','shield','damage','allies'] :
                    next<=4 ? ['damage','speed','allies','shield','w_vector','w_homing'] :
                    next<=6 ? ['shield','damage','beam','regen','emp','w_emp','allies'] :
                    next<=8 ? ['damage','shield','regen','crit','beam','atomic_r','w_grav'] :
                              ['damage','shield','regen','crit','beam','atomic_r','w_anti','w_quant'];
  let candidate=null;
  for(const id of priorities){
    const it=SHOP_ITEMS.find(s=>s.id===id); if(!it) continue;
    const lvl=G.upgrades[it.id]||0; if(lvl>=it.max) continue;
    if(!candidate) candidate=it;
    if(G.gold>=itemCost(it.id)){ candidate=it; break; }
  }
  if(!candidate) candidate=SHOP_ITEMS.find(it=>(G.upgrades[it.id]||0)<it.max) || null;
  if(!candidate) return null;
  const reason = (candidate.id==='speed')?'clave para esquivar corredores y meteoros':
                 (candidate.id==='shield')?'clave para sobrevivir choques y bombas':
                 (candidate.id==='damage')?'clave para matar evasivos antes de saturarte':
                 (candidate.id==='allies')?'clave para cubrir flancos sin quedarte quieto':
                 (candidate.id==='beam')?'clave contra jefes con fases largas':
                 (candidate.id==='regen')?'clave para niveles de desgaste':
                 (candidate.id==='crit')?'clave para bajar jefes resistentes':
                 (candidate.id==='atomic_r')?'clave como seguro ante caos extremo':'buena preparación para el siguiente nivel';
  return {id:candidate.id, item:candidate, reason};
}

(function(){
  const SPECIAL_PICKUPS = new Set(['weapon','ultralaser','bomb','speed','magnet','shieldx','companion','part','life','boss_shield']);

  PICKUP_DEFS.boss_shield = {icon:'◇', color:'#66ddff', label:'ESCUDO'};

  function tagSpecialPickup(p){
    if(!p || !SPECIAL_PICKUPS.has(p.type)) return p;
    p.special = true;
    p.ring = p.ring || rnd(0,TAU);
    p.bob = p.bob || rnd(0,TAU);
    p.life = p.life || (p.bossReward ? 1800 : 1500);
    if(p.type === 'weapon' && p.weapKey && WEAPONS[p.weapKey]){
      p.specialLabel = WEAPONS[p.weapKey].name;
      p.specialIcon = WEAPONS[p.weapKey].icon;
      p.specialColor = WEAPONS[p.weapKey].color;
    }
    return p;
  }

  const _xs63_spawnPickup = spawnPickup;
  spawnPickup = function(x,y,type,weapKey){
    _xs63_spawnPickup(x,y,type,weapKey);
    const p = G.pickups[G.pickups.length-1];
    tagSpecialPickup(p);
    return p;
  };

  spawnRandomPickup = function(){
    const lv = G.level || 1;
    const types = ['hp','shield','gold','gold','gold','weapon','speed','magnet','shieldx'];
    if(lv>=2) types.push('ultralaser');
    if(lv>=3) types.push('bomb','companion');
    const type = types[rndI(0,types.length-1)];
    const y = rnd(55,Math.max(80,H-120));
    const weapKey = type==='weapon' ? ALL_WEAPONS_PICK[rndI(0,ALL_WEAPONS_PICK.length-1)] : null;
    const p = spawnPickup(W+24,y,type,weapKey);
    if(p && p.special){
      p.vx = -rnd(0.55,1.05);
      p.vy = rnd(-0.35,0.45);
      p.life = 1500;
    }
  };

  function spawnBossAidPickup(){
    if(!G.boss || G.boss.dead || G.bossPhase==='collect') return;
    const pool = ['boss_shield','shieldx','hp','hp','ultralaser'];
    if((G.lives||0)<=2) pool.push('life');
    const type = pool[rndI(0,pool.length-1)];
    const p = spawnPickup(rnd(W*0.42,W*0.82), -22, type, null);
    if(p){
      p.special = true;
      p.vx = rnd(-0.55,0.15);
      p.vy = rnd(0.85,1.45);
      p.life = 980;
      p.bossAid = true;
      p.specialLabel = type==='boss_shield' ? 'ESCUDO JEFE' : (PICKUP_DEFS[type]?.label || 'PODER');
    }
    notify('PODER ESPECIAL ENTRANDO', '#66ddff', 90);
  }

  function activateBossGuard(frames=420){
    G.bossGuardTimer = Math.max(G.bossGuardTimer||0, frames);
    G.invTimer = Math.max(G.invTimer||0, 170);
    G.pshield = Math.max(G.pshield||0, G.pmaxsh||50);
    G.eBullets = [];
    flash('#66ddff', 10);
    SFX.shieldUp();
    notify('◇ ESCUDO AUTOMÁTICO DE JEFE ACTIVADO', '#66ddff', 180);
  }

  const _xs63_spawnBoss = spawnBoss;
  spawnBoss = function(){
    _xs63_spawnBoss();
    if(G.boss){
      G.boss.introTimer = 250;
      G.boss.fireTimer = Math.max(G.boss.fireTimer||0, 120);
      G.boss.shieldTimer = Math.max(G.boss.shieldTimer||0, 120);
      G.bossAidTimer = 260;
      activateBossGuard(IS_DESKTOP ? 480 : 420);
    }
  };

  const _xs63_damagePlayer = damagePlayer;
  damagePlayer = function(dmg){
    if((G.bossGuardTimer||0)>0){
      dmg = Math.max(1, Math.round(dmg * 0.42));
    }
    return _xs63_damagePlayer(dmg);
  };

  const _xs63_collectPickup = collectPickup;
  collectPickup = function(p){
    if(p.type === 'boss_shield'){
      G.pshield = Math.min((G.pmaxsh||50)+80, (G.pshield||0) + Math.round((G.pmaxsh||50)*0.95));
      G.invTimer = Math.max(G.invTimer||0, 100);
      G.bossGuardTimer = Math.max(G.bossGuardTimer||0, 260);
      notify('◇ ESCUDO REFORZADO CONTRA JEFE', '#66ddff', 130);
      SFX.shieldUp(); flash('#66ddff', 8); shake(0.18);
      return;
    }
    return _xs63_collectPickup(p);
  };

  const _xs63_update = update;
  update = function(){
    if((G.bossGuardTimer||0)>0) G.bossGuardTimer--;
    _xs63_update();

    // Suaviza las ráfagas del jefe: mantiene reto, evita muerte instantánea.
    if(G.boss && !G.boss.dead && G.bossPhase!=='collect'){
      (G.eBullets||[]).forEach(eb=>{
        if(!eb.xs63Scaled){
          eb.dmg = Math.max(6, Math.round((eb.dmg||12) * (G.level===1 ? 0.58 : 0.72)));
          eb.vx *= (G.level===1 ? 0.86 : 0.92);
          eb.vy *= (G.level===1 ? 0.86 : 0.92);
          eb.xs63Scaled = true;
        }
      });
      if(G.boss.introTimer && G.boss.introTimer>0){
        G.boss.introTimer--;
        G.boss.fireTimer = Math.max(G.boss.fireTimer||0, 55);
      }
      G.bossAidTimer = (G.bossAidTimer||300)-1;
      if(G.bossAidTimer<=0){
        spawnBossAidPickup();
        G.bossAidTimer = Math.max(230, 390 - (G.level||1)*15);
      }
    }

    // Los poderes especiales no deben perderse dentro del HUD inferior.
    (G.pickups||[]).forEach(p=>{
      tagSpecialPickup(p);
      if(p.special){
        const safeBottom = H - 108;
        if(p.y > safeBottom){ p.y = safeBottom; p.vy = -Math.abs(p.vy||0.5)*0.72; }
        if(p.y < 24 && (p.vy||0)<0) p.vy = Math.abs(p.vy)*0.8;

        const dx=G.px-p.x, dy=G.py-p.y, d=Math.max(1,Math.hypot(dx,dy));
        const radius = p.bossAid ? 220 : 150;
        if(d<radius){ p.x += dx/d*1.4; p.y += dy/d*1.4; }
      }
    });
  };

  const _xs63_drawPickup = drawPickup;
  drawPickup = function(p){
    tagSpecialPickup(p);
    if(!p.special) return _xs63_drawPickup(p);
    p.t=(p.t||0)+1;
    const def = PICKUP_DEFS[p.type] || PICKUP_DEFS.hp;
    const col = p.specialColor || def.color || '#ffffff';
    const icon = p.specialIcon || def.icon || '✦';
    const label = p.specialLabel || def.label || 'ESPECIAL';
    const pulse = 0.72 + Math.sin(p.t*0.15)*0.28;
    const bob = Math.sin(p.t*0.055 + (p.bob||0))*6;
    const rr = p.type==='part' ? 26 : p.type==='life' ? 27 : 24;

    cx.save(); cx.translate(p.x,p.y+bob);
    cx.globalCompositeOperation='screen';
    cx.shadowColor=col; cx.shadowBlur=18*pulse;
    cx.fillStyle=`rgba(${hexR(col)},${0.12+0.18*pulse})`;
    cx.beginPath(); cx.arc(0,0,rr+7+Math.sin(p.t*0.12)*3,0,TAU); cx.fill();
    cx.globalCompositeOperation='source-over';

    cx.rotate((p.ring||0)+p.t*0.026);
    cx.strokeStyle=col; cx.lineWidth=2.2; cx.globalAlpha=0.85;
    cx.beginPath(); cx.arc(0,0,rr,0,TAU); cx.stroke();
    cx.globalAlpha=0.55; cx.setLineDash([5,6]);
    cx.beginPath(); cx.arc(0,0,rr+7,0,TAU); cx.stroke();
    cx.setLineDash([]); cx.rotate(-((p.ring||0)+p.t*0.026));

    cx.globalAlpha=1; cx.font=`bold ${p.type==='life'?27:22}px sans-serif`; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillStyle='#ffffff'; cx.shadowColor=col; cx.shadowBlur=10; cx.fillText(icon,0,0);
    cx.font='bold 8.5px Courier New'; cx.fillStyle=col; cx.shadowBlur=7;
    cx.fillText(label.toString().slice(0,12).toUpperCase(),0,rr+17);
    if(p.bossAid){
      cx.font='bold 8px Courier New'; cx.fillStyle='#eaffff'; cx.fillText('TÓMALO',0,-rr-10);
    }
    cx.restore();
  };

  const _xs63_drawHUD = drawHUD;
  drawHUD = function(){
    // Oculta la tira inferior de poderes activos para no competir con las ranuras/vida.
    const saved = G.activePowers;
    G.activePowers = [];
    _xs63_drawHUD();
    G.activePowers = saved;

    if((G.bossGuardTimer||0)>0){
      const pct = Math.min(1,G.bossGuardTimer/480);
      const x = G.px, y = G.py;
      cx.save();
      cx.strokeStyle=`rgba(102,221,255,${0.25+pct*0.45})`; cx.lineWidth=3; cx.shadowColor='#66ddff'; cx.shadowBlur=IS_DESKTOP?16:0;
      cx.beginPath(); cx.ellipse(x,y,40+Math.sin(G.frame*0.15)*3,27+Math.sin(G.frame*0.11)*2,0,0,TAU); cx.stroke();
      cx.textAlign='center'; cx.font='bold 9px Courier New'; cx.fillStyle='#aeefff'; cx.shadowBlur=7;
      cx.fillText('ESCUDO JEFE',x,y-35);
      cx.restore();
    }
  };
})();

    const dw=(bw-18)/4, dY=H*.90; const cs=['#00aaff','#ffdd00','#ff8800','#ff2200']; G.diffNames.forEach((dn,i)=>{const dx=x+i*(dw+6); MENU_RECTS['diff'+i]={x:dx,y:dY,w:dw,h:25}; const sel=G.difficulty===i; cx.fillStyle=sel?'rgba(0,0,0,.64)':'rgba(0,0,0,.34)'; cx.strokeStyle=sel?cs[i]:'#334'; rrect(dx,dY,dw,25,7); cx.fillStyle=sel?cs[i]:'#667'; cx.font='bold 8px Courier New'; cx.fillText(dn,dx+dw/2,dY+16);});
    MENU_RECTS.shipPrev={x:0,y:H*.18,w:W*.34,h:H*.30}; MENU_RECTS.shipNext={x:W*.66,y:H*.18,w:W*.34,h:H*.30};
  }
  cx.fillStyle='rgba(180,220,220,.45)'; cx.font='9px Courier New'; cx.fillText('HI '+G.hiScore.toLocaleString()+' · 🪙 '+G.gold+' · v6.8',W/2,H-8); cx.textAlign='left';
};
function hit68(x,y,r){return r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;}
function startGame68(){requestGameFullscreen(); applyShip(); beginNewCampaign(); G.screen='GAME'; G.tourActive=false; G.tutorialSeen=true; SFX.gameStart();}
handleMenuTap = function(x,y){
  if(hit68(x,y,MENU_RECTS.fullscreen)){requestGameFullscreen();return;}
  if(hit68(x,y,MENU_RECTS.start)){startGame68();return;}
  if(hit68(x,y,MENU_RECTS.load)){if(loadGame()){requestGameFullscreen();G.screen='GAME';SFX.gameStart();notify('PARTIDA CARGADA','#00ffaa',100);}else notify('Sin partida guardada','#ff6677',100);return;}
  if(hit68(x,y,MENU_RECTS.store)){G.screen='STORE';G.shopScroll=0;return;}
  if(hit68(x,y,MENU_RECTS.manual)){G.screen='MANUAL';return;}
  if(hit68(x,y,MENU_RECTS.rank)){G.screen='LEADERBOARD';return;}
  for(let i=0;i<4;i++){if(hit68(x,y,MENU_RECTS['diff'+i])){G.difficulty=i;SFX.hit();return;}}
  if(hit68(x,y,MENU_RECTS.shipPrev)){G.shipSel=Math.max(0,G.shipSel-1);SFX.hit();return;}
  if(hit68(x,y,MENU_RECTS.shipNext)){G.shipSel=Math.min(G.ships.length-1,G.shipSel+1);SFX.hit();return;}
};
const SHOP_COMPACT = [
  {id:'shield',label:'Resistencia',icon:'🛡'}, {id:'damage',label:'Armas',icon:'⚔'}, {id:'speed',label:'Maniobra',icon:'💨'}, {id:'allies',label:'Escoltas',icon:'🛸'}, {id:'magnet',label:'Imán',icon:'🧲'},
  {id:'regen',label:'Reparación',icon:'❤'}, {id:'beam',label:'Láser-X',icon:'✦'}, {id:'atomic_r',label:'Bomba',icon:'💣'}, {id:'w_homing',label:'Arma especial',icon:'🚀'}, {id:'ship2',label:'Nave pesada',icon:'🔮'}
];
let STORE_RECTS=[];
function compactShopLayout(panelX,panelY,panelW,panelH){
  const availableH=panelH-74, gap=8; const cols = W>900?5:(W>650?4:(W>430?2:1));
  const cardW=(panelW-24-(cols-1)*gap)/cols; const cardH=clamp((availableH-gap*Math.ceil(SHOP_COMPACT.length/cols))/Math.ceil(SHOP_COMPACT.length/cols),46,72);
  STORE_RECTS=[]; SHOP_COMPACT.forEach((s,i)=>{const col=i%cols,row=Math.floor(i/cols); STORE_RECTS.push({x:panelX+12+col*(cardW+gap),y:panelY+64+row*(cardH+gap),w:cardW,h:cardH,id:s.id,meta:s});});
}
drawStore = function(){
  menuFrame++; drawBG(); cx.textAlign='center';
  const panelW=Math.min(W*.94,980), panelH=Math.min(H*.88,680), panelX=W/2-panelW/2, panelY=Math.max(48,H*.07);
  cx.fillStyle='rgba(3,8,18,.88)'; cx.strokeStyle='#7affb0'; cx.lineWidth=2; rrect(panelX,panelY,panelW,panelH,16);
  cx.fillStyle='#7affb0'; cx.font=`bold ${Math.min(22,Math.max(16,H*.055))}px Courier New`; cx.fillText('TIENDA COMPACTA',W/2,panelY+28);
  cx.fillStyle='#ffd54a'; cx.font='bold 11px Courier New'; cx.fillText('ORO '+G.gold+' · toca tarjeta para mejorar · X salir',W/2,panelY+48);
  compactShopLayout(panelX,panelY,panelW,panelH);
  const rec=(typeof getRecommendedUpgrade==='function'?getRecommendedUpgrade():null);
  STORE_RECTS.forEach(r=>{const it=SHOP_ITEMS.find(x=>x.id===r.id)||r.meta; const lvl=G.upgrades[r.id]||0; const max=it.max||1; const maxed=lvl>=max; const cost=itemCost(r.id); const can=G.gold>=cost&&!maxed; const key=rec&&rec.id===r.id;
    cx.fillStyle=key?'rgba(255,213,74,.12)':'rgba(0,0,0,.34)'; cx.strokeStyle=key?'#ffd54a':(can?'#7affb0':'#445'); cx.lineWidth=key?2:1; rrect(r.x,r.y,r.w,r.h,12);
    cx.textAlign='left'; cx.fillStyle=key?'#ffd54a':'#eaffff'; cx.font=`bold ${Math.max(10,Math.min(13,r.h*.24))}px Courier New`; cx.fillText((r.meta.icon||it.icon||'◆')+' '+r.meta.label,r.x+10,r.y+19);
    cx.fillStyle='#8aa79b'; cx.font=`${Math.max(8,Math.min(10,r.h*.18))}px Courier New`; cx.fillText((it.desc||'Mejora de nave').slice(0,32),r.x+10,r.y+35);
    const pct=max?lvl/max:0; cx.fillStyle='rgba(255,255,255,.09)'; cx.fillRect(r.x+10,r.y+r.h-17,r.w-20,5); cx.fillStyle=can?'#7affb0':'#667'; cx.fillRect(r.x+10,r.y+r.h-17,(r.w-20)*pct,5);
    cx.textAlign='right'; cx.fillStyle=maxed?'#9aa':(can?'#ffd54a':'#ff8a8a'); cx.font='bold 10px Courier New'; cx.fillText(maxed?'MAX':cost+' oro',r.x+r.w-10,r.y+r.h-23); cx.fillText('LV '+lvl+'/'+max,r.x+r.w-10,r.y+r.h-7);
    if(key){cx.textAlign='center'; cx.fillStyle='#ffd54a'; cx.font='bold 9px Courier New'; cx.fillText('CLAVE',r.x+r.w/2,r.y+10);} });
  cx.textAlign='right'; cx.fillStyle='#ff6677'; cx.font='bold 14px Courier New'; cx.fillText('X',W-22,panelY+24); cx.textAlign='left';
};
handleStoreTap = function(x,y){
  if(x>W-70 && y<90){G.screen='MENU';G.shopScroll=0;return;}
  for(const r of STORE_RECTS){if(hit68(x,y,r)){tryBuyUpgrade(r.id);return;}}
};
drawIntermission = function(){
  drawBG(); cx.textAlign='center'; const panelW=Math.min(W*.94,980), panelH=Math.min(H*.88,680), panelX=W/2-panelW/2, panelY=Math.max(36,H*.06);
  cx.fillStyle='rgba(0,0,0,.86)'; cx.strokeStyle='#7affb0'; cx.lineWidth=2; rrect(panelX,panelY,panelW,panelH,16);
  cx.fillStyle='#ffdd00'; cx.font=`bold ${Math.min(22,Math.max(15,H*.052))}px Courier New`; cx.fillText('MISIÓN '+G.level+' COMPLETADA',W/2,panelY+28);
  cx.fillStyle='#9fb'; cx.font='bold 11px Courier New'; cx.fillText('ORO +'+G.missionGold+' · TOTAL '+G.gold+' · VIDAS '+G.lives,W/2,panelY+48);
  compactShopLayout(panelX,panelY+8,panelW,panelH-60);
  const rec=(typeof getRecommendedUpgrade==='function'?getRecommendedUpgrade():null);
  STORE_RECTS.forEach(r=>{const it=SHOP_ITEMS.find(x=>x.id===r.id)||r.meta; const lvl=G.upgrades[r.id]||0; const max=it.max||1; const maxed=lvl>=max; const cost=itemCost(r.id); const can=G.gold>=cost&&!maxed; const key=rec&&rec.id===r.id;
    cx.fillStyle=key?'rgba(255,213,74,.12)':'rgba(0,0,0,.34)'; cx.strokeStyle=key?'#ffd54a':(can?'#7affb0':'#445'); cx.lineWidth=key?2:1; rrect(r.x,r.y,r.w,r.h,12);
    cx.textAlign='left'; cx.fillStyle=key?'#ffd54a':'#eaffff'; cx.font='bold 11px Courier New'; cx.fillText((r.meta.icon||it.icon||'◆')+' '+r.meta.label,r.x+10,r.y+19);
    cx.fillStyle='#8aa79b'; cx.font='9px Courier New'; cx.fillText((it.desc||'Mejora').slice(0,30),r.x+10,r.y+35);
    cx.textAlign='right'; cx.fillStyle=maxed?'#9aa':(can?'#ffd54a':'#ff8a8a'); cx.font='bold 10px Courier New'; cx.fillText(maxed?'MAX':cost+' oro',r.x+r.w-10,r.y+r.h-10);
  });
  const btnW=Math.min(260,W*.40), btnH=40, btnX=W/2-btnW/2, btnY=panelY+panelH-48; cx.fillStyle='rgba(0,255,136,.18)'; cx.strokeStyle='#00ff88'; rrect(btnX,btnY,btnW,btnH,12); cx.fillStyle='#dffff4'; cx.font='bold 13px Courier New'; cx.textAlign='center'; cx.fillText('CONTINUAR NIVEL '+(G.level+1),W/2,btnY+25); MENU_RECTS.continue={x:btnX,y:btnY,w:btnW,h:btnH}; cx.textAlign='left';
};
handleIntermissionTap = function(x,y){
  if(hit68(x,y,MENU_RECTS.continue)){G.level++; G.screen='GAME'; SFX.gameStart(); notify('NIVEL '+G.level,'#00ffaa',100); resetGame(false); return;}
  for(const r of STORE_RECTS){if(hit68(x,y,r)){tryBuyUpgrade(r.id);return;}}
  if(x>W-70&&y<70){G.level++;G.screen='GAME';resetGame(false);return;}
};

let _lastT=0;
function loop(ts) {
  // Cap to ~60fps on high-refresh screens; skip if < 14ms since last
  const _dt = ts - _lastT;
  if(_dt < 14){ requestAnimationFrame(loop); return; }
  _lastT = ts;
  cx.clearRect(0,0,W,H);
  switch(G.screen){
    case 'PROFILE':     drawProfile();      break;
    case 'MENU':        drawMenu();                                      break;
    case 'MANUAL':      drawManual();                                    break;
    case 'GAME':        renderGame();                                    break;
    case 'PAUSED':      renderGame(); drawPause(); break;
    case 'DEAD':        drawDead();         break;
    case 'TRAINING':    updateTraining(); drawTraining(); break;
    case 'BONUS_TRACK': G.screen='INTERMISSION'; drawIntermission(); break;
    case 'WIN':         drawWin();          break;
    case 'LEADERBOARD': drawLeaderboard();  break;
    case 'STORE':        drawStore();          break;
    case 'INTERMISSION': drawIntermission();   break;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
