<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050814">
  <title>SWARM//RIFT — Insecta Siege</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/player_ship.webp" as="image" type="image/webp">
  <link rel="preload" href="assets/bg_rust_canyon.webp" as="image" type="image/webp">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <main id="shell" aria-label="SWARM RIFT Insecta Siege">
    <canvas id="game" aria-label="Juego"></canvas>

    <section id="rotateGate" class="gate" aria-live="polite">
      <div class="gate-card">
        <img src="assets/icon.svg" alt="" width="76" height="76">
        <h1>SWARM//RIFT</h1>
        <p>El <strong>combate</strong> entra en horizontal y pantalla completa al iniciar. Si tu celular no gira solo, hazlo manualmente para entrar al enjambre.</p>
        <div class="rotate-glyph">↻ 📱 ↔</div>
      </div>
    </section>

    <div id="topActions" class="top-actions" aria-label="Controles del juego">
      <button id="shopBtn" type="button" title="Tienda — pausa el combate">🛒</button>
      <button id="pauseBtn" type="button" title="Pausa">Ⅱ</button>
      <button id="musicBtn" class="music-btn music-off" type="button" title="Música de jefe: activada" aria-label="Activar o desactivar música de fondo"><img src="assets/music_toggle.png" alt="" aria-hidden="true"></button>
      <button id="audioBtn" type="button" title="Efectos de sonido">🔊</button>
      <button id="fullBtn" type="button" title="Pantalla completa">⛶</button>
    </div>

    <div id="touchHud" class="touch-hud" aria-hidden="true">
      <div id="stickZone" class="stick-zone"><div id="stickBase" class="stick-base"><div id="stickKnob" class="stick-knob"></div></div></div>
</div>
    <audio id="preBossMusic" preload="auto" loop playsinline></audio>
    <audio id="bossMusic" src="assets/iron_legion_march.mp3" preload="metadata" loop></audio>
    <audio id="playlistAudio" preload="metadata"></audio>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
