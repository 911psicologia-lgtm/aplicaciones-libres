<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050814">
  <title>SWARM//RIFT — Insecta Siege</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <main id="shell" aria-label="SWARM RIFT Insecta Siege">
    <canvas id="game" aria-label="Juego"></canvas>

    <section id="rotateGate" class="gate" aria-live="polite">
      <div class="gate-card">
        <img src="assets/icon.svg" alt="" width="76" height="76">
        <h1>SWARM//RIFT</h1>
        <p>El <strong>combate</strong> entra en horizontal y pantalla completa al iniciar. Si tu celular no gira solo, hazlo manualmente para entrar al enjambre.</p>
        <div class="rotate-glyph">↻ 📱 ↔</div>
      </div>
    </section>

    <div id="topActions" class="top-actions" aria-label="Controles del juego">
      <button id="shopBtn" type="button" title="Tienda — pausa el combate">🛒</button>
      <button id="pauseBtn" type="button" title="Pausa">Ⅱ</button>
      <button id="audioBtn" type="button" title="Sonido">🔊</button>
      <button id="fullBtn" type="button" title="Pantalla completa">⛶</button>
    </div>

    <div id="touchHud" class="touch-hud" aria-hidden="true">
      <div id="stickZone" class="stick-zone"><div id="stickBase" class="stick-base"><div id="stickKnob" class="stick-knob"></div></div></div>
      <button id="dashBtn" type="button" class="dash-btn" aria-label="Impulso evasivo"><span>⚡</span><small>DASH</small></button>
    </div>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
