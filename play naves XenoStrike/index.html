function drawPhantomEnemy(t) {
  const a = 0.5+Math.sin(t)*0.3;
  cx.globalAlpha *= a;
  cx.shadowColor='#8844ff'; cx.shadowBlur=16;
  cx.fillStyle='#2a1a3a';
  cx.beginPath(); cx.ellipse(0,0,14,18,0,0,TAU); cx.fill();
  cx.fillStyle='#180d28';
  cx.beginPath(); cx.moveTo(0,-16); cx.bezierCurveTo(4,-22,6,-32,3,-36);
  cx.bezierCurveTo(0,-40,-3,-36,-3,-32); cx.bezierCurveTo(-4,-26,-2,-20,0,-16); cx.fill();
  cx.strokeStyle='#441188'; cx.lineWidth=2;
  cx.beginPath(); cx.moveTo(-12,-4); cx.bezierCurveTo(-20,0+Math.sin(t)*4,-20,10,-16,14); cx.stroke();
  cx.beginPath(); cx.moveTo(12,-4); cx.bezierCurveTo(20,0+Math.sin(t+1)*4,18,10,15,14); cx.stroke();
  glowDot(0,-18,3,'#aa44ff',0.7);
  cx.globalAlpha = 1;
}

function drawCrusher(t) {
  cx.shadowColor='#ff2200'; cx.shadowBlur=14;
  // Massive armored body
  cx.fillStyle='#1a0a0a';
  cx.beginPath(); cx.ellipse(0,0,28,36,0,0,TAU); cx.fill();
  // Armor plates
  cx.fillStyle='#2a1010';
  [-20,-10,0,10,20].forEach(y => {
    cx.beginPath(); cx.ellipse(0,y,24,5,0,0,TAU); cx.fill();
  });
  cx.strokeStyle='#442222'; cx.lineWidth=2;
  [-20,-10,0,10,20].forEach(y => { cx.beginPath(); cx.ellipse(0,y,24,5,0,0,TAU); cx.stroke(); });
  // Head
  cx.fillStyle='#140808';
  cx.beginPath(); cx.moveTo(0,-34); cx.bezierCurveTo(10,-44,14,-56,8,-62);
  cx.bezierCurveTo(2,-66,-2,-62,-2,-56); cx.bezierCurveTo(-6,-48,-4,-38,0,-34); cx.fill();
  cx.strokeStyle='#662222'; cx.lineWidth=2;
  for(let i=0;i<6;i++){ cx.beginPath(); cx.moveTo(i*2-5,-36-i*4); cx.lineTo(i*2-6,-44-i*4); cx.stroke(); }
  // Giant arms
  cx.strokeStyle='#1a0808'; cx.lineWidth=9;
  cx.beginPath(); cx.moveTo(-22,-10); cx.bezierCurveTo(-42,-15+Math.sin(t)*8,-50,-4,-46,10); cx.stroke();
  cx.beginPath(); cx.moveTo(22,-10); cx.bezierCurveTo(42,-15+Math.sin(t+1)*8,48,-4,45,10); cx.stroke();
  // Claws
  cx.strokeStyle='#330000'; cx.lineWidth=4;
  cx.beginPath(); cx.moveTo(-46,10); cx.lineTo(-52,4); cx.stroke();
  cx.beginPath(); cx.moveTo(-46,10); cx.lineTo(-52,14); cx.stroke();
  cx.beginPath(); cx.moveTo(45,10); cx.lineTo(50,4); cx.stroke();
  cx.beginPath(); cx.moveTo(45,10); cx.lineTo(50,15); cx.stroke();
  glowDot(0,-36,4,'#ff4444',0.7);
  glowDot(-4,-36,3,'#ff8888',0.5);
  glowDot(4,-36,3,'#ff8888',0.5);
}

function drawHiveNode(t) {
  cx.shadowColor='#224422'; cx.shadowBlur=12;
  cx.fillStyle='#0a1a0a';
  cx.beginPath(); cx.arc(0,0,24,0,TAU); cx.fill();
  // Hex pattern
  cx.strokeStyle='#1a3a1a'; cx.lineWidth=1;
  for(let i=0;i<8;i++){
    const a=i/8*TAU;
    cx.beginPath(); cx.moveTo(0,0); cx.lineTo(Math.cos(a)*24,Math.sin(a)*24); cx.stroke();
  }
  // Pulsing tentacles
  cx.strokeStyle='#225522'; cx.lineWidth=3;
  for(let i=0;i<6;i++){
    const a=i/6*TAU+t*0.5;
    const len=30+Math.sin(t+i)*8;
    cx.beginPath();
    cx.moveTo(Math.cos(a)*20,Math.sin(a)*20);
    cx.bezierCurveTo(Math.cos(a+0.4)*len*0.6,Math.sin(a+0.4)*len*0.6,
      Math.cos(a+0.3)*len*0.9,Math.sin(a+0.3)*len*0.9,
      Math.cos(a+0.3)*len,Math.sin(a+0.3)*len);
    cx.stroke();
  }
  glowDot(0,0,10,'#00ff88',0.5);
  glowDot(0,0,4,'#ffffff',0.8);
}

function drawHivemind(t) {
  cx.shadowColor='#00ff88'; cx.shadowBlur=22;
  const p = 0.8+Math.sin(t)*0.2;
  // Outer shell
  cx.fillStyle='#051a0a';
  cx.beginPath(); cx.arc(0,0,48,0,TAU); cx.fill();
  // Rings
  [16,28,40].forEach(r => {
    cx.strokeStyle=`rgba(0,${100+r*3},${60+r*2},0.4)`; cx.lineWidth=2;
    cx.beginPath(); cx.arc(0,0,r,0,TAU); cx.stroke();
  });
  // Hex veins
  cx.strokeStyle='#113322'; cx.lineWidth=1;
  for(let i=0;i<12;i++){ const a=i/12*TAU; cx.beginPath(); cx.moveTo(0,0); cx.lineTo(Math.cos(a)*48,Math.sin(a)*48); cx.stroke(); }
  // Tentacle arms
  cx.strokeStyle='#005533'; cx.lineWidth=5;
  for(let i=0;i<10;i++){
    const a=i/10*TAU+t*0.2;
    const len=70+Math.sin(t+i)*12;
    cx.beginPath();
    cx.moveTo(Math.cos(a)*42,Math.sin(a)*42);
    cx.bezierCurveTo(Math.cos(a+0.4)*len*0.5+Math.sin(t+i)*6,Math.sin(a+0.4)*len*0.5,
      Math.cos(a+0.2)*len*0.8,Math.sin(a+0.2)*len*0.8,
      Math.cos(a+0.3+Math.sin(t)*0.1)*len,Math.sin(a+0.3+Math.sin(t)*0.1)*len);
    cx.stroke();
  }
  glowDot(0,0,22*p,'#00ff88',0.35);
  glowDot(0,0,10*p,'#00ffaa',0.6);
  glowDot(0,0,4,'#ffffff',0.9);
}

function drawBroodqueen(t) {
  cx.shadowColor='#ff00aa'; cx.shadowBlur=20;
  // Crown crest
  cx.fillStyle='#0a0018';
  cx.beginPath();
  cx.moveTo(0,-68); cx.bezierCurveTo(12,-84,36,-74,30,-50);
  cx.bezierCurveTo(18,-38,6,-36,0,-34);
  cx.bezierCurveTo(-6,-36,-18,-38,-30,-50); cx.bezierCurveTo(-36,-74,-12,-84,0,-68);
  cx.fill();
  // Body
  cx.fillStyle='#0d0018';
  cx.beginPath(); cx.ellipse(0,5,36,46,0,0,TAU); cx.fill();
  // Rib cage
  cx.strokeStyle='#330044'; cx.lineWidth=2;
  [-28,-14,0,14,28].forEach(y => {
    cx.beginPath(); cx.moveTo(-34,y); cx.bezierCurveTo(-40,y-4,-40,y+4,-34,y+8); cx.stroke();
    cx.beginPath(); cx.moveTo(34,y);  cx.bezierCurveTo(40,y-4,40,y+4,34,y+8); cx.stroke();
  });
  // Upper arms (huge)
  cx.strokeStyle='#110022'; cx.lineWidth=9;
  cx.beginPath(); cx.moveTo(-26,-12); cx.bezierCurveTo(-50,-22+Math.sin(t)*10,-66,-8,-62,8); cx.stroke();
  cx.beginPath(); cx.moveTo(26,-12);  cx.bezierCurveTo(50,-22+Math.sin(t+1)*10,64,-8,60,8);  cx.stroke();
  // Lower inner arms
  cx.lineWidth=5;
  cx.beginPath(); cx.moveTo(-18,4); cx.bezierCurveTo(-36,14+Math.sin(t*1.5)*6,-42,26,-35,34); cx.stroke();
  cx.beginPath(); cx.moveTo(18,4);  cx.bezierCurveTo(36,14+Math.sin(t*1.5+1)*6,40,26,33,35);  cx.stroke();
  // Tail
  cx.lineWidth=7;
  cx.beginPath(); cx.moveTo(0,42); cx.bezierCurveTo(-28,58+Math.sin(t)*10,-14,76,10,80);
  cx.bezierCurveTo(24,84,18,90,8,94); cx.stroke();
  cx.fillStyle='#440022';
  cx.beginPath(); cx.moveTo(4,90); cx.lineTo(14,100); cx.lineTo(0,98); cx.closePath(); cx.fill();
  // Eyes (4 pair)
  [[-12,-54],[12,-54],[-7,-46],[7,-46]].forEach(([ex,ey]) => glowDot(ex,ey,4.5,'#ff00aa',0.85));
}

function drawXenoking(t) {
  cx.shadowColor='#ff2200'; cx.shadowBlur=26;
  // Crown
  cx.fillStyle='#0d0000';
  cx.beginPath();
  cx.moveTo(0,-84); cx.bezierCurveTo(18,-100,56,-90,50,-62);
  cx.bezierCurveTo(36,-42,10,-38,0,-34);
  cx.bezierCurveTo(-10,-38,-36,-42,-50,-62); cx.bezierCurveTo(-56,-90,-18,-100,0,-84);
  cx.fill();
  // Bony protrusions on crown
  cx.fillStyle='#2a0000';
  [[0,-92],[15,-98],[28,-90],[-15,-98],[-28,-90]].forEach(([bx,by]) => {
    cx.beginPath(); cx.ellipse(bx,by,4,8,-0.3,0,TAU); cx.fill();
  });
  // Body (massive)
  cx.fillStyle='#0d0000';
  cx.beginPath(); cx.ellipse(0,10,42,56,0,0,TAU); cx.fill();
  // Armor segments
  cx.fillStyle='#1a0000';
  [-24,-12,0,12,24,36].forEach(y => {
    cx.beginPath(); cx.ellipse(0,y,36-Math.abs(y)*0.2,7,0,0,TAU); cx.fill();
  });
  cx.strokeStyle='#440000'; cx.lineWidth=1.5;
  [-24,-12,0,12,24,36].forEach(y => { cx.beginPath(); cx.ellipse(0,y,36-Math.abs(y)*0.2,7,0,0,TAU); cx.stroke(); });
  // Quad arms
  [[-1,1],[-1,1]].forEach((_,i) => {});
  const arms = [
    {sx:-30,sy:-20,cx1:-60,cy1:-30,cx2:-80,cy2:-10,ex:-76,ey:10, w:10},
    {sx: 30,sy:-20,cx1: 60,cy1:-30,cx2: 78,cy2:-10,ex: 74,ey:10, w:10},
    {sx:-26,sy: 10,cx1:-52,cy1: 20,cx2:-64,cy2: 40,ex:-58,ey:54, w:6},
    {sx: 26,sy: 10,cx1: 52,cy1: 20,cx2: 62,cy2: 40,ex: 56,ey:54, w:6},
  ];
  arms.forEach((a,i) => {
    cx.strokeStyle='#110000'; cx.lineWidth=a.w;
    cx.beginPath(); cx.moveTo(a.sx,a.sy+Math.sin(t+i)*4);
    cx.bezierCurveTo(a.cx1,a.cy1+Math.sin(t+i)*4,a.cx2,a.cy2,a.ex,a.ey); cx.stroke();
  });
  // Claw tips
  [[-76,10],[-58,54],[74,10],[56,54]].forEach(([cx2,cy]) => {
    cx.strokeStyle='#330000'; cx.lineWidth=3;
    for(let s of [-1,0,1]){
      cx.beginPath(); cx.moveTo(cx2,cy); cx.lineTo(cx2+(cx2<0?-10:10),cy+s*8); cx.stroke();
    }
  });
  // Tail
  cx.strokeStyle='#1a0000'; cx.lineWidth=9;
  cx.beginPath(); cx.moveTo(0,60); cx.bezierCurveTo(-36,76+Math.sin(t)*12,-26,96,12,106);
  cx.bezierCurveTo(28,110,24,120,10,124); cx.stroke();
  cx.fillStyle='#550000';
  cx.beginPath(); cx.moveTo(6,120); cx.lineTo(18,132); cx.lineTo(2,130); cx.closePath(); cx.fill();
  // Six eyes
  [[-14,-70],[14,-70],[-9,-62],[9,-62],[-5,-54],[5,-54]].forEach(([ex,ey]) => glowDot(ex,ey,5,'#ff2200',0.88));
}

function glowDot(x,y,r,col,a) {
  cx.save(); cx.globalAlpha=a; cx.shadowColor=col; cx.shadowBlur=r*2.5;
  cx.fillStyle=col; cx.beginPath(); cx.arc(x,y,r,0,TAU); cx.fill(); cx.restore();
}

// ═══════════════════════════════════════════════════════════════
//  DRAWING — BULLETS
// ═══════════════════════════════════════════════════════════════
function drawBullet(b) {
  if(!IS_DESKTOP && cx.shadowBlur!==0) cx.shadowBlur=0;
  cx.save(); cx.translate(b.x,b.y); cx.rotate(b.ang||0);
  const t=G.frame*0.2;
  switch(b.wtype) {

    case 'laser': {
      // Animated colorful energy laser — hue shifts with level
      const lHues = ['#00ffff','#ff00ff','#ffff00','#00ff88','#ff4488','#8866ff'];
      const laserCol = lHues[G.level % lHues.length];
      const laserRgb = laserCol==='#00ffff'?'0,255,255':laserCol==='#ff00ff'?'255,0,255':laserCol==='#ffff00'?'255,255,0':laserCol==='#00ff88'?'0,255,136':laserCol==='#ff4488'?'255,68,136':'136,102,255';
      const pulse=0.8+Math.sin(t+b.y*0.05)*0.2;
      const bw=b.w*(0.9+Math.sin(t*3)*0.1);
      // Outer aura
      cx.shadowColor=laserCol; cx.shadowBlur=20*pulse;
      cx.fillStyle=`rgba(${laserRgb},0.22)`; cx.fillRect(-2,-b.h*2,bw+4,b.h*4);
      // Mid glow
      cx.shadowBlur=10; cx.fillStyle=`rgba(${laserRgb},${0.7*pulse})`;
      cx.fillRect(0,-b.h,bw,b.h*2);
      // Bright core
      cx.shadowBlur=4; cx.fillStyle='#ffffff';
      cx.fillRect(0,-1.2,bw*0.75,2.4);
      // Energy fringe (sparkling)
      cx.strokeStyle=`rgba(${laserRgb},${0.55*pulse})`; cx.lineWidth=0.9;
      for(let i=0;i<bw;i+=6){
        const jit=rnd(-2,2);
        cx.beginPath(); cx.moveTo(i,b.h*1.4); cx.lineTo(i+3,jit); cx.lineTo(i+6,-b.h*1.4); cx.stroke();
      }
      // Dense spark trail
      if(Math.random()<0.55) addLaserSparks(b.x+bw,b.y,laserCol);
      if(Math.random()<0.3) addLaserSparks(b.x+bw*0.5,b.y+rnd(-4,4),laserCol);
      break;
    }

    case 'trishot': {
      const sz=b.w/2; const p2=0.7+Math.sin(t*2)*0.3;
      cx.shadowColor='#ffff00'; cx.shadowBlur=10;
      // Outer ring
      cx.strokeStyle=`rgba(255,220,0,${0.4*p2})`; cx.lineWidth=2;
      cx.beginPath(); cx.arc(0,0,sz+3,0,TAU); cx.stroke();
      // Core orb
      const grad=cx.createRadialGradient(0,0,0,0,0,sz);
      grad.addColorStop(0,'#ffffff'); grad.addColorStop(0.4,'#ffff00'); grad.addColorStop(1,'rgba(255,200,0,0)');
      cx.fillStyle=grad; cx.beginPath(); cx.arc(0,0,sz,0,TAU); cx.fill();
      break;
    }

    case 'plasma': {
      const pr=b.w/2; const pp=0.6+Math.sin(t*1.5)*0.4;
      // Wobbly outer shell
      cx.shadowColor='#ff00ff'; cx.shadowBlur=24*pp;
      cx.fillStyle=`rgba(180,0,255,${0.3*pp})`;
      cx.beginPath();
      for(let i=0;i<12;i++){const a=i/12*TAU,rr=pr*(1+Math.sin(t*3+a*2)*0.18);cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
      cx.closePath(); cx.fill();
      // Inner hot core
      const pg=cx.createRadialGradient(0,0,0,0,0,pr*0.8);
      pg.addColorStop(0,'#ffffff'); pg.addColorStop(0.5,'#ff00ff'); pg.addColorStop(1,'rgba(100,0,200,0)');
      cx.fillStyle=pg; cx.beginPath(); cx.arc(0,0,pr*0.8,0,TAU); cx.fill();
      break;
    }

    case 'missile': {
      // Animated exhaust
      const mex=rnd(-4,4);
      cx.fillStyle=`rgba(255,${100+Math.random()*100},0,0.6)`;
      cx.beginPath(); cx.ellipse(-b.w/2+mex,-1,8,3,0,0,TAU); cx.fill();
      // Missile body
      cx.shadowColor='#ff4400'; cx.shadowBlur=8; cx.fillStyle='#cc4400';
      cx.beginPath(); cx.moveTo(b.w/2,0); cx.lineTo(-b.w/2,-b.h/2); cx.lineTo(-b.w/2,b.h/2); cx.closePath(); cx.fill();
      cx.fillStyle='#ff8800'; cx.beginPath(); cx.moveTo(b.w/2-2,0); cx.lineTo(b.w/2-8,-2); cx.lineTo(b.w/2-8,2); cx.closePath(); cx.fill();
      cx.fillStyle='#ffcc44'; cx.fillRect(b.w*0.1,-1,b.w*0.4,2);
      break;
    }

    case 'lightning': {
      // Multi-strand lightning
      cx.shadowColor='#ffffff'; cx.shadowBlur=16; cx.lineWidth=2.5;
      ['#ffffff','#aaaaff','#8888ff'].forEach((col,ci)=>{
        cx.strokeStyle=col; cx.globalAlpha=1-ci*0.25; cx.lineWidth=2.5-ci;
        cx.beginPath(); cx.moveTo(0,0); let lx2=0;
        while(lx2<b.w){lx2+=5; cx.lineTo(lx2,rnd(-5+ci,5-ci));} cx.stroke();
      });
      cx.globalAlpha=1;
      // Arc branches
      cx.strokeStyle='rgba(180,180,255,0.4)'; cx.lineWidth=1;
      for(let i=0;i<3;i++){
        const bx2=rnd(b.w*0.2,b.w*0.7), by2=rnd(-3,3);
        cx.beginPath(); cx.moveTo(bx2,by2); cx.lineTo(bx2+rnd(-10,10),by2+rnd(-12,12)); cx.stroke();
      }
      break;
    }

    case 'flame': {
      const fhue=20+Math.random()*25, fsize=b.w/2*(0.7+Math.random()*0.6);
      cx.shadowColor='#ff6600'; cx.shadowBlur=14; cx.globalAlpha=0.4+Math.random()*0.4;
      const fg=cx.createRadialGradient(0,0,0,0,0,fsize);
      fg.addColorStop(0,'#ffffff'); fg.addColorStop(0.3,`hsl(${fhue},100%,60%)`); fg.addColorStop(1,'rgba(200,50,0,0)');
      cx.fillStyle=fg; cx.beginPath(); cx.arc(0,0,fsize,0,TAU); cx.fill();
      break;
    }

    case 'spread5': {
      const sp=b.w/2*(0.8+Math.sin(t*4)*0.2);
      cx.shadowColor='#ffaa00'; cx.shadowBlur=10;
      // Star-shaped bolt
      cx.fillStyle='#ffdd00';
      cx.beginPath();
      for(let i=0;i<8;i++){const a=i/8*TAU,rr=i%2?sp:sp*0.5;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
      cx.closePath(); cx.fill();
      cx.fillStyle='#ffffff'; cx.beginPath(); cx.arc(0,0,sp*0.3,0,TAU); cx.fill();
      break;
    }

    case 'railgun': {
      // Hyper-velocity rod with motion lines
      cx.shadowColor='#44ffaa'; cx.shadowBlur=22;
      // Motion blur lines
      for(let i=0;i<4;i++){
        cx.strokeStyle=`rgba(68,255,170,${0.15-i*0.03})`; cx.lineWidth=10-i*2;
        cx.beginPath(); cx.moveTo(-i*6,0); cx.lineTo(b.w,0); cx.stroke();
      }
      // Core beam
      cx.strokeStyle='#44ffaa'; cx.lineWidth=4;
      cx.beginPath(); cx.moveTo(0,0); cx.lineTo(b.w,0); cx.stroke();
      cx.strokeStyle='#ffffff'; cx.lineWidth=1.5;
      cx.beginPath(); cx.moveTo(0,0); cx.lineTo(b.w,0); cx.stroke();
      // Tip flare
      cx.fillStyle='#ffffff'; cx.shadowColor='#ffffff'; cx.shadowBlur=8;
      cx.beginPath(); cx.arc(b.w,0,3,0,TAU); cx.fill();
      break;
    }

    case 'trilaser': {
      // 3-colored laser beam — vivid sparkling
      const colors = ['#00ffaa','#00ddff','#88ffcc'];
      const cIdx = Math.abs(Math.round(b.y/10)) % 3;
      const col = colors[cIdx];
      const pulse2=0.8+Math.sin(t+b.y*0.08)*0.2;
      cx.shadowColor=col; cx.shadowBlur=18*pulse2;
      // Outer glow
      cx.fillStyle=`rgba(0,220,180,0.2)`; cx.fillRect(-2,-b.h*2.2,b.w+4,b.h*4.4);
      // Mid
      cx.shadowBlur=10; cx.fillStyle=`rgba(0,255,170,${0.72*pulse2})`;
      cx.fillRect(0,-b.h*1.2,b.w,b.h*2.4);
      // Core
      cx.fillStyle='#ffffff'; cx.fillRect(0,-1.2,b.w*0.8,2.4);
      // Sparkles
      cx.strokeStyle=`rgba(180,255,240,${0.5*pulse2})`; cx.lineWidth=0.7;
      for(let i=0;i<b.w;i+=6){
        const jit=rnd(-1.5,1.5);
        cx.beginPath(); cx.moveTo(i,b.h*1.4); cx.lineTo(i+3,jit); cx.lineTo(i+6,-b.h*1.4); cx.stroke();
      }
      if(Math.random()<0.5) addLaserSparks(b.x+b.w,b.y,col);
      break;
    }
    case 'ionic': {
      // High-voltage arc: blue-white branching
      const ip=0.85+Math.sin(t*2.5+b.y*0.04)*0.15;
      cx.shadowColor='#aaddff'; cx.shadowBlur=20*ip;
      ['#ffffff','#aaddff','#6699ff'].forEach((c2,ci)=>{
        cx.strokeStyle=c2; cx.globalAlpha=1-ci*0.28; cx.lineWidth=3-ci*0.8;
        cx.beginPath(); cx.moveTo(0,0); let lxi=0;
        while(lxi<b.w){lxi+=4; cx.lineTo(lxi,rnd(-4+ci,4-ci));} cx.stroke();
      });
      cx.globalAlpha=1;
      // Branch arcs
      for(let i=0;i<4;i++){
        const bx2=rnd(b.w*0.2,b.w*0.8),by2=rnd(-3,3);
        cx.strokeStyle='rgba(170,220,255,0.5)'; cx.lineWidth=1; cx.globalAlpha=0.6;
        cx.beginPath(); cx.moveTo(bx2,by2); cx.lineTo(bx2+rnd(-12,12),by2+rnd(-14,14)); cx.stroke();
        cx.globalAlpha=1;
      }
      break;
    }
    case 'mine': {
      // Floating proximity mine
      const armed=(b.armed||0)>0;
      cx.shadowColor=armed?'#444400':'#ffaa00'; cx.shadowBlur=10;
      cx.strokeStyle=armed?'#888800':'#ffaa00'; cx.lineWidth=2;
      cx.beginPath(); cx.arc(0,0,7,0,TAU); cx.stroke();
      if(!armed){ cx.fillStyle='rgba(255,170,0,0.4)'; cx.beginPath(); cx.arc(0,0,7,0,TAU); cx.fill(); }
      // Spikes
      const nc=armed?4:8;
      for(let si=0;si<nc;si++){
        const sa=si/nc*TAU+b.ang;
        cx.strokeStyle=armed?'#556600':'#ffcc44'; cx.lineWidth=1;
        cx.beginPath(); cx.moveTo(Math.cos(sa)*7,Math.sin(sa)*7); cx.lineTo(Math.cos(sa)*12,Math.sin(sa)*12); cx.stroke();
      }
      b.ang=(b.ang||0)+0.04;
      break;
    }
    case 'cryo': {
      const cp=0.85+Math.sin(t*3)*0.15;
      cx.shadowColor='#aaddff'; cx.shadowBlur=10;
      cx.fillStyle=`rgba(170,220,255,${0.85*cp})`; cx.fillRect(0,-b.h*0.8,b.w,b.h*1.6);
      cx.fillStyle='rgba(220,240,255,0.9)'; cx.fillRect(0,-b.h*0.4,b.w*0.7,b.h*0.8);
      // Snowflake tip
      cx.strokeStyle='rgba(200,235,255,0.6)'; cx.lineWidth=1;
      for(let ci=0;ci<6;ci++){ const ca=ci/6*TAU; cx.beginPath(); cx.moveTo(0,0); cx.lineTo(Math.cos(ca)*5,Math.sin(ca)*5); cx.stroke(); }
      break;
    }
    case 'napalm': {
      const flicker=0.7+Math.sin(t*8)*0.3;
      const ng=cx.createRadialGradient(0,0,0,0,0,9);
      ng.addColorStop(0,'rgba(255,220,50,0.95)'); ng.addColorStop(0.5,'rgba(255,100,0,0.8)'); ng.addColorStop(1,'rgba(200,40,0,0)');
      cx.fillStyle=ng; cx.globalAlpha=flicker;
      cx.beginPath(); cx.arc(0,0,9,0,TAU); cx.fill(); cx.globalAlpha=1;
      break;
    }
    case 'gravity': {
      const gr=14+Math.sin(t*2)*3;
      const gg=cx.createRadialGradient(0,0,0,0,0,gr);
      gg.addColorStop(0,'rgba(150,100,255,0.9)'); gg.addColorStop(0.5,'rgba(100,60,200,0.5)'); gg.addColorStop(1,'rgba(80,40,180,0)');
      cx.fillStyle=gg; cx.beginPath(); cx.arc(0,0,gr,0,TAU); cx.fill();
      cx.strokeStyle='rgba(136,102,255,0.6)'; cx.lineWidth=1.5;
      for(let gi=0;gi<3;gi++){ const ga=t*2+gi*TAU/3; cx.beginPath(); cx.arc(Math.cos(ga)*8,Math.sin(ga)*8,3,0,TAU); cx.stroke(); }
      break;
    }
    case 'antimatter': {
      const ap=0.8+Math.sin(t*5)*0.2;
      const ag2=cx.createRadialGradient(0,0,0,0,0,11);
      ag2.addColorStop(0,'rgba(255,255,255,1)'); ag2.addColorStop(0.4,'rgba(255,136,255,0.9)'); ag2.addColorStop(1,'rgba(200,0,200,0)');
      cx.fillStyle=ag2; cx.globalAlpha=ap;
      cx.beginPath(); cx.arc(0,0,11,0,TAU); cx.fill(); cx.globalAlpha=1;
      cx.shadowColor='#ff88ff'; cx.shadowBlur=14;
      cx.strokeStyle='rgba(255,200,255,0.5)'; cx.lineWidth=1;
      cx.beginPath(); cx.arc(0,0,13+Math.sin(t*3)*2,0,TAU); cx.stroke();
      break;
    }
    case 'quantum': {
      const qp=0.6+Math.sin(t*6)*0.4;
      cx.shadowColor='#88ffff'; cx.shadowBlur=10;
      cx.fillStyle=`rgba(136,255,255,${qp})`; cx.fillRect(0,-b.h*0.6,b.w,b.h*1.2);
      cx.fillStyle=`rgba(200,255,255,${qp*0.9})`; cx.fillRect(0,-2,b.w*0.8,4);
      // Quantum shimmer
      if(Math.random()<0.5){ cx.fillStyle='rgba(255,255,255,0.7)'; cx.fillRect(rnd(0,b.w),-1,4,2); }
      break;
    }
    case 'vector3': {
      // Magenta divergent bolt — tapers with energy trail
      const v3p=0.8+Math.sin(t*3+b.y*0.05)*0.2;
      cx.shadowColor='#ff44ff'; cx.shadowBlur=12;
      cx.fillStyle=`rgba(255,68,255,${0.9*v3p})`; cx.fillRect(0,-b.h,b.w,b.h*2);
      cx.fillStyle='#ffffff'; cx.fillRect(0,-1.5,b.w*0.6,3);
      if(Math.random()<0.4) addLaserSparks(b.x+b.w,b.y,'#ff88ff');
      break;
    }
    case 'proton': {
      // Fat energy bolt — glowing cylinder, white core
      const pp=0.85+Math.sin(t*2)*0.15;
      cx.shadowColor='#aaffff'; cx.shadowBlur=14;
      // Outer corona
      cx.fillStyle=`rgba(100,255,255,0.2)`; cx.fillRect(-2,-b.h*1.8,b.w+4,b.h*3.6);
      // Mid
      cx.fillStyle=`rgba(170,255,255,${0.8*pp})`; cx.fillRect(0,-b.h,b.w,b.h*2);
      // Core
      cx.fillStyle='#ffffff'; cx.fillRect(0,-2,b.w*0.9,4);
      // Charge rings (perpendicular)
      cx.strokeStyle=`rgba(0,255,255,0.6)`; cx.lineWidth=1.5;
      for(let pi=0;pi<b.w;pi+=10){
        cx.beginPath(); cx.ellipse(pi,0,2,b.h*1.4,0,0,TAU); cx.stroke();
      }
      if(G.frame%2===0) addLaserSparks(b.x+b.w,b.y,'#aaffff');
      break;
    }
    case 'homing_rocket': {
      // Rocket with exhaust trail and nose
      cx.shadowColor='#ff6622'; cx.shadowBlur=10;
      cx.fillStyle='#ff6622'; cx.fillRect(0,-b.h*0.8,b.w*0.75,b.h*1.6);
      cx.fillStyle='#ffaa44'; cx.fillRect(0,-b.h*0.5,b.w*0.9,b.h);
      // Nose cone
      cx.beginPath(); cx.moveTo(b.w,0); cx.lineTo(b.w*0.7,-b.h*0.8); cx.lineTo(b.w*0.7,b.h*0.8); cx.closePath(); cx.fill();
      // Fins
      cx.fillStyle='#cc3300'; cx.fillRect(-b.w*0.2,-b.h*1.5,b.w*0.25,b.h*0.8);
      cx.fillRect(-b.w*0.2,b.h*0.7,b.w*0.25,b.h*0.8);
      // Exhaust
      const exr=b.w*0.3+Math.random()*b.w*0.2;
      const exg=cx.createRadialGradient(-exr*0.5,0,0,-exr,0,exr);
      exg.addColorStop(0,'rgba(255,200,50,0.9)'); exg.addColorStop(1,'rgba(255,80,0,0)');
      cx.fillStyle=exg; cx.beginPath(); cx.ellipse(-exr*0.5,0,exr,b.h*0.6,0,0,TAU); cx.fill();
      break;
    }
    case 'acid': {
      const ag=cx.createRadialGradient(0,0,0,0,0,5);
      ag.addColorStop(0,'#eeffcc'); ag.addColorStop(0.5,'#88ff00'); ag.addColorStop(1,'rgba(40,180,0,0)');
      cx.shadowColor='#66ff00'; cx.shadowBlur=8; cx.fillStyle=ag;
      cx.beginPath(); cx.arc(0,0,5+Math.sin(t*3)*1,0,TAU); cx.fill(); break;
    }
    case 'acid_big': {
      const abg=cx.createRadialGradient(0,0,0,0,0,9);
      abg.addColorStop(0,'#ffffff'); abg.addColorStop(0.4,'#aaff00'); abg.addColorStop(1,'rgba(30,160,0,0)');
      cx.shadowColor='#44ff00'; cx.shadowBlur=14; cx.fillStyle=abg;
      cx.beginPath(); cx.arc(0,0,9+Math.sin(t*2)*1.5,0,TAU); cx.fill(); break;
    }
  }
  cx.restore();
}

  weapon:  {icon:'⚡', color:'#ffdd00', label:'ARMA'},

  bomb:    {icon:'💣', color:'#ff8800', label:'BOMBA'},

  magnet:  {icon:'🧲', color:'#66ffee', label:'IMÁN'},
  shieldx: {icon:'🛡', color:'#88bbff', label:'SHIELD+'},
  companion:{icon:'🛸',color:'#ffdd00', label:'ESCOLTA'},
  gold:    {icon:'🪙', color:'#ffd54a', label:'ORO'},

function drawPickup(p) {
  const def = PICKUP_DEFS[p.type] || PICKUP_DEFS.hp;
  p.t = (p.t||0)+1;
  const pulse = 0.75+Math.sin(p.t*0.1)*0.25;
  cx.save(); cx.translate(p.x,p.y);

  if(p.type === 'part') {
    // Special ship-part pickup: hexagonal rotating frame
    const pDef = SHIP_PARTS_DEFS[p.weapKey];
    cx.rotate(p.t*0.025);
    // Outer hex
    cx.beginPath();
    for(let i=0;i<6;i++){const a=i/6*TAU;cx.lineTo(Math.cos(a)*22,Math.sin(a)*22);}
    cx.closePath(); cx.strokeStyle='#ff9900'; cx.lineWidth=2; cx.globalAlpha=pulse*0.8;
    cx.shadowColor='#ff9900'; cx.shadowBlur=16; cx.stroke();
    cx.rotate(-p.t*0.05);
    // Inner hex
    cx.beginPath();
    for(let i=0;i<6;i++){const a=i/6*TAU+0.3;cx.lineTo(Math.cos(a)*14,Math.sin(a)*14);}
    cx.closePath(); cx.fillStyle='rgba(255,153,0,0.18)'; cx.fill(); cx.stroke();
    cx.rotate(p.t*0.07);
    cx.globalAlpha = pulse;
    cx.font='18px sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(pDef?pDef.icon:'⚙',0,0);
    cx.font='bold 8px Courier New'; cx.fillStyle='#ff9900'; cx.shadowBlur=8;
    cx.textBaseline='alphabetic'; cx.fillText(pDef?pDef.name.split(' ')[0]:'PIEZA',0,30);
  } else {
    // Rotating ring (standard)
    cx.rotate(p.t*0.03);
    cx.strokeStyle=def.color; cx.lineWidth=2; cx.globalAlpha=pulse*0.7;
    cx.shadowColor=def.color; cx.shadowBlur=12;
    cx.beginPath(); cx.arc(0,0,18,0,TAU); cx.stroke();
    cx.rotate(-p.t*0.06);
    cx.beginPath(); cx.arc(0,0,13,0,TAU*0.5); cx.stroke();
    cx.rotate(p.t*0.09);
    // Icon
    cx.globalAlpha = pulse;
    cx.font='16px sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(def.icon,0,0);
    // Label
    cx.font='bold 8px Courier New'; cx.fillStyle=def.color; cx.shadowBlur=6;
    cx.textBaseline='alphabetic'; cx.fillText(def.label,0,24);
  }
  cx.restore();
}

function spawnEx(x,y,col,n=16,sz=3,spd=4) {
  const MAX_PART = IS_DESKTOP ? 80 : 40;
  if(G.particles.length >= MAX_PART) return; // hard cap
  const actual = Math.min(n, MAX_PART - G.particles.length);
  for(let i=0;i<Math.max(1,Math.floor(actual*PERF.particleMult));i++){
    const a=rnd(0,TAU), s=rnd(0.5,spd);
    G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(sz*0.4,sz),life:1,decay:rnd(0.02,0.055),col});
  }
}
function spawnTrail(x,y,col) {
  G.particles.push({x:x+rnd(-3,3),y:y+rnd(-2,2),vx:rnd(-0.5,-1.5),vy:rnd(-0.3,0.3),r:rnd(1,3),life:1,decay:0.1,col});
}
function updateParticles() {
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.93; p.vy*=0.93; p.life-=p.decay;
    if(p.life<=0) G.particles.splice(i,1);
  }
}
function drawParticles() {
  G.particles.forEach(p => {
    cx.save(); cx.globalAlpha=p.life*0.88;
    cx.fillStyle=p.col; cx.shadowColor=p.col; cx.shadowBlur=p.r*3;
    cx.beginPath(); cx.arc(p.x,p.y,p.r*p.life,0,TAU); cx.fill(); cx.restore();
  });
}

function drawBG() {
  const lvl=G.level;
  const t=G.frame*0.003;
  // Base gradient - dark with colored tint per level
  const bgCols=[
    ['#000810','#001220','#000820'],['#060008','#080010','#050008'],['#0a0000','#120004','#080000'],
    ['#021028','#04143a','#000816'],['#180600','#260a00','#090000'],['#030008','#0b0014','#000000'],
    ['#001010','#001f1f','#000808'],['#021122','#08263c','#02070f'],['#181000','#241800','#090600'],['#000b12','#001922','#00050a']
  ];
  const [c1,c2,c3]=bgCols[(lvl-1)%bgCols.length]||bgCols[0];
  cx.fillStyle=c1; cx.fillRect(0,0,W,H);

  // Deep space nebula (level-specific color)
  const nebCols=['rgba(0,80,160,','rgba(80,0,120,','rgba(120,0,0,','rgba(70,120,255,','rgba(255,90,0,','rgba(120,60,180,','rgba(0,180,120,','rgba(180,220,255,','rgba(255,210,80,','rgba(0,150,180,'];
  const nebCol=nebCols[(lvl-1)%nebCols.length]||nebCols[0];
  for(let i=0;i<2;i++){
    const nx=W*(0.3+i*0.4)+Math.sin(t+i)*60, ny=H*(0.4+i*0.2)+Math.cos(t*0.7+i)*40;
    const ng=cx.createRadialGradient(nx,ny,10,nx,ny,H*0.55);
    ng.addColorStop(0,nebCol+'0.08)'); ng.addColorStop(1,'transparent');
    cx.fillStyle=ng; cx.fillRect(0,0,W,H);
  }

  // Parallax debris layers
  drawParallaxLayer(G.px||W/2, G.py||H/2);

  // Stars (twinkling, with colored tints)
  const starTints=['#aaddff','#ffddaa','#ddffdd'];
  G.stars.forEach(s => {
    s.x -= s.spd*0.35;
    if(s.x<0){s.x=W; s.y=rnd(0,H);}
    const tw=0.4+Math.sin(Date.now()*0.0008+s.tw)*0.55;
    if(s.r>1.2) {
      // Bright star with cross sparkle
      cx.save(); cx.translate(s.x,s.y);
      cx.fillStyle=starTints[Math.floor(s.tw)%3]; cx.globalAlpha=s.bright*tw;
      cx.fillRect(-s.r,-0.5,s.r*2,1); cx.fillRect(-0.5,-s.r,1,s.r*2);
      cx.beginPath(); cx.arc(0,0,s.r*0.7,0,TAU); cx.fill(); cx.restore();
    } else {
      cx.fillStyle=`rgba(200,220,255,${s.bright*tw})`;
      cx.beginPath(); cx.arc(s.x,s.y,s.r,0,TAU); cx.fill();
    }
  });

  // Phosphor haze
  drawPhosphorHaze();

  // Horizon grid (retro bottom)
  if(lvl===1 || lvl===4 || lvl===8) {
    cx.save(); cx.globalAlpha=0.04;
    cx.strokeStyle='#00ccff'; cx.lineWidth=1;
    const gh=H*0.82, glines=8;
    for(let i=0;i<glines;i++){
      const gy=gh+i*(H-gh)/glines;
      cx.beginPath(); cx.moveTo(0,gy); cx.lineTo(W,gy); cx.stroke();
    }
    const gcols=12, vscroll=(G.scroll*0.5)%((W/gcols));
    for(let i=-1;i<=gcols+1;i++){
      const gx=(i*(W/gcols))-vscroll;
      const persp=1-0.4*(gx/W);
      cx.beginPath(); cx.moveTo(W/2,gh); cx.lineTo(gx,H); cx.stroke();
    }
    cx.restore();
  } else if(lvl===2 || lvl===5 || lvl===7) {
    // Hive hexagons in background
    cx.save(); cx.globalAlpha=0.04; cx.strokeStyle='#225522'; cx.lineWidth=1;
    const hxs=60; const off=(G.scroll*0.2)%hxs;
    for(let hx=-hxs;hx<W+hxs;hx+=hxs*1.5){
      for(let hy=0;hy<H+hxs;hy+=hxs*0.87){
        const ox=(hy/hxs)%2<1?off:off+hxs*0.75;
        cx.beginPath();
        for(let i=0;i<6;i++){const a=i/6*TAU;cx.lineTo(hx+ox+Math.cos(a)*28,hy+Math.sin(a)*28);}
        cx.closePath(); cx.stroke();
      }
    }
    cx.restore();
  } else {
    // Sanctum: red energy rings
    cx.save(); cx.globalAlpha=0.05;
    const rings=5;
    for(let i=0;i<rings;i++){
      const rs=100+i*80+(G.scroll*0.15)%(80);
      const rc=cx.createRadialGradient(W*0.75,H/2,rs-5,W*0.75,H/2,rs+5);
      rc.addColorStop(0,'rgba(200,0,0,0)'); rc.addColorStop(0.5,'rgba(200,0,0,0.8)'); rc.addColorStop(1,'rgba(200,0,0,0)');
      cx.strokeStyle='#ff0000'; cx.lineWidth=3;
      cx.beginPath(); cx.arc(W*0.75,H/2,rs,0,TAU); cx.stroke();
    }
    cx.restore();
  }
}

function activatePickupBomb(x, y) {
  // Bomba flotante: se activa al recogerla; no ocupa ranura inferior.
  const bossHit = G.boss && !G.boss.dead;
  G.eBullets = [];
  if (bossHit) {
    const dmg = Math.max(180, G.boss.maxhp * 0.22);
    G.boss.hp -= dmg;
    G.boss.flashTimer = 18;
    spawnDmgNum(G.boss.x, G.boss.y - G.boss.sz, 'BOMBA', '#ffdd00', true);
    spawnEx(G.boss.x, G.boss.y, '#ff8800', 60, 10, 14);
    spawnEx(G.boss.x, G.boss.y, '#ffffff', 24, 6, 10);
    if (G.boss.hp <= 0 && typeof killBoss === 'function') killBoss();
  } else {
    for (let i=G.enemies.length-1;i>=0;i--) {
      const e = G.enemies[i];
      if (dist2(x,y,e.x,e.y) < Math.max(W,H)*Math.max(W,H)*0.45) {
        e.hp -= 240;
        e.flashTimer = 10;
        spawnEx(e.x,e.y,'#ff8800',16,5,8);
        if (e.hp <= 0) {
          e.dead = true;
        }
      }
    }
  }
  shake(0.85);

}

  const dmgBoost = getDamageBoost();
  const bx = G.px + 28, by = G.py;
  const hasComp = G.companions > 0;

  const push = (x, y, vx, vy, extra = {}) => {
    G.bullets.push({
      x, y, vx, vy,
      dmg: wd.dmg * dmgBoost,
      wtype: wd.type,
      w: 12,
      h: 4,
      ang: Math.atan2(vy, vx),
      ...extra,
    });
  };

  switch (G.weapon) {
    case 'laser':
      push(bx, by, wd.spd, 0, { w: 16, h: 3 });
      if (G.frame % 3 === 0) spawnTrail(bx - 4, by, '#00ffff');
      break;

    case 'trishot':
      [-0.28, 0, 0.28].forEach(a => push(bx, by, Math.cos(a) * wd.spd, Math.sin(a) * wd.spd, { w: 10, h: 5 }));
      break;

    case 'plasma':
      push(bx, by, wd.spd, 0, { dmg: wd.dmg * dmgBoost, wtype: 'plasma', w: 14, h: 14, aoe: 50 * (G.aoeBoost || 1) });
      break;

    case 'missile': {
      const tgt = findTarget();
      const targetAng = tgt ? ang(bx, by, tgt.x, tgt.y) : 0;
      push(bx, by - 8, Math.cos(targetAng) * wd.spd, Math.sin(targetAng) * wd.spd, { homing: true, homingStrength: 0.06, w: 13, h: 5, aoe: 38 * (G.aoeBoost || 1) });
      push(bx, by + 8, Math.cos(targetAng) * wd.spd, Math.sin(targetAng) * wd.spd, { homing: true, homingStrength: 0.06, w: 13, h: 5, aoe: 38 * (G.aoeBoost || 1) });
      break;
    }

    case 'lightning': {
      const tgt = findTarget();
      const la = tgt ? ang(bx, by, tgt.x, tgt.y) : 0;
      push(bx, by, Math.cos(la) * wd.spd, Math.sin(la) * wd.spd, { w: 20, h: 6, pierce: true });
      break;
    }

    case 'flamethr':
      push(bx + rnd(-5, 5), by + rnd(-8, 8), wd.spd + rnd(-1, 1), rnd(-1, 1), { dmg: wd.dmg * dmgBoost, wtype: 'flame', w: 12, h: 12 });
      break;

    case 'spread5':
      [-0.35, -0.18, 0, 0.18, 0.35].forEach(a => push(bx, by, Math.cos(a) * wd.spd, Math.sin(a) * wd.spd, { w: 9, h: 5 }));
      break;

    case 'railgun':
      push(bx, by, wd.spd, 0, { w: 28, h: 5, pierce: true });
      spawnEx(bx, by, '#44ffaa', 6, 2, 3);
      break;

    case 'trilaser':
      [-10, 0, 10].forEach(yo => {
        push(bx, by + yo, wd.spd, 0, { w: 18, h: 3, trilaser: true });
        if (G.frame % 3 === 0) spawnTrail(bx - 4, by + yo, '#00ffaa');
      });
      break;

    case 'ionic': {
      const itgt = findTarget();
      const ia = itgt ? ang(bx, by, itgt.x, itgt.y) : 0;
      push(bx, by, Math.cos(ia) * wd.spd, Math.sin(ia) * wd.spd, { w: 22, h: 7, ionic: true, pierce: true });
      push(bx, by, Math.cos(ia + 0.15) * wd.spd * 0.9, Math.sin(ia + 0.15) * wd.spd * 0.9, { w: 14, h: 4, ionic: true, dmg: wd.dmg * dmgBoost * 0.5 });
      push(bx, by, Math.cos(ia - 0.15) * wd.spd * 0.9, Math.sin(ia - 0.15) * wd.spd * 0.9, { w: 14, h: 4, ionic: true, dmg: wd.dmg * dmgBoost * 0.5 });
      break;
    }

    case 'atomic':
      break;

    case 'vector3':
      push(bx, by, wd.spd, 0, { w: 15, h: 4, wtype: 'vector3' });
      push(bx, by, Math.cos(-0.45) * wd.spd, Math.sin(-0.45) * wd.spd * 0.7, { w: 13, h: 4, wtype: 'vector3' });
      push(bx, by, Math.cos(0.45) * wd.spd, Math.sin(0.45) * wd.spd * 0.7, { w: 13, h: 4, wtype: 'vector3' });
      if (G.frame % 2 === 0) {
        spawnTrail(bx, by, '#ff44ff');
        spawnTrail(bx, by - 6, '#cc22cc');
        spawnTrail(bx, by + 6, '#cc22cc');
      }
      break;

    case 'emp':
      G.empWaves = G.empWaves || [];
      G.empWaves.push({ x: G.px, y: G.py, r: 20, maxR: Math.max(W, H) * 0.75, speed: 9, dmg: wd.dmg * dmgBoost, t: 0 });
      spawnEx(G.px, G.py, '#00ffdd', 20, 4, 6);
      shake(0.25);
      flash('#00ffdd', 8);
      break;

    case 'homing': {
      const ht = findTarget();
      const ha = ht ? ang(bx, by, ht.x, ht.y) : 0;
      for (let ri = 0; ri < 3; ri++) {
        const spread = (ri - 1) * 0.3;
        push(
          bx + rnd(-5, 5),
          by + rnd(-8, 8),
          Math.cos(ha + spread) * wd.spd * (0.7 + (G.upgrades.homing_sp || 0) * 0.04),
          Math.sin(ha + spread) * wd.spd * (0.7 + (G.upgrades.homing_sp || 0) * 0.04),
          { homing: true, homingStrength: 0.08 + (G.upgrades.homing_sp || 0) * 0.015, w: 12, h: 5, aoe: 38 * (G.aoeBoost || 1), wtype: 'homing_rocket' }
        );
      }
      break;
    }

    case 'proton':
      push(bx, by, wd.spd, 0, { w: 32, h: 10, pierce: true, wtype: 'proton' });
      spawnEx(bx, by, '#aaffff', 10, 4, 5);
      shake(0.2);
      break;

    case 'rhizome': {
      G.rhizomeActive = G.rhizomeActive || [];
      const all = [...G.enemies, ...(G.boss && !G.boss.dead ? [G.boss] : [])].filter(e => !e.dead);
      if (all.length > 0) {
        G.rhizomeActive.push({
          targets: all.map(e => ({ e, x: e.x, y: e.y })),
          dmg: wd.dmg * dmgBoost,
          t: 0,
          maxT: 60,
        });
        spawnEx(G.px, G.py, '#ff88ff', 12, 3, 5);
        shake(0.15);
      }
      break;
    }

    case 'viral':
      push(bx, by, wd.spd, 0, { w: 12, h: 8, infect: true, dmg: wd.dmg * dmgBoost, wtype: 'viral' });
      push(bx, by - 10, wd.spd * 0.94, -0.12 * wd.spd, { w: 10, h: 7, infect: true, dmg: wd.dmg * dmgBoost * 0.85, wtype: 'viral' });
      push(bx, by + 10, wd.spd * 0.94, 0.12 * wd.spd, { w: 10, h: 7, infect: true, dmg: wd.dmg * dmgBoost * 0.85, wtype: 'viral' });
      break;

    case 'shrapnel':
      [-0.46, -0.24, -0.08, 0, 0.08, 0.24, 0.46].forEach(a => push(bx, by, Math.cos(a) * wd.spd, Math.sin(a) * wd.spd, { w: 8, h: 4, shrapnel: true, dmg: wd.dmg * dmgBoost }));
      break;

    case 'blackhole':
      push(bx, by, wd.spd, 0, { w: 18, h: 18, blackhole: true, life: 130, dmg: wd.dmg * dmgBoost, pierce: true, wtype: 'blackhole' });
      break;

    case 'mines':
      G.bullets.push({ x: bx + rnd(-10, 10), y: by + rnd(-20, 20), vx: rnd(-0.3, 0.1), vy: rnd(-0.4, 0.4), dmg: wd.dmg * dmgBoost, wtype: 'mine', w: 14, h: 14, ang: 0, mine: true, life: 300, aoe: 55 * (G.aoeBoost || 1), armed: 60 });
      break;

    case 'cryo':
      push(bx, by, wd.spd, 0, { w: 18, h: 7, cryo: true, pierce: false, wtype: 'cryo' });
      if (G.frame % 3 === 0) spawnTrail(bx - 6, by, '#aaddff');
      break;

    case 'napalm':
      push(bx + rnd(-5, 5), by + rnd(-10, 10), wd.spd + rnd(-1.5, 1.5), rnd(-1.5, 1.5), { dmg: wd.dmg * dmgBoost, wtype: 'napalm', w: 16, h: 16, napalm: true, aoe: 35 * (G.aoeBoost || 1), life: 110 });
      break;

    case 'gravity':
      G.bullets.push({ x: bx + 80, y: G.py, vx: 0, vy: 0, dmg: wd.dmg * dmgBoost, wtype: 'gravity', w: 30, h: 30, ang: 0, gravity: true, life: 180, pierce: true, pull: true });
      spawnEx(bx + 80, G.py, '#8866ff', 8, 2, 4);
      break;

    case 'antimatter':
      push(bx, by, wd.spd, 0, { w: 22, h: 22, pierce: true, aoe: 40 * (G.aoeBoost || 1), wtype: 'antimatter' });
      spawnEx(bx, by, '#ff88ff', 8, 3, 4);
      shake(0.15);
      break;

    case 'quantum':
      [0, 12, 24].forEach(delay => {
        setTimeout(() => {
          if (G.screen === 'GAME') {
            G.bullets.push({
              x: G.px + 50,
              y: G.py + rnd(-6, 6),
              vx: WEAPONS.quantum.spd,
              vy: rnd(-0.3, 0.3),
              dmg: WEAPONS.quantum.dmg * getDamageBoost(),
              wtype: 'quantum',
              w: 20,
              h: 6,
              ang: 0,
              pierce: true,
              quantum: true,
            });
          }
        }, delay);
      });
      break;
  }

  if (hasComp) {
    const orbs = getCompanionPositions();
    orbs.slice(0, G.companions).forEach(cp => {
      const cdmg = wd.dmg * dmgBoost * 0.55;
      const cspd = wd.spd * 0.88;
      const cpush = (vx, vy, extra = {}) => {
        G.bullets.push({ x: cp.x + 10, y: cp.y, vx, vy, dmg: cdmg, wtype: wd.type, w: 10, h: 3, ang: Math.atan2(vy, vx), ...extra });
      };

      if (G.weapon === 'trilaser') {
        [-8, 0, 8].forEach(yo => G.bullets.push({ x: cp.x + 10, y: cp.y + yo, vx: cspd, vy: 0, dmg: cdmg * 0.5, wtype: 'trilaser', w: 10, h: 2, ang: 0, trilaser: true }));
      } else if (G.weapon === 'vector3') {
        G.bullets.push({ x: cp.x + 10, y: cp.y, vx: cspd, vy: 0, dmg: cdmg * 0.7, wtype: 'vector3', w: 12, h: 3, ang: 0 });
        G.bullets.push({ x: cp.x + 8, y: cp.y, vx: Math.cos(-0.5) * cspd, vy: Math.sin(-0.5) * cspd * 0.6, dmg: cdmg * 0.5, wtype: 'vector3', w: 10, h: 3, ang: -0.5 });
        G.bullets.push({ x: cp.x + 8, y: cp.y, vx: Math.cos(0.5) * cspd, vy: Math.sin(0.5) * cspd * 0.6, dmg: cdmg * 0.5, wtype: 'vector3', w: 10, h: 3, ang: 0.5 });
      } else if (G.weapon === 'homing') {
        const tgt = findTarget();
        const a = tgt ? ang(cp.x, cp.y, tgt.x, tgt.y) : 0;
        G.bullets.push({ x: cp.x + 8, y: cp.y, vx: Math.cos(a) * cspd * 0.7, vy: Math.sin(a) * cspd * 0.7, dmg: cdmg * 0.8, wtype: 'homing_rocket', w: 10, h: 4, ang: a, homing: true, homingStrength: 0.07, aoe: 30 * (G.aoeBoost || 1) });
      } else if (G.weapon === 'plasma') {
        G.bullets.push({ x: cp.x + 10, y: cp.y, vx: cspd * 0.8, vy: 0, dmg: cdmg * 0.75, wtype: 'plasma', w: 10, h: 10, ang: 0, aoe: 36 * (G.aoeBoost || 1) });
      } else if (G.weapon === 'railgun' || G.weapon === 'proton' || G.weapon === 'antimatter') {
        G.bullets.push({ x: cp.x + 10, y: cp.y, vx: cspd * 1.08, vy: 0, dmg: cdmg * 0.9, wtype: wd.type, w: G.weapon === 'proton' ? 22 : 16, h: G.weapon === 'proton' ? 7 : 3, ang: 0, pierce: true });
      } else if (G.weapon === 'ionic' || G.weapon === 'lightning') {
        const tgt = findTarget();
        const a = tgt ? ang(cp.x, cp.y, tgt.x, tgt.y) : 0;
        G.bullets.push({ x: cp.x + 8, y: cp.y, vx: Math.cos(a) * cspd, vy: Math.sin(a) * cspd, dmg: cdmg * 0.75, wtype: wd.type, w: 12, h: 4, ang: a, pierce: true, ionic: G.weapon === 'ionic' });
      } else {
        cpush(cspd, 0, { w: 10, h: 3 });
      }
    });
  }
}

function findTarget() {
  const all = [...G.enemies, ...(G.boss && !G.boss.dead ? [G.boss] : [])];
  if(!all.length) return null;
  return all.reduce((a,b) => b.x<a.x?b:a);
}

// ═══════════════════════════════════════════════════════════════
//  GAME UPDATE
// ═══════════════════════════════════════════════════════════════
function lerpAng(a,b,t) {
  let d=b-a; while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU; return a+d*t;
}

function update() {
  G.frame++;
  G.scroll++;
  COMBO.tick();
  updateCam();
  // Drain boss drop queue (2 items per frame to spread load)
  if(G.bossDropQueue && G.bossDropQueue.length>0){
    for(let di=0;di<2&&G.bossDropQueue.length>0;di++){
      const dq=G.bossDropQueue.shift();
      const wk=dq.type==='weapon'?ALL_WEAPONS_PICK[rndI(0,ALL_WEAPONS_PICK.length-1)]:null;
      G.pickups.push({
        x:dq.dropCX+Math.cos(dq.angle)*dq.radius+rnd(-20,20),
        y:dq.dropCY+Math.sin(dq.angle)*dq.radius+rnd(-20,20),
        type:dq.type, weapKey:wk, t:0,
        vx:Math.cos(dq.angle)*0.3, vy:Math.sin(dq.angle)*0.3,
        bossReward:true, life:1800,
      });
    }
  }
  // Drain boss explosion queue
  if(G.bossExpQueue && G.bossExpQueue.length>0){
    // Decrement all delays simultaneously
    G.bossExpQueue.forEach(eq2=>eq2.delay--);
    // Fire and remove all whose delay hit 0 this frame
    for(let qi=G.bossExpQueue.length-1;qi>=0;qi--){
      if(G.bossExpQueue[qi].delay<=0){
        const eq=G.bossExpQueue[qi];
        G.bossExpQueue.splice(qi,1);
        spawnEx(eq.bx+rnd(-70,70),eq.by+rnd(-50,50),'#ff2200',7,5,7);
        spawnEx(eq.bx+rnd(-50,50),eq.by+rnd(-40,40),'#ffaa00',5,4,5);
        shake(0.2);
      }
    }
  }

  // ── Player movement v6.8 — precisión PC + control relativo móvil
  const spd = G.speed || 5;
  if(G.touching) {
    let tx = G.tx, ty = G.ty;
    if(!IS_DESKTOP){
      tx = G.tx - (G.touchOffsetX || 0);
      ty = G.ty - (G.touchOffsetY || 0);
    }
    const dx = tx - G.px, dy = ty - G.py;
    const d = Math.hypot(dx,dy);
    if(d > 1.2){
      const nx = dx/d, ny = dy/d;
      const maxStep = spd * (IS_DESKTOP ? 1.18 : 1.02);
      const desired = Math.min(maxStep, d * (IS_DESKTOP ? 0.62 : 0.36));
      G.pvx = lerp(G.pvx, nx*desired, IS_DESKTOP ? 0.90 : 0.60);
      G.pvy = lerp(G.pvy, ny*desired, IS_DESKTOP ? 0.90 : 0.60);
    } else {
      G.pvx *= 0.48; G.pvy *= 0.48;
    }
  } else {
    G.pvx *= IS_DESKTOP ? 0.62 : 0.82;
    G.pvy *= IS_DESKTOP ? 0.62 : 0.82;
  }
  G.pvx = clamp(G.pvx, -spd*1.15, spd*1.15);
  G.pvy = clamp(G.pvy, -spd*1.15, spd*1.15);
  G.px = clamp(G.px+G.pvx, 24, W-24);
  G.py = clamp(G.py+G.pvy, 42, (typeof gameplayBottomLimit==='function'?gameplayBottomLimit():H-58));

  // Position history for companions
  G.posHist.unshift({x:G.px,y:G.py});
  if(G.posHist.length>80) G.posHist.pop();

  // Engine trail
  if(G.frame%5===0){
    spawnTrail(G.px-20,G.py,'#ff8800');
    if(G.companions>0){
      getCompanionPositions().slice(0,G.companions).forEach(cp=>spawnTrail(cp.x-10,cp.y,'#ffaa44'));
    }
  }

  // Shield regen
  if(G.invTimer>0) G.invTimer--;
  G.shieldTimer++;
  if(G.shieldTimer>150 && G.pshield<G.pmaxsh) G.pshield=Math.min(G.pmaxsh,G.pshield+0.5);

  // Active power timers
  G.activePowers = (G.activePowers||[]).filter(p=>{ p.timer--; return p.timer>0; });
  if(G.beamTimer>0){ G.beamTimer--; G.beamColor = getLevelBeamColor(); }
  if(G.magnetTimer>0) G.magnetTimer--;
  if(G.killCount>0 && G.killCount%6===0 && (!G.checkpoint || G.checkpoint.killCount!==G.killCount)) setCheckpoint('AUTO');

  // Auto-fire (cap bullets for performance)
  if(G.bullets.length > 40) G.bullets.splice(0, G.bullets.length - 40);
  const pCap = IS_DESKTOP ? 80 : 40;
  if(G.particles.length > pCap) G.particles.length = pCap;
  const enemyBulletCap = IS_DESKTOP ? 140 : 90;
  if(G.eBullets.length > enemyBulletCap) G.eBullets.splice(0, G.eBullets.length - enemyBulletCap);
  const pickupCap = 90;
  if(G.pickups.length > pickupCap) {
    const bossRewards = G.pickups.filter(p=>p.bossReward);
    const normal = G.pickups.filter(p=>!p.bossReward).slice(-Math.max(0,pickupCap-bossRewards.length));
    G.pickups = [...bossRewards, ...normal];
  }
  G.weapTimer=Math.max(0,G.weapTimer-1);
  if((G.regenRate||0)>0 && G.frame%60===0 && G.php<G.pmaxhp){ G.php=Math.min(G.pmaxhp,G.php+G.regenRate); }
  if(G.weapTimer<=0){
    firePlayer();
    G.weapTimer=WEAPONS[G.weapon].rate;
    // SFX - laser fires more frequently for feel
    const sfxRate = ['laser','trilaser','vector3'].includes(G.weapon) ? 3 : 5;
    if(G.frame%sfxRate===0) SFX.shoot(WEAPONS[G.weapon]?.type||'laser');
  }

  // ── Spawn pickups periodically
  if(G.frame%180===0) spawnRandomPickup();

  // ── Guaranteed ship part per mission (at ~60% kills)
  if(!G.bossSpawned && !G.partSpawned && G.killCount >= Math.floor(G.killGoal * 0.6)) {
    G.partSpawned = true;
    const partKeys = Object.keys(SHIP_PARTS_DEFS);
    const pKey = partKeys[rndI(0, partKeys.length-1)];
    spawnPickup(W*0.6, H/2 + rnd(-80,80), 'part', pKey);
    notify('⚙ PIEZA DE NAVE DETECTADA ⚙', '#ff9900', 180);
  }

  // ── Pre-boss gift: guaranteed railgun/lightning before boss
  if(!G.bossSpawned && !G.preBossGift && G.killCount >= G.killGoal - 4) {
    G.preBossGift = true;
    const preBossWeapons = getLevelLoadout(G.level).preBoss || ALL_WEAPONS_PICK;
    const wk = preBossWeapons[rndI(0,preBossWeapons.length-1)];
    spawnPickup(W*0.75, H/2, 'weapon', wk);
    spawnPickup(W*0.75, H/2+60, 'shield', null);
    spawnPickup(W*0.75, H/2-60, 'hp', null);
    notify('⚡ ARSENAL PRE-JEFE DETECTADO ⚡', '#ffdd00', 200);
  }

  // ── Spawn enemies (capped for performance)
  if(!G.bossSpawned){
    G.spawnTimer--;
    const maxEnemies = Math.min(16, 5 + G.level);
    if(G.spawnTimer<=0 && G.enemies.length < maxEnemies){
      const fc = FORMATION_CHANCE[G.level] || 0.2;
      if(Math.random() < fc && G.enemies.length < maxEnemies-2) {
        // Spawn a formation
        const fKeys = Object.keys(FORMATIONS);
        const fKey = fKeys[rndI(0,fKeys.length-1)];
        const pool = SPAWN_POOL[G.level] || SPAWN_POOL[1];
        const eKey = pool[rndI(0,pool.length-1)];
        spawnFormation(fKey, eKey);
        G.spawnTimer = Math.max(90, 180-G.level*14);
      } else {
        spawnEnemy();
        G.spawnTimer=Math.max(28, 90-G.level*10-Math.floor(G.killCount*0.3));
      }
    }
  }
  if(G.killCount>=G.killGoal && !G.bossSpawned){
    G.enemies=[];
    spawnBoss();
  }

  // ── Update enemies
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    if(e.dead){G.enemies.splice(i,1);continue;}
    e.t++;
    if(e.flashTimer>0) e.flashTimer--;
    // Movement patterns
    const spdMult = (e.empSlow||0)>0 ? 0.3 : 1.0;
    switch(e.move){
      case 'sine':    e.x-=e.spd*spdMult; e.y=e.baseY+Math.sin(e.t*0.05)*60; break;
      case 'zigzag':  e.x-=e.spd*spdMult; e.y=e.baseY+Math.sin(e.t*0.09)*45; break;
      case 'charge':  {const dx2=G.px-e.x,dy2=G.py-e.y,d=Math.hypot(dx2,dy2)||1; e.x+=dx2/d*e.spd; e.y+=dy2/d*e.spd;} break;
      case 'hover':   e.x=Math.max(W*0.55,e.x-e.spd*spdMult*0.4); e.y=e.baseY+Math.sin(e.t*0.03)*30; break;
      case 'dash':    e.t2=(e.t2||0)+1; if(e.t2%80<20){const dx3=G.px-e.x,dy3=G.py-e.y,d3=Math.hypot(dx3,dy3)||1;e.x+=dx3/d3*e.spd*spdMult*3;e.y+=dy3/d3*e.spd*spdMult*3;}else{e.x-=e.spd*spdMult;} break;
      case 'direct':  e.x-=e.spd*spdMult; break;
      case 'dive': {
        const ph=Math.floor(e.t/90)%2;
        if(ph===0){ e.x-=e.spd*spdMult*0.6; e.y+=Math.sin(e.t*0.12)*5*spdMult; }
        else{ const dy4=G.py-e.y; e.y+=Math.sign(dy4)*Math.min(e.spd*spdMult*1.5,Math.abs(dy4)*0.1); e.x-=e.spd*spdMult*0.4; }
        break;
      }
      case 'arc':   { e.x-=e.spd*spdMult*0.8; e.y=e.baseY+Math.sin(e.t*0.045)*70; break; }
      case 'dart':  {
        if(e.t%40<8){ e.x-=e.spd*spdMult*3.2; } else { e.x-=e.spd*spdMult*0.3; e.y+=Math.sin(e.t*0.2)*2.5; }
        break;
      }
      case 'orbit': { e.x-=e.spd*spdMult*0.4; e.y=e.baseY+Math.sin(e.t*0.08)*45+Math.cos(e.t*0.05)*20; break; }
      case 'wave':  { e.x-=e.spd*spdMult*0.65; e.y=e.baseY+Math.sin(e.t*0.07+(e.formIdx||0)*0.5)*55; break; }
      case 'evasive': {
        e.x-=e.spd*spdMult*0.92;
        e.y=e.baseY+Math.sin(e.t*0.08)*38;
        let threat=null, best=9999;
        for(const b of G.bullets){
          if((b.vx||0)>0 && b.x<e.x && e.x-b.x<190 && Math.abs(b.y-e.y)<e.sz*2.4){ const d=e.x-b.x; if(d<best){best=d; threat=b;} }
        }
        if(threat){ e.dodgeFlash=8; e.dodgeDir = (threat.y<e.y)?1:-1; e.y += e.dodgeDir*(5.5+G.level*0.35)*spdMult; e.baseY=lerp(e.baseY,e.y,0.08); }
        if(e.dodgeFlash>0) e.dodgeFlash--;
        e.y=clamp(e.y,e.sz+18,H-e.sz-24);
        break;
      }
      case 'kamikaze': {
        const dxk=G.px-e.x, dyk=G.py-e.y, dk=Math.hypot(dxk,dyk)||1;
        const charge = e.x<W*0.86 ? 1.85 : 0.75;
        e.x += dxk/dk*e.spd*charge*spdMult; e.y += dyk/dk*e.spd*charge*spdMult;
        if(e.t%10===0) spawnTrail(e.x+e.sz*0.5,e.y,'#ff3344');
        break;
      }
      case 'sniper': {
        const holdX=W*0.72;
        e.x += (holdX-e.x)*0.025 - e.spd*0.12*spdMult;
        e.y += Math.sign(G.py-e.y)*Math.min(1.7+G.level*0.12, Math.abs(G.py-e.y)*0.035);
        e.y += Math.sin(e.t*0.04)*0.8;
        break;
      }
      case 'leech': {
        const dxl=G.px-e.x, dyl=G.py-e.y, dl=Math.hypot(dxl,dyl)||1;
        e.x += dxl/dl*e.spd*0.72*spdMult - e.spd*0.18;
        e.y += dyl/dl*e.spd*0.72*spdMult + Math.sin(e.t*0.12)*1.2;
        if(dist2(e.x,e.y,G.px,G.py)<120**2 && G.frame%45===0){
          if(G.pshield>0){ G.pshield=Math.max(0,G.pshield-5); e.hp=Math.min(e.maxhp,e.hp+9); spawnDmgNum(e.x,e.y-e.sz,'DRENA','#bb44ff',false); }
        }
        if(G.boss && !G.boss.dead && dist2(e.x,e.y,G.boss.x,G.boss.y)<80**2){ G.boss.hp=Math.min(G.boss.maxhp,G.boss.hp+e.hp*0.28); spawnEx(e.x,e.y,'#bb44ff',14,3,5); e.dead=true; notify('EL JEFE ABSORBE UNA SANGUIJUELA','#bb44ff',80); }
        break;
      }
      default:        e.x-=e.spd*spdMult; break;
    }
    // Enemy fire
    if(e.fireRate){
      e.fireTimer--;
      if(e.fireTimer<=0){
        e.fireTimer=e.fireRate;
        const a=ang(e.x,e.y,G.px,G.py);
        const bigShot=e.sz>30;
        if(e.key==='sniper'){
          for(let s=-1;s<=1;s++){
            const aa=a+s*0.055;
            G.eBullets.push({x:e.x-e.sz,y:e.y,vx:Math.cos(aa)*7.2,vy:Math.sin(aa)*7.2,dmg:18,wtype:'acid_big',ang:aa,w:13,h:8});
          }
          spawnEx(e.x-e.sz,e.y,'#ffdd44',10,2,5);
        } else if(e.key==='leech'){
          if(G.pshield>0 && dist2(e.x,e.y,G.px,G.py)<180**2){ G.pshield=Math.max(0,G.pshield-8); e.hp=Math.min(e.maxhp,e.hp+12); }
        } else {
          G.eBullets.push({x:e.x-e.sz,y:e.y,vx:Math.cos(a)*4.5,vy:Math.sin(a)*4.5,dmg:bigShot?18:12,wtype:bigShot?'acid_big':'acid',ang:a,w:10,h:10});
        }
      }
    }
    // Off-screen
    if(e.x<-e.sz*2) G.enemies.splice(i,1);
  }

  // ── Boss update
  if(G.boss && !G.boss.dead){
    const b=G.boss; b.t++;
    if(b.flashTimer>0) b.flashTimer--;
    const phaseAmp = b.phase===1 ? 0.24 : b.phase===2 ? 0.32 : 0.38;
    b.x=clamp(b.x-0.24+Math.sin(b.t*0.008+b.phase)*0.8, W*0.52, W-b.sz-24);
    b.y=H/2+Math.sin(b.t*0.018)*(H*phaseAmp);
    b.y=clamp(b.y,b.sz+30,H-b.sz-30);
    if(b.hp<b.maxhp*0.68&&b.phase===1){b.phase=2; spawnEx(b.x,b.y,'#ff4400',32,6,6); notify('JEFE EN FASE 2','#ff8844',90);}
    if(b.hp<b.maxhp*0.28&&b.phase===2){b.phase=3; spawnEx(b.x,b.y,'#ffffff',38,7,7); notify('JEFE EN FASE 3','#ffffff',90);}
    updateBossPersonality(b);
    b.fireTimer--;
    if(b.fireTimer<=0){
      b.fireTimer=b.phase===3?18:b.phase===2?24:38;
      const spread = b.phase===3 ? 3 : 2;
      for(let i=-spread;i<=spread;i++){
        const a=ang(b.x,b.y,G.px,G.py)+i*(b.phase===3?0.18:0.22);
        G.eBullets.push({x:b.x-b.sz,y:b.y,vx:Math.cos(a)*(b.phase===3?6.2:5.5),vy:Math.sin(a)*(b.phase===3?6.2:5.5),dmg:b.phase===3?24:22,wtype:'acid_big',ang:a,w:12,h:12});
      }
      if(b.phase>=2&&G.frame%100===0) spawnEnemy();
      if(b.phase===3&&G.frame%70===0){
        const waveY = clamp(G.py + rnd(-90,90), 40, H-40);
        for(let k=0;k<4;k++) G.eBullets.push({x:b.x-b.sz-30*k,y:waveY+rnd(-18,18),vx:-4.8-k*0.3,vy:rnd(-0.8,0.8),dmg:16,wtype:'acid',ang:Math.PI,w:10,h:10});
      }
    }
  }

  // ── Update bullets
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];
    if(b.homing){
      const tgt=findTarget();
      if(tgt){
        const ta=ang(b.x,b.y,tgt.x,tgt.y);
        const bAng=lerpAng(Math.atan2(b.vy,b.vx),ta,0.1);
        const spd=Math.hypot(b.vx,b.vy);
        b.vx=Math.cos(bAng)*spd; b.vy=Math.sin(bAng)*spd;
        b.ang=bAng;
      }
    }
    if(b.blackhole){
      b.life=(b.life||100)-1;
      b.vx*=0.985; b.vy*=0.985;
      [...G.enemies, ...(G.boss && !G.boss.dead ? [G.boss] : [])].forEach(t=>{
        const dx=t.x-b.x, dy=t.y-b.y, d=Math.max(30, Math.hypot(dx,dy));
        if(d<150){ const pull=(150-d)*0.0038; t.x-=dx/d*pull*24; t.y-=dy/d*pull*18; if(G.frame%8===0) t.hp-=b.dmg*0.75; }
      });
      G.eBullets.forEach(eb=>{
        const dx=eb.x-b.x, dy=eb.y-b.y, d=Math.max(18,Math.hypot(dx,dy));
        if(d<130){ eb.vx -= dx/d*0.25; eb.vy -= dy/d*0.25; }
      });
    }
    b.x+=b.vx; b.y+=b.vy;
    if((b.blackhole && b.life<=0) || b.x>W+30||b.x<-30||b.y<-30||b.y>H+30){G.bullets.splice(i,1);continue;}
    if(b.wtype==='plasma'&&G.frame%2===0) spawnTrail(b.x,b.y,'#ff00ff');
    if(b.wtype==='missile'&&G.frame%2===0) spawnTrail(b.x,b.y,'#ff6600');
    if(b.wtype==='viral'&&G.frame%2===0) spawnTrail(b.x,b.y,'#66ff66');
    if(b.wtype==='blackhole'&&G.frame%2===0) spawnTrail(b.x,b.y,'#7a6bff');
  }

  for(let i=G.eBullets.length-1;i>=0;i--){
    const b=G.eBullets[i];
    b.x+=b.vx; b.y+=b.vy;
    if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30) G.eBullets.splice(i,1);
  }

  // ── Collisions: player bullets vs enemies
  outer:
  for(let bi=G.bullets.length-1;bi>=0;bi--){
    const b=G.bullets[bi];
    // vs enemies
    for(let ei=G.enemies.length-1;ei>=0;ei--){
      const e=G.enemies[ei];
      if(dist2(b.x,b.y,e.x,e.y)<(e.sz+8)**2){
        const critRoll = (G.critChance||0)>0 && Math.random()<G.critChance;
        const finalDmg = b.dmg*(critRoll?2:1);
        e.hp-=finalDmg; e.flashTimer=6;
        if(critRoll) spawnEx(e.x,e.y,'#ffff00',5,2,3);
        if(b.cryo){ e.empSlow=Math.max(e.empSlow||0,120); spawnEx(e.x,e.y,'#aaddff',4,1,2); }
        if(G.frame%3===0) SFX.hit();
        spawnEx(b.x,b.y,bossReactionColor(b.wtype||G.weapon),5,2,3);
        if(b.wtype==='plasma'&&b.aoe){
          G.enemies.forEach(e2=>{if(dist2(b.x,b.y,e2.x,e2.y)<b.aoe**2) e2.hp-=b.dmg*0.5;});
          spawnEx(b.x,b.y,'#ff00ff',18,4,6);
        }
        if(b.infect){
          G.enemies.forEach(e2=>{ if(e2!==e && dist2(b.x,b.y,e2.x,e2.y)<90**2) e2.hp-=b.dmg*0.45; });
          if(G.boss&&!G.boss.dead&&dist2(b.x,b.y,G.boss.x,G.boss.y)<120**2) G.boss.hp-=b.dmg*0.28;
          spawnEx(b.x,b.y,'#66ff66',10,3,4);
        }
        if(e.hp<=0) killEnemy(e,ei);
        if(!b.pierce && !b.blackhole){G.bullets.splice(bi,1); continue outer;}
        break;
      }
    }
    // vs boss
    if(G.boss&&!G.boss.dead){
      const bs=G.boss;
      if(dist2(b.x,b.y,bs.x,bs.y)<(bs.sz+6)**2){
        const factor = weaponFactorVsBoss(b.wtype||G.weapon, bs.key);
        const shieldFactor = bs.shieldTimer>0 ? 0.38 : 1;
        bs.hp-=b.dmg*factor*shieldFactor; bs.flashTimer=4;
        if(bs.shieldTimer>0 && G.frame%10===0) spawnDmgNum(bs.x,bs.y-bs.sz,'ESCUDO','#66ddff',false);
        spawnEx(b.x,b.y,bossReactionColor(b.wtype||G.weapon),7,2,3);
        if(factor>1.12 && G.frame%8===0) notify(`CRÍTICO ${Math.round((factor-1)*100)}%`, bossReactionColor(b.wtype||G.weapon), 26);
        if(b.wtype==='plasma'&&b.aoe){spawnEx(b.x,b.y,'#ff00ff',20,5,7);}
        if(b.infect){ bs.hp-=b.dmg*0.35*factor; spawnEx(b.x,b.y,'#66ff66',12,3,4); }
        if(b.shrapnel){ bs.hp-=3.5*factor; }
        if(!b.pierce && !b.blackhole) G.bullets.splice(bi,1);
        if(bs.hp<=0) killBoss();
        continue outer;
      }
    }
  }

  // ── Enemy bullets vs player
  if(G.invTimer<=0){
    for(let i=G.eBullets.length-1;i>=0;i--){
      const b=G.eBullets[i];
      if(dist2(b.x,b.y,G.px,G.py)<22**2){
        damagePlayer(b.dmg); spawnEx(b.x,b.y,'#66ff00',6,2,3); G.eBullets.splice(i,1);
      }
    }
    // Enemy body vs player
    G.enemies.forEach(e=>{
      if(dist2(e.x,e.y,G.px,G.py)<(e.sz+14)**2){
        damagePlayer(e.contactDmg||25); e.hp-= e.key==='kamikaze'?80:40; spawnEx(G.px,G.py,'#ff4400',10,3,4);
        if(e.hp<=0) killEnemy(e,G.enemies.indexOf(e));
      }
    });
  }

  // ── Ultra beam tick
  if(G.beamTimer>0){
    G.beamDamageTick++;
    const beamW = 18 + Math.sin(G.frame*0.25)*4;
    G.enemies.forEach(e=>{
      if(e.x>G.px && Math.abs(e.y-G.py)<(e.sz+beamW)){
        if(G.beamDamageTick%3===0) { e.hp -= 26 + G.level*8; e.flashTimer=2; }
        if(e.hp<=0) killEnemy(e,G.enemies.indexOf(e));
      }
    });
    if(G.boss && !G.boss.dead && G.boss.x>G.px && Math.abs(G.boss.y-G.py)<(G.boss.sz+beamW+10)){
      if(G.beamDamageTick%3===0) {
        const beamFactor = weaponFactorVsBoss('beam', G.boss.key);
        G.boss.hp -= (30 + G.level*10) * beamFactor * (G.boss.shieldTimer>0?0.42:1); G.boss.flashTimer=2; if(G.boss.hp<=0) killBoss();
      }
    }
    G.eBullets = G.eBullets.filter(eb=> !(eb.x>G.px && Math.abs(eb.y-G.py)<beamW));
    if(G.frame%4===0) addLaserSparks(G.px+50+rnd(0,Math.max(80,W-G.px-60)), G.py+rnd(-beamW,beamW), G.beamColor);
  }

  // ── Pickups
  for(let i=G.pickups.length-1;i>=0;i--){
    const p=G.pickups[i];
    p.t=(p.t||0)+1;

    if(p.bossReward){
      // Boss rewards: bounce off all 4 walls, slow drift, always magnetised
      p.x+=p.vx; p.y+=p.vy;
      p.vx*=0.995; p.vy*=0.995; // slight damping — eventually hover
      if(p.x<30)  { p.x=30;  p.vx=Math.abs(p.vx)*0.6; }
      if(p.x>W-30){ p.x=W-30; p.vx=-Math.abs(p.vx)*0.6; }
      if(p.y<30)  { p.y=30;  p.vy=Math.abs(p.vy)*0.6; }
      if(p.y>H-30){ p.y=H-30; p.vy=-Math.abs(p.vy)*0.6; }
      // Always magnet-attracted (gentle pull even without magnet item)
      const bdx=G.px-p.x, bdy=G.py-p.y, bd=Math.max(1,Math.hypot(bdx,bdy));
      const mr2=getMagnetRadius();
      if(bd<mr2){ p.x+=bdx/bd*5.5; p.y+=bdy/bd*5.5; }
      else if(bd<mr2*2){ p.x+=bdx/bd*1.5; p.y+=bdy/bd*1.5; } // gentle always-on pull
      // Life countdown
      if(p.life!==undefined){ p.life--; if(p.life<=0){ G.pickups.splice(i,1); continue; } }
      // Collect
      if(dist2(p.x,p.y,G.px,G.py)<32**2){
        collectPickup(p); spawnEx(p.x,p.y,PICKUP_DEFS[p.type]?.color||'#fff',18,4,5); G.pickups.splice(i,1);
      }
    } else {
      // Normal pickups: original behaviour
      p.x+=p.vx; p.y+=p.vy;
      if(G.magnetTimer>0){
        const dx=G.px-p.x, dy=G.py-p.y, d=Math.max(20,Math.hypot(dx,dy));
        if(d<getMagnetRadius()){ p.x += dx/d*4.2; p.y += dy/d*4.2; }
      }
      if(p.y<20||p.y>H-20) p.vy*=-1;
      if(p.x<-40){G.pickups.splice(i,1);continue;}
      if(dist2(p.x,p.y,G.px,G.py)<28**2){
        collectPickup(p); spawnEx(p.x,p.y,PICKUP_DEFS[p.type]?.color||'#fff',14,3,4); G.pickups.splice(i,1);
      }
    }
  }

  // Boss collect phase countdown
  if(G.bossPhase==='collect'){
    G.bossCollectTimer=(G.bossCollectTimer||0)-1;
    const remaining=G.pickups.filter(p=>p.bossReward).length;
    if(remaining===0 || G.bossCollectTimer<=0){
      G.bossPhase=null; G.bossCollectTimer=0;
      G.bossExpQueue=[]; G.bossDropQueue=[];  // clear on transition
      G.pickups=G.pickups.filter(p=>!p.bossReward);
      if(G.level>=G.maxLevel){ submitScore(); G.screen='WIN'; SFX.levelUp(); }
      else { G.screen='INTERMISSION'; SFX.levelUp(); G.shopScroll=0; }
    }
  }
  updateStageDirector();
  updateObstacles();
  updateParticles();
  // EMP waves
  G.empWaves = G.empWaves || [];
  for(let wi=G.empWaves.length-1;wi>=0;wi--){
    const ew=G.empWaves[wi]; ew.r+=ew.speed; ew.t++;
    // Damage + slow all enemies in wave radius
    const all2=[...G.enemies,...(G.boss&&!G.boss.dead?[G.boss]:[])];
    all2.forEach(e=>{
      if(!e.dead && !e.empHit){
        const d=Math.sqrt((e.x-ew.x)**2+(e.y-ew.y)**2);
        if(d<=ew.r && d>=ew.r-ew.speed*2){
          e.hp-=ew.dmg; e.empHit=true; e.empSlow=90; e.flashTimer=8;
          spawnEx(e.x,e.y,'#00ffdd',6,2,3);
          if(e.hp<=0){ killEnemy(e); }
        }
      }
    });
    if(ew.r>=ew.maxR) G.empWaves.splice(wi,1);
  }
  // Reset empHit per frame so EMP can re-hit on next wave
  G.enemies.forEach(e=>{ e.empHit=false; });
  // EMP slow effect
  G.enemies.forEach(e=>{ if(e.empSlow>0){ e.empSlow--; } });
  // Gravity pull
  G.bullets.forEach(b=>{
    if(b.gravity&&b.pull&&!b.dead){
      const all3=[...G.enemies,...(G.boss&&!G.boss.dead?[G.boss]:[])];
      all3.forEach(e=>{ if(!e.dead){ const dx2=b.x-e.x,dy2=b.y-e.y,d2=Math.hypot(dx2,dy2)||1; if(d2<140){ e.x+=dx2/d2*2.5; e.y+=dy2/d2*2.5; } } });
    }
  });
  // Mine proximity trigger
  G.bullets.forEach((b,bi)=>{
    if(b.mine&&!b.dead){
      b.life=(b.life||300)-1; b.armed=(b.armed||0)-1;
      if(b.life<=0){b.dead=true;return;}
      if(b.armed>0) return;
      const all4=[...G.enemies,...(G.boss&&!G.boss.dead?[G.boss]:[])];
      all4.forEach(e=>{ if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<55){
        b.dead=true;
        spawnEx(b.x,b.y,'#ffaa00',20,6,8); shake(0.3);
        all4.forEach(e2=>{ if(!e2.dead&&Math.hypot(e2.x-b.x,e2.y-b.y)<55){ e2.hp-=b.dmg; e2.flashTimer=10; if(e2.hp<=0) killEnemy(e2,G.enemies.indexOf(e2)); } });
      }});
    }
  });
  if(G.boss && !G.boss.dead && G.boss.empSlow>0) G.boss.empSlow--;
  // Rhizome
  G.rhizomeActive = G.rhizomeActive || [];
  for(let ri=G.rhizomeActive.length-1;ri>=0;ri--){
    const rh=G.rhizomeActive[ri]; rh.t++;
    if(rh.t===1){
      // Apply damage to all targets instantly
      rh.targets.forEach(({e})=>{
        if(!e.dead){ e.hp-=rh.dmg; e.flashTimer=15;
          spawnEx(e.x,e.y,'#ff88ff',8,3,4);
          if(e.hp<=0){ killEnemy(e); }
        }
      });
    }
    if(rh.t>=rh.maxT) G.rhizomeActive.splice(ri,1);
  }
}

function damagePlayer(dmg) {
  dmg = Math.max(1, Math.round(dmg * (1 - (G.damageReduction||0))));
  G.shieldTimer=0;
  if(G.pshield>0){
    const ab=Math.min(G.pshield,dmg); G.pshield-=ab; dmg-=ab;
    if(ab>0) { SFX.shieldUp(); shake(0.12); flash('#4488ff',6); }
  }
  if(dmg>0){
    G.php-=dmg; SFX.playerHit();
    shake(0.35); triggerChroma(); flash('#ff2200',8);
    spawnDmgNum(G.px+rnd(-20,20), G.py-30, dmg, '#ff2200', false);
    spawnEx(G.px,G.py,'#ff4400',10,3,4);
    if(G.php<=0){
      G.php=0; shake(1.0); flash('#ffffff',16);
      spawnEx(G.px,G.py,'#ff4400',70,10,12);
      spawnEx(G.px,G.py,'#ffdd00',40,7,9);
      SFX.bigExplosion(); COMBO.reset();
      submitScore();
      // Use a life if available
      if((G.lives||1) > 1){
        G.lives--;
        notify('❤ VIDA PERDIDA — quedan '+G.lives, '#ff2244', 200);
        G.php = Math.ceil(G.pmaxhp * 0.5);
        G.pshield = 0; G.invTimer = 180; G.touching = false;
        shake(0.5); flash('#ff0000', 15);
        SFX.hit();
      } else {
        G.lives = 0;
        setCheckpoint('MUERTE'); saveGame(); G.screen='DEAD';
      }
    }
  }
  G.invTimer=40;
}


function updateBossPersonality(b){
  if(!b || b.dead) return;
  b.shieldTimer = Math.max(0,(b.shieldTimer||0)-1);
  b.tauntTimer = Math.max(0,(b.tauntTimer||0)-1);
  b.stealTimer = Math.max(0,(b.stealTimer||0)-1);
  if(b.tauntTimer>0){
    b.y += Math.sin(b.t*0.32)*3.2;
    if(b.t%12===0) spawnEx(b.x+rnd(-b.sz,b.sz), b.y+rnd(-b.sz*0.7,b.sz*0.7), '#ffdd66', 3,2,3);
  }
  if(b.t%310===80){
    b.tauntTimer=72; b.shieldTimer=Math.max(b.shieldTimer,78);
    notify('EL JEFE SE BURLA Y ACTIVA CORAZA','#ffdd66',120);
  }
  if(b.stealTimer<=0){
    b.stealTimer = b.phase>=3 ? 150 : 230;
    let stole=false;
    if(G.beamTimer>120){
      G.beamTimer=Math.max(0,G.beamTimer-150);
      b.hp=Math.min(b.maxhp,b.hp+b.maxhp*0.045);
      stole=true; notify('⚠ ROBA ENERGÍA DEL LÁSER X','#bb66ff',130);
    } else {
      let nearest=-1, best=999999;
      for(let i=0;i<G.pickups.length;i++){
        const p=G.pickups[i]; if(p.bossReward) continue;
        const d=dist2(p.x,p.y,b.x,b.y); if(d<best){best=d; nearest=i;}
      }
      if(nearest>=0 && best<260**2){
        const p=G.pickups.splice(nearest,1)[0];
        b.hp=Math.min(b.maxhp,b.hp+b.maxhp*0.035);
        spawnEx(p.x,p.y,'#bb66ff',18,3,7); stole=true;
        notify('EL JEFE ABSORBE UN PODER','#bb66ff',100);
      }
    }
    if(stole){ b.shieldTimer=Math.max(b.shieldTimer,55); spawnDmgNum(b.x,b.y-b.sz,'+REGEN','#bb66ff',true); }
  }
  b.specialTimer = Math.max(0,(b.specialTimer||0)-1);
  if(b.specialTimer<=0){
    bossSpecialPattern(b);
    b.specialTimer = Math.max(70, (b.phase===3?120:b.phase===2?160:210) - (G.level||1)*5);
  }
}
function bossSpecialPattern(b){
  const key=b.key;
  if(['hivemind','voidseraph','stellarnest','omnimind'].includes(key)){
    const n=b.phase>=3?14:b.phase>=2?10:8;
    for(let i=0;i<n;i++){
      const a=i/n*TAU + b.t*0.025;
      G.eBullets.push({x:b.x-b.sz*0.4,y:b.y,vx:Math.cos(a)*3.4,vy:Math.sin(a)*3.4,dmg:14+b.phase*3,wtype:'acid',ang:a,w:10,h:10});
    }
    if(G.enemies.length<12){
      ['leech','dodger','hornet'].slice(0,b.phase).forEach((k,idx)=>{
        const def=ENEMIES[k];
        G.enemies.push({key:k,x:b.x-b.sz-20-idx*20,y:clamp(b.y+rnd(-60,60),40,H-40),baseY:b.y+rnd(-60,60),hp:def.hp*(1+G.level*0.22),maxhp:def.hp*(1+G.level*0.22),spd:def.spd,sz:def.sz,score:def.score,fireRate:def.fireRate||0,fireTimer:def.fireRate||80,t:0,dead:false,flashTimer:0,move:def.move,contactDmg:def.contactDmg||25,dodgeDir:Math.random()<0.5?-1:1});
      });
    }
  } else if(['broodqueen','magmahydra','frostwyrm'].includes(key)){
    for(let k=0;k<5+b.phase;k++){
      const yy=(k/(4+b.phase))*H;
      const a=ang(b.x,b.y,W*0.12,yy)+rnd(-0.12,0.12);
      G.eBullets.push({x:b.x-b.sz,y:b.y+rnd(-30,30),vx:Math.cos(a)*4.8,vy:Math.sin(a)*4.8,dmg:16+b.phase*3,wtype:'acid_big',ang:a,w:12,h:12});
    }
    if(Math.random()<0.6) spawnFallingBomb();
    if(G.enemies.length<14){ const def=ENEMIES.kamikaze; G.enemies.push({key:'kamikaze',x:W+30,y:clamp(b.y+rnd(-100,100),40,H-40),baseY:b.y, hp:def.hp*(1+G.level*0.25),maxhp:def.hp*(1+G.level*0.25),spd:def.spd,sz:def.sz,score:def.score,fireRate:0,fireTimer:0,t:0,dead:false,flashTimer:0,move:'kamikaze',contactDmg:def.contactDmg}); }
  } else {
    const rows=b.phase>=3?5:3;
    for(let r=0;r<rows;r++){
      const yy=(r+1)*H/(rows+1);
      for(let k=0;k<4;k++){
        G.eBullets.push({x:b.x-b.sz-18*k,y:yy+rnd(-10,10),vx:-4.5-k*0.35,vy:Math.sin((b.t+k)*0.4)*0.85,dmg:15+b.phase*4,wtype:'acid',ang:Math.PI,w:10,h:10});
      }
    }
    if(Math.random()<0.5) spawnFugitiveMeteor();
    if(b.phase>=2 && Math.random()<0.45) spawnMazeGate();
  }
}

function killEnemy(e,idx) {
  if(!e || e.dead) return;
  if(e === G.boss || ENEMIES[e.key]?.boss) { killBoss(); return; }
  e.dead=true;
  COMBO.add();
  const scoreMult = COMBO.mult;
  const actualScore = Math.round(e.score * scoreMult);
  G.score += actualScore;
  G.killCount++;
  if(G.score >= (G.nextLifeScore||50000) && (G.lives||3) < (G.maxLives||5)){
    G.lives=(G.lives||3)+1; G.nextLifeScore=(G.nextLifeScore||50000)+50000;
    notify('❤ +VIDA EXTRA! ('+G.lives+' vidas)', '#ff44aa', 200); SFX.powerUp(); shake(0.3);
  }
  shake(e.sz > 30 ? 0.18 : 0.08);
  spawnEx(e.x,e.y,'#ff4400',18,e.sz*0.45,6);
  spawnEx(e.x,e.y,'#ffdd00',10,e.sz*0.3,4);
  SFX.enemyDie();
  const scoreCol = scoreMult>2?'#ff00ff':scoreMult>1?'#ffdd00':'#ffffff';
  spawnDmgNum(e.x+rnd(-15,15), e.y-e.sz, actualScore, scoreCol, scoreMult>1);
  if(scoreMult>1) spawnDmgNum(e.x, e.y-e.sz-18, `×${scoreMult}`, '#ff00ff', false);
  if(Math.random()<0.42) spawnPickup(e.x,e.y,['hp','shield','weapon','speed','bomb','gold','gold'][rndI(0,6)],ALL_WEAPONS_PICK[rndI(0,ALL_WEAPONS_PICK.length-1)]);
}

function killBoss() {
  const b=G.boss; if(b.dead) return;
  b.dead=true; stopBossHum();
  const bScore = Math.round(b.score * Math.max(1,COMBO.mult));
  G.score += bScore;
  SFX.bossDie(b.key);
  shake(1.0); flash('#ffffff',26);
  // Staged explosion: enqueue bursts instead of spawning 290 particles at once
  G.bossExpQueue = G.bossExpQueue || [];
  const bx2=b.x, by2=b.y;
  for(let i=0;i<16;i++){
    G.bossExpQueue.push({ delay:i*10, bx:bx2+rnd(-b.sz,b.sz), by:by2+rnd(-b.sz*0.8,b.sz*0.8) });
  }
  for(let ring=0;ring<3;ring++){ setTimeout(()=>{ spawnEx(b.x+rnd(-40,40),b.y+rnd(-30,30),ring===0?'#ffffff':ring===1?'#ffdd00':'#ff2200',34,8,14); shake(0.45); }, ring*180); }
  spawnEx(b.x,b.y,'#ffffff',28,8,14);
  spawnEx(b.x,b.y,'#ff4400',36,7,12);
  spawnDmgNum(b.x, b.y-b.sz, bScore, '#ffdd00', true);
  notify(`⚡ ${ENEMIES[b.key].name} DESTRUIDO ⚡`, '#ff2200', 240);
  notify(`+${bScore.toLocaleString()} pts`, '#ffdd00', 180);
  COMBO.reset();
  // Expanded boss drops — spawn near screen center so they're reachable
  const bossDrops = [
    'weapon','weapon','weapon',
    'companion','companion',
    'hp','hp',
    'shield','shield',
    'gold','gold','gold','gold','gold',
    'bomb','speed','ultralaser',
  ];
  // Enqueue drops — spawn 1-2 per frame to avoid lag spike
  G.bossDropQueue = G.bossDropQueue || [];
  const dropCX = W*0.45, dropCY = H/2;
  bossDrops.forEach((t,i)=>{
    const angle = (i/bossDrops.length)*TAU;
    const radius = 60 + Math.floor(i/6)*55;
    G.bossDropQueue.push({type:t, angle, radius, dropCX, dropCY});
  });
  G.missionGold = G.missionGold || 0;
  const bossGoldBonus = 60 + G.level * 20;
  G.gold += bossGoldBonus; G.missionGold += bossGoldBonus; saveMetaProgress();
  notify('+'+bossGoldBonus+' ORO DE JEFE 🪙', '#ffd54a', 200);
  notify('⭐ RECOGE LOS PREMIOS ANTES DE AVANZAR ⭐', '#ffdd00', 400);
  // Start collect phase — screen stays as GAME, timer counts down
  G.bossPhase = 'collect';
  G.bossCollectTimer = IS_DESKTOP ? 720 : 480;  // 12s desktop / 8s mobile
}

function collectPickup(p) {
  SFX.pickup();
  const SPEED_DUR = 22000; // ms — longer durations
  const def = PICKUP_DEFS[p.type] || {};
  switch(p.type){
    case 'hp':
      const heal = Math.round(G.pmaxhp*0.42);
      G.php=Math.min(G.pmaxhp,G.php+heal);
      notify(`+${heal} CASCO ❤`, '#ff4488', 90); SFX.shieldUp(); break;
    case 'shield':
      const sh = Math.round(G.pmaxsh*0.6);
      G.pshield=Math.min(G.pmaxsh,G.pshield+sh);
      notify(`+${sh} ESCUDO 🛡`, '#4488ff', 90); SFX.shieldUp(); break;
    case 'speed':
      G.speed=Math.min(12,G.speed+2.0);
      addActivePower('speed','TURBO','💨',SPEED_DUR/16,'#00ffcc');
      notify('TURBO ACTIVADO 💨', '#00ffcc', 100); SFX.powerUp();
      setTimeout(()=>G.speed=Math.max(G.ships[G.shipSel].speed,G.speed-2.0),SPEED_DUR); break;
    case 'magnet':
      G.magnetTimer = Math.max(G.magnetTimer, 720);
      addActivePower('magnet','IMÁN','🧲',720,'#66ffee');
      notify('IMÁN ATRACTOR ACTIVO', '#66ffee', 100); SFX.powerUp(); break;
    case 'shieldx':
      G.pshield=Math.min(G.pmaxsh+40,G.pshield+45);
      G.invTimer=Math.max(G.invTimer,80);
      notify('SHIELD PROTECTOR MEJORADO', '#88bbff', 100); SFX.shieldUp(); break;
    case 'ultralaser':
      G.beamCharges = Math.max(1, G.beamCharges+1);
      activateBeam(600); break;
    case 'bomb':
      G.enemies.forEach(e=>{
        e.hp-=e.maxhp*0.7;
        spawnEx(e.x,e.y,'#ff8800',10,4,5);
      });
      G.enemies=G.enemies.filter(e=>e.hp>0);
      G.eBullets=[]; spawnEx(W/2,H/2,'#ff8800',100,8,16);
      SFX.bigExplosion(); notify('💣 BOMBA TOTAL', '#ff8800', 120); break;
    case 'companion':
      G.companions=Math.min(getMaxCompanions(),G.companions+1);
      notify(`ESCOLTA ACTIVADO 🛸 ×${G.companions}`, '#ffdd00', 120); SFX.powerUp(); break;
    case 'part': {
      const pDef = SHIP_PARTS_DEFS[p.weapKey];
      if(pDef) {
        G.shipParts = G.shipParts || [];
        G.shipParts.push({id:p.weapKey, ...pDef});
        // Apply bonus immediately
        if(pDef.bonus.speed)  G.speed = Math.min(14, G.speed + pDef.bonus.speed);
        if(pDef.bonus.hp)   { G.pmaxhp += pDef.bonus.hp; G.php = Math.min(G.pmaxhp, G.php + pDef.bonus.hp); }
        if(pDef.bonus.sh)   { G.pmaxsh += pDef.bonus.sh; G.pshield = Math.min(G.pmaxsh, G.pshield + pDef.bonus.sh); }
        if(pDef.bonus.beamCharges) G.beamCharges = Math.max(G.beamCharges, G.beamCharges + pDef.bonus.beamCharges);
        if(pDef.bonus.all) {
          G.speed = Math.min(14, G.speed * (1+pDef.bonus.all));
          G.pmaxhp = Math.round(G.pmaxhp * (1+pDef.bonus.all)); G.php = Math.min(G.pmaxhp, G.php);
          G.pmaxsh = Math.round(G.pmaxsh * (1+pDef.bonus.all)); G.pshield = Math.min(G.pmaxsh, G.pshield);
        }
        notify(`⚙ ${pDef.name} INSTALADA! ${pDef.desc}`, '#ff9900', 200);
        flash('#ff9900', 12); SFX.levelUp();
      }
      break;
    }
    case 'gold':
      const amount = 30 + G.level*8;
      G.gold += amount; G.runGold += amount; G.missionGold += amount; saveMetaProgress();
      notify(`+${amount} ORO 🪙`, '#ffd54a', 70); break;
    case 'weapon':
      if(p.weapKey){
        const wd2=WEAPONS[p.weapKey];
        if(wd2 && wd2.type!=='atomic'){
          // Put in first non-active slot (not current slot)
          const slot = G.weapSlots.findIndex((wk,i)=>i!==G.slotSel && wk!==p.weapKey && i<5);
          const s = slot>=0 ? slot : (G.slotSel+1)%5;
          G.weapSlots[s]=p.weapKey;
          notify(`${wd2.icon} ${wd2.name} → RANURA ${s+1}`, wd2.color, 120); SFX.powerUp();
        }
      }
      break;
  }
}

function addActivePower(id, label, icon, frames, color) {
  G.activePowers = (G.activePowers||[]).filter(p=>p.id!==id);
  G.activePowers.push({id, label, icon, timer:frames, maxTimer:frames, color});
}

    cx.shadowBlur=0; cx.strokeStyle='#550000'; cx.lineWidth=1; cx.strokeRect(bbx-2,22,bw+4,16);

    const hint = ({hivemind:'vulnerable a viral/fuego',broodqueen:'vulnerable a rail/metralla',xenoking:'vulnerable a hoyo negro/rayo',voidseraph:'vulnerable a rayo',magmahydra:'vulnerable a fuego/misil',abysslord:'vulnerable a hoyo negro',stellarnest:'vulnerable a viral/plasma',frostwyrm:'vulnerable a rayo/metralla',eclipsecore:'vulnerable a rail/hoyo negro',omnimind:'vulnerable a combinaciones premium'})[G.boss.key] || 'analiza su patrón';

  // Gold indicator
  cx.fillStyle='#ffd54a'; cx.font='bold 10px Courier New';
  cx.fillText(`🪙${G.gold}`, bx, H-70);
  // Ship parts
  const parts = G.shipParts||[];
  if(parts.length>0){

  G.notifications = G.notifications || [];
  for(let i=G.notifications.length-1;i>=0;i--){
    const n=G.notifications[i]; n.t++;
    const alpha=Math.min(1,(n.dur-n.t)/30)*Math.min(1,n.t/10);
    if(alpha<=0){G.notifications.splice(i,1);continue;}
    cx.save(); cx.globalAlpha=alpha;
    cx.fillStyle=n.color; cx.shadowColor=n.color; cx.shadowBlur=8;
    cx.font=`bold ${Math.min(13,W*0.022)}px Courier New`; cx.textAlign='right';
    const ny=H*0.25-i*28+n.t*0.3;
    cx.fillText(n.text, W-14, ny);
    cx.restore();

function drawTopBtn(r, label, bgC, fgC) {
  cx.fillStyle='rgba(0,0,0,0.6)'; cx.strokeStyle=bgC; cx.lineWidth=1;
  rrect(r.x,r.y,r.w,r.h,6);
  cx.fillStyle=fgC; cx.font='16px sans-serif'; cx.textAlign='center';
  cx.fillText(label,r.x+r.w/2,r.y+r.h*0.66);
  cx.textAlign='left';
}

function hexR(h){
  return `${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`;
}
function rrect(x,y,w,h,r){
  cx.beginPath(); cx.moveTo(x+r,y); cx.lineTo(x+w-r,y);
  cx.quadraticCurveTo(x+w,y,x+w,y+r); cx.lineTo(x+w,y+h-r);
  cx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); cx.lineTo(x+r,y+h);
  cx.quadraticCurveTo(x,y+h,x,y+h-r); cx.lineTo(x,y+r);
  cx.quadraticCurveTo(x,y,x+r,y); cx.closePath(); cx.fill(); cx.stroke();
}

let menuFrame=0;
const VKEYS=[
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['Z','X','C','V','B','N','M','⌫'],
];
let vkeyRects=[];

function drawProfile() {
  menuFrame++;
  drawBG();
  cx.textAlign='center';

  cx.shadowColor='#00ff88'; cx.shadowBlur=20; cx.fillStyle='#00ff88';

  cx.shadowBlur=0;
  cx.font=`${Math.min(14,W*0.023)}px Courier New`; cx.fillStyle='#446655';
  cx.fillText('INTRODUCE TU NOMBRE DE GAMER',W/2,H*0.18);

  // Name display box
  const bw=Math.min(300,W*0.7), bh=46, bx2=W/2-bw/2, by2=H*0.24;
  cx.fillStyle='rgba(0,20,15,0.8)'; cx.strokeStyle='#00ff88'; cx.lineWidth=2;
  cx.shadowColor='#00ff88'; cx.shadowBlur=10;
  rrect(bx2,by2,bw,bh,8);
  cx.shadowBlur=0;
  const cursor=Math.floor(menuFrame/20)%2===0?'█':'';
  cx.fillStyle='#00ffaa'; cx.font=`bold ${Math.min(22,W*0.038)}px Courier New`;
  cx.fillText(G.nameInput+cursor,W/2,by2+30);

  // Virtual keyboard
  const kW=Math.min(W*0.9,400), kStart=(W-kW)/2;
  const kBw=kW/10-3, kBh=Math.min(40,H*0.062);
  const kTop=H*0.40;
  vkeyRects=[];
  VKEYS.forEach((row,ri)=>{
    const rowOff=ri*0.5*kBw;
    row.forEach((k,ki)=>{
      const kx=kStart+rowOff+ki*(kBw+3), ky=kTop+ri*(kBh+5);
      const isBS=k==='⌫';
      const kbw=isBS?kBw*1.5:kBw;
      vkeyRects.push({x:kx,y:ky,w:kbw,h:kBh,k});
      const isActive=false;
      cx.fillStyle='rgba(0,30,20,0.85)'; cx.strokeStyle=isActive?'#00ff88':'#224433'; cx.lineWidth=1;
      cx.shadowColor='transparent'; cx.shadowBlur=0;
      rrect(kx,ky,kbw,kBh,5);
      cx.fillStyle=isBS?'#ff4444':'#00cc88'; cx.font=`bold ${Math.min(13,kBw*0.7)}px Courier New`;
      cx.fillText(k,kx+kbw/2,ky+kBh*0.66);
    });
  });

  // Confirm button
  const ok=G.nameInput.length>=2;
  const cbW=Math.min(200,W*0.38), cbH=44, cbX=W/2-cbW/2, cbY=H*0.82;
  cx.fillStyle=ok?'rgba(0,255,136,0.18)':'rgba(50,50,50,0.4)';
  cx.strokeStyle=ok?'#00ff88':'#333'; cx.lineWidth=2;
  cx.shadowColor=ok?'#00ff88':'transparent'; cx.shadowBlur=ok?12:0;
  rrect(cbX,cbY,cbW,cbH,10);
  cx.shadowBlur=0;
  cx.fillStyle=ok?'#00ff88':'#444'; cx.font=`bold ${Math.min(16,W*0.028)}px Courier New`;
  cx.fillText(ok?'▶  CONTINUAR':'(mín. 2 letras)',W/2,cbY+cbH*0.62);

  // Skip if name already set
  cx.font='10px Courier New'; cx.fillStyle='#224433';
  if(G.gamerName) cx.fillText(`[Nombre actual: ${G.gamerName} — toca CONTINUAR]`,W/2,H*0.95);
  cx.textAlign='left';

  // Virtual keyboard tap
  cv.ontouchstart_profile_handled=true;
}

// Override handleProfileTap to handle virtual keyboard
function handleProfileTap(x, y) {
  // Virtual keys
  for(const r of vkeyRects){
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){
      if(r.k==='⌫') G.nameInput=G.nameInput.slice(0,-1);
      else if(G.nameInput.length<14) G.nameInput+=r.k;
      SFX.hit(); return;
    }
  }
  // Confirm button
  if(y>H*0.80 && G.nameInput.length>=2) confirmName();
  else if(y>H*0.80 && G.gamerName.length>=2) { G.nameInput=G.gamerName; confirmName(); }
}

function hitRect(x,y,r){ return r && x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }

function startMissionFromMenu() {
  requestGameFullscreen();
  applyShip();
  beginNewCampaign();
  G.screen='GAME';
  G.tutorialSeen = true; // sin tour invasivo
  SFX.gameStart();
}

function handleMenuTap(x, y) {
  if(hitRect(x,y,MENU_RECTS.fullscreen)){ requestGameFullscreen(); return; }
  if(hitRect(x,y,MENU_RECTS.start)){ startMissionFromMenu(); return; }
  if(hitRect(x,y,MENU_RECTS.load)){
    if(loadGame()){ requestGameFullscreen(); G.screen='GAME'; SFX.gameStart(); notify('PARTIDA CARGADA 💾','#00ffaa',180); }
    else notify('No hay partida guardada','#ff6677',140);
    return;
  }
  if(hitRect(x,y,MENU_RECTS.store)){ G.screen='STORE'; return; }
  if(hitRect(x,y,MENU_RECTS.manual)){ G.screen='MANUAL'; return; }
  if(hitRect(x,y,MENU_RECTS.rank)){ G.screen='LEADERBOARD'; return; }
  for(let i=0;i<4;i++){ if(hitRect(x,y,MENU_RECTS['diff'+i])){ G.difficulty=i; SFX.hit(); return; } }
  if(hitRect(x,y,MENU_RECTS.shipPrev)){ G.shipSel=Math.max(0,G.shipSel-1); SFX.hit(); return; }
  if(hitRect(x,y,MENU_RECTS.shipNext)){ G.shipSel=Math.min(G.ships.length-1,G.shipSel+1); SFX.hit(); return; }
}
