<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Visor limpio de estímulos K-BIT">
  <title>Visor de estímulos K-BIT</title>
  <style>
    :root{--bg:#f4f6f2;--panel:#ffffff;--ink:#1e2a28;--muted:#5b6864;--line:#d3d9ca;--accent:#2f6459;--accent-soft:#dce8e3;--danger:#963e31;--danger-soft:#f3e3de}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
    .shell{min-height:100vh;display:flex;flex-direction:column}
    .top{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;justify-content:space-between;gap:10px;align-items:center}
    .top h1{font-size:18px;margin:0;font-family:Georgia,serif}.top .meta{font-size:12px;color:var(--muted);margin-top:3px}
    .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 12px;font-weight:600}.btn.ghost{background:transparent;color:var(--accent)}
    .stage-wrap{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px}
    .stage{flex:1;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;padding:14px}
    .stage img{max-width:100%;max-height:calc(100vh - 170px);object-fit:contain;border-radius:8px}
    .empty{padding:28px;border:1px dashed var(--line);border-radius:12px;background:var(--panel);text-align:center;color:var(--muted)}
    .note{padding:10px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:12.5px;color:var(--muted)}
    .note.warn{border-color:#e0c2bb;background:var(--danger-soft);color:#6f3028}
    @media print {.top{display:none}.stage-wrap{padding:0}.stage{border:0;border-radius:0;padding:0}.stage img{max-height:none;width:100%}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div>
        <h1>Visor limpio de estímulos</h1>
        <div id="meta" class="meta">Esperando un estímulo desde la aplicación principal…</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" id="fit-btn">Ajustar</button>
        <button class="btn" id="fs-btn">Pantalla completa</button>
      </div>
    </div>
    <div class="stage-wrap">
      <div class="stage" id="stage"><div class="empty">Abre la aplicación principal y pulsa <strong>Visor limpio</strong> para sincronizar el estímulo actual.</div></div>
      <div id="note" class="note">Este visor muestra únicamente el estímulo actual y su estado de sincronización.</div>
    </div>
  </div>
  <script type="module" src="./assets/js/stimulus-viewer.js"></script>
</body>
</html>
