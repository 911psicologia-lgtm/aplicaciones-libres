let AC=null;
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,tp,v,dl,fe){tp=tp||'sine';v=v||0.2;dl=dl||0;try{const ac=getAC(),o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+dl;o.connect(g);g.connect(ac.destination);o.type=tp;o.frequency.setValueAtTime(f,t);if(fe)o.frequency.exponentialRampToValueAtTime(fe,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.start(t);o.stop(t+d+0.05);}catch(e){}}

let bgOn=false,bgLi=-1;
function stopBg(){bgOn=false;}
function startBg(li){
  if(bgOn&&bgLi===li)return;bgOn=true;bgLi=li;
  try{const ac=getAC();const scales=[[261,294,330,349,392,440,494,523],[277,311,370,415,466,554,622,740],[246,277,311,330,370,415,466,493],[261,311,349,392,440,493,523,587]];const sc=scales[li%4];const seq=[0,2,4,2,0,4,3,2,4,2,0,2,4,6,5,4];let t=ac.currentTime+0.1;function sched(){if(!bgOn)return;seq.forEach((n,i)=>{tone(sc[n%sc.length],0.3,'sine',0.07,t-ac.currentTime+i*0.18);tone(sc[n%sc.length]*2,0.15,'sine',0.025,t-ac.currentTime+i*0.18+0.09);});t+=seq.length*0.18;setTimeout(sched,(seq.length*0.18-0.2)*1000);}sched();}catch(e){}
}

// INPUT
const keys={left:false,right:false};
let leftHeld=false,rightHeld=false,shootHeld=false;
let jumpReq=false,djumpReq=false,dropReq=false,shootPressed=false;
let lastTap=0;
const AT={};
const TOUCH_UI={jump:{x:696,y:388,r:56},down:{x:716,y:456,r:34}};
let kidMoveTarget=null;
let kidMoveMarker={x:0,life:0};
let kidDragPointer=null;
let kidDragScreenX=null;
function sc2lg(cx,cy){const r=C.getBoundingClientRect();return{x:(cx-r.left)*LW/r.width,y:(cy-r.top)*LH/r.height};}
function inCircle(x,y,cx,cy,r){return Math.hypot(x-cx,y-cy)<=r;}
function inJumpBtn(x,y){return inCircle(x,y,TOUCH_UI.jump.x,TOUCH_UI.jump.y,TOUCH_UI.jump.r);}
function inDownBtn(x,y){return inCircle(x,y,TOUCH_UI.down.x,TOUCH_UI.down.y,TOUCH_UI.down.r);}
function inPauseBtn(x,y){return x>(LW-48)&&y<48;}
function pointNearPrincess(x,y){if(!player||ST!=='playing')return false;const px=player.x-camX+player.w/2,py=player.y+player.h*0.48;return Math.hypot(x-px,y-py)<68;}
function setKidMoveTarget(worldX){if(!player)return;kidMoveTarget=Math.max(player.w*0.5,Math.min(LVW-player.w*0.5,worldX));kidMoveMarker={x:kidMoveTarget,life:1};}
function clearKidDrag(pointerId){if(kidDragPointer===pointerId){kidDragPointer=null;kidDragScreenX=null;}}
function getKidDesiredWorldX(){if(kidDragPointer!==null&&kidDragScreenX!==null)return camX+kidDragScreenX;return kidMoveTarget;}
function updateKidMarker(){if(kidMoveMarker.life>0)kidMoveMarker.life=Math.max(0,kidMoveMarker.life-0.03);}
function kidAutoShoot(){
  if(!KID_MODE||ST!=='playing'||!player)return false;
  if(bossObj&&bossObj.awake&&!bossObj.dead)return true;
  let near=false;
  enemies.forEach(e=>{if(near||e.dead)return;const dx=Math.abs((player.x+player.w/2)-e.x),dy=Math.abs((player.y+player.h/2)-e.y);if(dx<360&&dy<140)near=true;});
  return near;
}
C.addEventListener('pointerdown',e=>{
  e.preventDefault();getAC();const p=sc2lg(e.clientX,e.clientY);
  if(ST!=='playing'){AT[e.pointerId]={type:'ui',x:p.x,y:p.y,t:Date.now(),moved:false};return;}
  if(inPauseBtn(p.x,p.y)){handleClick(p.x,p.y);AT[e.pointerId]={type:'ui'};return;}
  if(inJumpBtn(p.x,p.y)){jumpReq=true;AT[e.pointerId]={type:'jumpBtn'};return;}
  if(inDownBtn(p.x,p.y)){dropReq=true;AT[e.pointerId]={type:'downBtn'};return;}
  if(p.y<70){AT[e.pointerId]={type:'ui'};return;}
  if(pointNearPrincess(p.x,p.y)){
    kidDragPointer=e.pointerId;kidDragScreenX=p.x;kidMoveTarget=null;kidMoveMarker.life=0;
    AT[e.pointerId]={type:'dragPrincess',x:p.x,y:p.y,t:Date.now(),moved:false};
    return;
  }
  setKidMoveTarget(camX+p.x);
  AT[e.pointerId]={type:'moveTarget',x:p.x,y:p.y,t:Date.now(),moved:false};
},{passive:false});
C.addEventListener('pointermove',e=>{
  e.preventDefault();const t=AT[e.pointerId];if(!t)return;const p=sc2lg(e.clientX,e.clientY);
  if(t.type==='dragPrincess'){
    if(Math.abs(p.x-t.x)>4||Math.abs(p.y-t.y)>4)t.moved=true;
    kidDragScreenX=p.x;t.x=p.x;t.y=p.y;
    return;
  }
  if(t.type==='moveTarget'){
    if(Math.abs(p.x-t.x)>6||Math.abs(p.y-t.y)>6)t.moved=true;
    if(t.moved)setKidMoveTarget(camX+p.x);
    t.x=p.x;t.y=p.y;
    return;
  }
  if(t.type==='ui'){if(Math.abs(p.x-t.x)>6||Math.abs(p.y-t.y)>6)t.moved=true;t.x=p.x;t.y=p.y;}
},{passive:false});
function relTouch(e){
  e.preventDefault();const t=AT[e.pointerId];if(!t)return;const p=sc2lg(e.clientX,e.clientY);
  if(t.type==='dragPrincess'){clearKidDrag(e.pointerId);}
  else if(t.type==='moveTarget'){if(!t.moved)setKidMoveTarget(camX+p.x);}
  delete AT[e.pointerId];
}
C.addEventListener('pointerup',relTouch,{passive:false});
C.addEventListener('pointercancel',e=>{clearKidDrag(e.pointerId);delete AT[e.pointerId];},{passive:false});
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;
  if(['ArrowRight','d','D'].includes(e.key))keys.right=true;
  if([' ','ArrowUp','w','W'].includes(e.key)){e.preventDefault();if(!e.repeat){const now=Date.now();if(now-lastTap<300)djumpReq=true;else jumpReq=true;lastTap=now;}}
  if(['ArrowDown','s','S'].includes(e.key)&&!e.repeat){e.preventDefault();dropReq=true;}
  if(['z','Z','x','X'].includes(e.key)&&!e.repeat)shootPressed=true;
  if(['Escape','p','P'].includes(e.key)){if(ST==='playing')ST='paused';else if(ST==='paused')ST='playing';}
});
document.addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false;});

function castRoyalBurst(){
  if(!player||royalEnergy<100)return;
  royalEnergy=0;royalReady=false;
  for(let i=0;i<10;i++){
    const a=i*Math.PI*2/10;
    bullets.push({x:player.x+player.w/2,y:player.y+player.h*0.42,vx:Math.cos(a)*6.8,vy:Math.sin(a)*4.4,life:52,col:['#FFD700','#FF69B4','#87CEEB','#FFFFFF'][i%4],dmg:2,pierce:1});

}

function buildExtendedLevel(ld,li){
  const plats=ld.plats.map(p=>p.slice());
  plats[0]=[0,440,LVW,60];
  const ens=ld.ens.map(e=>Object.assign({},e));
  const pups=ld.pups.map(p=>Object.assign({},p));
  const bonusCycle=['rabbit','fox','owl','unicorn','shield','strength','cat','dragon','elephant','chicken'];
  const enemyCycle=['vampire','bat','pumpkin','zombie','spider','shadow','skeleton','troll','witch','ogre'];
  for(let s=0;s<7;s++){
    const base=3080+s*280;
    const y1=345-((li*17+s*31)%96);
    const y2=Math.max(220,y1-42-((s+li)%2)*10);
    const y3=Math.max(210,y2-28+((s+li)%3)*8);
    plats.push([base,y1,150+((s+li)%3)*24,18+((s+li)%2)*2]);
    plats.push([base+165,y2,170+((s*2+li)%4)*20,18+((s+1)%2)*2]);
    plats.push([base+350,y3,130+((s+li)%2)*24,18]);
    const t1=enemyCycle[(s+li*2)%enemyCycle.length];
    const t2=enemyCycle[(s+li*2+3)%enemyCycle.length];
    ens.push({t:t1,x:base+90,hp:(li>5&&['troll','ogre','shadow'].includes(t1))?3:undefined});
    ens.push({t:t2,x:base+250,y:['bat','witch','shadow'].includes(t2)?y2-86:undefined,hp:(li>6&&['witch','ogre'].includes(t2))?3:undefined});
    if(s===2||s===5){ens.push({t:li>4?'ogre':'troll',x:base+390,hp:3});}
    pups.push({t:bonusCycle[(li+s)%bonusCycle.length],x:base+115,y:y1-30});
    if(s%3===1)pups.push({t:bonusCycle[(li+s+4)%bonusCycle.length],x:base+355,y:y3-30});
  }

function mkEn(type,x,y,spd){

    case'ogre':e.vx=0.8*spd;e.hp=2;e.maxhp=2;break;case'pumpkin':e.vx=1.5*spd;break;

// === DRAWING ===
function wx(x){return(x-camX)*S;}// world x to screen x
function wy(y){return y*S;}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function st5(cx,cy,r1,r2){ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?r2:r1,a=i*Math.PI/5-Math.PI/2;i?ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath();}

// DRAW PLATFORM
function drawPlat(p){
  const sx=wx(p.x),sy=wy(p.y),sw=p.w*S,sh=p.h*S;
  if(sx+sw<0||sx>C.width)return;
  const theme=LVLS[LEVEL].theme;

  ctx.fillStyle=c[1];ctx.fillRect(sx,sy,sw,sh);
  ctx.fillStyle=c[0];ctx.fillRect(sx,sy,sw,Math.min(7*S,sh));
  ctx.fillStyle=c[2];ctx.fillRect(sx,sy+sh-4*S,sw,4*S);
  ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(sx,sy,sw,2*S);

  ctx.strokeStyle=po.active?'#FFD700':'#9966CC';ctx.lineWidth=4*S;ctx.beginPath();ctx.arc(sx,sy,20*S,0,Math.PI*2);ctx.stroke();
  if(po.active)for(let i=0;i<4;i++){const a=TICK*0.05+i*Math.PI/2;st5(sx+Math.cos(a)*26*S,sy+Math.sin(a)*26*S,5*S,3*S);ctx.fillStyle='#FFD700';ctx.fill();}
  ctx.globalAlpha=1;ctx.fillStyle=po.active?'#FFD700':'rgba(200,200,200,0.4)';ctx.font=`bold ${13*S}px Arial`;ctx.textAlign='center';ctx.fillText('PORTAL',sx,(sy-28)*S/S);ctx.textAlign='left';
}

// DRAW COLLECTIBLE
function drawCollect(c){
  if(c.got)return;const sx=wx(c.x);if(sx<-30*S||sx>C.width+30*S)return;

  switch(c.type){
    case'heart':ctx.fillStyle='#FF0066';ctx.beginPath();ctx.moveTo(0,4*S);ctx.bezierCurveTo(-10*S,-4*S,-13*S,-11*S,-4*S,-11*S);ctx.bezierCurveTo(0,-14*S,0,-9*S,0,-7*S);ctx.bezierCurveTo(0,-9*S,0,-14*S,4*S,-11*S);ctx.bezierCurveTo(13*S,-11*S,10*S,-4*S,0,4*S);ctx.fill();break;
    case'star':ctx.fillStyle='#FFD700';st5(0,0,12*S,5*S);ctx.fill();break;
    case'cupcake':ctx.fillStyle='#D2691E';ctx.beginPath();ctx.moveTo(-8*S,8*S);ctx.lineTo(-6*S,-4*S);ctx.lineTo(6*S,-4*S);ctx.lineTo(8*S,8*S);ctx.fill();ctx.fillStyle='#FF69B4';ctx.beginPath();ctx.ellipse(0,-6*S,9*S,7*S,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FF0000';ctx.beginPath();ctx.arc(0,-13*S,3*S,0,Math.PI*2);ctx.fill();break;
    case'candy':ctx.strokeStyle='#FF4444';ctx.lineWidth=4*S;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,-3*S,8*S,Math.PI,0);ctx.stroke();ctx.strokeStyle='white';ctx.lineWidth=2*S;ctx.beginPath();ctx.arc(0,-3*S,8*S,Math.PI,0);ctx.stroke();ctx.strokeStyle='#FF4444';ctx.lineWidth=4*S;ctx.beginPath();ctx.moveTo(-8*S,-3*S);ctx.lineTo(-8*S,9*S);ctx.stroke();break;
    case'gem':ctx.fillStyle='#00BFFF';ctx.beginPath();ctx.moveTo(0,-13*S);ctx.lineTo(9*S,-4*S);ctx.lineTo(9*S,4*S);ctx.lineTo(0,11*S);ctx.lineTo(-9*S,4*S);ctx.lineTo(-9*S,-4*S);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,255,255,0.45)';ctx.beginPath();ctx.moveTo(0,-13*S);ctx.lineTo(4*S,-6*S);ctx.lineTo(0,-1*S);ctx.lineTo(-4*S,-6*S);ctx.closePath();ctx.fill();break;

// DRAW POWER-UP ITEM
function drawPUI(pu){
  if(pu.got)return;const sx=wx(pu.x);if(sx<-40*S||sx>C.width+40*S)return;

  const g=ctx.createRadialGradient(0,0,0,0,0,20*S);g.addColorStop(0,col);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.globalAlpha=0.5+Math.sin(TICK*0.1)*0.3;ctx.beginPath();ctx.arc(0,0,20*S,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  // Box
  ctx.fillStyle=col;rr(-14*S,-14*S,28*S,28*S,5*S);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2*S;rr(-14*S,-14*S,28*S,28*S,5*S);ctx.stroke();

  ctx.fillStyle='white';ctx.font=`bold ${11*S}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(PU_ICONS[pu.type]||'?',0,0);ctx.textBaseline='alphabetic';ctx.textAlign='left';

// DRAW PLAYER (with transformation)
function drawPlayer(p){
  const sx=wx(p.x+p.w/2),sy=wy(p.y+p.h);
  if(p.inv>0&&Math.floor(p.inv/4)%2===1)ctx.globalAlpha=0.45;
  ctx.save();ctx.translate(sx,sy);ctx.scale(p.facing,1);
  if(activePU){
    switch(activePU.type){
      case'cat':drawPlayerCatForm();break;
      case'chicken':drawPlayerChickenForm();break;
      case'elephant':drawPlayerElephantForm();break;
      case'witch':drawPlayerWitchForm();break;
      case'dragon':drawPlayerDragonForm();break;
      case'rabbit':drawPlayerRabbitForm();break;
      case'fox':drawPlayerFoxForm();break;
      case'owl':drawPlayerOwlForm();break;
      case'unicorn':drawPlayerUnicornForm();break;
      default:drawPlayerNormal();break;

// === PHYSICS ===
function platLand(obj,w,h){
  let landed=false;
  platforms.forEach(pl=>{
    if(obj.dropTimer>0&&pl!==platforms[0])return;
    if(obj.x+w>pl.x&&obj.x<pl.x+pl.w&&obj.y+h>pl.y&&obj.y+h<pl.y+pl.h+Math.abs(obj.vy)+8&&obj.vy>=0){obj.y=pl.y-h;obj.vy=0;landed=true;}
  });
  return landed;
}
function supportPlatform(obj){
  let found=null;
  platforms.forEach(pl=>{
    if(obj.x+obj.w>pl.x&&obj.x<pl.x+pl.w&&Math.abs(obj.y+obj.h-pl.y)<=10&&obj.vy>=0)found=pl;
  });
  return found;
}

function updatePlayer(){
  const p=player;if(!p)return;
  const pu=activePU,pt=pu?pu.type:'';
  const isFlying=pu&&['witch','dragon','chicken','owl','unicorn'].includes(pt);
  const isElephant=pt==='elephant',isCat=pt==='cat',isRabbit=pt==='rabbit',isFox=pt==='fox',isOwl=pt==='owl',isUnicorn=pt==='unicorn';
  const pSpeed=isFox?6.6:isRabbit?5.9:isCat?5.5:isUnicorn?5.2:isElephant?2.2:4.3;
  const pJump=isRabbit?-14:isCat?-12:isElephant?-8:isUnicorn?-13:pt==='strength'?-13:-11.5;
  const maxJumps=isFlying?99:(isRabbit||isCat||isUnicorn?3:2);
  const accel=isFlying?0.42:isElephant?0.35:isFox?0.72:0.6;

  const desiredX=getKidDesiredWorldX();
  let kidDir=0;
  if(desiredX!==null){
    const dx=desiredX-(p.x+p.w/2);
    const tol=kidDragPointer!==null?5:16;
    if(Math.abs(dx)<=tol){
      if(kidDragPointer===null)kidMoveTarget=null;
    }else kidDir=dx>0?1:-1;
  }
  const goL=keys.left||leftHeld||kidDir<0,goR=keys.right||rightHeld||kidDir>0;
  if(goL){p.vx-=accel;p.facing=-1;}
  if(goR){p.vx+=accel;p.facing=1;}
  p.vx*=(isFlying?0.89:0.82);if(Math.abs(p.vx)>pSpeed)p.vx=Math.sign(p.vx)*pSpeed;

  if(jumpReq){
    if(isFlying){p.vy=Math.max(p.vy-3.4,-5.6);sfxJump();}
    else if(p.jumps<maxJumps){p.vy=pJump;p.jumps++;p.jumps===1?sfxJump():sfxJump2();spawnP(p.x+p.w/2,p.y+p.h,5,['#FFD700','#FF69B4'],2);}
  }
  if(djumpReq&&!isFlying&&p.jumps<maxJumps){p.vy=pJump*0.88;p.jumps++;sfxJump2();spawnP(p.x+p.w/2,p.y+p.h,8,['#FFD700','#FFFFFF','#FF69B4'],3);}
  if(dropReq&&!isFlying){
    const pl=supportPlatform(p);
    if(pl&&pl!==platforms[0]){
      p.dropTimer=18;p.onGround=false;p.y+=12;p.vy=Math.max(p.vy,2.8);p.jumps=Math.min(Math.max(p.jumps,1),maxJumps-1);
      spawnP(p.x+p.w/2,p.y+p.h,6,['#87CEEB','#FFFFFF','#FFD700'],3);
    }
  }
  jumpReq=false;djumpReq=false;dropReq=false;

  if(isFlying&&p.vy>0&&(shootHeld||leftHeld||rightHeld))p.vy*=pt==='owl'?0.86:0.9;

  const sh=shootHeld||shootPressed||kidAutoShoot();shootPressed=false;
  if(sh&&royalReady&&p.shootCD<=0)castRoyalBurst();
  if(sh&&p.shootCD<=0){
    const cx=p.x+p.w/2,cy=p.y+p.h*0.38;
    if(pt==='dragon'){
      bullets.push({x:p.x+(p.facing>0?p.w+2:-2),y:cy,vx:9.2*p.facing,vy:(Math.random()-0.5)*2,life:32,fire:true,col:'#FF7A00',dmg:2});
      bullets.push({x:cx,y:cy-6,vx:8.2*p.facing,vy:-1.2,life:26,fire:true,col:'#FFD700'});
    } else if(pt==='witch'){
      [-2,0,2].forEach(vy=>bullets.push({x:cx,y:cy,vx:8.2*p.facing,vy,life:42,col:'#C084FC',dmg:1}));
    } else if(pt==='fox'){
      [-2.3,0,2.3].forEach(vy=>bullets.push({x:cx,y:cy,vx:8.4*p.facing,vy,life:40,col:'#FF7F50',dmg:1}));
    } else if(pt==='owl'){
      [-1,1].forEach(vy=>bullets.push({x:cx,y:cy+vy*2,vx:7.2*p.facing,vy,life:52,col:'#8FD3FF',dmg:1,homing:true}));
    } else if(pt==='unicorn'){
      [-1.8,0,1.8].forEach((vy,i)=>bullets.push({x:cx,y:cy+(i-1)*3,vx:8.6*p.facing,vy,life:48,col:['#FF69B4','#FFD700','#87CEEB'][i],dmg:2,pierce:1}));
    } else if(pt==='rabbit'){
      bullets.push({x:cx,y:cy,vx:8.8*p.facing,vy:0,life:46,col:'#FF8FAB',dmg:1,pierce:1});
      bullets.push({x:cx,y:cy-5,vx:7.8*p.facing,vy:-0.8,life:32,col:'#FFD1DC'});
    } else if(pt==='elephant'){
      bullets.push({x:cx,y:cy,vx:6.4*p.facing,vy:0,life:44,col:'#9B59B6',dmg:2,big:true});
    } else if(pt==='chicken') {
      bullets.push({x:cx,y:cy-2,vx:7.6*p.facing,vy:-0.7,life:38,col:'#FFD700'});
      bullets.push({x:cx,y:cy+2,vx:7.2*p.facing,vy:0.7,life:38,col:'#FFC000'});
    } else if(pt==='cat') {
      bullets.push({x:cx,y:cy,vx:7.8*p.facing,vy:0,life:40,col:'#FFA500'});
      bullets.push({x:cx,y:cy-6,vx:7.1*p.facing,vy:-0.8,life:34,col:'#FFCC80'});
    } else {
      bullets.push({x:p.x+(p.facing>0?p.w+2:-2),y:cy-3,vx:7.4*p.facing,vy:-0.45,life:42,col:'#FFD700'});
      bullets.push({x:p.x+(p.facing>0?p.w+2:-2),y:cy+3,vx:7.4*p.facing,vy:0.45,life:42,col:'#FF9AD7'});
    }
    p.shootCD=(pt==='witch'||pt==='dragon'||pt==='fox'||pt==='owl')?10:(pt==='rabbit'?9:15);sfxShoot();
  }
  if(p.shootCD>0)p.shootCD--;

  if(p.dropTimer>0)p.dropTimer--;
  if(isFlying){p.vy+=pt==='owl'?0.14:0.18;if(p.vy>5)p.vy=5;}else p.vy+=0.48;

  p.y+=p.vy;p.x+=p.vx;
  p.x=Math.max(camX,Math.min(LVW-p.w,p.x));

  p.onGround=platLand(p,p.w,p.h);
  if(p.onGround){p.jumps=0;if(pt==='rabbit'&&Math.abs(p.vx)>4)awardRoyalEnergy(0.15);}

  if(p.y>LH+120){rescueFromFall();if(ST==='gameOver')return;}
  if(p.inv>0)p.inv--;

  if(isElephant&&!p.onGround&&p.vy>3){
    enemies.forEach(e=>{if(!e.dead&&Math.abs(p.x+p.w/2-e.x)<40&&Math.abs(p.y+p.h-e.y)<50){e.dead=true;SCORE+=200;awardRoyalEnergy(10);sfxDie();spawnP(e.x,e.y,10,['#9B59B6','#FFD700']);}});
  }

  if(SCORE>=nextLifeScore){LIVES++;nextLifeScore+=2000;sfxLife();spawnP(player.x+player.w/2,player.y,12,['#FF0066','#FFD700','#00FF88'],5);awardRoyalEnergy(12);}

  if(activePU){activePU.timer--;if(activePU.timer<=0)activePU=null;}
  updateCamera();
}

function updateCat(){
  if(!cat||!player)return;
  cat.x+=(player.x-80-cat.x)*0.07;cat.y+=(player.y-cat.y)*0.09;
  if(cat.happy>0)cat.happy--;
  if(cat.shootCd>0){cat.shootCd--;return;}
  let nearest=null,nd=240;enemies.forEach(e=>{if(e.dead)return;const d=Math.abs(e.x-cat.x)+Math.abs(e.y-cat.y);if(d<nd){nd=d;nearest=e;}});
  if(nearest){catBullets.push({x:cat.x,y:cat.y-14,vx:nearest.x>cat.x?4.5:-4.5,vy:-0.5,life:55});sfxCat();cat.shootCd=75;}
}

function updatePony(){

  pony.frame++;
  const gp=platforms[0];
  if(pony.state==='follow'){
    const tx=player.x-100*(player.facing>0?1:-1);
    pony.vx+=(tx-pony.x)*0.04;pony.vx*=0.84;pony.vy+=0.4;pony.y+=pony.vy;pony.x+=pony.vx;
    const onG=platLand(pony,40,36);if(onG){pony.vy=0;}if(pony.y>gp.y+10){pony.y=gp.y-36;pony.vy=0;}
    pony.dir=pony.vx>0.3?1:pony.vx<-0.3?-1:pony.dir;
    if(pony.chargeCd>0){pony.chargeCd--;return;}
    let near=null,nd=280;enemies.forEach(e=>{if(e.dead)return;const d=Math.abs(e.x-pony.x)+Math.abs(e.y-pony.y);if(d<nd){nd=d;near=e;}});

      // Spawn pony bullets sparkle
      for(let i=0;i<4;i++)ponyBullets.push({x:t.x,y:t.y,vx:(Math.random()-0.5)*5,vy:-3-Math.random()*3,life:30});}
    if(Math.abs(pony.x-player.x)>600){pony.state='follow';pony.vx=0;}
  }
}

function updateEnemies(){
  const gp=platforms[0];
  enemies.forEach(e=>{
    if(e.dead)return;e.timer++;
    switch(e.type){
      case'vampire':case'zombie':case'skeleton':case'troll':case'ogre':
        e.x+=e.vx*e.dir;
        let on=false;platforms.forEach(pl=>{if(e.x+12>pl.x&&e.x-12<pl.x+pl.w&&Math.abs(e.y-pl.y)<=8)on=true;});
        if(!on||e.x<10||e.x>LVW-10)e.dir*=-1;break;
      case'bat':case'witch':case'shadow':
        e.x+=e.vx*e.dir;e.y=e.floatY+Math.sin(e.timer*e.floatS)*e.floatA;
        if(e.x<10||e.x>LVW-10)e.dir*=-1;break;
      case'pumpkin':
        e.x+=e.vx*e.dir;e.vy+=0.3;e.y+=e.vy;
        platforms.forEach(pl=>{if(e.x+10>pl.x&&e.x-10<pl.x+pl.w&&e.y>pl.y-6&&e.y<pl.y+pl.h){e.y=pl.y;e.vy=-7.5;}});
        if(e.x<10||e.x>LVW-10)e.dir*=-1;break;
      case'spider':
        if(e.dropping){e.y+=1.8;if(e.y>=gp.y-32){e.dropping=false;e.y=gp.y-32;}}
        else{e.x+=e.vx*e.dir;if(e.x<10||e.x>LVW-10)e.dir*=-1;}break;
    }
    if(e.hitFlash>0)e.hitFlash--;
  });
}

function updateBullets(){
  bullets=bullets.filter(b=>{
    if(b.homing){
      let near=null,nd=9999;enemies.forEach(e=>{if(e.dead)return;const d=Math.abs(e.x-b.x)+Math.abs(e.y-b.y);if(d<nd){nd=d;near=e;}});
      if((!near||nd>240) && bossObj && bossObj.awake && !bossObj.dead) near={x:bossObj.x,y:bossObj.y-bossObj.h*0.5};
      if(near){b.vx+=(near.x>b.x?0.28:-0.28);b.vy+=(near.y>b.y?0.08:-0.08);const lim=8.4;if(Math.abs(b.vx)>lim)b.vx=Math.sign(b.vx)*lim;if(Math.abs(b.vy)>3)b.vy=Math.sign(b.vy)*3;}
    }
    b.x+=b.vx;b.y+=b.vy;b.life--;if(b.life<=0)return false;
    let remove=false;
    enemies.forEach(e=>{
      if(e.dead||remove)return;
      if(Math.abs(b.x-e.x)<22+(b.big?6:0)&&Math.abs(b.y-e.y)<26+(b.big?6:0)){
        e.hp-=(b.dmg||1);e.hitFlash=8;shake=Math.max(shake,2);
        if(e.hp<=0){e.dead=true;SCORE+=100+(b.dmg||1)*15;awardRoyalEnergy(8);sfxDie();spawnP(e.x,e.y,12,['#FFD700','#FF69B4','#FFA500','#FFFFFF'],5);addDmgText(e.x,e.y-20,'+KO','#FFD700',13);}
        else{sfxHit();awardRoyalEnergy(3);spawnP(e.x,e.y,6,['#FFFFFF','#FFD700','#FF69B4'],3);addDmgText(e.x,e.y-22,'-'+(b.dmg||1),'#FFF0A8',11);}
        if(b.pierce){b.pierce--;if(b.pierce<=0)remove=true;}else remove=true;
      }
    });
    if(!remove && bossObj && bossObj.awake && !bossObj.dead){
      const hb=bossHitbox(bossObj);
      if(b.x>hb.x && b.x<hb.x+hb.w && b.y>hb.y && b.y<hb.y+hb.h){
        const dmg=Math.max(1,b.dmg||1);bossObj.hp-=dmg;bossObj.hitFlash=10;shake=Math.max(shake,4);sfxHit();awardRoyalEnergy(5);spawnP(b.x,b.y,10,[bossObj.accent,'#FFFFFF','#FFD700'],4);addDmgText(bossObj.x,bossObj.y-bossObj.h-10,'-'+dmg,bossObj.accent,14);
        if(b.pierce){b.pierce--;if(b.pierce<=0)remove=true;}else remove=true;
      }
    }
    return !remove;
  });
  catBullets=catBullets.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;b.life--;if(b.life<=0)return false;let hit=false;
    enemies.forEach(e=>{if(e.dead||hit)return;if(Math.abs(b.x-e.x)<20&&Math.abs(b.y-e.y)<24){e.hp--;e.hitFlash=8;if(e.hp<=0){e.dead=true;SCORE+=80;awardRoyalEnergy(6);sfxDie();spawnP(e.x,e.y,8,['#00FF00','#7FFF00','#FFFFFF'],4);addDmgText(e.x,e.y-20,'MIAU!','#7FFF00',11);}else addDmgText(e.x,e.y-18,'-1','#C9FFB6',10);hit=true;cat.happy=25;}});
    if(!hit && bossObj && bossObj.awake && !bossObj.dead){const hb=bossHitbox(bossObj);if(b.x>hb.x&&b.x<hb.x+hb.w&&b.y>hb.y&&b.y<hb.y+hb.h){bossObj.hp-=1;bossObj.hitFlash=8;hit=true;cat.happy=30;spawnP(b.x,b.y,7,['#7FFF00','#FFFFFF'],3);addDmgText(bossObj.x,bossObj.y-bossObj.h-6,'-1','#B8FF88',11);}}
    return !hit;
  });
  ponyBullets=ponyBullets.filter(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;return b.life>0;});
  updateBossBullets();
}

function checkEnemyCollision(){

  const hasStrength=activePU&&activePU.type==='strength';

  enemies.forEach(e=>{
    if(e.dead)return;
    if(Math.abs(p.x+p.w/2-e.x)<(KID_MODE?20:24)&&Math.abs(p.y+p.h/2-e.y)<(KID_MODE?24:28)){
      if(hasShield){shieldHits--;e.hp=0;e.dead=true;SCORE+=120;awardRoyalEnergy(10);sfxDie();shake=Math.max(shake,3);spawnP(e.x,e.y,10,['#00BFFF','#FFD700','#FFFFFF'],5);addDmgText(e.x,e.y-20,'ESCUDO','#8FD3FF',11);if(shieldHits<=0)activePU=null;return;}
      if(hasStrength||hasDragon||hasRoyalBeast){e.hp=0;e.dead=true;SCORE+=150;awardRoyalEnergy(12);sfxDie();shake=Math.max(shake,4);spawnP(e.x,e.y,12,['#FF4500','#FFD700','#FFFFFF'],5);addDmgText(e.x,e.y-20,'IMPACTO','#FFD700',12);return;}
      if(p.vy>1.5&&p.y+p.h<e.y+14){
        e.hp--;awardRoyalEnergy(6);shake=Math.max(shake,2);
        if(e.hp<=0){e.dead=true;SCORE+=150;sfxDie();spawnP(e.x,e.y,12,['#FFD700','#FF69B4','#FFFFFF'],5);addDmgText(e.x,e.y-20,'SALTO!','#FFD700',12);}
        else{e.hitFlash=12;sfxHit();spawnP(e.x,e.y,6,['#FFFFFF','#FFD700'],3);addDmgText(e.x,e.y-18,'-1','#FFF0A8',10);}
        p.vy=-9;spawnP(p.x+p.w/2,p.y+p.h,5,['#FFD700']);
      } else {
        hitPrincess('enemy');
      }
    }
  });
  if(bossObj && bossObj.awake && !bossObj.dead){
    const hb=bossHitbox(bossObj);
    if(p.x+p.w>hb.x && p.x<hb.x+hb.w && p.y+p.h>hb.y && p.y<hb.y+hb.h){
      if(hasShield){
        shieldHits--;bossObj.hp-=2;bossObj.hitFlash=10;shake=Math.max(shake,5);spawnP(p.x+p.w/2,p.y+p.h/2,16,['#00BFFF','#FFFFFF','#FFD700'],5);addDmgText(bossObj.x,bossObj.y-bossObj.h-12,'-2','#8FD3FF',14);if(shieldHits<=0)activePU=null;
      } else if(hasStrength||hasDragon||hasRoyalBeast || (p.vy>1.8&&p.y+p.h<hb.y+18)){
        bossObj.hp-=(hasDragon||hasStrength?3:2);bossObj.hitFlash=12;p.vy=-9;shake=Math.max(shake,6);sfxHit();spawnP(bossObj.x,bossObj.y-bossObj.h/2,18,[bossObj.accent,'#FFFFFF','#FFD700'],6);addDmgText(bossObj.x,bossObj.y-bossObj.h-12,hasDragon||hasStrength?'-3':'-2',bossObj.accent,15);
      } else {
        hitPrincess('boss');
      }
    }
  }
}
function checkPortal(){
  if(!portalObj.active||!player)return;
  if(Math.abs(player.x+player.w/2-portalObj.x)<(KID_MODE?52:36)&&Math.abs(player.y+player.h/2-portalObj.y)<(KID_MODE?52:36)){
    sfxPortal();sfxLevel();SCORE+=500+collected*25;LIVES++;sfxLife();// Life bonus per level
    ST='levelComplete';stopBg();save();saveRank();
  }
}

// CLICK / TAP HANDLER
C.addEventListener('click',e=>{const p=sc2lg(e.clientX,e.clientY);handleClick(p.x,p.y);});
function handleClick(cx,cy){
  if(ST==='birthday'){
    if(Math.abs(cx-LW/2)<90&&Math.abs(cy-LH*0.62)<90){if(!bdClicked){bdClicked=true;if(!bdPlayed){playHBD();bdPlayed=true;}for(let i=0;i<32;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*6;bdParts2.push({x:LW/2,y:LH*0.62,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:1,col:['#FF69B4','#FFD700','#87CEEB','#98FB98','#DDA0DD'][Math.floor(Math.random()*5)],sz:18+Math.random()*12});}setTimeout(()=>ST='menu',3200);}}
    else if(!bdClicked)ST='menu';return;
  }
  if(storyTimer>0){storyTimer=0;return;}
  if(ST==='menu'){if(cy>LH*0.37&&cy<LH*0.49&&Math.abs(cx-LW/2)<95){LEVEL=0;ST='charSelect';}if(cy>LH*0.49&&cy<LH*0.6&&Math.abs(cx-LW/2)<95)ST='ranking';return;}
  if(ST==='charSelect'){[[0.2],[0.5],[0.8]].forEach(([xr],i)=>{if(Math.abs(cx-xr*LW)<68&&cy>LH*0.35&&cy<LH*0.82)CHAR=i;});if(cy>LH*0.85&&cy<LH*0.97&&Math.abs(cx-LW/2)<90){LIVES=START_LIVES;SCORE=0;nextLifeScore=START_NEXT_LIFE_SCORE;royalEnergy=0;royalReady=false;initLevel(LEVEL);ST='playing';}return;}
  if(ST==='ranking'){if(cy>LH*0.87&&Math.abs(cx-LW/2)<65)ST='menu';return;}
  if(ST==='paused'){if(cy>LH*0.47&&cy<LH*0.58&&Math.abs(cx-LW/2)<90)ST='playing';if(cy>LH*0.61&&cy<LH*0.72&&Math.abs(cx-LW/2)<65){ST='menu';stopBg();}return;}
  if(ST==='gameOver'){if(cy>LH*0.49&&cy<LH*0.6&&Math.abs(cx-LW/2)<100){LIVES=START_LIVES;SCORE=0;nextLifeScore=START_NEXT_LIFE_SCORE;royalEnergy=0;royalReady=false;initLevel(LEVEL);ST='playing';}if(cy>LH*0.65&&cy<LH*0.76&&Math.abs(cx-LW/2)<65){ST='menu';stopBg();}return;}
  if(ST==='levelComplete'){if(LEVEL<9&&cy>LH*0.51&&cy<LH*0.63&&Math.abs(cx-LW/2)<100){LEVEL++;initLevel(LEVEL);ST='playing';}if(cy>LH*0.69&&cy<LH*0.8&&Math.abs(cx-LW/2)<65){ST='menu';stopBg();}return;}
  if(ST==='playing'&&cx>(LW-48)&&cy<48)ST='paused';
}

// MAIN LOOP
function update(){
  TICK++;
  if(shake>0)shake*=0.84;if(shake<0.25)shake=0;
  updateDmgTexts();
  if(bossWarningTimer>0)bossWarningTimer--;
  if(ST==='birthday'){bdParts2=bdParts2.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=0.014;return p.life>0;});}
  else if(ST==='playing'){
    if(storyTimer>0){storyTimer--;updateP();return;}
    updatePlayer();updateCat();updatePony();updateEnemies();updateBoss();updateBullets();updateCollect();checkEnemyCollision();checkPortal();updateP();updateKidMarker();
  }else {updateP();updateKidMarker();}
}

function draw(){
  ctx.clearRect(0,0,C.width,C.height);
  if(ST==='birthday')drawBirthday();
  else if(ST==='menu')drawMenu();
  else if(ST==='charSelect')drawCharSelect();
  else if(ST==='ranking')drawRanking();
  else{
    const ld=LVLS[LEVEL];
    ctx.save();
    if(shake>0)ctx.translate((Math.random()-0.5)*shake*S,(Math.random()-0.5)*shake*S);
    drawBg(ld);
    if(platforms)platforms.forEach(p=>drawPlat(p));
    if(portalObj)drawPortal(portalObj);
    if(collectibles)collectibles.forEach(drawCollect);
    if(powerupItems)powerupItems.forEach(drawPUI);
    if(enemies)enemies.forEach(drawEnemy);
    if(bossObj)drawBoss(bossObj);
    drawBullets();
    if(cat)drawCat(cat);
    if(pony)drawPony(pony);
    if(player)drawPlayer(player);
    drawP();
    drawDmgTexts();
    ctx.restore();
    drawHUD();
    drawStory();
    drawBossWarning();
    if(ST==='paused')drawPaused();
    if(ST==='levelComplete')drawLevelComplete();
    if(ST==='gameOver')drawGameOver();
  }
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();

</script>
