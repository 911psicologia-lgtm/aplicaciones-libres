function syncDoom(id, src) {
  const sl = document.getElementById(`${id}-sl`);
  const nv = document.getElementById(`${id}-nv`);
  if (!sl || !nv) return;
  if (src === 'sl') {
    let v = parseInt(sl.value);
    v = Math.max(0, Math.min(100, v));
    nv.value = v;
  } else {
    let v = parseInt(nv.value);
    if (isNaN(v)) return;
    v = Math.max(0, Math.min(100, v));
    nv.value = v;
    sl.value = v;
  }
  calcDoom();
}

function doomScenario(s) {
  const scenarios = {
    opt:  {n:20,c:35,b:20,t:30,g:25,i:80},
    cur:  {n:75,c:70,b:45,t:65,g:80,i:35},
    crit: {n:95,c:90,b:70,t:85,g:95,i:15},
  };
  const sc = scenarios[s];
  ['n','c','b','t','g','i'].forEach(k => {
    const sl = document.getElementById(`d-${k}-sl`);
    const nv = document.getElementById(`d-${k}-nv`);
    if (sl) sl.value = sc[k];
    if (nv) nv.value = sc[k];
  });
  calcDoom();
}

function getDoomVals() {
  return ['n','c','b','t','g','i'].reduce((acc,k) => {
    acc[k] = parseInt(document.getElementById(`d-${k}-sl`)?.value||'0')/100;
    return acc;
  }, {});
}

function calcDoom() {
  const {n,c,b,t,g,i} = getDoomVals();
  let R = 0.30*n + 0.20*c + 0.15*b + 0.15*t + 0.15*g + 0.05*(1-i)
        + 0.10*(n*g) + 0.05*(t*g);
  R = Math.max(0, Math.min(1, R));
  const S = Math.round(600 * Math.pow(1-R, 2));
  const mins = Math.floor(S/60), secs = S%60;

  const el_sec = document.getElementById('doom-sec');
  const el_ms  = document.getElementById('doom-min-sec');
  const el_risk = document.getElementById('doom-risk');
  const el_badge = document.getElementById('doom-badge');

  if (el_sec) el_sec.textContent = S + ' s';
  if (el_ms)  el_ms.textContent  = mins>0 ? `${mins} min ${secs} s para medianoche` : `${secs} s para medianoche`;
  if (el_risk) el_risk.textContent = fmtNum(R,4) + ' (' + fmtNum(R*100) + '%)';

  const levels = [
    {max:0.20,label:'Bajo',cls:'level-low'},
    {max:0.40,label:'Moderado',cls:'level-mod'},
    {max:0.60,label:'Alto',cls:'level-high'},
    {max:0.80,label:'Crítico',cls:'level-crit'},
    {max:1.00,label:'Extremo',cls:'level-ext'},
  ];
  const lv = levels.find(l => R <= l.max) || levels[4];
  if (el_badge) el_badge.innerHTML = `<span class="level-badge ${lv.cls}">${lv.label}</span>`;

  // Bars
  const varData = [
    {l:'Nuclear',v:n,w:0.30,c:'#ff453a'},
    {l:'Climático',v:c,w:0.20,c:'#ffd60a'},
    {l:'Biológico',v:b,w:0.15,c:'#30d158'},
    {l:'Tecnológico',v:t,w:0.15,c:'#0a84ff'},
    {l:'Geopolítico',v:g,w:0.15,c:'#bf5af2'},
    {l:'Cooperación',v:i,w:0.05,c:'#5ac8fa'},
  ];
  const barsEl = document.getElementById('doom-bars');
  if (barsEl) barsEl.innerHTML = varData.map(d=>`
    <div class="risk-bar-row">
      <span>${d.l}</span>
      <div class="risk-bar-track"><div class="risk-bar-fill" style="width:${d.v*100}%;background:${d.c}"></div></div>
      <span class="pct">${Math.round(d.v*100)}%</span>
    </div>
  `).join('');

  // Interpretive text
  const dominant = varData.slice(0,5).sort((a,b)=>b.v-a.v);
  let text = '';
  if (R >= 0.8) text = `Escenario extremo. El resultado está impulsado principalmente por ${dominant[0].l.toLowerCase()} (${Math.round(dominant[0].v*100)}%) y ${dominant[1].l.toLowerCase()} (${Math.round(dominant[1].v*100)}%). La cooperación internacional, en ${Math.round(i*100)}%, es insuficiente para mitigar este nivel de riesgo acumulado.`;
  else if (R >= 0.6) text = `Nivel crítico. La combinación entre ${dominant[0].l.toLowerCase()} y ${dominant[1].l.toLowerCase()} intensifica el escenario. ${i < 0.4 ? 'La baja cooperación internacional amplifica significativamente el riesgo global.' : 'La cooperación internacional ayuda a contener parcialmente el riesgo total.'}`;
  else if (R >= 0.4) text = `Riesgo alto. El factor dominante es ${dominant[0].l.toLowerCase()} (${Math.round(dominant[0].v*100)}%). ${n>0.5&&g>0.5?'La interacción entre riesgo nuclear y tensión geopolítica actúa como multiplicador del índice.':'El sistema global muestra señales de tensión en varias dimensiones simultáneamente.'}`;
  else if (R >= 0.2) text = `Riesgo moderado. El mundo opera con vulnerabilidades visibles, especialmente en ${dominant[0].l.toLowerCase()}. ${i>0.6?'El nivel de cooperación internacional actúa como factor estabilizador clave.':'Un aumento en la cooperación internacional reduciría notablemente este índice.'}`;
  else text = `Riesgo bajo. El escenario es relativamente estable. La combinación de valores bajos de amenaza y ${i>0.7?'alta cooperación internacional contribuye a un horizonte global favorable.':'factores de riesgo contenidos genera un horizonte global estable.'}`;

  const textEl = document.getElementById('doom-text');
  if (textEl) textEl.textContent = text;

  // Clock
  drawDoomClock(R);
}

function drawDoomClock(R) {
  const canvas = document.getElementById('clock-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const CX = 80, CY = 80, CR = 68;
  ctx.clearRect(0,0,160,160);

  // Background circle
  ctx.beginPath(); ctx.arc(CX,CY,CR,0,Math.PI*2);
  ctx.fillStyle = '#1c1c1e'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2; ctx.stroke();

  // Tick marks
  for (let i=0;i<60;i++) {
    const ang = (i/60)*Math.PI*2 - Math.PI/2;
    const len = i%5===0?8:4;
    ctx.beginPath();
    ctx.moveTo(CX+Math.cos(ang)*(CR-2), CY+Math.sin(ang)*(CR-2));
    ctx.lineTo(CX+Math.cos(ang)*(CR-2-len), CY+Math.sin(ang)*(CR-2-len));
    ctx.strokeStyle = i%5===0?'rgba(255,255,255,0.4)':'rgba(255,255,255,0.15)';
    ctx.lineWidth = i%5===0?1.5:1;
    ctx.stroke();
  }

  // 12 marker
  ctx.font = 'bold 11px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.textAlign='center'; ctx.fillText('12', CX, CY-CR+16);

  // Risk arc
  const arcStart = -Math.PI/2;
  const arcEnd = arcStart + R * Math.PI * 2;
  const riskColor = R > 0.8 ? '#bf5af2' : R > 0.6 ? '#ff453a' : R > 0.4 ? '#ff9f0a' : R > 0.2 ? '#ffd60a' : '#30d158';
  ctx.beginPath(); ctx.arc(CX,CY,CR-10, arcStart, arcEnd);
  ctx.strokeStyle = riskColor + '40'; ctx.lineWidth = 8; ctx.stroke();

  // Hand — approaches midnight (12) as R→1
  // Midnight = angle -PI/2 (top). We go backward from -PI/2-spread to -PI/2
  const spread = Math.PI * 0.75; // range of motion
  const handAng = -Math.PI/2 - spread + R * spread;
  const handLen = CR - 14;
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(CX + Math.cos(handAng)*handLen, CY + Math.sin(handAng)*handLen);
  ctx.strokeStyle = riskColor; ctx.lineWidth = 2.5;
  ctx.lineCap = 'round'; ctx.stroke();

  // Center dot
  ctx.beginPath(); ctx.arc(CX,CY,4,0,Math.PI*2);
  ctx.fillStyle = riskColor; ctx.fill();

  // Label
  ctx.font = '9px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.textAlign='center'; ctx.fillText('MEDIANOCHE', CX, CY+CR-8);
}

function fmtNum(n, dec=6) {
  if (!isFinite(n)) return '∞';
  if (Number.isInteger(n)) return n.toLocaleString('es');
  const s = parseFloat(n.toPrecision(dec)).toString();
  if (s.includes('e')) return n.toExponential(4);
  const parts = s.split('.');
  parts[0] = parseInt(parts[0]).toLocaleString('es');
  return parts.join('.');
}

function fmt$(n) {
  if (!isFinite(n)) return '—';
  return n.toLocaleString('es', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

  { title:'Bienvenido a CalcPro', desc:'Una calculadora premium con 31 módulos especializados. Navega entre módulos usando el panel lateral.', target: null },
  { title:'Selector de Módulos', desc:'Aquí encuentras todos los módulos organizados por categoría. Usa el buscador para encontrar rápidamente el que necesitas.', target:'#sidebar' },

  { title:'Reloj del Fin del Mundo', desc:'Módulo especial: simula con variables de riesgo global cuán cerca estaría el mundo de una "medianoche simbólica".', target:null },
  { title:'¡Listo!', desc:'Explora libremente todos los módulos. ¡Disfruta CalcPro!', target:null },
];

let tourStep = 0;
function startTour() {
  tourStep = 0;
  document.getElementById('tour-overlay').classList.add('active');
  showTourStep();
}

function showTourStep() {
  const s = TOUR_STEPS[tourStep];
  document.getElementById('tour-title').textContent = s.title;
  document.getElementById('tour-desc').textContent = s.desc;
  document.getElementById('tour-counter').textContent = `${tourStep+1} / ${TOUR_STEPS.length}`;
  const nxt = document.getElementById('tour-next-btn');
  nxt.textContent = tourStep === TOUR_STEPS.length-1 ? t('tour_finish') : t('tour_next');

  // Position popup
  const popup = document.getElementById('tour-popup');
  if (s.target) {
    const el = document.querySelector(s.target);
    if (el) {
      const r = el.getBoundingClientRect();
      popup.style.top  = Math.min(r.bottom + 12, window.innerHeight - 200) + 'px';
      popup.style.left = Math.min(Math.max(r.left, 10), window.innerWidth - 300) + 'px';
    } else { centerPopup(popup); }
  } else { centerPopup(popup); }
}

function centerPopup(popup) {
  popup.style.top  = '50%';
  popup.style.left = '50%';
  popup.style.transform = 'translate(-50%,-50%)';
}

function tourNext() {
  tourStep++;
  if (tourStep >= TOUR_STEPS.length) { endTour(); return; }
  showTourStep();
}

function endTour() {
  document.getElementById('tour-overlay').classList.remove('active');
  document.getElementById('tour-popup').style.transform = '';
}
