<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>XENOSTRIKE ULTRA</title>
<style>
:root{--bg:#01020a;--fg:#d8ffcf;--acc:#77ff77;--warn:#ff6b6b;--cyan:#7df9ff;--amb:#ffda6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:var(--fg);font-family:"Courier New",monospace;overflow:hidden}
#app{position:fixed;inset:0;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px}
.screen.active{display:flex}
.panel{width:min(600px,96vw);padding:22px 20px;border:1px solid #1e4030;background:rgba(0,4,8,.95);box-shadow:0 0 0 1px rgba(119,255,119,.06) inset,0 0 40px rgba(0,0,0,.8)}
.tWrap{text-align:center;margin-bottom:18px}
.tMain{display:block;font-size:clamp(34px,8vw,80px);letter-spacing:2px;text-transform:uppercase;font-weight:900;line-height:.92;background:linear-gradient(180deg,#fff 0%,#b0d0ff 18%,#5588ff 36%,#eef2ff 50%,#6ad4ff 62%,#ffe280 78%,#ff8833 90%,#ff2200 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(100,140,255,.3));animation:tP 2.4s ease-in-out infinite}
.tSub{display:block;font-size:clamp(8px,1.6vw,13px);letter-spacing:9px;color:#7df9ff;margin-top:8px;opacity:.7}
.tVer{font-size:10px;color:#3a5a48;letter-spacing:3px;margin-top:4px;display:block}
@keyframes tP{0%,100%{filter:drop-shadow(0 0 8px rgba(100,140,255,.3))}50%{filter:drop-shadow(0 0 18px rgba(255,180,80,.42))}}
.blink{animation:bl 1.1s steps(2,end) infinite}
@keyframes bl{50%{opacity:.1}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
h2{font-size:clamp(13px,2.8vw,19px);color:var(--acc);letter-spacing:3px;margin-bottom:10px}
input,button{font:inherit;border:none;outline:none}
input{flex:1;min-width:180px;padding:11px 12px;background:#060f0b;color:#d9ffe0;border:1px solid #264038}
button{padding:11px 16px;background:#0b1c12;color:#d8ffcf;border:1px solid #356548;cursor:pointer;min-width:140px;transition:background .12s}
button:hover{background:#122a1c}
button:disabled{opacity:.35;cursor:default}
.small{font-size:11px;color:#6a8e7a;line-height:1.5}
.rank{max-height:30vh;overflow:auto;border:1px solid #192e1e;padding:8px 10px;background:rgba(0,0,0,.22)}
.rank div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted rgba(140,255,180,.1);font-size:11px}
.sCard{padding:9px 10px;border:1px solid rgba(125,249,255,.08);margin-bottom:7px;background:rgba(0,0,0,.14)}
.sCard .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}
.sCard button{padding:6px 10px;min-width:90px}
.lock{opacity:.45}
.savePrev{background:rgba(0,18,10,.7);border:1px solid #193325;padding:9px 14px;margin:10px 0;font-size:11px;color:#8bbea8;display:none}
.savePrev .sr{display:flex;justify-content:space-between;margin-bottom:2px}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:8px;padding:7px 12px;pointer-events:none;color:#d8ffcf;text-shadow:0 0 6px rgba(0,0,0,.95);font-size:clamp(10px,1.8vw,15px);z-index:5}
.hud span{white-space:nowrap}
.gmsg{position:absolute;left:50%;top:12%;transform:translateX(-50%);padding:7px 14px;border:1px solid rgba(125,249,255,.22);background:rgba(0,0,0,.55);color:#d9fcff;font-size:clamp(13px,2.5vw,22px);z-index:6;display:none;white-space:nowrap}
.ctag{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;pointer-events:none;z-index:6}
.ctag span{padding:4px 9px;background:rgba(0,0,0,.22);border:1px solid rgba(125,249,255,.1);color:#88c0d0;font-size:10px}
.pauseOv{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.72)}
.pauseOv.on{display:flex}
.pauseBox{border:1px solid #2a5035;background:rgba(0,6,12,.96);padding:22px 28px;text-align:center;min-width:230px}
.pauseBox h2{margin-bottom:10px}
.pStats{font-size:11px;color:#8ab8a0;margin-bottom:12px;line-height:2}
.pRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.pRow button{min-width:110px}
.oBt{position:absolute;right:10px;bottom:10px;z-index:10;padding:8px 10px;font-size:10px;opacity:.75;min-width:auto}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 55%,rgba(0,0,0,.25));mix-blend-mode:multiply}
#vjBase{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.18);pointer-events:none;display:none}
#vjThumb{position:absolute;border-radius:50%;background:rgba(255,255,255,.22);pointer-events:none;display:none}
#actBtn{position:absolute;border-radius:50%;background:rgba(255,200,0,.15);border:2px solid rgba(255,200,0,.3);display:none;align-items:center;justify-content:center;font-size:10px;color:#ffda6b;cursor:pointer}
@media(max-width:700px){.panel{padding:14px 10px} button{min-width:unset;flex:1}}
</style>
</head>
<body>
<div id="app" class="crt">
<canvas id="game"></canvas>
<div class="hud" id="hud" style="display:none">
  <span id="hL">P1</span><span id="hC">OLEADA 1</span><span id="hR">0 · 3▲</span>
</div>
<div class="gmsg" id="gmsg"></div>
<div class="ctag" id="ctag" style="display:none"><span id="ctagTxt">← → · AUTO · P PAUSA</span></div>

<section class="screen active" id="splash">
  <div class="panel">
    <div class="tWrap">
      <span class="tMain">XENOSTRIKE</span>
      <span class="tSub">· ULTRA ARCADE ·</span>
      <span class="tVer" id="audSt">v2.0 · clic para activar audio</span>

    <div class="row" style="justify-content:center">
      <button id="btnLogin">NUEVA MISIÓN</button>

</section>

<section class="screen" id="login">
  <div class="panel">
    <h2>IDENTIFICACIÓN DE PILOTO</h2>
    <p class="small">Ingresa tu indicativo de combate</p>
    <div class="row"><input id="pilotName" maxlength="18" placeholder="USUARIO" autocomplete="off"/></div>
    <div class="row">
      <button id="btnStart">LANZAR</button>

<section class="screen" id="ranking">

    <div class="rank" id="rankList"></div>
    <div class="row">
      <button data-back="splash">VOLVER</button>
      <button id="btnClearRank">LIMPIAR</button>

<section class="screen" id="load">

    <h2>CONTINUAR MISIÓN</h2>
    <div id="saveInfo" class="rank" style="margin-bottom:10px"></div>
    <div class="row">
      <button id="btnContinue">CONTINUAR</button>
      <button id="btnDelSave">BORRAR GUARDADO</button>
      <button data-back="splash">VOLVER</button>

</section>

<section class="screen" id="ships">
  <div class="panel">
    <h2>HANGAR DE NAVES</h2>

</section>

<div class="pauseOv" id="pauseOv">

    <h2>— PAUSA —</h2>
    <div class="pStats" id="pStats"></div>
    <div class="pRow">
      <button id="btnResume">CONTINUAR</button>
      <button id="btnHangar">HANGAR</button>

</div>

<div id="vjBase"></div>
<div id="vjThumb"></div>
<div id="actBtn">EMP</div>
<button class="oBt" id="pauseBtn" style="display:none">PAUSA</button>
</div>
<script>
(()=>{
'use strict';
const SK='xs2_save',RK='xs2_rank',HK='xs2_ship';
const CV=document.getElementById('game');
const ctx=CV.getContext('2d');
const allScreens=[...document.querySelectorAll('.screen')];
const hud=document.getElementById('hud');
const hL=document.getElementById('hL'),hC=document.getElementById('hC'),hR=document.getElementById('hR');
const gmsg=document.getElementById('gmsg');
const ctag=document.getElementById('ctag');
const pauseBtn=document.getElementById('pauseBtn');
const pauseOv=document.getElementById('pauseOv');
const vjBase=document.getElementById('vjBase');
const vjThumb=document.getElementById('vjThumb');
const actBtn=document.getElementById('actBtn');

/* ── SHIPS ── */
const SHIPS=[
  {id:'classic',    name:'CLÁSICA',     unlock:0,     col:'#a6ffe7',acc:'#8cd3ff',spd:1,    cd:88,  bs:-1080,hp:1,desc:'Equilibrada · disparo estándar'},
  {id:'interceptor',name:'INTERCEPTOR', unlock:2500,  col:'#ffd86b',acc:'#ff9d5c',spd:1.12, cd:76,  bs:-1160,hp:1,desc:'Rápida · alta cadencia'},
  {id:'phantom',    name:'PHANTOM',     unlock:6500,  col:'#ff8ad8',acc:'#c79dff',spd:1.18, cd:72,  bs:-1210,hp:1,desc:'Bala veloz · sigilo'},
  {id:'titan',      name:'TITAN',       unlock:15000, col:'#ff9966',acc:'#ffcc55',spd:0.82, cd:95,  bs:-980, hp:3,desc:'Armadura triple · escudo pasivo'},
  {id:'nebula',     name:'NEBULA',      unlock:30000, col:'#88aaff',acc:'#aaddff',spd:1.05, cd:80,  bs:-1120,hp:1,desc:'Onda plasma · disparo especial'},
  {id:'apex',       name:'APEX',        unlock:80000, col:'#ffee44',acc:'#ffffff', spd:1.30, cd:55,  bs:-1380,hp:1,desc:'Hipercadencia · max velocidad'}
];
/* ── COLORS ── */
const C={squid:'#ffdb69',crab:'#7df9ff',octo:'#9effa4',ufo:'#ff7b72',mosquito:'#ff5cb8',carrier:'#a287ff',
  emp:'#76f7ff',shield:'#72f3ff',laser:'#ff4dff',ally:'#ffe37a',bullet:'#8cd3ff',bomb:'#ff6b6b',
  elite:'#ff5252',elite2:'#b488ff',elite3:'#73f2ff',elite4:'#dd77ff',
  boss:'#ff8b3d',boss2:'#ffe26d',boss3:'#8dff65',boss4:'#ff5db1',boss5:'#77d6ff',boss6:'#ff4466',boss7:'#44ffaa',boss8:'#ffaa33',
  plasma:'#cc77ff',wraith:'#aaffcc',hive:'#55aaff',scarab:'#88ff55',kamikaze:'#ff6d6d'};

/* ── STATE ── */
const G={
  mode:'menu',player:'',wave:1,lives:3,score:0,w:0,h:0,
  pX:0,pY:0,pW:42,pH:22,pHp:1,pMaxHp:1,
  ml:false,mr:false,
  pBul:[],eBul:[],parts:[],shields:[],invaders:[],dir:1,stepDown:18,
  iDx:8,iSpd:650,lastIM:0,lastES:0,
  ufo:null,lastUfo:0,shots:0,paused:false,running:false,ptrAct:false,
  lastT:0,cdTimer:0,nextWaveT:0,over:false,sndOk:false,
  starsF:[],starsM:[],starsN:[],scObjs:[],
  startAt:0,fireCd:145,lastFire:0,fireLevel:1,powerUntil:0,
  combo:0,comboUntil:0,mosqs:[],lastMosq:0,plasmas:[],lastPlasma:0,
  wraiths:[],lastWraith:0,
  boss:null,bossMode:false,killsWave:0,_beatAt:0,_beatIdx:0,
  respawnUntil:0,shipType:'classic',shipCol:'#a6ffe7',shipAcc:'#8cd3ff',
  spdMult:1,bSpd:-1080,hitFlash:0,nextLife:2500,
  kams:[],lastKam:0,shieldUntil:0,laserUntil:0,
  aux:0,auxUntil:0,lastAuxFire:0,
  isPortrait:false,eAreaCap:0,pMagnet:110,empFlash:0,
  bossPending:false,allyUsed:false,laserUsed:false,empUsed:false,wPow:0,
  missileUntil:0,_lastMissile:0,overchargeUntil:0,
  vjDx:0,vjTid:null,vjBX:0,vjBY:0,vjRad:54,vjActive:false,
  bossPhase:0,bossFlashUntil:0,gpIdx:null
};
const LIM={pBul:30,eBul:110,parts:320,mosqs:24,kams:22,pow:12,plasmas:16,wraiths:10};

/* ────────────────────────────
   AUDIO
   ──────────────────────────── */
let AC=null,piT=null,piIdx=0;
const BPM=114,BEAT=60/BPM;
// Piano Rhodes 80s melody
const SEQ=[
  [440,.5,.07],[329,.25,.05],[261,.25,.05],[329,.5,.055],[392,.5,.06],
  [329,.25,.045],[293,.25,.05],[261,1,.065],[0,.25,0],
  [220,.5,.07],[261,.25,.05],[329,.25,.055],[440,.5,.07],
  [392,.25,.055],[349,.25,.05],[329,1,.065],[0,.5,0],
  [523,.5,.065],[494,.25,.05],[440,.25,.055],[494,.5,.055],
  [523,.5,.06],[440,.5,.055],[392,.5,.055],[329,1,.065],[0,.75,0],
  [261,.5,.065],[329,.25,.05],[392,.25,.055],[440,.5,.06],
  [392,.5,.06],[349,.5,.055],[329,.25,.05],[293,.25,.05],[261,1,.07],[0,.5,0]
];
function initAudio(){
  if(AC) return;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  G.sndOk=true;
  document.getElementById('audSt').textContent='v2.0 · audio activo';
  startPiano();
}
function pianoNote(freq,beats,vol){
  if(!AC||!freq) return;
  const t=AC.currentTime,dur=beats*BEAT;
  const o1=AC.createOscillator(),o2=AC.createOscillator();
  const g1=AC.createGain(),g2=AC.createGain(),gm=AC.createGain();
  o1.type='triangle';o1.frequency.value=freq;
  o2.type='sine';o2.frequency.value=freq*2.005;
  // ADSR piano
  g1.gain.setValueAtTime(0,t);g1.gain.linearRampToValueAtTime(vol,t+.007);
  g1.gain.exponentialRampToValueAtTime(vol*.3,t+.22);
  g1.gain.setValueAtTime(vol*.3,t+dur*.72);g1.gain.exponentialRampToValueAtTime(.0001,t+dur+.01);
  g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(vol*.22,t+.007);
  g2.gain.exponentialRampToValueAtTime(.0001,t+.18);
  gm.gain.value=.9;
  o1.connect(g1);g1.connect(gm);o2.connect(g2);g2.connect(gm);gm.connect(AC.destination);
  o1.start(t);o1.stop(t+dur+.08);o2.start(t);o2.stop(t+dur+.08);
}
function schedPiano(){
  if(!AC||G.mode==='game') return;
  const [f,b,v]=SEQ[piIdx]; pianoNote(f,b,v); piIdx=(piIdx+1)%SEQ.length;
  piT=setTimeout(schedPiano,b*BEAT*1000);
}
function startPiano(){if(piT)clearTimeout(piT);piIdx=0;schedPiano();}
function stopPiano(){if(piT){clearTimeout(piT);piT=null;}}

function beep(fr=220,dur=.08,type='square',vol=.03,sl=1){
  if(!AC) return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(fr,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,fr*sl),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
function noise(dur=.12,vol=.04,cut=880){
  if(!AC) return;
  const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  f.type='lowpass';f.frequency.value=cut;g.gain.value=vol;
  s.buffer=buf;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();
}
function shipBeep(){
  const map={classic:()=>beep(250+G.fireLevel*36,.03,'square',.018,2.05),
    interceptor:()=>beep(380+G.fireLevel*45,.025,'square',.02,2.2),
    phantom:()=>beep(180+G.fireLevel*60,.04,'sawtooth',.016,1.8),
    titan:()=>{beep(140+G.fireLevel*28,.05,'square',.022,1.5);},
    nebula:()=>beep(310+G.fireLevel*50,.035,'triangle',.02,1.55),
    apex:()=>beep(560+G.fireLevel*80,.018,'square',.022,3.0)};
  (map[G.shipType]||map.classic)();
}
function fanfare(kind){
  if(!AC) return;
  if(kind==='wave'){ beep(440,.08,'square',.04,1);setTimeout(()=>beep(550,.08,'square',.04,1),90);setTimeout(()=>beep(660,.12,'square',.04,1),180); }
  else if(kind==='boss'){ beep(180,.12,'sawtooth',.05,.7);setTimeout(()=>beep(120,.18,'square',.06,.5),120); }
  else if(kind==='life'){ beep(880,.09,'square',.04,1.18);setTimeout(()=>beep(1100,.07,'square',.03,1.02),90); }
  else if(kind==='gameover'){ for(let i=0;i<4;i++) setTimeout(()=>beep(220-i*28,.18,'sawtooth',.05,.5),i*200); }
}
function heartbeat(){
  if(!AC||!G.running||G.paused||G.over||G.cdTimer!==0) return;
  let fr=1;
  if(G.bossMode&&G.boss) fr=Math.max(.12,G.boss.hp/G.boss.maxHp);
  else{ const a=G.invaders.filter(v=>v.alive).length+G.mosqs.filter(v=>v.alive).length; fr=Math.max(.1,a/64); }
  const ms=Math.max(62,330*fr),now=performance.now();
  if(now>G._beatAt){ G._beatAt=now+ms; beep([55,58,62,66][G._beatIdx%4],.05,'square',.013,1.02); G._beatIdx++; }
}

/* ────────────────────────────
   SPRITES (pixel bitmask)
   ──────────────────────────── */
function spr(kind,frame){
  const F={
    squid:[['00111100','11111111','11011011','11111111','00111100','01100110','11000011','00000000'],['00111100','11111111','11011011','11111111','00111100','11000011','01100110','00000000']],
    crab: [['00111100','01111110','11111111','11011011','11111111','00100100','01011010','10100101'],['00111100','01111110','11111111','11011011','11111111','01011010','10100101','01000010']],

    carrier: [['00111100','01111110','11111111','10111101','11111111','00111100','01100110','11000011'],['00111100','01111110','11111111','11111111','10111101','01111110','11000011','00100100']],
    kamikaze:[['00011000','00111100','01111110','11111111','00111100','01100110','11000011','00000000'],['00011000','00111100','01111110','11111111','01111110','00100100','01000010','10000001']],
    scarab:  [['00111100','01111110','11111111','10111101','11111111','11000011','01100110','00111100'],['00111100','01111110','11011011','11111111','11111111','01100110','10000001','00111100']],
    plasma_orb:[['00111100','01111110','11111111','10111101','10111101','11111111','01111110','00111100'],['00111100','01111110','11111111','11011011','01111110','01011010','00111100','00000000']],

function drawBg(dt,now){
  const sc=getScene(G.wave);
  ctx.fillStyle=sc.bg;ctx.fillRect(0,0,G.w,G.h);
  // scene objects
  for(const o of G.scObjs){
    o.y+=o.spd*dt/16;if(o.y>G.h+200){o.y=-200;o.x=Math.random()*G.w;}
    if(o.type==='planet'){
      ctx.globalAlpha=.09;ctx.fillStyle=o.col;
      ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=.045;ctx.strokeStyle='#aabbcc';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(o.x,o.y,o.r*1.5,-.3,Math.PI*.55);ctx.stroke();
    } else {
      ctx.globalAlpha=1;ctx.fillStyle=o.col;
      ctx.beginPath();ctx.ellipse(o.x,o.y,o.rx,o.ry,0,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // far
  for(const s of G.starsF){s.y+=s.spd*dt/16;if(s.y>G.h){s.y=-2;s.x=Math.random()*G.w;}ctx.globalAlpha=s.a*(0.6+Math.sin((now+s.x*7)/900)*.38);ctx.fillStyle=s.col;ctx.fillRect(s.x,s.y,s.r,s.r);}
  // mid
  for(const s of G.starsM){s.y+=s.spd*dt/16;if(s.y>G.h){s.y=-2;s.x=Math.random()*G.w;}ctx.globalAlpha=s.a*(0.5+(Math.sin((now+s.x)/420)+1)*.22);ctx.fillStyle=s.col;ctx.fillRect(s.x,s.y,s.r,s.r);}
  // near
  for(const s of G.starsN){s.y+=s.spd*dt/16;if(s.y>G.h){s.y=-3;s.x=Math.random()*G.w;}ctx.globalAlpha=s.a;ctx.fillStyle=s.col;ctx.fillRect(s.x,s.y,s.r,s.r);}
  // war zone pulse
  if(G.wave>=13&&Math.random()<.003){ctx.globalAlpha=.035;ctx.fillStyle='#8866ff';ctx.fillRect(Math.random()*G.w,0,2,G.h);}
  ctx.globalAlpha=1;
}

function mkShield(x,y){const cols=14,rows=8,sz=Math.max(4,Math.floor(G.w/160)),map=[];for(let r=0;r<rows;r++){map[r]=[];for(let c=0;c<cols;c++) map[r][c]=(r>4&&c>4&&c<9)||(r===0&&(c<1||c>12))||(r===1&&(c<1||c>12))?0:1;}return{x,y,cols,rows,sz,map};}
function drawShields(){for(const s of G.shields) for(let r=0;r<s.rows;r++) for(let c=0;c<s.cols;c++) if(s.map[r][c]){ctx.fillStyle=r<2?'#9effa4':'#6fdc7a';ctx.fillRect(s.x+c*s.sz,s.y+r*s.sz,s.sz-.4,s.sz-.4);}}
function erodeShield(x,y){for(const s of G.shields){const lx=x-s.x,ly=y-s.y;if(lx>=0&&ly>=0&&lx<s.cols*s.sz&&ly<s.rows*s.sz){const c=Math.floor(lx/s.sz),r=Math.floor(ly/s.sz);for(let rr=r-1;rr<=r+1;rr++) for(let cc=c-1;cc<=c+1;cc++) if(s.map[rr]?.[cc]) s.map[rr][cc]=Math.random()>.25?0:s.map[rr][cc];return true;}}return false;}
function rebuildShields(){if(G.bossMode){G.shields=[];return;}const sy=G.h-(G.isPortrait?176:156),sp=G.w/5;G.shields=[];for(let i=1;i<=4;i++) G.shields.push(mkShield(sp*i-32,sy));}

/* ────────────────────────────
   WAVE + BOSS SYSTEM
   ──────────────────────────── */
function buildWave(wave){
  G.invaders=[];G.mosqs=[];G.kams=[];G.carriers=[];G.plasmas=[];G.wraiths=[];
  G.boss=null;G.bossMode=false;G.bossPending=wave>=2&&wave%2===0;
  G.pBul=[];G.eBul=[];G.ufo=null;G.killsWave=0;
  G.lastES=0;G.lastMosq=0;G.lastKam=0;G.lastPlasma=0;G.lastWraith=0;
  G.allyUsed=false;G.laserUsed=false;G.empUsed=false;G.wPow=0;G.aux=0;G.auxUntil=0;

  const cols=11,baseRows=5,extR=Math.min(6,Math.floor((wave-1)/2));
  const scale=Math.max(.92,Math.min(2.2,G.w/540));
  const gX=11*scale,gY=Math.max(7,10*scale-Math.min(extR*.7,4));
  const iw=20*scale,ih=14*scale,totW=cols*iw+(cols-1)*gX;
  const sX=Math.max(18,(G.w-totW)/2),sY=62+Math.min(12*(wave-1),72);
  const maxRows=Math.max(baseRows,Math.floor((G.eAreaCap-sY)/(ih+gY)));
  const rows=Math.min(baseRows+extR,maxRows),over=Math.max(0,(baseRows+extR)-rows);
  const eCol=Math.floor(cols/2);
  const eKinds=['elite_hornet','elite_beetle','elite_eye','elite_plasma'];
  const eColors={elite_hornet:C.elite,elite_beetle:C.elite2,elite_eye:C.elite3,elite_plasma:C.elite4};

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      let kind='octo',pts=10,col=C.octo,sp=false,hp=1;
      if(r===0){kind='squid';pts=30;col=C.squid;}
      else if(r<=2){kind='crab';pts=20;col=C.crab;}
      else if(wave>=5&&r===rows-1&&c%3===0){kind='scarab';pts=22;col=C.scarab;hp=2;}
      else if(wave>=4&&r===rows-1&&c%3===1){kind='mosquito';pts=18;col=C.mosquito;hp=1+(wave>=10?1:0);}
      else if(wave>=6&&r>=rows-2&&c%4===1){kind='kamikaze';pts=24;col=C.kamikaze;hp=1+(wave>=12?1:0);}
      else if(r>=5&&(r+c)%3===0){kind='carrier';pts=35;col=C.carrier;hp=1+(wave>=8?1:0);}
      if(wave>=6&&r>=rows-2&&c%4===0) hp++;
      if(wave>=8&&(kind==='mosquito'||kind==='kamikaze')) hp++;
      if(over>0&&r>=rows-2) hp+=Math.min(2,over);
      if(wave>=2&&r===0&&c===eCol){
        kind=eKinds[Math.floor((wave-2)/2)%eKinds.length];
        pts=120+wave*10;col=eColors[kind]||C.elite;sp=true;hp=4+Math.floor(wave/3);
      }
      const fw=kind.startsWith('elite_')?iw*1.8:iw,fh=kind.startsWith('elite_')?ih*1.6:ih;
      G.invaders.push({x:sX+c*(iw+gX),y:sY+r*(ih+gY),w:fw,h:fh,kind,pts,alive:true,frame:0,col,special:sp,hp,maxHp:hp});
    }
  }
  // Hive drones
  if(wave>=7){
    const dn=Math.min(5,Math.floor((wave-6)*1.4));
    for(let i=0;i<dn;i++){
      const hx=sX+(i%cols)*(iw+gX)+iw*.1;
      G.invaders.push({x:hx,y:sY-ih-gY,w:iw*1.2,h:ih*1.2,kind:'hive_drone',pts:28,alive:true,frame:0,col:C.hive,special:false,hp:2+(wave>=10?1:0),maxHp:2+(wave>=10?1:0)});
    }
  }
  G.dir=1;G.lastIM=0;G.iDx=Math.min(18,8+Math.floor(wave/3));G.iSpd=Math.max(58,500-wave*10-over*12);
  compact(performance.now());rebuildShields();fitInvaders();
}

const BOSS_LIST=[
  {kind:'boss',       col:()=>C.boss},
  {kind:'boss_beetle',col:()=>C.boss2},
  {kind:'boss_mantis',col:()=>C.boss3},
  {kind:'boss_wasp',  col:()=>C.boss4},
  {kind:'boss_spider',col:()=>C.boss5},
  {kind:'boss_eye',   col:()=>C.boss6},
  {kind:'boss_hydra', col:()=>C.boss7},
  {kind:'boss_queen', col:()=>C.boss8},
  {kind:'boss_dread', col:()=>'#ff9933'}
];
function spawnBoss(){
  G.bossMode=true;G.shields=[];G.eBul=[];G.mosqs=[];G.kams=[];G.plasmas=[];G.wraiths=[];G.bMinions=[];
  const bw=Math.min(250,G.w*.4),bh=Math.min(100,G.h*.15);
  const bIdx=Math.floor((G.wave/2-1)%BOSS_LIST.length);
  const bd=BOSS_LIST[bIdx];
  const hpBase=40+G.wave*8;
  G.boss={x:G.w/2-bw/2,y:84,baseY:84,w:bw,h:bh,vx:155+G.wave*9,dir:1,
    hp:hpBase,maxHp:hpBase,col:bd.col(),kind:bd.kind,phase:0,
    lastShot:0,dashT:0,dashDir:0};
  G.bossPhase=0;G.iSpd=180;G.bossPending=false;
  setMsg('⚠ JEFE OLEADA '+G.wave,900);
  fanfare('boss');
}
function bossPhase(b){const f=b.hp/b.maxHp;return f>.6?0:f>.3?1:2;}

function moveBoss(now){
  if(!G.boss) return;
  const b=G.boss,t=now/1000,ph=bossPhase(b);
  G.bossPhase=ph;

  // Phase tint
  if(ph===1) b.col=b.col.replace(/#.*/,_=>b.kind==='boss_dread'?'#ff7700':b.col);//keep original
  // Speed multiplier by phase
  const spMul=ph===0?1:ph===1?1.4:1.9;

  switch(b.kind){
    case 'boss_mantis': b.x+=b.vx*b.dir/100*1.55*spMul; b.y=b.baseY+Math.sin(t*3.1)*18; break;
    case 'boss_wasp':   b.x+=b.vx*b.dir/100*1.9*spMul;  b.y=b.baseY+Math.sin(t*4.4)*22; break;
    case 'boss_spider': b.x+=b.vx*b.dir/100*1.1*spMul;  b.y=b.baseY+Math.abs(Math.sin(t*2.2))*34; break;
    case 'boss_eye':    b.x+=b.vx*b.dir/100*1.35*spMul; b.y=b.baseY+Math.sin(t*2.7)*12; break;
    case 'boss_hydra':
      b.x+=b.vx*b.dir/100*1.7*spMul;
      b.y=b.baseY+Math.sin(t*3.8)*16+(ph>=1?Math.sin(t*1.2)*12:0);
      break;
    case 'boss_queen':
      b.x+=b.vx*b.dir/100*1.3*spMul;
      if(ph>=1){ b.y=b.baseY+Math.sin(t*2.2)*20; } else { b.y=b.baseY+Math.sin(t*1.4)*8; }
      break;
    case 'boss_dread':
      b.x+=b.vx*b.dir/100*1.15*spMul;
      b.y=b.baseY+(ph===2?Math.sin(t*5)*24:Math.sin(t*1.8)*6);
      // dash in phase 2
      if(ph===2&&now-b.dashT>1800){b.dashT=now;b.baseY=Math.min(G.pY-130,b.baseY+25);}
      break;
    case 'boss_beetle': b.x+=b.vx*b.dir/100*1.2*spMul; b.y=b.baseY+Math.sin(t*1.5)*8; break;
    default: b.x+=b.vx*b.dir/100*1.6*spMul; b.y=b.baseY+Math.sin(t*2)*10;
  }

  // Wall bounce + approach
  if(b.x+b.w>=G.w-16||b.x<=16){
    b.dir*=-1;
    b.baseY=Math.min(G.pY-120,b.baseY+(ph===2?18:10));
  }
  if(Math.sin(t*.7)<-.92) b.baseY=Math.max(70,b.baseY-8);
  b.x=Math.max(8,Math.min(G.w-b.w-8,b.x));
  if(performance.now()>=G.respawnUntil&&b.y+b.h>=G.pY-10) triggerGameOver();
}

function compact(now){
  G.pBul=G.pBul.filter(b=>isFinite(b.x)&&isFinite(b.y)&&b.y>-80&&b.y<G.h+80&&b.x>-120&&b.x<G.w+120);
  G.eBul=G.eBul.filter(b=>isFinite(b.x)&&isFinite(b.y)&&b.y>-80&&b.y<G.h+120&&b.x>-160&&b.x<G.w+160);
  G.parts=G.parts.filter(p=>isFinite(p.x)&&isFinite(p.y)&&p.life>0&&p.y>-140&&p.y<G.h+180&&p.x>-180&&p.x<G.w+180);
  G.mosqs=G.mosqs.filter(m=>m&&m.alive&&isFinite(m.x)&&isFinite(m.y));
  G.kams=G.kams.filter(k=>k&&k.alive&&isFinite(k.x)&&isFinite(k.y));
  G.plasmas=G.plasmas.filter(p=>p&&p.alive&&isFinite(p.x)&&isFinite(p.y));
  G.wraiths=G.wraiths.filter(w=>w&&w.alive&&isFinite(w.x)&&isFinite(w.y));
  // cap power drops
  const pd=G.parts.filter(p=>p.kind==='power');
  if(pd.length>LIM.pow){let k=LIM.pow;G.parts=G.parts.filter(p=>{if(p.kind!=='power') return true;if(k>0){k--;return true;}return false;});}
  if(G.pBul.length>LIM.pBul) G.pBul.splice(0,G.pBul.length-LIM.pBul);
  if(G.eBul.length>LIM.eBul) G.eBul.splice(0,G.eBul.length-LIM.eBul);
  if(G.parts.length>LIM.parts) G.parts.splice(0,G.parts.length-LIM.parts);
  if(G.mosqs.length>LIM.mosqs) G.mosqs.splice(0,G.mosqs.length-LIM.mosqs);
  if(G.kams.length>LIM.kams) G.kams.splice(0,G.kams.length-LIM.kams);
  if(G.plasmas.length>LIM.plasmas) G.plasmas.splice(0,G.plasmas.length-LIM.plasmas);
  if(G.wraiths.length>LIM.wraiths) G.wraiths.splice(0,G.wraiths.length-LIM.wraiths);
  if(!isFinite(G.pX)) G.pX=G.w/2-G.pW/2;
  if(!isFinite(G.pY)) G.pY=G.h-70;
  if(G.nextWaveT&&now-G.nextWaveT>5000) G.nextWaveT=0;
}
function sp(arr,obj,max){arr.push(obj);if(arr.length>max) arr.splice(0,arr.length-max);}
function hit(a,b){return a&&b&&a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function fitInvaders(){
  if(!G.invaders?.length||G.bossMode) return;
  const al=G.invaders.filter(v=>v.alive);if(!al.length) return;
  const bot=Math.max(...al.map(v=>v.y+v.h));
  const ov=bot-G.eAreaCap;if(ov>0) G.invaders.forEach(v=>v.y-=ov+10);
}
function updateProfile(){
  const asp=G.w/Math.max(1,G.h);
  G.isPortrait=G.h>=G.w;
  G.pMagnet=G.isPortrait?165:(asp>1.45?118:138);
  G.eAreaCap=Math.max(165,G.h-(G.isPortrait?238:218));
  G.stepDown=G.isPortrait?16:13;
}

/* ────────────────────────────
   EXPLOSIONS / PARTICLES

function explode(x,y,col,n){for(let i=0;i<n;i++) sp(G.parts,{x,y,vx:(Math.random()*2-1)*(145+Math.random()*115),vy:(Math.random()*2-1)*(145+Math.random()*115),life:420+Math.random()*320,col,s:Math.random()>.65?3:2},LIM.parts);}
function burst(x,y,col='#fff',n=7){for(let i=0;i<n;i++) sp(G.parts,{x,y,vx:(Math.random()*2-1)*(65+Math.random()*60),vy:(Math.random()*2-1)*(65+Math.random()*60),life:120+Math.random()*120,col,s:Math.random()>.5?2:1},LIM.parts);}

function spawnPower(x,y,kind='double'){
  const cols2={double:'#7df9ff',triple:'#ff7b72',shield:'#72f3ff',laser:'#ff4dff',ally:'#ffe37a',emp:'#76f7ff',missile:'#ffaa44',overcharge:'#ffee44',area_bomb:'#ff8844'};
  const travel=Math.max(120,G.pY-y-8);
  const tMs=Math.max(3200,Math.min(6200,(travel/(G.isPortrait?76:96))*1000+1100));
  const vy=travel/(tMs/1000);
  G.wPow++;
  sp(G.parts,{kind:'power',x,y,vx:0,vy,life:tMs+2800,col:cols2[kind]||'#7df9ff',s:7,power:kind,rot:Math.random()*6.28},LIM.parts);
}

function triggerEMP(){
  G.empFlash=performance.now()+260;
  const cx2=G.pX+G.pW/2,cy2=G.pY+G.pH/2;
  explode(cx2,cy2,C.emp,28);burst(cx2,cy2,'#fff',20);
  G.eBul=G.eBul.filter((_,i)=>i%2===0);
  for(const m of G.mosqs){if(m.alive&&Math.random()<.65){m.alive=false;G.score+=35;explode(m.x+m.w/2,m.y+m.h/2,m.col||C.mosquito,14);}}
  for(const k of G.kams){if(k.alive&&Math.random()<.7){k.alive=false;G.score+=45;explode(k.x+k.w/2,k.y+k.h/2,k.col,16);}}
  for(const p of G.plasmas){if(p.alive&&Math.random()<.75){p.alive=false;G.score+=40;explode(p.x+p.w/2,p.y+p.h/2,C.plasma,14);}}
  const al=G.invaders.filter(v=>v.alive);
  const kill=Math.max(1,Math.floor(al.length*.48));let rm=0;
  for(const inv of al.sort(()=>Math.random()-.5)){if(rm>=kill) break;if(inv.special||inv.kind==='carrier'){inv.hp=Math.max(1,(inv.hp||1)-2);burst(inv.x+inv.w/2,inv.y+inv.h/2,C.emp,8);continue;}inv.hp=0;enemyKilled(inv);rm++;}
  if(G.ufo){explode(G.ufo.x+G.ufo.w/2,G.ufo.y+G.ufo.h/2,C.emp,20);G.score+=120;G.ufo=null;}
  if(G.boss){G.boss.hp-=Math.max(4,Math.round(G.boss.maxHp*.09));burst(G.boss.x+G.boss.w/2,G.boss.y+G.boss.h/2,C.emp,24);if(G.boss.hp<=0){G.score+=420+G.wave*22;checkLife();explode(G.boss.x+G.boss.w/2,G.boss.y+G.boss.h/2,G.boss.col,44);G.boss=null;nextWave();}}
  beep(180,.14,'sawtooth',.055,2.1);setTimeout(()=>beep(90,.16,'triangle',.045,.6),70);
  setCombo('EMP 50%');checkLife();
}
function triggerMissile(now){
  if(!G.mosqs.concat(G.kams,G.invaders.filter(v=>v.alive)).length) return;
  const targets=[...G.mosqs.filter(m=>m.alive),...G.kams.filter(k=>k.alive),...G.invaders.filter(v=>v.alive)];
  if(!targets.length) return;
  const tgt=targets.sort((a,b)=>{const da=Math.hypot(a.x-G.pX,a.y-G.pY),db=Math.hypot(b.x-G.pX,b.y-G.pY);return da-db;})[0];
  const dx=tgt.x+tgt.w/2-(G.pX+G.pW/2),dy=tgt.y+tgt.h/2-(G.pY+G.pH/2);
  const dist=Math.hypot(dx,dy);
  if(dist<1) return;
  const vx=(dx/dist)*700,vy=(dy/dist)*700;
  sp(G.pBul,{x:G.pX+G.pW/2-2,y:G.pY-8,w:5,h:14,v:0,vx,vy,isMissile:true,target:tgt,turn:3.2},LIM.pBul);
  beep(320,.08,'sawtooth',.03,1.4);
}
function triggerAreaBomb(){
  const cx2=G.pX+G.pW/2,cy2=G.pY-60,rad=100+G.wave*4;
  for(const inv of G.invaders){if(!inv.alive) continue;const d=Math.hypot(inv.x+inv.w/2-cx2,inv.y+inv.h/2-cy2);if(d<rad){inv.hp-=2;if(inv.hp<=0) enemyKilled(inv);else burst(inv.x+inv.w/2,inv.y+inv.h/2,inv.col,6);}}
  for(const m of G.mosqs){if(m.alive&&Math.hypot(m.x+m.w/2-cx2,m.y+m.h/2-cy2)<rad){m.alive=false;G.score+=35;explode(m.x+m.w/2,m.y+m.h/2,m.col||C.mosquito,12);}}
  if(G.boss&&Math.hypot(G.boss.x+G.boss.w/2-cx2,G.boss.y+G.boss.h/2-cy2)<rad*1.5){G.boss.hp-=Math.max(3,Math.round(G.boss.maxHp*.07));burst(G.boss.x+G.boss.w/2,G.boss.y+G.boss.h/2,'#ff8844',18);}
  // visual ring
  for(let i=0;i<20;i++){const a=i/20*Math.PI*2;sp(G.parts,{x:cx2+Math.cos(a)*rad*.5,y:cy2+Math.sin(a)*rad*.5,vx:Math.cos(a)*180,vy:Math.sin(a)*180,life:400+Math.random()*200,col:'#ff8844',s:3},LIM.parts);}
  beep(220,.16,'sawtooth',.055,.55);setTimeout(()=>beep(110,.2,'triangle',.04,.4),100);
  setCombo('BOMBA ÁREA');checkLife();
}

function applyPower(kind){
  const now=performance.now();
  if(kind==='triple'||kind==='double'){G.fireLevel=kind==='triple'?3:2;G.powerUntil=now+10000;beep(kind==='triple'?760:640,.12,'square',.04,1.2);setCombo(kind==='triple'?'TRIPLE x10s':'DOBLE x10s');}
  else if(kind==='shield'){G.shieldUntil=now+12000;beep(560,.14,'triangle',.04,1.18);setCombo('SHIELD x12s');}
  else if(kind==='laser'){G.laserUntil=now+3000;G.laserUsed=true;beep(920,.16,'sawtooth',.045,.92);setCombo('LASER x3s');}
  else if(kind==='emp'){G.empUsed=true;triggerEMP();}
  else if(kind==='ally'){G.aux=Math.min(2,Math.max(1,G.aux));G.auxUntil=now+5000;G.allyUsed=true;beep(700,.1,'square',.035,1.08);setCombo('AUXILIAR x5s');}
  else if(kind==='missile'){G.missileUntil=now+8000;beep(480,.1,'sawtooth',.03,1.3);setCombo('MISIL GUIADO x8s');}
  else if(kind==='overcharge'){G.overchargeUntil=now+6000;G.fireCd=Math.floor(G.fireCd*.42);beep(680,.1,'square',.04,1.5);setCombo('SOBRECARGA x6s');}
  else if(kind==='area_bomb'){triggerAreaBomb();}
  saveGame();
}

/* ────────────────────────────
   ENEMY DEATH + COMBO
   ──────────────────────────── */
function addCombo(){
  const now=performance.now();
  if(now<G.comboUntil) G.combo+=1; else G.combo=1;
  G.comboUntil=now+1200;
  if(G.combo>=3){G.score+=G.combo*5;setCombo('COMBO x'+G.combo);}
}
function enemyKilled(inv){
  inv.alive=false;G.killsWave++;G.score+=inv.pts;addCombo();
  explode(inv.x+inv.w/2,inv.y+inv.h/2,inv.col||C.octo,14);
  noise(.07,.03,inv.kind==='squid'?1300:900);
  const pool=k=>!(k==='ally'&&G.allyUsed)&&!(k==='laser'&&G.laserUsed)&&!(k==='emp'&&(G.empUsed||G.wave<5))&&!(k==='missile'&&G.wave<4)&&!(k==='area_bomb'&&G.wave<6);
  const pick=arr=>{const f=arr.filter(pool);return f.length?f[Math.floor(Math.random()*f.length)]:null;};
  if(G.wPow<2&&inv.special){
    const ep=G.wave>=5?['double','triple','shield','laser','ally','emp','missile','overcharge']:['double','triple','shield','ally'];
    const d=pick(ep);if(d) spawnPower(inv.x+inv.w/2,inv.y+inv.h/2,d);
  } else if(G.wPow<2&&inv.kind==='carrier'&&Math.random()<.12){
    const d=pick(G.wave>=5?['shield','ally','double','laser','emp','area_bomb']:['shield','ally','double']);
    if(d) spawnPower(inv.x+inv.w/2,inv.y+inv.h/2,d);
  } else if(G.wPow<1&&Math.random()<.026){
    const d=pick(['double','triple','shield','missile']);
    if(d) spawnPower(inv.x+inv.w/2,inv.y+inv.h/2,d);
  }
  checkLife();
}
function checkLife(){
  if(G.score>=G.nextLife){G.lives++;G.nextLife+=2500;setCombo('+1 VIDA');fanfare('life');saveGame();}
}

function handleInput(dt){
  let dx=0;
  if(G.ml) dx=-1;if(G.mr) dx=1;
  if(G.vjActive) dx=G.vjDx;
  // gamepad
  if(G.gpIdx!==null){const gp=navigator.getGamepads()[G.gpIdx];if(gp){const ax=gp.axes[0]||0;if(Math.abs(ax)>.12) dx=ax;if(gp.buttons[0]?.pressed&&!G._gpA){G._gpA=true;triggerActivepower();}if(!gp.buttons[0]?.pressed) G._gpA=false;}}
  if(dx!==0){const spd=Math.max(510,G.w*1.02)*G.spdMult;G.pX=Math.max(8,Math.min(G.w-G.pW-8,G.pX+dx*spd*dt/1000));}
}
function triggerActivepower(){
  const now=performance.now();
  if(now<G.empFlash) return;
  // use EMP if available in parts
  const ep=G.parts.findIndex(p=>p.kind==='power'&&p.power==='emp');
  if(ep>=0){G.parts.splice(ep,1);triggerEMP();}
}
function bulletPattern(){
  const ss=Math.round(Math.max(340,(G.bSpd||760)*.78));
  if(G.fireLevel===3) return [{off:0,vx:0},{off:-12,vx:-ss},{off:12,vx:ss}];
  if(G.fireLevel===2) return [{off:-7,vx:-90},{off:7,vx:90}];
  return [{off:0,vx:0}];
}
function autoShoot(now){
  if(G.cdTimer!==0||G.paused||G.over) return;
  if(now-G.lastFire<G.fireCd) return;
  G.lastFire=now;
  // Nebula special: plasma wave
  if(G.shipType==='nebula'&&G.fireLevel===3){
    for(let a=-2;a<=2;a++) sp(G.pBul,{x:G.pX+G.pW/2-2,y:G.pY-8,w:4,h:14,v:G.bSpd,vx:a*180,isNeb:true},LIM.pBul);
    shipBeep();G.shots++;return;
  }
  for(const sh of bulletPattern()) sp(G.pBul,{x:G.pX+G.pW/2-2+sh.off,y:G.pY-8,w:4,h:16,v:G.bSpd,vx:sh.vx||0},LIM.pBul);
  if(G.aux>0){
    const aoffs=G.aux===1?[-G.pW*.92]:[-G.pW*.92,G.pW*.92];
    for(const ax of aoffs) sp(G.pBul,{x:G.pX+G.pW/2-2+ax,y:G.pY-2,w:3,h:13,v:G.bSpd*.9,vx:0},LIM.pBul);
  }
  // Missile auto-fire
  if(performance.now()<G.missileUntil&&now-G._lastMissile>1200){G._lastMissile=now;triggerMissile(now);}
  shipBeep();G.shots++;
}

/* ────────────────────────────
   BULLET UPDATE
   ──────────────────────────── */
function updateBullets(dt){
  const now=performance.now();
  for(let i=G.pBul.length-1;i>=0;i--){
    const b=G.pBul[i];
    if(b.isMissile&&b.target&&b.target.alive){
      const tx=b.target.x+b.target.w/2,ty=b.target.y+b.target.h/2;
      const dx=tx-(b.x+b.w/2),dy=ty-(b.y+b.h/2);
      const dist=Math.hypot(dx,dy)||1;
      const spd=Math.hypot(b.vx,b.vy)||700;
      const tdx=dx/dist*spd,tdy=dy/dist*spd;
      b.vx+=(tdx-b.vx)*Math.min(1,b.turn*dt/1000);
      b.vy+=(tdy-b.vy)*Math.min(1,b.turn*dt/1000);
    }
    b.y+=((b.v||0)+(b.vy||0))*dt/1000;b.x+=(b.vx||0)*dt/1000;
    if(erodeShield(b.x+b.w/2,b.y+b.h/2)){G.pBul.splice(i,1);continue;}
    if(G.ufo&&hit(b,G.ufo)){
      const bn=80+((G.shots===23||(G.shots>23&&(G.shots-23)%15===0))?220:(Math.floor(Math.random()*5)*25));
      G.score+=bn;burst(b.x,b.y,'#fff5aa',10);explode(G.ufo.x+G.ufo.w/2,G.ufo.y+G.ufo.h/2,C.ufo,20);
      noise(.15,.05,1200);beep(640,.12,'square',.04,.8);G.ufo=null;G.pBul.splice(i,1);setCombo('UFO +'+bn);continue;
    }
    if(G.boss&&hit(b,G.boss)){
      G.boss.hp-=b.isMissile?4:1;G.pBul.splice(i,1);
      burst(b.x,b.y,'#ffd48f',8);explode(b.x,b.y,G.boss.col,6);beep(180,.02,'square',.015,1.01);
      if(G.boss.hp<=0) killBoss();continue;
    }
    let rm=false;
    for(const inv of G.invaders){if(inv.alive&&hit(b,inv)){burst(b.x,b.y,inv.col,8);inv.hp=(inv.hp||1)-(b.isMissile?3:1);if(inv.hp<=0) enemyKilled(inv);else beep(210,.02,'square',.012,1.01);G.pBul.splice(i,1);rm=true;break;}}if(rm) continue;
    for(const m of G.mosqs){if(m.alive&&hit(b,m)){m.alive=false;G.score+=40;addCombo();checkLife();if(Math.random()<.2) spawnPower(m.x+m.w/2,m.y+m.h/2,['double','shield','emp'][Math.floor(Math.random()*3)]);burst(b.x,b.y,'#ffd7f4',8);explode(m.x+m.w/2,m.y+m.h/2,m.col||C.mosquito,16);noise(.08,.035,1400);G.pBul.splice(i,1);rm=true;break;}}if(rm) continue;
    for(const k of G.kams){if(k.alive&&hit(b,k)){k.alive=false;G.score+=55;addCombo();checkLife();burst(b.x,b.y,'#ffe8a6',8);explode(k.x+k.w/2,k.y+k.h/2,k.col,18);if(Math.random()<.25) spawnPower(k.x+k.w/2,k.y+k.h/2,['double','shield','laser','ally','emp'][Math.floor(Math.random()*5)]);G.pBul.splice(i,1);rm=true;break;}}if(rm) continue;
    for(const p of G.plasmas){if(p.alive&&hit(b,p)){p.hp-=1;if(p.hp<=0){p.alive=false;G.score+=45;addCombo();checkLife();explode(p.x+p.w/2,p.y+p.h/2,C.plasma,16);// plasma death: burst bullets
      if(G.wave>=3) for(let a=0;a<5;a++){const ang=a/5*Math.PI*2;sp(G.eBul,{x:p.x+p.w/2,y:p.y+p.h/2,w:6,h:6,v:0,vx:Math.cos(ang)*140,vy:Math.sin(ang)*140,kind:'rolling',phase:Math.random()*999,life:5000},LIM.eBul);}
    } else burst(b.x,b.y,C.plasma,6);G.pBul.splice(i,1);rm=true;break;}}if(rm) continue;
    for(const w of G.wraiths){if(w.alive&&w.visible&&hit(b,w)){w.hp-=1;if(w.hp<=0){w.alive=false;G.score+=60;addCombo();checkLife();explode(w.x+w.w/2,w.y+w.h/2,C.wraith,16);}else burst(b.x,b.y,C.wraith,6);G.pBul.splice(i,1);rm=true;break;}}if(rm) continue;
    if(b.y<-28||b.x<-32||b.x>G.w+32) G.pBul.splice(i,1);
  }
  for(let i=G.eBul.length-1;i>=0;i--){
    const b=G.eBul[i];
    // directional (vx/vy) + fixed-speed (v) bullets both handled
    b.y += ((b.v||0)+(b.vy||0))*dt/1000;
    b.x += (b.vx||0)*dt/1000;
    // oscillation offsets for special kinds
    if(b.kind==='zigzag') b.x+=Math.sin((now+b.phase)/95)*2.2;
    else if(b.kind==='rolling') b.x+=Math.cos((now+b.phase)/75)*1.6;
    else if(b.kind==='spiral') b.x+=Math.cos((now/80+b.phase))*2.8;
    if(b.kind==='bomb'){b.w=8;b.h=16;}
    // lifetime expiry
    if(b.life!==undefined){b.life-=dt;if(b.life<=0){G.eBul.splice(i,1);continue;}}
    if(erodeShield(b.x,b.y)){G.eBul.splice(i,1);continue;}
    if(now>=G.respawnUntil&&hit(b,{x:G.pX,y:G.pY,w:G.pW,h:G.pH})){
      G.eBul.splice(i,1);
      if(now<G.shieldUntil){burst(G.pX+G.pW/2,G.pY+G.pH/2,C.shield,10);beep(480,.03,'triangle',.02,1.04);}
      else loseLife();continue;
    }
    // remove if off any edge
    if(b.y>G.h+32||b.y<-32||b.x<-32||b.x>G.w+32) G.eBul.splice(i,1);
  }
}
function killBoss(){
  G.score+=420+G.wave*22;checkLife();
  explode(G.boss.x+G.boss.w/2,G.boss.y+G.boss.h/2,G.boss.col,46);
  noise(.22,.06,700);beep(420,.18,'sawtooth',.04,.5);
  G.boss=null;nextWave();
}

/* ────────────────────────────
   BOSS MINIONS — fighter ships launched by boss

G.bMinions=[];
function spawnMinionInterval(){return Math.max(1800,5000-G.wave*220);}
function spawnBossMinion(b){
  if(!b) return;
  const ph=bossPhase(b);
  const count=ph===2?2:1;
  for(let i=0;i<count;i++){
    const side=i%2===0?-1:1;
    const sx=b.x+b.w/2+side*(b.w*.38);
    const sy=b.y+b.h;
    const col=['#ff5cb8','#ff9d45','#7df9ff','#ff5252','#b6ff66','#ffda6b'][Math.floor(Math.random()*6)];
    sp(G.bMinions,{
      x:sx-12,y:sy,w:24,h:18,
      vx:side*(40+Math.random()*60),vy:90+G.wave*8+Math.random()*40,
      alive:true,frame:0,col,
      hp:1,lastShot:0,
      shotInterval:Math.max(600,1400-G.wave*50)
    },32);
  }
  beep(380,.06,'sawtooth',.018,.9);
}
function updateBossMinions(dt,now){
  for(let i=G.bMinions.length-1;i>=0;i--){
    const m=G.bMinions[i];
    if(!m.alive){G.bMinions.splice(i,1);continue;}
    m.x+=m.vx*dt/1000;
    m.y+=m.vy*dt/1000;
    m.vx*=0.995; // friction drift
    m.frame=Math.floor(now/130)%2;
    // minion shoots at player
    if(now-m.lastShot>m.shotInterval){
      m.lastShot=now;
      const tx=G.pX+G.pW/2-(m.x+m.w/2);
      const ty=G.pY-(m.y+m.h);
      const dist=Math.hypot(tx,ty)||1;
      const bv=260+G.wave*10;
      sp(G.eBul,{x:m.x+m.w/2-2,y:m.y+m.h,w:4,h:9,v:0,
        vx:(tx/dist)*bv*.35,vy:(ty/dist)*bv,
        kind:'straight',phase:0,life:4000},LIM.eBul);
    }
    // minion hits player
    if(now>=G.respawnUntil&&hit(m,{x:G.pX,y:G.pY,w:G.pW,h:G.pH})){
      m.alive=false;explode(m.x+m.w/2,m.y+m.h/2,m.col,14);
      if(now<G.shieldUntil) burst(G.pX+G.pW/2,G.pY+G.pH/2,C.shield,8);
      else loseLife();continue;
    }
    // player bullet hits minion
    for(let j=G.pBul.length-1;j>=0;j--){
      const b=G.pBul[j];
      if(hit(b,m)){
        m.alive=false;G.score+=35;addCombo();checkLife();
        explode(m.x+m.w/2,m.y+m.h/2,m.col,14);
        G.pBul.splice(j,1);break;
      }
    }
    // off-screen
    if(m.y>G.h+40||m.x<-60||m.x>G.w+60) m.alive=false;
  }
  G.bMinions=G.bMinions.filter(m=>m.alive);
}

/* ────────────────────────────
   ENEMY FIRE
   ──────────────────────────── */
function enemyFire(now){
  if(G.cdTimer!==0||G.paused) return;
  const al=G.invaders.filter(v=>v.alive);if(!al.length&&!G.bossMode) return;
  const interval=Math.max(120,820-G.wave*22);
  if(now-G.lastES<interval) return;
  G.lastES=now;

  if(G.bossMode&&G.boss){
    const b=G.boss,ph=bossPhase(b);
    const cx2=b.x+b.w/2,cy2=b.y+b.h;
    const bv=340+G.wave*12;
    const shots_per_ph=[1,2,3];
    const n=shots_per_ph[ph];
    for(let s=0;s<n;s++){
      const offx=(s-(n-1)/2)*38;
      const tx=G.pX+G.pW/2+offx-(cx2),ty=G.pY-cy2;
      const dist=Math.hypot(tx,ty)||1;
      const kind=ph===2?['zigzag','rolling','spiral'][s%3]:ph===1?'rolling':'straight';
      sp(G.eBul,{x:cx2-4+offx*.3,y:cy2,w:7,h:14,v:0,vx:(tx/dist)*bv,vy:(ty/dist)*bv,kind,phase:Math.random()*999,life:5000},LIM.eBul);
    }
    // Phase 2: additional radial burst every 2.5s
    if(ph===2&&(!b._radialT||now-b._radialT>2500)){
      b._radialT=now;
      for(let a=0;a<8;a++){const ang=a/8*Math.PI*2;sp(G.eBul,{x:cx2,y:cy2,w:6,h:6,v:0,vx:Math.cos(ang)*280,vy:Math.sin(ang)*280,kind:'rolling',phase:Math.random()*999,life:5000},LIM.eBul);}
    }
    // Bosses from wave 4+ spawn fighter minions
    if(G.wave>=4&&(!b._minionT||now-b._minionT>spawnMinionInterval())){
      b._minionT=now;
      spawnBossMinion(b);
    }
    return;
  }

  const shooters=al.sort(()=>Math.random()-.5).slice(0,Math.min(3+Math.floor(G.wave/3),8));
  for(const inv of shooters){
    const px=inv.x+inv.w/2,py=inv.y+inv.h;
    const tx=G.pX+G.pW/2-px,ty=G.pY-py;
    const dist=Math.hypot(tx,ty)||1;
    const bv=240+G.wave*14;
    const kind=G.wave>=7&&Math.random()<.3?'zigzag':G.wave>=10&&Math.random()<.25?'rolling':'straight';
    sp(G.eBul,{x:px-2,y:py,w:4,h:10,v:0,vx:(tx/dist)*bv*.4,vy:(ty/dist)*bv,kind,phase:Math.random()*999,life:5000},LIM.eBul);
  }
}

/* ────────────────────────────
   ENEMY MOVEMENT
   ──────────────────────────── */
function moveInvaders(now){
  if(G.cdTimer!==0||G.paused) return;
  if(G.bossMode){moveBoss(now);return;}
  if(now-G.lastIM<G.iSpd) return;
  G.lastIM=now;
  const al=G.invaders.filter(v=>v.alive);if(!al.length) return;
  const left=Math.min(...al.map(v=>v.x)),right=Math.max(...al.map(v=>v.x+v.w));
  let change=false;
  if((G.dir>0&&right+G.iDx>=G.w-10)||(G.dir<0&&left-G.iDx<=10)) change=true;
  if(change){G.dir*=-1;al.forEach(v=>v.y+=G.stepDown);beep(74,.05,'square',.02,1.01);}
  else al.forEach(v=>{v.x+=G.iDx*G.dir;v.frame=(v.frame+1)%2;});
  const frac=Math.max(.08,al.length/58);
  G.iSpd=Math.max(26,(430-G.wave*9)*frac);
  const bot=Math.max(...al.map(v=>v.y+v.h));
  if(performance.now()>=G.respawnUntil&&bot>=G.pY-12) triggerGameOver();
}

function spawnMosqs(now){

    sp(G.mosqs,{x:fl?-30-(n*18):G.w+30+(n*18),y,w:28,h:22,vx:(fl?1:-1)*(180+G.wave*5+n*14),vy:(dive?84:56)+G.wave*4+n*8,alive:true,frame:0,col,dive},LIM.mosqs);

function spawnKams(now){

  }
  beep(300,.06,'sawtooth',.018,.85);

function spawnPlasmas(now){
  if(G.bossMode||G.cdTimer!==0||G.paused||G.wave<5) return;
  const intv=Math.max(1200,5500-G.wave*180);
  if(now-G.lastPlasma<intv) return;G.lastPlasma=now;

function spawnWraiths(now){

  sp(G.wraiths,{x,y:60+Math.random()*60,w:30,h:28,vx:(Math.random()-.5)*(100+G.wave*4),vy:20+G.wave*3,alive:true,frame:0,col:C.wraith,hp:2,visible:true,visTimer:now+800,visToggle:1200+Math.random()*600},LIM.wraiths);
}

function updateMosqs(dt){
  for(let i=G.mosqs.length-1;i>=0;i--){
    const m=G.mosqs[i];if(!m.alive){continue;}
    m.x+=m.vx*dt/1000;
    m.y+=m.vy*dt/1000;
    if(m.dive){m.vy+=G.wave*1.4*dt/16;}
    m.frame=Math.floor(performance.now()/120)%2;
    if(m.x<-60||m.x>G.w+60||m.y>G.h+40) m.alive=false;
    if(performance.now()>=G.respawnUntil&&hit(m,{x:G.pX,y:G.pY,w:G.pW,h:G.pH})){
      m.alive=false;
      if(performance.now()<G.shieldUntil){burst(G.pX+G.pW/2,G.pY+G.pH/2,C.shield,8);}else loseLife();
    }
  }
}
function updateKams(dt){
  for(let i=G.kams.length-1;i>=0;i--){
    const k=G.kams[i];if(!k.alive) continue;
    k.x+=k.vx*dt/1000;k.y+=k.vy*dt/1000;
    k.vx+=(G.pX-k.x)*.0015*dt;
    k.frame=Math.floor(performance.now()/120)%2;
    if(k.x<-40||k.x>G.w+40||k.y>G.h+40) k.alive=false;
    if(performance.now()>=G.respawnUntil&&hit(k,{x:G.pX,y:G.pY,w:G.pW,h:G.pH})){
      k.alive=false;explode(G.pX+G.pW/2,G.pY+G.pH/2,'#ffaa44',16);
      if(performance.now()<G.shieldUntil){burst(G.pX+G.pW/2,G.pY+G.pH/2,C.shield,10);}else loseLife();
    }
  }
}
function updatePlasmas(dt,now){
  for(const p of G.plasmas){
    if(!p.alive) continue;
    p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;
    p.vx=Math.sin(now*.0015)*( 80+G.wave*4);
    p.frame=Math.floor(now/200)%2;
    if(p.x<-40||p.x>G.w+40||p.y>G.h+40){p.alive=false;continue;}
    if(performance.now()>=G.respawnUntil&&hit(p,{x:G.pX,y:G.pY,w:G.pW,h:G.pH})){
      p.alive=false;if(performance.now()<G.shieldUntil){burst(G.pX+G.pW/2,G.pY+G.pH/2,C.shield,8);}else loseLife();
    }
  }
}
function updateWraiths(dt,now){
  for(const w of G.wraiths){
    if(!w.alive) continue;
    w.x+=w.vx*dt/1000;w.y+=w.vy*dt/1000;
    w.frame=Math.floor(now/200)%2;
    if(now>w.visTimer){w.visible=!w.visible;w.visTimer=now+w.visToggle;}
    if(w.x<-40||w.x>G.w+40||w.y>G.h+40){w.alive=false;continue;}
    if(w.visible&&performance.now()>=G.respawnUntil&&hit(w,{x:G.pX,y:G.pY,w:G.pW,h:G.pH})){
      w.alive=false;if(performance.now()<G.shieldUntil){burst(G.pX+G.pW/2,G.pY+G.pH/2,C.shield,8);}else loseLife();
    }
  }
}

/* ────────────────────────────
   UFO
   ──────────────────────────── */
function updateUfo(now,dt){
  if(G.bossMode) return;
  if(!G.ufo){
    const intv=Math.max(8000,20000-G.wave*400);
    if(now-G.lastUfo>intv){G.lastUfo=now;const fl=Math.random()>.5;G.ufo={x:fl?-48:G.w+4,y:38+Math.random()*28,w:44,h:22,vx:fl?200:-200};beep(440,.04,'triangle',.015,1.02);}
  } else {
    G.ufo.x+=G.ufo.vx*dt/1000;
    if(G.ufo.x<-60||G.ufo.x>G.w+60){G.ufo=null;G.lastUfo=now;}
  }
}

/* ────────────────────────────
   LASER
   ──────────────────────────── */
function updateLaser(now){
  if(now>=G.laserUntil||G.cdTimer!==0||G.paused) return;
  if(!updateLaser._t||now-updateLaser._t>85){
    updateLaser._t=now;
    const lx=G.pX+G.pW/2-5;
    const beam={x:lx,y:0,w:10,h:G.pY};
    for(const inv of G.invaders){if(inv.alive&&hit(beam,inv)){inv.hp=0;enemyKilled(inv);}}
    for(const m of G.mosqs){if(m.alive&&hit(beam,m)){m.alive=false;G.score+=40;explode(m.x+m.w/2,m.y+m.h/2,m.col||C.mosquito,14);}}
    for(const k of G.kams){if(k.alive&&hit(beam,k)){k.alive=false;G.score+=55;explode(k.x+k.w/2,k.y+k.h/2,k.col,16);}}
    for(const p of G.plasmas){if(p.alive&&hit(beam,p)){p.alive=false;G.score+=45;explode(p.x+p.w/2,p.y+p.h/2,C.plasma,14);}}
    if(G.ufo&&hit(beam,G.ufo)){G.score+=180;explode(G.ufo.x+G.ufo.w/2,G.ufo.y+G.ufo.h/2,C.ufo,20);G.ufo=null;}
    if(G.boss&&hit(beam,G.boss)){G.boss.hp-=2;burst(lx+5,G.boss.y+G.boss.h/2,'#ffd48f',10);if(G.boss.hp<=0) killBoss();}
  }
}

/* ────────────────────────────
   PARTICLES UPDATE
   ──────────────────────────── */
function updateParts(dt){
  const now=performance.now();
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i];
    if(p.kind==='power'){
      const cx2=G.pX+G.pW/2;
      const pull=Math.max(0,1-Math.min(1,Math.abs(cx2-p.x)/(G.isPortrait?240:178)));
      p.x+=Math.sign(cx2-p.x)*G.pMagnet*pull*dt/1000;
      p.y+=p.vy*dt/1000;p.life-=dt;p.rot+=.03;
      if(hit({x:p.x-9,y:p.y-9,w:18,h:18},{x:G.pX,y:G.pY,w:G.pW,h:G.pH})){applyPower(p.power);G.parts.splice(i,1);continue;}
      if(p.y>G.h+20||p.life<=0) G.parts.splice(i,1);
    } else {
      p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.life-=dt;p.vy+=50*dt/1000;
      if(p.life<=0) G.parts.splice(i,1);
    }
  }
  if(G.fireLevel>1&&now>G.powerUntil) G.fireLevel=1;
  if(G.aux>0&&now>G.auxUntil) G.aux=0;
  if(G.hitFlash>0) G.hitFlash-=dt;
  if(now>G.overchargeUntil&&G.overchargeUntil>0){G.overchargeUntil=0;applyShipStats();}
}

/* ────────────────────────────
   LOSE LIFE / GAME OVER
   ──────────────────────────── */
function loseLife(){
  G.lives--;explode(G.pX+G.pW/2,G.pY+G.pH/2,'#ff6666',24);noise(.18,.06,600);
  beep(220,.14,'sawtooth',.05,.6);setTimeout(()=>beep(160,.18,'sawtooth',.05,.4),140);
  if(G.pMaxHp>1&&G.pHp>1){G.pHp--;G.hitFlash=350;G.respawnUntil=performance.now()+1200;return;}
  G.hitFlash=350;
  if(G.lives<=0){triggerGameOver();return;}
  G.pX=G.w/2-G.pW/2;G.respawnUntil=performance.now()+2400;
  setMsg('☆ '+G.lives+' VIDA'+(G.lives!==1?'S':'')+' ☆',1000);
}
function triggerGameOver(){
  if(G.over) return;G.over=true;
  fanfare('gameover');
  saveRank(G.player,G.score,G.wave);
  localStorage.removeItem(SK);
  setMsg('GAME OVER',0);
  setTimeout(()=>{showScreen('splash');stopPiano();startPiano();},3200);
}
function nextWave(){
  G.wave++;saveGame();
  setMsg('OLEADA '+G.wave,900);fanfare('wave');
  G.nextWaveT=performance.now();
  setTimeout(()=>{G.nextWaveT=0;buildWave(G.wave);},900);
}

/* ────────────────────────────
   RENDER
   ──────────────────────────── */
function drawBossHud(){
  if(!G.boss) return;
  const ph=bossPhase(G.boss);
  const w=Math.min(G.w*.36,260),h=11,x=G.w/2-w/2,y=46;
  ctx.fillStyle='rgba(0,0,0,.42)';ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle='#3b1f12';ctx.fillRect(x,y,w,h);
  const phCols=['#ff8b3d','#ff4422','#ff0011'];
  ctx.fillStyle=phCols[ph];ctx.fillRect(x,y,w*(G.boss.hp/G.boss.maxHp),h);
  ctx.strokeStyle='#ffd48f';ctx.strokeRect(x,y,w,h);
  // phase indicators
  for(let p=1;p<=2;p++){const px=x+w*(p===1?0.6:0.3);ctx.globalAlpha=.5;ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(px,y);ctx.lineTo(px,y+h);ctx.stroke();}
  ctx.globalAlpha=1;
}

function drawPowerHud(now){
  let txts=[];
  if(G.fireLevel>1) txts.push(`×${G.fireLevel} ${Math.max(0,Math.ceil((G.powerUntil-now)/1000))}s`);
  if(now<G.shieldUntil) txts.push(`SHIELD ${Math.max(0,Math.ceil((G.shieldUntil-now)/1000))}s`);
  if(now<G.laserUntil) txts.push(`LASER ${Math.max(0,Math.ceil((G.laserUntil-now)/1000))}s`);
  if(G.aux>0) txts.push(`AUX ${Math.max(0,Math.ceil((G.auxUntil-now)/1000))}s`);
  if(now<G.missileUntil) txts.push(`MSL ${Math.max(0,Math.ceil((G.missileUntil-now)/1000))}s`);
  if(now<G.overchargeUntil) txts.push(`OVR ${Math.max(0,Math.ceil((G.overchargeUntil-now)/1000))}s`);
  if(G.bossPending&&!G.bossMode) txts.push('JEFE PROX.');
  return txts.join(' · ');
}

function render(dt,now){
  ctx.clearRect(0,0,G.w,G.h);
  drawBg(dt,now);
  if(G.mode!=='game') return;

  if(!G.bossMode) drawShields();

  // draw invaders with phase flash for boss-phase enemies
  for(const inv of G.invaders){
    if(!inv.alive) continue;
    let alpha=1;
    if(inv.hp<inv.maxHp&&Math.floor(now/80)%2===0) alpha=.7;
    drawSpr(inv.x,inv.y,inv.w,inv.h,inv.kind,inv.frame,inv.col,alpha);
    // HP bar for multi-hp
    if(inv.maxHp>1&&inv.hp<inv.maxHp){
      ctx.fillStyle='#111';ctx.fillRect(inv.x,inv.y-4,inv.w,3);
      ctx.fillStyle='#88ff88';ctx.fillRect(inv.x,inv.y-4,inv.w*(inv.hp/inv.maxHp),3);
    }
  }
  for(const m of G.mosqs) if(m.alive) drawSpr(m.x,m.y,m.w,m.h,'mosquito',m.frame,m.col);
  for(const k of G.kams) if(k.alive) drawSpr(k.x,k.y,k.w,k.h,'kamikaze',k.frame,k.col);
  // boss minions
  for(const m of G.bMinions) if(m.alive){
    drawSpr(m.x,m.y,m.w,m.h,'kamikaze',m.frame,m.col);
  }
  for(const p of G.plasmas) if(p.alive){
    const al=.6+Math.sin(now*.006)*.4;
    drawSpr(p.x,p.y,p.w,p.h,'plasma_orb',p.frame,C.plasma,al);
  }
  for(const w of G.wraiths) if(w.alive&&w.visible){
    const al=.4+Math.sin(now*.008)*.35;
    drawSpr(w.x,w.y,w.w,w.h,'wraith',w.frame,C.wraith,al);
  }
  if(G.ufo) drawSpr(G.ufo.x,G.ufo.y,G.ufo.w,G.ufo.h,'ufo',0,C.ufo);

  // Boss with phase glow
  if(G.boss){
    const ph=bossPhase(G.boss);
    const frame=Math.floor(now/200)%2;
    if(ph===2&&Math.floor(now/90)%2===0){
      ctx.globalAlpha=.85;
    }
    drawSpr(G.boss.x,G.boss.y,G.boss.w,G.boss.h,G.boss.kind,frame,G.boss.col);
    ctx.globalAlpha=1;
    // phase 1 overlay tint
    if(ph>=1){
      ctx.globalAlpha=.08+(ph===2?0.1:0);
      ctx.fillStyle=ph===2?'#ff2200':'#ff8800';
      ctx.fillRect(G.boss.x,G.boss.y,G.boss.w,G.boss.h);
      ctx.globalAlpha=1;
    }
  }

  // Laser beam
  if(now<G.laserUntil){
    const lx=G.pX+G.pW/2-3;
    ctx.fillStyle='rgba(255,77,255,.85)';ctx.fillRect(lx,0,6,G.pY);
    ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(lx+1,0,2,G.pY);
  }
  // EMP flash
  if(now<G.empFlash){
    ctx.fillStyle='rgba(118,247,255,.14)';ctx.fillRect(0,0,G.w,G.h);
    ctx.strokeStyle='rgba(118,247,255,.6)';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(G.pX+G.pW/2,G.pY+G.pH/2,34+((G.empFlash-now)/260)*220,0,Math.PI*2);ctx.stroke();
  }

  // Bullets
  for(const b of G.pBul){
    ctx.fillStyle=b.isMissile?'#ffaa44':b.isNeb?'#aaddff':'#8cd3ff';
    if(b.isMissile){ctx.fillRect(b.x-1,b.y,7,10);ctx.globalAlpha=.5;ctx.fillStyle='#ffdd88';ctx.fillRect(b.x,b.y+10,5,5);ctx.globalAlpha=1;}
    else ctx.fillRect(Math.round(b.x),Math.round(b.y),Math.max(1,b.w),Math.max(1,b.h));
  }
  for(const b of G.eBul){
    ctx.globalAlpha=Math.max(0,b.life/660)||1;
    ctx.fillStyle=b.kind==='bomb'?C.bomb:b.kind==='spiral'?'#ff8888':'#ffe27a';
    ctx.fillRect(Math.round(b.x),Math.round(b.y),Math.max(1,b.w),Math.max(1,b.h));
    ctx.globalAlpha=1;
  }

  drawPlayer();

  // Particles
  for(const p of G.parts){
    if(p.kind==='power'){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);
      ctx.globalAlpha=Math.min(1,p.life/500);
      ctx.fillStyle=p.col;ctx.fillRect(-p.s,-p.s,p.s*2,p.s*2);
      ctx.strokeStyle=p.col;ctx.lineWidth=1;ctx.strokeRect(-p.s*1.8,-p.s*1.8,p.s*3.6,p.s*3.6);
      ctx.restore();
    } else {
      ctx.globalAlpha=Math.max(0,p.life/660);
      ctx.fillStyle=p.col;
      ctx.fillRect(Math.round(p.x),Math.round(p.y),Math.max(1,p.s),Math.max(1,p.s));
    }
    ctx.globalAlpha=1;
  }
  drawBossHud();

  // HUD text
  const pTxt=drawPowerHud(now);
  hL.textContent=`${G.player} · ${G.bossMode?'JEFE':'INV.'} · ${G.shipType.toUpperCase()}`;
  hC.textContent=`NIVEL ${G.wave}${pTxt?' · '+pTxt:''}`;
  hR.textContent=`${G.score} · ${G.lives}▲ · +1@${G.nextLife}`;

  // Virtual joystick
  if(G.vjActive&&G.isPortrait){
    ctx.globalAlpha=.3;ctx.strokeStyle='#ffffff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(G.vjBX,G.vjBY,G.vjRad,0,Math.PI*2);ctx.stroke();
    const tx=G.vjBX+G.vjDx*G.vjRad,ty=G.vjBY;
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(tx,ty,G.vjRad*.45,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
}

/* ────────────────────────────
   MAIN LOOP
   ──────────────────────────── */
function loop(now){
  const dt=Math.min(34,now-(G.lastT||now));G.lastT=now;
  try{
    compact(now);
    if(G.mode==='game'&&!G.paused&&!G.over){
      handleInput(dt);autoShoot(now);updateLaser(now);updateBullets(dt);
      updateParts(dt);moveInvaders(now);
      spawnMosqs(now);spawnKams(now);spawnPlasmas(now);spawnWraiths(now);updateBossMinions(dt,now);
      updateMosqs(dt);updateKams(dt);updatePlasmas(dt,now);updateWraiths(dt,now);
      enemyFire(now);updateUfo(now,dt);heartbeat();
      if(!G.bossMode){
        const alv=G.invaders.filter(v=>v.alive).length;
        if(!alv&&!G.nextWaveT){if(G.bossPending) spawnBoss();else nextWave();}
      }
    }
    render(dt,now);
  } catch(err){
    console.error('Loop recovery',err);
    compact(now);G.eBul=[];
    G.parts=G.parts.filter(p=>p.kind==='power').slice(-LIM.pow);
    if(G.mode==='game'&&!G.over){setMsg('RECUPERANDO...',650);}
    render(16,now);
  }
  requestAnimationFrame(loop);
}

/* ────────────────────────────
   RESIZE
   ──────────────────────────── */
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  CV.width=innerWidth*dpr;CV.height=innerHeight*dpr;
  CV.style.width=innerWidth+'px';CV.style.height=innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  G.w=innerWidth;G.h=innerHeight;
  updateProfile();
  if(!G.running) seedBg();
  G.pY=G.h-70;
  G.pX=Math.max(18,Math.min(G.w-G.pW-18,G.pX||G.w/2));
  if(G.mode==='game'){rebuildShields();fitInvaders();}
  setupVjoy();
}
addEventListener('resize',resize);

/* ────────────────────────────
   INPUT — KEYBOARD
   ──────────────────────────── */
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') G.ml=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') G.mr=true;
  if(e.key==='p'||e.key==='P') togglePause();
  if(e.key==='Escape'&&G.mode==='game'){saveGame();showScreen('splash');}
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') G.ml=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') G.mr=false;
});

/* ────────────────────────────
   VIRTUAL JOYSTICK (touch)
   ──────────────────────────── */
function setupVjoy(){
  G.vjRad=Math.min(54,G.h*.075);
  if(G.isPortrait||('ontouchstart' in window)){
    G.vjBX=G.w*.22;G.vjBY=G.h*.88;
    document.getElementById('ctag')&&(document.getElementById('ctag').style.display='none');
  }
}
function bindPointer(){
  const px=e=>{const r=CV.getBoundingClientRect();return(e.touches?e.touches[0].clientX:e.clientX)-r.left;};
  const py2=e=>{const r=CV.getBoundingClientRect();return(e.touches?e.touches[0].clientY:e.clientY)-r.top;};
  const onDown=e=>{
    if(G.mode!=='game') return;initAudio();
    const x=px(e),y=py2(e);
    // vjoy zone: left 45% of screen, bottom 40%
    if(G.isPortrait&&x<G.w*.45&&y>G.h*.6){
      G.vjActive=true;G.vjBX=x;G.vjBY=y;G.vjDx=0;
      G.vjTid=e.touches?e.touches[0].identifier:null;
    } else {G.ptrAct=true;movePtrX(x);}
    e.preventDefault?.();
  };
  const onMove=e=>{
    if(G.mode!=='game') return;
    if(G.vjActive){
      let tx=px(e);
      G.vjDx=Math.max(-1,Math.min(1,(tx-G.vjBX)/G.vjRad));
    } else if(G.ptrAct) movePtrX(px(e));
    e.preventDefault?.();
  };
  const onUp=e=>{G.ptrAct=false;if(G.vjActive){G.vjActive=false;G.vjDx=0;}};
  CV.addEventListener('mousedown',onDown);addEventListener('mousemove',onMove);addEventListener('mouseup',onUp);
  CV.addEventListener('touchstart',onDown,{passive:false});
  CV.addEventListener('touchmove',onMove,{passive:false});
  addEventListener('touchend',onUp);
  // Action button
  actBtn.addEventListener('touchstart',e=>{initAudio();triggerActivepower();e.preventDefault();},{passive:false});
  actBtn.addEventListener('click',()=>{initAudio();triggerActivepower();});
}
function movePtrX(x){G.pX=Math.max(8,Math.min(G.w-G.pW-8,x-G.pW/2));}

/* ────────────────────────────
   GAMEPAD
   ──────────────────────────── */
window.addEventListener('gamepadconnected',e=>{G.gpIdx=e.gamepad.index;});
window.addEventListener('gamepaddisconnected',()=>{G.gpIdx=null;});

/* ────────────────────────────
   PAUSE / SCREENS
   ──────────────────────────── */
function togglePause(){
  if(G.mode!=='game'||G.cdTimer>0||G.over) return;
  G.paused=!G.paused;
  pauseOv.classList.toggle('on',G.paused);
  pauseBtn.textContent=G.paused?'REANUDAR':'PAUSA';
  if(G.paused){
    document.getElementById('pStats').innerHTML=
      `Piloto: ${G.player}<br>Nave: ${G.shipType.toUpperCase()}<br>Puntos: ${G.score}<br>Oleada: ${G.wave}<br>Vidas: ${G.lives}`;
    saveGame();
  } else {
    gmsg.style.display='none';
  }
}
pauseBtn.onclick=togglePause;
document.getElementById('btnResume').onclick=togglePause;
document.getElementById('btnHangar').onclick=()=>{saveGame();showScreen('ships');};
document.getElementById('btnExit').onclick=()=>{saveGame();G.paused=false;pauseOv.classList.remove('on');showScreen('splash');stopPiano();startPiano();};

function showScreen(id){
  allScreens.forEach(s=>s.classList.toggle('active',s.id===id));
  hud.style.display='none';ctag.style.display='none';pauseBtn.style.display='none';
  pauseOv.classList.remove('on');actBtn.style.display='none';
  G.mode='menu';G.paused=false;
  if(id==='ranking') renderRanking();
  if(id==='load') renderSaveInfo();
  if(id==='ships') renderShips();
  if(id==='splash') renderSplashSave();
}
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>showScreen(b.dataset.back));

/* ────────────────────────────
   GAME START
   ──────────────────────────── */
function applyShipStats(){
  const s=SHIPS.find(s=>s.id===G.shipType)||SHIPS[0];
  G.shipType=s.id;G.shipCol=s.col;G.shipAcc=s.acc;G.spdMult=s.spd;
  G.fireCd=s.cd;G.bSpd=s.bs;G.pMaxHp=s.hp;G.pHp=s.hp;
}
function getSelectedShip(){
  const saved=localStorage.getItem(HK)||'classic';
  const best=getBestScore();
  const ok=SHIPS.find(s=>s.id===saved&&best>=s.unlock);
  return ok?ok.id:'classic';
}
function startGame(fromSave=false){
  initAudio();stopPiano();
  const sv=fromSave?readSave():null;
  G.player=sv?.player||(document.getElementById('pilotName').value.trim().toUpperCase()||'PILOTO');
  G.wave=sv?.wave||1;G.lives=sv?.lives||5;G.score=sv?.score||0;
  G.fireLevel=Math.max(1,Math.min(3,sv?.fireLevel||1));
  G.powerUntil=sv?.powerLeft?performance.now()+sv.powerLeft:0;
  G.shieldUntil=sv?.shieldLeft?performance.now()+sv.shieldLeft:0;
  G.laserUntil=sv?.laserLeft?performance.now()+sv.laserLeft:0;
  G.aux=sv?.aux??0;G.auxUntil=sv?.auxLeft?performance.now()+sv.auxLeft:0;
  G.shipType=sv?.shipType||getSelectedShip();applyShipStats();
  G.pW=Math.max(34,Math.min(54,Math.floor(G.w/19)));G.pH=Math.floor(G.pW*.55);
  G.pX=G.w/2-G.pW/2;G.pY=G.h-70;
  G.running=true;G.paused=false;G.over=false;G.startAt=performance.now();
  G.cdTimer=3;G.combo=0;G.comboUntil=0;
  G.respawnUntil=performance.now()+1800;G.hitFlash=0;
  G.nextLife=Math.max(2500,(Math.floor((G.score||0)/2500)+1)*2500);
  G.kams=[];G.lastKam=0;G.carriers=[];
  buildWave(G.wave);
  allScreens.forEach(s=>s.classList.remove('active'));
  hud.style.display='flex';ctag.style.display='flex';pauseBtn.style.display='block';
  // show act button on mobile
  if('ontouchstart' in window){
    const abSz=Math.round(G.vjRad*1.7);
    actBtn.style.display='flex';
    actBtn.style.width=actBtn.style.height=abSz+'px';
    actBtn.style.right='14px';
    actBtn.style.bottom=Math.round(G.h*.28)+'px';
    actBtn.style.position='absolute';
    actBtn.style.zIndex='15';
  }
  G.mode='game';compact(performance.now());
  restMsgStyle();setMsg('3',0);cdTick();saveGame();
  setupVjoy();
}
function cdTick(){
  if(G.mode!=='game') return;
  if(G.cdTimer>1) beep(220+G.cdTimer*70,.08,'square',.03,1.02);
  if(G.cdTimer===0){gmsg.style.display='none';beep(520,.12,'square',.04,1.4);return;}
  restMsgStyle();setMsg(String(G.cdTimer),0);G.cdTimer--;setTimeout(cdTick,650);
}

/* ────────────────────────────
   SAVE / RANK / SHIPS
   ──────────────────────────── */
function saveGame(){
  localStorage.setItem(SK,JSON.stringify({
    player:G.player,wave:G.wave,lives:G.lives,score:G.score,
    fireLevel:G.fireLevel,powerLeft:Math.max(0,G.powerUntil-performance.now()),
    shieldLeft:Math.max(0,G.shieldUntil-performance.now()),
    laserLeft:Math.max(0,G.laserUntil-performance.now()),
    aux:G.aux,auxLeft:Math.max(0,G.auxUntil-performance.now()),shipType:G.shipType
  }));
}
function readSave(){try{return JSON.parse(localStorage.getItem(SK)||'null');}catch{return null;}}
function saveRank(name,score,wave){
  const arr=rankData();arr.push({name,score,wave,at:new Date().toLocaleDateString()});
  arr.sort((a,b)=>b.score-a.score||b.wave-a.wave);
  localStorage.setItem(RK,JSON.stringify(arr.slice(0,20)));
}
function rankData(){try{return JSON.parse(localStorage.getItem(RK)||'[]');}catch{return[];}}
function getBestScore(){const a=rankData();return a.length?Math.max(...a.map(r=>r.score||0)):0;}
function renderRanking(){
  const list=document.getElementById('rankList');const arr=rankData();
  list.innerHTML=arr.length?arr.map((r,i)=>`<div><span>${i+1}. ${r.name}</span><span>${r.score} · N${r.wave} · ${r.at}</span></div>`).join(''):'<div><span>SIN REGISTROS</span><span>—</span></div>';
}
function renderSaveInfo(){
  const box=document.getElementById('saveInfo');const s=readSave();
  box.innerHTML=s?`<div><span>${s.player}</span><span>Puntos ${s.score}</span></div><div><span>Nivel ${s.wave}</span><span>Vidas ${s.lives}</span></div>`:'<div><span>NO HAY PARTIDA GUARDADA</span><span>—</span></div>';
}
function renderSplashSave(){
  const box=document.getElementById('splSave');const s=readSave();
  if(s){box.style.display='block';box.innerHTML=`<div class="sr"><span>GUARDADO: ${s.player}</span><span>Pts ${s.score} · N${s.wave} · Vidas ${s.lives}</span></div>`;}
  else box.style.display='none';
}
function renderShips(){
  const box=document.getElementById('shipList');const best=getBestScore();const sel=getSelectedShip();
  box.innerHTML=SHIPS.map(s=>{
    const ok=best>=s.unlock;
    return`<div class="sCard ${ok?'':'lock'}">
      <div class="top"><strong style="color:${s.col}">${s.name}</strong><span style="font-size:11px">${ok?'DESBLOQUEADA':'REQ. '+s.unlock+' PTS'}</span></div>
      <div style="font-size:11px;color:#7aab90;margin-bottom:6px">${s.desc} · Vel ${Math.round(s.spd*100)} · Cd ${s.cd}ms</div>
      <button ${ok?'':'disabled'} data-ship="${s.id}">${sel===s.id?'✓ EQUIPADA':'ELEGIR'}</button>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-ship]').forEach(btn=>btn.onclick=()=>{localStorage.setItem(HK,btn.dataset.ship);renderShips();});
}

/* ────────────────────────────
   MSG HELPERS
   ──────────────────────────── */
function setMsg(txt,ms=1200){
  if(!txt){gmsg.style.display='none';return;}
  gmsg.textContent=txt;gmsg.style.display='block';
  clearTimeout(setMsg._t);
  if(ms>0) setMsg._t=setTimeout(()=>gmsg.style.display='none',ms);
}
function setCombo(txt){setMsg(txt,680);gmsg.style.top='11%';gmsg.style.fontSize='clamp(12px,1.9vw,19px)';gmsg.style.padding='5px 11px';}
function restMsgStyle(){gmsg.style.top='12%';gmsg.style.fontSize='clamp(13px,2.4vw,22px)';gmsg.style.padding='7px 14px';}

/* ────────────────────────────
   BUTTON WIRING
   ──────────────────────────── */
document.getElementById('btnLogin').onclick=()=>{initAudio();showScreen('login');};
document.getElementById('btnLoad').onclick=()=>{initAudio();const sv=readSave();if(sv) startGame(true);else{showScreen('load');}};
document.getElementById('btnRank').onclick=()=>showScreen('ranking');
document.getElementById('btnShips').onclick=()=>showScreen('ships');
document.getElementById('btnStart').onclick=()=>startGame(false);
document.getElementById('btnContinue').onclick=()=>readSave()?startGame(true):setMsg('NO HAY GUARDADO',900);
document.getElementById('btnDelSave').onclick=()=>{localStorage.removeItem(SK);renderSaveInfo();renderSplashSave();};
document.getElementById('btnClearRank').onclick=()=>{localStorage.removeItem(RK);renderRanking();};
document.getElementById('pilotName').addEventListener('keydown',e=>{if(e.key==='Enter') startGame(false);});

// Audio init on any first interaction
document.getElementById('splash').addEventListener('click',initAudio,{once:true});
document.getElementById('splash').addEventListener('touchstart',initAudio,{once:true});

/* ────────────────────────────
   BOOT
   ──────────────────────────── */
bindPointer();resize();renderRanking();renderSaveInfo();renderShips();renderSplashSave();
requestAnimationFrame(loop);

})();
</script>
