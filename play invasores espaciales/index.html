<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Starfall Frontier v0.4.3</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="overlay hidden">
      <div class="hud-left">
        <div class="pilot-line"><strong id="playerNameHud">Piloto</strong> · <span id="shipHud">Vanguard</span></div>
        <div class="world-line"><span id="worldHud">Mundo 1</span> · <span id="waveHud">Oleada 1</span></div>
        <div class="bars">
          <div class="bar-wrap"><span>Casco</span><div class="bar"><div id="healthBar" class="fill health"></div></div></div>
          <div class="bar-wrap"><span>Escudo</span><div class="bar"><div id="shieldBar" class="fill shield"></div></div></div>
          <div class="bar-wrap"><span>Jefe</span><div class="bar"><div id="bossBar" class="fill boss"></div></div></div>
        </div>
      </div>
      <div class="hud-right">
        <div class="score-line"><span id="scoreHud">0</span> pts</div>
        <div class="lives-line" id="livesHud">❤ ❤ ❤</div>
        <div class="relic-line">Reliquias: <span id="relicHud">0</span></div>
        <button id="pauseBtn" class="mini-btn">Pausa</button>
      </div>
    </div>

    <div id="menuScreen" class="screen visible">
      <div class="panel hero-panel">
        <h1>STARFALL FRONTIER</h1>
        <p class="subtitle">Explora · Sobrevive · Evoluciona</p>
        <div class="menu-group">
          <label for="playerName">Usuario</label>
          <input id="playerName" type="text" maxlength="18" placeholder="Ingresa tu nombre" />
        </div>
        <div class="menu-actions">
          <button id="btnNewGame" class="primary">Jugar</button>
          <button id="btnLoadGame">Cargar partida</button>
          <button id="btnRanking">Ranking</button>
          <button id="btnHangar">Hangar</button>
        </div>
        <p class="tiny">20 mundos · patrones únicos · audio dinámico por familia</p>
      </div>
    </div>

    <div id="hangarScreen" class="screen hidden">
      <div class="panel">
        <h2>Hangar</h2>
        <div id="shipCards" class="ship-grid"></div>
        <div class="panel-actions">
          <button id="btnHangarBack">Volver</button>
        </div>
      </div>
    </div>

    <div id="rankingScreen" class="screen hidden">
      <div class="panel">
        <h2>Ranking</h2>
        <ol id="rankingList" class="ranking-list"></ol>
        <div class="panel-actions">
          <button id="btnRankingBack">Volver</button>
        </div>
      </div>
    </div>

    <div id="pauseScreen" class="screen hidden">
      <div class="panel small">
        <h2>Juego en pausa</h2>
        <div class="panel-actions">
          <button id="btnResume">Continuar</button>
          <button id="btnPauseSave">Guardar y salir</button>
        </div>
      </div>
    </div>

    <div id="gameOverScreen" class="screen hidden">
      <div class="panel small">
        <h2 id="gameOverTitle">Game Over</h2>
        <p id="gameOverText">Has caído en combate.</p>
        <div class="panel-actions">
          <button id="btnRetryCheckpoint" class="primary">Reintentar checkpoint</button>
          <button id="btnBackMenu">Volver al menú</button>
        </div>
      </div>
    </div>

    <div id="toastLayer" class="overlay"></div>
  </div>

  <script src="js/worlds.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
