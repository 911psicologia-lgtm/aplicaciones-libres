<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMPI-2 · Aplicación clínica</title>
  <meta name="description" content="Aplicación clínica de apoyo para captura, integración y reporte MMPI-2; la corrección oficial puede importarse desde sistemas autorizados.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
  <!-- Pantallas -->
  <div id="app"></div>

  <!-- Modal overlay para menú hamburguesa -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content" id="modal-content"></div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- Vendor scripts (librerías externas) -->
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/docx.umd.min.js"></script>

  <!-- Datos: bootstrap externo para permitir CSP restrictiva -->
  <script src="js/lib/data-loader.js"></script>

  <!-- App scripts (módulos) -->
  <script src="js/lib/utils.js"></script>
  <script src="js/lib/storage.js"></script>
  <script src="js/lib/mmpi2.js"></script>
  <script src="js/lib/export.js"></script>
  <script src="js/lib/signature.js"></script>
  <script src="js/lib/ai-prompt.js"></script>
  <script src="js/screens/splash.js"></script>
  <script src="js/screens/setup.js"></script>
  <script src="js/screens/dashboard.js"></script>
  <script src="js/screens/case.js"></script>
  <script src="js/screens/capture.js"></script>
  <script src="js/screens/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
