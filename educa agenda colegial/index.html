        .logo { width: 50px; height: 50px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; }
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; margin: 2px; transition: all 0.3s; }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-primary:hover { background: #45a049; }
        .btn-danger { background: #f44336; color: white; }
        .btn-danger:hover { background: #d32f2f; }
        .btn-secondary { background: #ff9800; color: white; }
        .btn-secondary:hover { background: #f57c00; }
        .btn-outline { background: white; border: 2px solid #4CAF50; color: #4CAF50; }
        .btn-outline:hover { background: #f5f5f5; }
        .btn-info { background: #2196F3; color: white; }
        .btn-info:hover { background: #1976D2; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-success:hover { background: #45a049; }
        .btn-warning { background: #FF9800; color: white; }
        .btn-warning:hover { background: #F57C00; }
        .btn-whatsapp { background: #25D366 !important; color: white !important; }
        .btn-whatsapp:hover { background: #128C7E !important; }
        .btn-small { padding: 6px 12px; font-size: 12px; }

        .form-label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .form-textarea { min-height: 100px; font-family: inherit; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto; }
        .modal.show { display: flex; align-items: flex-start; justify-content: center; padding: 20px; }

        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }

        .stat-label { font-size: 14px; margin-top: 5px; }
        
        .cal-header { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #ddd; border: 1px solid #ddd; }
        .cal-day { background: white; min-height: 80px; padding: 5px; cursor: pointer; }

        .cal-day.today { background: #e8f5e9; }
        .day-num { font-weight: bold; margin-bottom: 5px; }
        .cal-event { background: #2196F3; color: white; padding: 2px 4px; margin: 2px 0; font-size: 10px; border-radius: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .nav { display: flex; background: white; border-bottom: 1px solid #ddd; overflow-x: auto; }
        .nav-tab { padding: 15px 20px; border: none; background: none; cursor: pointer; font-weight: bold; color: #666; border-bottom: 3px solid transparent; white-space: nowrap; }

        .alert { padding: 12px; border-radius: 5px; margin-bottom: 15px; }

        .alert-danger { background: #f8d7da; color: #721c24; border-left: 4px solid #f44336; }

        .img-prev img { width: 100%; height: 100%; object-fit: cover; }

        @media (max-width: 768px) {

            th, td { padding: 8px 4px; }

        let lastQuotaAlert = 0; // Control de alertas
        
        function saveDB(showConfirmation = false) {
            try {
                localStorage.setItem('agendaDB', JSON.stringify(DB));
                if (showConfirmation) {
                    showAlert('✅ Datos guardados correctamente');
                }
                return true;
            } catch (error) {
                if (error.name === 'QuotaExceededError') {
                    // Solo mostrar alerta una vez cada 60 segundos
                    const now = Date.now();
                    const shouldAlert = (now - lastQuotaAlert) > 60000;
                    
                    console.log('Limpiando datos antiguos...');
                    cleanOldData();
                    try {
                        localStorage.setItem('agendaDB', JSON.stringify(DB));
                        if (shouldAlert) {

                        return true;

                        cleanOldDataAggressive();

                            if (shouldAlert) {

                            if (shouldAlert) {
                                lastQuotaAlert = now;
                                showAlert('⚠️ Almacenamiento lleno. Usa Backup para guardar y liberar espacio');
                            }
                            return false;
                        }
                    }
                }
                console.error('Error al guardar:', error);
                return false;
            }

        function cleanOldData() {
            // Eliminar tareas completadas de hace más de 30 días
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            
            if (DB.tasks) {
                DB.tasks = DB.tasks.filter(t => {
                    if (!t.done) return true;
                    const taskDate = new Date(t.date);
                    return taskDate > thirtyDaysAgo;
                });
            }
        }
        
        function cleanOldDataAggressive() {
            // Limpiar tareas completadas de hace más de 7 días
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            
            if (DB.tasks) {
                DB.tasks = DB.tasks.filter(t => {
                    if (!t.done) return true;
                    const taskDate = new Date(t.date);
                    return taskDate > sevenDaysAgo;
                });

            const arr = Array.isArray(list) ? list : [];
            const maxId = arr.reduce((m, x) => Math.max(m, Number(x && x.id) || 0), 0);
            return maxId + 1;

        // Garantiza que existan cuentas mínimas para ingresar (especialmente tras migraciones antiguas sin users)
        function ensureDefaultUsers() {
            if (!Array.isArray(DB.users)) DB.users = [];
            let changed = false;

            const demo = [
                { id: 1, email: 'admin@test.com', password: 'admin123', name: 'Administrador', role: 'admin' },
                { id: 2, email: 'padre@test.com', password: 'padre123', name: 'María López', role: 'parent', studentIds: [1] },
                { id: 3, email: 'profesor@test.com', password: 'profesor123', name: 'Ana Martínez', role: 'teacher', courseIds: [1] }
            ];

            // Si viene vacío (caso típico de DB antigua), reconstruye demo completo
            if (DB.users.length === 0) {
                DB.users = demo.map(u => ({ ...u }));
                changed = true;
                return changed;
            }

            const byEmail = new Map(DB.users.map(u => [normalizeEmail(u && u.email), u]));

            // Asegura al menos un admin
            if (!DB.users.some(u => u && u.role === 'admin')) {
                const id = nextId(DB.users);
                DB.users.push({ ...demo[0], id });
                changed = true;
            }

            // Asegura estructura mínima por usuario
            DB.users.forEach(u => {
                if (!u) return;
                if (u.role === 'parent' && !Array.isArray(u.studentIds)) { u.studentIds = []; changed = true; }
                if (u.role === 'teacher' && !Array.isArray(u.courseIds)) { u.courseIds = []; changed = true; }
                if (u.password === undefined) { u.password = ''; changed = true; }
            });

            // Añade cuentas demo faltantes (sin sobrescribir contraseñas si ya existen)
            for (const du of demo) {
                const key = normalizeEmail(du.email);
                if (!byEmail.has(key)) {
                    const id = nextId(DB.users);
                    const nu = { ...du, id };

                    // Evita referencias inválidas si no existen esos registros
                    if (nu.role === 'parent') {
                        nu.studentIds = (Array.isArray(DB.students) && DB.students.some(s => s && s.id === 1)) ? [1] : [];
                    }
                    if (nu.role === 'teacher') {
                        nu.courseIds = (Array.isArray(DB.courses) && DB.courses.some(c => c && c.id === 1)) ? [1] : [];
                    }

                    DB.users.push(nu);
                    byEmail.set(key, nu);
                    changed = true;
                } else {
                    const u = byEmail.get(key);
                    if (u && (u.role === undefined || u.role === null || u.role === '')) { u.role = du.role; changed = true; }
                }
            }

            return changed;
        }

                .replaceAll('"', '&quot;')

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve({
                    name: file.name,
                    type: file.type || 'application/octet-stream',
                    size: file.size || 0,
                    dataUrl: reader.result
                });
                reader.onerror = () => reject(reader.error || new Error('Error leyendo archivo'));
                reader.readAsDataURL(file);
            });
        }

        // Ocurrencia de eventos (repetición / intervalo)
        function occursOnDate(ev, dateStr) {
            if (!ev || !ev.date) return false;

            const d = new Date(dateStr + 'T00:00:00');
            const start = new Date(ev.date + 'T00:00:00');
            if (isNaN(d.getTime()) || isNaN(start.getTime())) return false;

            // Intervalo (rango de fechas)
            const hasRange = ev.endDate && ev.endDate !== '' && (ev.repeat === 'none' || !ev.repeat);
            if (hasRange) {
                const end = new Date(ev.endDate + 'T00:00:00');
                return d >= start && d <= end;
            }

            const repeat = (ev.repeat || 'none');
            const interval = Math.max(1, parseInt(ev.interval || 1));

            if (repeat === 'none') return dateStr === ev.date;

            if (d < start) return false;

            const diffDays = Math.floor((d - start) / 86400000);

            if (repeat === 'daily') {
                return diffDays % interval === 0;
            }

            if (repeat === 'weekly') {
                const weeks = Math.floor(diffDays / 7);
                return d.getDay() === start.getDay() && (weeks % interval === 0);
            }

            if (repeat === 'monthly') {
                const months = (d.getFullYear() - start.getFullYear()) * 12 + (d.getMonth() - start.getMonth());
                return d.getDate() === start.getDate() && (months % interval === 0);
            }

            if (repeat === 'custom') {
                const days = Array.isArray(ev.customDays) ? ev.customDays : [];
                const weeks = Math.floor(diffDays / 7);
                return days.includes(d.getDay()) && (weeks % interval === 0);
            }

            return false;
        }

        function getStudentForParent() {

        function isCourseMatchForUser(courseId) {
            if (!courseId) return true; // "Todos"
            if (!currentUser) return false;

            if (currentUser.role === 'parent') {
                const stu = getStudentForParent();
                return stu ? courseId === stu.courseId : false;
            }

            if (currentUser.role === 'teacher') {
                return DB.courses.some(c => c.id === courseId && c.teacherId === currentUser.id);
            }

            return true; // admin
        }

        function getEventsForDate(dateStr) {
            // Base pools by role
            let tasks = DB.tasks || [];
            let comms = DB.communications || [];
            let msgs = DB.parentMessages || [];

            if (currentUser?.role === 'parent') {
                const stu = getStudentForParent();
                tasks = tasks.filter(t => (t.courseId == null) || (t.courseId === stu?.courseId));
                comms = comms.filter(c => (c.courseId == null) || (c.courseId === stu?.courseId));
                msgs = msgs.filter(m => m.parentId === currentUser.id && currentUser.studentIds?.includes(m.studentId));
            } else if (currentUser?.role === 'teacher') {
                tasks = tasks.filter(t => !t.courseId || isCourseMatchForUser(t.courseId));
                comms = comms.filter(c => !c.courseId || isCourseMatchForUser(c.courseId));
                // mensajes de padres: por ahora solo admin/parent (no se muestran al profesor)
                msgs = [];
            } else {
                // admin: ve todo
            }

            const out = [];

            tasks.forEach(t => {
                if (!isCourseMatchForUser(t.courseId)) return;
                if (occursOnDate(t, dateStr)) out.push({
                    source: 'task',
                    id: t.id,
                    title: t.title || 'Tarea',
                    text: t.desc || '',
                    date: t.date,
                    endDate: t.endDate || '',
                    startTime: t.startTime || '',
                    endTime: t.endTime || '',
                    repeat: t.repeat || 'none',
                    interval: t.interval || 1,
                    linkUrl: t.linkUrl || '',
                    files: t.files || [],
                    courseId: t.courseId || null,
                    done: !!t.done
                });
            });

            comms.forEach(c => {
                if (!isCourseMatchForUser(c.courseId)) return;
                if (occursOnDate(c, dateStr)) out.push({
                    source: 'comm',
                    id: c.id,
                    title: c.title || 'Comunicado',
                    text: c.text || '',
                    date: c.date,
                    endDate: c.endDate || '',
                    startTime: c.startTime || '',
                    endTime: c.endTime || '',
                    repeat: c.repeat || 'none',
                    interval: c.interval || 1,
                    linkUrl: c.linkUrl || '',
                    files: c.files || [],
                    courseId: c.courseId || null
                });
            });

            msgs.forEach(m => {
                if (occursOnDate(m, dateStr)) out.push({
                    source: 'msg',
                    id: m.id,
                    title: m.title || 'Mensaje',
                    text: m.text || '',
                    date: m.date,
                    endDate: m.endDate || '',
                    startTime: m.startTime || '',
                    endTime: m.endTime || '',
                    repeat: m.repeat || 'none',
                    interval: m.interval || 1,
                    linkUrl: m.linkUrl || '',
                    files: m.files || [],
                    studentId: m.studentId
                });
            });
            
            // Agregar eventos del cronograma
            (DB.scheduleEvents || []).forEach(se => {
                // Verificar si el evento ocurre en esta fecha
                const evDate = new Date(dateStr);
                const evStart = new Date(se.startDate);
                const evEnd = new Date(se.endDate || se.startDate);
                
                if (evDate >= evStart && evDate <= evEnd) {
                    const typeLabels = {
                        vacation: '🏖️ Vacaciones',
                        holiday: '🎉 Festivo',
                        institutional: '🏫 Día Institucional',
                        meeting: '👥 Reunión de Padres',
                        celebration: '🎊 Celebración',
                        field_trip: '🚌 Salida Pedagógica',
                        workshop: '🎨 Taller',
                        evaluation: '📝 Evaluación',
                        training: '📚 Capacitación',
                        maintenance: '🔧 Mantenimiento',
                        other: '📌 Otro'
                    };
                    
                    out.push({
                        source: 'schedule',
                        id: se.id,
                        title: se.title,
                        text: typeLabels[se.type] || se.type,
                        date: se.startDate,
                        endDate: se.endDate || se.startDate,
                        color: se.color || '#FF9800',
                        scheduleType: se.type
                    });
                }
            });

            // Orden por hora (si existe)
            out.sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
            return out;
        }

        // Si el usuario existe pero la contraseña guardada no coincide (por migraciones),
        // y el usuario escribe la contraseña demo correcta, se repara sin romper la DB.
        function repairDemoAccountIfMatches(emailNorm, password) {
            const demo = DEMO_ACCOUNTS.find(d => normalizeEmail(d.email) === emailNorm && String(d.password) === String(password));
            if (!demo) return null;

            if (!Array.isArray(DB.users)) DB.users = [];
            let u = DB.users.find(x => normalizeEmail(x && x.email) === emailNorm);

            if (!u) {
                const id = nextId(DB.users);
                u = { ...demo, id };

                // Evita referencias inválidas si no existen esos registros
                if (u.role === 'parent') {
                    u.studentIds = (Array.isArray(DB.students) && DB.students.some(s => s && s.id === 1)) ? [1] : [];
                }
                if (u.role === 'teacher') {
                    u.courseIds = (Array.isArray(DB.courses) && DB.courses.some(c => c && c.id === 1)) ? [1] : [];
                }

                DB.users.push(u);
            } else {
                // No toca otros campos salvo los mínimos necesarios
                u.role = demo.role;
                if (!u.name) u.name = demo.name;
                // Repara contraseña solo porque el usuario la digitó (demo)
                u.password = String(password);
                // Repara rol y enlaces mínimos (sin borrar datos existentes)
                if (u.role === 'parent') {
                    if (!Array.isArray(u.studentIds)) u.studentIds = [];
                    if (u.studentIds.length === 0 && Array.isArray(DB.students) && DB.students.some(s => s && s.id === 1)) u.studentIds = [1];
                }
                if (u.role === 'teacher') {
                    if (!Array.isArray(u.courseIds)) u.courseIds = [];
                    if (u.courseIds.length === 0 && Array.isArray(DB.courses) && DB.courses.some(c => c && c.id === 1)) u.courseIds = [1];
                }
                if (u.role === 'parent' && !Array.isArray(u.studentIds)) u.studentIds = [];
                if (u.role === 'teacher' && !Array.isArray(u.courseIds)) u.courseIds = [];
            }

            saveDB(false);
            return u;
        }

        function showView(view) {
            currentView = view;
            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.classList.toggle('active', (btn.dataset.view || '') === view);
            });

            const content = document.getElementById('content');
            content.innerHTML = '';

            if (view === 'dashboard') renderDashboard();
            else if (view === 'calendar') renderCalendar();
            else if (view === 'cronograma') renderCronograma();
            else if (view === 'institution') renderInstitution();
            else if (view === 'courses') renderCourses();
            else if (view === 'students') renderStudents();
            else if (view === 'tasks') renderTasks();
            else if (view === 'communications') renderCommunications();
            else if (view === 'users') renderUsers();
            else if (view === 'teachers') renderTeachers();
            else if (view === 'backup') renderBackup();
            else if (view === 'my-courses') renderMyCourses();
            else if (view === 'observations') renderObservations();
            else if (view === 'student') renderStudent();
        }

            const upcomingHtml = upcoming.length ? upcoming.slice(0, 8).map(ev => {

            c.innerHTML = `
                <div class="card" style="background: linear-gradient(135deg, #4CAF50, #45a049); color: white;">

                <div class="card" style="margin-top:16px;">
                    <div class="card-header">

        function saveScheduleEvent() {
            if (!DB.scheduleEvents) DB.scheduleEvents = [];
            
            const type = document.getElementById('eventType')?.value;
            const title = document.getElementById('eventTitle')?.value.trim();
            const startDate = document.getElementById('eventStart')?.value;
            const endDate = document.getElementById('eventEnd')?.value;
            const color = document.getElementById('eventColor')?.value;
            
            if (!title || !startDate) {
                showAlert('⚠️ Por favor completa el título y fecha de inicio');
                return;
            }
            
            DB.scheduleEvents.push({
                id: Date.now(),
                type: type,
                title: title,
                startDate: startDate,
                endDate: endDate || startDate,
                color: color || '#FF9800'
            });
            
            saveDB();
            closeModal();
            showAlert('✅ Evento agregado al cronograma');
            renderCronograma();
        }

        function updateScheduleEvent(id) {

            const type = document.getElementById('eventType')?.value;
            const title = document.getElementById('eventTitle')?.value.trim();
            const startDate = document.getElementById('eventStart')?.value;
            const endDate = document.getElementById('eventEnd')?.value;

            if (!title || !startDate) {

            event.type = type;
            event.title = title;
            event.startDate = startDate;
            event.endDate = endDate || startDate;

            saveDB();

        // ========== CALENDAR ==========
        function renderCalendar() {
            const c = document.getElementById('content');
            const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            const today = new Date();

            let grid = '<div class="cal-grid">';
            ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].forEach(d => grid += `<div style="background:#f5f5f5;padding:10px;text-align:center;font-weight:bold;">${d}</div>`);
            for (let i = 0; i < firstDay; i++) grid += '<div class="cal-day" style="opacity:0.3;"></div>';

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const isToday = today.getDate() === day && today.getMonth() === calMonth && today.getFullYear() === calYear;
                const events = getEventsForDate(dateStr);

                const preview = events.slice(0, 3).map(e => {
                    const bgColor = e.source === 'schedule' ? (e.color || '#FF9800') : '#2196F3';
                    const icon = e.source === 'schedule' ? ({'vacation': '🏖️', 'holiday': '🎉', 'institutional': '🏫', 'meeting': '👥', 'celebration': '🎊', 'field_trip': '🚌', 'workshop': '🎨', 'evaluation': '📝', 'training': '📚', 'maintenance': '🔧', 'other': '📌'}[e.scheduleType] || '📅') : '';
                    return `<div class="cal-event" style="background: ${bgColor};">${icon} ${escapeHTML(e.title)}</div>`;
                }).join('');
                const more = events.length > 3 ? `<div class="cal-event" style="opacity:0.75;">+${events.length - 3} más</div>` : '';

                grid += `<div class="cal-day ${isToday ? 'today' : ''}" onclick="viewDay('${dateStr}')">
                    <div class="day-num">${day}</div>
                    ${preview}${more}
                </div>`;
            }
            grid += '</div>';

            c.innerHTML = `
                <div class="card">
                    <div class="cal-header">
                        <h3>📅 ${monthNames[calMonth]} ${calYear}</h3>
                        <div>
                            <button class="btn btn-outline" onclick="calMonth--; if(calMonth<0){calMonth=11;calYear--;} showView('calendar');">◀ Ant</button>
                            <button class="btn btn-outline" onclick="calMonth++; if(calMonth>11){calMonth=0;calYear++;} showView('calendar');">Sig ▶</button>
                            ${currentUser.role !== 'parent' ? '<button class="btn btn-primary" onclick="addEvent()">➕ Nuevo Evento</button>' : ''}
                        </div>
                    </div>
                    ${grid}
                </div>
            `;
        }

        function viewDay(dateStr) {
            const events = getEventsForDate(dateStr);
            const body = events.length ? events.map(ev => {
                const time = prettyTimeRange(ev.startTime, ev.endTime);
                const timeHtml = time ? `<div style="color:#666;margin-top:4px;">⏰ ${time}</div>` : '';
                const txt = ev.text ? `<div style="margin-top:8px;white-space:pre-wrap;">${escapeHTML(ev.text)}</div>` : '';
                const link = ev.linkUrl ? `<div style="margin-top:8px;"><a href="${escapeHTML(ev.linkUrl)}" target="_blank" rel="noopener">🔗 Abrir enlace</a></div>` : '';
                const done = (ev.source === 'task') ? `<div style="margin-top:8px;color:${ev.done ? '#2e7d32' : '#666'};"><b>${ev.done ? '✅ Completada' : '⬜ Pendiente'}</b></div>` : '';
                const course = ev.courseId ? DB.courses.find(c => c.id === ev.courseId) : null;
                const courseHtml = course ? `<div style="margin-top:6px;color:#555;">📚 ${course.icon} ${escapeHTML(course.name)}</div>` : '';

                return `
                    <div style="padding:14px;background:#f7f7f7;margin:10px 0;border-radius:12px;">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                            <div style="font-size:16px;"><b>${escapeHTML(ev.title)}</b></div>
                            ${eventBadge(ev)}
                        </div>
                        ${courseHtml}
                        ${timeHtml}
                        ${done}
                        ${txt}
                        ${link}
                        ${renderFiles(ev.files)}
                    </div>
                `;
            }).join('') : '<p>Sin eventos</p>';

            openModal('📅 Agenda del día', `
                <div style="margin-bottom:10px;color:#666;"><b>${prettyDate(dateStr)}</b></div>
                ${body}
            `);
        }

        function toggleRange(prefix) {
            const isRange = document.getElementById(prefix + 'Range').checked;
            const wrap = document.getElementById(prefix + 'EndDateWrap');
            const repeat = document.getElementById(prefix + 'Repeat');
            const custom = document.getElementById(prefix + 'CustomDaysWrap');

            if (isRange) {
                wrap.style.display = 'block';
                // desactivar repetición
                repeat.value = 'none';
                repeat.disabled = true;
                if (custom) custom.style.display = 'none';
            } else {
                wrap.style.display = 'none';
                repeat.disabled = false;
            }
        }

        function toggleCustomDays(prefix) {
            const rep = document.getElementById(prefix + 'Repeat').value;
            const wrap = document.getElementById(prefix + 'CustomDaysWrap');
            if (!wrap) return;
            wrap.style.display = (rep === 'custom') ? 'block' : 'none';
        }

        async function saveEvent() {
            const type = document.getElementById('evType').value;
            const title = document.getElementById('evTitle').value.trim();
            const desc = document.getElementById('evDesc').value.trim();
            const date = document.getElementById('evDate').value;
            const isRange = document.getElementById('evRange').checked;
            const endDate = isRange ? (document.getElementById('evEndDate').value || '') : '';
            const startTime = document.getElementById('evStartTime').value || '';
            const endTime = document.getElementById('evEndTime').value || '';
            const repeat = isRange ? 'none' : (document.getElementById('evRepeat').value || 'none');
            const interval = Math.max(1, parseInt(document.getElementById('evInterval').value || 1));
            const linkUrl = document.getElementById('evLink').value.trim();
            const courseId = parseInt(document.getElementById('evCourse').value) || null;
            const customDays = repeat === 'custom' ? Array.from(document.querySelectorAll('.evDay:checked')).map(x => parseInt(x.value)) : [];

            if (!title) return alert('Escribe un título');
            if (!date) return alert('Selecciona una fecha');

            const files = getStashFiles('ev');

            if (type === 'task') {
                DB.tasks.push({
                    id: Date.now(),
                    title,
                    desc,
                    courseId,
                    date,
                    endDate,
                    startTime,
                    endTime,
                    repeat,
                    interval,
                    customDays,
                    linkUrl,
                    files,
                    done: false,
                    by: currentUser.id
                });
            } else {
            if (editId) {
                const co = DB.communications.find(x => x.id === editId);
                if (!co) return alert('No se encontró el comunicado a editar');
                co.title = title;
                co.text = text;
                co.date = date;
                co.startTime = startTime;
                co.endTime = endTime;
                co.linkUrl = linkUrl;
                co.courseId = courseId;
                co.files = files;
                if (co.by === undefined || co.by === null) co.by = currentUser.id;
            } else {
                DB.communications.push({
                    id: Date.now(),
                    title,
                    text,
                    date,
                    endDate: '',
                    startTime,
                    endTime,
                    repeat: 'none',
                    interval: 1,
                    customDays: [],
                    linkUrl,
                    files,
                    courseId,
                    by: currentUser.id
                });
            }
            }

            saveDB();
            closeModal();
            showAlert('✅ Evento creado');
            showView('calendar');
        }

        function saveStudent(editId) {
            const name = document.getElementById('stuName').value;
            const birth = document.getElementById('stuBirth').value;
            const courseId = parseInt(document.getElementById('stuCourse').value);
            const allergies = document.getElementById('stuAllergies').value;
            const blood = document.getElementById('stuBlood').value;
            const medications = document.getElementById('stuMeds').value;
            const emergencyContact = document.getElementById('stuEmergency').value;
            const schedule = document.getElementById('stuSchedule')?.value || 'Jornada Única -Preescolar: 20-25 horas semanales.-';
            const calendarType = document.getElementById('stuCalendar')?.value || 'A';
            
            const parent1Name = document.getElementById('parent1Name').value;
            const parent1Phone = document.getElementById('parent1Phone').value;
            const parent1Email = document.getElementById('parent1Email').value;
            
            const parent2Name = document.getElementById('parent2Name').value;
            const parent2Phone = document.getElementById('parent2Phone').value;
            const parent2Email = document.getElementById('parent2Email').value;

            if (!name || !birth || !parent1Name || !parent1Email) {
                alert('Por favor completa todos los campos obligatorios (*)');
                return;
            }

            let parentId = null;
            let generatedPassword = '';
            let parentUser = null;

            if (editId) {
                // Modo edición
                const s = DB.students.find(st => st.id === editId);
                s.name = name;
                s.birth = birth;
                s.courseId = courseId;
                s.allergies = allergies;
                s.blood = blood;
                s.medications = medications;
                s.emergencyContact = emergencyContact;
                s.schedule = schedule;
                s.calendarType = calendarType;
                s.parent1Name = parent1Name;
                s.parent1Phone = parent1Phone;
                s.parent1Email = parent1Email;
                s.parent2Name = parent2Name;
                s.parent2Phone = parent2Phone;
                s.parent2Email = parent2Email;
            } else {
                // Modo creación - crear usuario automáticamente
                const existingUser = DB.users.find(u => u.email === parent1Email);
                
                if (existingUser) {
                    parentUser = existingUser;
                    parentId = existingUser.id;
                } else {
                    // Crear nuevo usuario padre
                    generatedPassword = generatePassword();
                    const newUserId = Date.now() + Math.floor(Math.random() * 1000);
                    parentUser = {
                        id: newUserId,
                        email: parent1Email,
                        password: generatedPassword,
                        name: parent1Name,
                        role: 'parent',
                        studentIds: []
                    };
                    DB.users.push(parentUser);
                    parentId = newUserId;
                }

                // Crear estudiante
                const newStudentId = Date.now();
                DB.students.push({
                    id: newStudentId,
                    name,
                    birth,
                    courseId,
                    parentId,
                    parent1Name,
                    parent1Phone,
                    parent1Email,
                    parent2Name,
                    parent2Phone,
                    parent2Email,
                    allergies,
                    blood,
                    medications,
                    emergencyContact,
                    schedule,
                    calendarType
                });

                // Vincular estudiante al padre
                if (!parentUser.studentIds) parentUser.studentIds = [];
                parentUser.studentIds.push(newStudentId);
            }
            
            saveDB();
            closeModal();
            
            if (generatedPassword) {
                // Mostrar credenciales generadas
                openModal('✅ Estudiante Creado', `
                    <div class="alert alert-success">
                        <strong>✅ Estudiante "${name}" registrado exitosamente</strong>
                    </div>
                    
                    <div class="credentials-box">
                        <h4>🔑 Credenciales de Acceso para ${parent1Name}</h4>
                        <p><strong>Email:</strong> ${parent1Email}</p>
                        <p><strong>Contraseña:</strong> ${generatedPassword}</p>
                        <div class="alert alert-info" style="margin-top: 10px;">
                            <strong>⚠️ Importante:</strong> Guarda estas credenciales y entrégalas al padre de familia. No podrás verlas nuevamente.
                        </div>
                        <button class="btn btn-primary" onclick="copyCredentials('${parent1Email}', '${generatedPassword}')">📋 Copiar Credenciales</button>
                        <button class="btn btn-secondary" onclick="closeModal(); renderStudents();">Cerrar</button>
                    </div>
                `);
            } else {
                showAlert('✅ Estudiante ' + (editId ? 'actualizado' : 'creado'));
                renderStudents();
            }
        }

            navigator.clipboard.writeText(text).then(() => {

        }

        async function saveParentMessage(studentId) {
            const s = DB.students.find(x => x.id === studentId);
            if (!s) return;

            const title = document.getElementById('pmTitle').value.trim() || 'Mensaje';
            const text = document.getElementById('pmText').value.trim();
            const date = document.getElementById('pmDate').value;
            const startTime = document.getElementById('pmStart').value || '';
            const endTime = document.getElementById('pmEnd').value || '';
            const linkUrl = document.getElementById('pmLink').value.trim() || '';

            if (!date) return alert('Selecciona una fecha');
            if (!text) return alert('Escribe el mensaje');

            const files = getStashFiles('pm');

            DB.parentMessages.push({
                id: Date.now(),
                parentId: s.parentId,
                studentId: s.id,
                title,
                text,
                date,
                endDate: '',
                startTime,
                endTime,
                repeat: 'none',
                interval: 1,
                customDays: [],
                linkUrl,
                files,
                courseId: s.courseId || null
            });

            saveDB();
            closeModal();
            showAlert('✅ Mensaje agregado a la agenda del padre');
        }

        // ========== TASKS ==========
        function canEditTask(t) {
            if (!currentUser) return false;
            if (currentUser.role === 'admin') return true;
            if (currentUser.role === 'teacher') {
                if (t.by && t.by === currentUser.id) return true;
                if (t.courseId && isCourseMatchForUser(t.courseId)) return true;
                if (!t.courseId) return true; // tareas globales
            }
            return false;
        }
        
        function renderTasks() {
            let tasks = DB.tasks || [];
        
            // Filtros por rol
            if (currentUser.role === 'parent') {
                const stu = DB.students.find(s => currentUser.studentIds?.includes(s.id));
                const courseId = stu ? stu.courseId : null;
                tasks = tasks.filter(t => (t.courseId === null || t.courseId === undefined) || t.courseId === courseId);
            } else if (currentUser.role === 'teacher') {
                tasks = tasks.filter(t => (t.courseId === null || t.courseId === undefined) || isCourseMatchForUser(t.courseId) || (t.by === currentUser.id));
            }
        
            // Orden por fecha/hora
            tasks = tasks.slice().sort((a, b) => {
                const ad = (a.date || '9999-12-31') + ' ' + (a.startTime || '23:59');
                const bd = (b.date || '9999-12-31') + ' ' + (b.startTime || '23:59');
                return ad.localeCompare(bd);
            });
        
            const pending = tasks.filter(t => !t.done);
            const done = tasks.filter(t => t.done);
        
            const courseName = (id) => {
                const c = DB.courses.find(x => x.id === id);
                return c ? `${c.icon} ${escapeHTML(c.name)}` : '—';
            };
        
            function taskCard(t) {
                const time = prettyTimeRange(t.startTime || '', t.endTime || '');
                const dateLbl = t.date ? prettyDate(t.date) : 'Sin fecha';
                const courseLbl = t.courseId ? courseName(t.courseId) : 'Todos';
                const link = t.linkUrl ? `<a href="${escapeHTML(t.linkUrl)}" target="_blank" rel="noopener">🔗 Link</a>` : '';
                const repeatLbl = (t.endDate && t.endDate !== '') ? `🗓️ ${prettyDate(t.date)} → ${prettyDate(t.endDate)}` :
                    (t.repeat && t.repeat !== 'none') ? `🔁 ${escapeHTML(t.repeat)}` : '';
        
                const actions = currentUser.role === 'parent'
                    ? (!t.done ? `<button class="btn btn-success btn-small" onclick="completeTask(${t.id})" title="Marcar como hecha">✅</button>` : '')
                    : `
                        ${canEditTask(t) ? `<button class="btn btn-secondary btn-small" onclick="editTask(${t.id})" title="Editar">✏️</button>` : ''}
                        ${canEditTask(t) ? `<button class="btn btn-info btn-small" onclick="sendEmailToParents(${t.id}, null)" title="Enviar por email">📧</button>` : ''}
                        ${canEditTask(t) && t.courseId ? `<button class="btn btn-whatsapp btn-small" onclick="shareTaskToWhatsAppGroup(${t.id})" title="Compartir en WhatsApp">📱</button>` : ''}
                        ${canEditTask(t) ? `<button class="btn btn-danger btn-small" onclick="deleteTask(${t.id})" title="Eliminar">🗑️</button>` : ''}
                        <button class="btn btn-outline btn-small" onclick="toggleTaskDone(${t.id})" title="${t.done ? 'Reabrir tarea' : 'Marcar como hecha'}">${t.done ? '↩️' : '✅'}</button>
                    `;
                
                const hasDesc = t.desc && t.desc.trim();
                const descId = 'desc_' + t.id;
        
                return `
                    <div class="card" style="margin-bottom:8px; padding:10px;">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
                            <div style="flex:1; min-width:0;">
                                <div style="font-weight:700; font-size:14px; margin-bottom:4px;">${escapeHTML(t.title || 'Tarea')}</div>
                                <div style="display:flex; gap:6px; flex-wrap:wrap; font-size:11px; margin-bottom:4px;">
                                    <span class="badge" style="font-size:10px; padding:2px 6px;">${dateLbl}${time ? ` · ${time}` : ''}</span>
                                    <span class="badge badge-task" style="font-size:10px; padding:2px 6px;">${courseLbl}</span>
                                    ${repeatLbl ? `<span class="badge" style="font-size:10px; padding:2px 6px;">${repeatLbl}</span>` : ''}
                                    ${link ? `<span class="badge" style="font-size:10px; padding:2px 6px;">${link}</span>` : ''}
                                </div>
                                ${hasDesc ? `
                                    <button onclick="document.getElementById('${descId}').style.display=document.getElementById('${descId}').style.display==='none'?'block':'none'" 
                                        style="background:none; border:none; color:#2196F3; cursor:pointer; padding:0; font-size:11px; text-decoration:underline;">
                                        ▼ Ver descripción
                                    </button>
                                    <div id="${descId}" style="display:none; color:#666; margin-top:4px; font-size:12px; padding:8px; background:#f5f5f5; border-radius:4px;">
                                        ${escapeHTML(t.desc)}
                                    </div>
                                ` : ''}
                            </div>
                            <div style="display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end;">
                                ${actions}
                            </div>
                        </div>
                        ${renderFiles(t.files || [])}
                    </div>
                `;
            }
        
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
                        <h2 style="margin:0;">📝 Tareas</h2>
                        ${currentUser.role === 'parent' ? '' : `<button class="btn btn-primary" onclick="addTask()">➕ Nueva Tarea</button>`}
                    </div>
        
                    <div style="margin-top:14px;">
                        <h3 style="margin:10px 0;">Pendientes (${pending.length})</h3>
                        ${pending.length ? pending.map(taskCard).join('') : `<div style="color:#666;">No hay tareas pendientes.</div>`}
                    </div>
        
                    <div style="margin-top:20px;">
                        <h3 style="margin:10px 0;">Realizadas (${done.length})</h3>
                        ${done.length ? done.map(taskCard).join('') : `<div style="color:#666;">Aún no hay tareas realizadas.</div>`}
                    </div>
                </div>
            `;
        }
        
        function addTask() {
            openTaskModal(null);
        }
        
        function editTask(id) {
            openTaskModal(id);
        }
        
        function openTaskModal(editId) {
            const t = editId ? DB.tasks.find(x => x.id === editId) : null;
            const titleVal = t ? escapeHTML(t.title || '') : '';
            const descVal = t ? escapeHTML(t.desc || '') : '';
            const dateVal = (t && t.date) ? t.date : new Date().toISOString().split('T')[0];
            const endDateVal = (t && t.endDate) ? t.endDate : '';
            const startTimeVal = (t && t.startTime) ? t.startTime : '';
            const endTimeVal = (t && t.endTime) ? t.endTime : '';
            const repeatVal = (t && t.repeat) ? t.repeat : 'none';
            const intervalVal = (t && t.interval) ? t.interval : 1;
            const linkVal = (t && t.linkUrl) ? escapeHTML(t.linkUrl) : '';
            const courseVal = (t && t.courseId) ? t.courseId : '';
        
            const courseOptions = DB.courses
                .filter(c => currentUser.role !== 'teacher' || isCourseMatchForUser(c.id))
                .map(c => `<option value="${c.id}">${c.icon} ${escapeHTML(c.name)}</option>`).join('');
        
            openModal(editId ? '✏️ Editar Tarea' : '➕ Nueva Tarea', `
                <div class="form-group">
                    <label class="form-label">Título</label>
                    <input class="form-input" id="taskTitle" value="${titleVal}" placeholder="Ej: Enviar cuaderno / Actividad">
                </div>
        
                <div class="form-group">
                    <label class="form-label">Descripción</label>
                    <textarea class="form-textarea" id="taskDesc" placeholder="Detalles...">${descVal}</textarea>
                </div>
        
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-input" id="taskDate" value="${dateVal}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Hora inicio</label>
                        <input type="time" class="form-input" id="taskStartTime" value="${startTimeVal}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Hora final</label>
                        <input type="time" class="form-input" id="taskEndTime" value="${endTimeVal}">
                    </div>
                </div>
        
                <div class="form-row">
                    <div class="form-group" style="min-width:200px;">
                        <label class="form-label">Repetición</label>
                        <select class="form-select" id="taskRepeat" onchange="toggleCustomDays('task')">
                            <option value="none">No repetitivo</option>
                            <option value="daily">Diario</option>
                            <option value="weekly">Semanal</option>
                            <option value="monthly">Mensual</option>
                            <option value="yearly">Anual</option>
                            <option value="custom">Días específicos</option>
                        </select>
                    </div>
        
                    <div class="form-group" style="min-width:180px;">
                        <label class="form-label">Intervalo</label>
                        <input type="number" min="1" class="form-input" id="taskInterval" value="${intervalVal}">
                        <div class="form-hint">Ej: semanal cada 2 semanas, diario cada 3 días, etc.</div>
                    </div>
        
                    <div class="form-group" style="min-width:220px;">
                        <label class="form-label">Intervalo de fechas</label>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <input type="checkbox" id="taskRange" onchange="toggleRange('task')">
                            <label for="taskRange" style="cursor:pointer;">Usar rango</label>
                        </div>
                    </div>
                </div>
        
                <div class="form-group" id="taskEndDateWrap" style="display:none;">
                    <label class="form-label">Fecha final (rango)</label>
                    <input type="date" class="form-input" id="taskEndDate" value="${endDateVal}">
                    <div class="form-hint">Si activas rango, la repetición se desactiva.</div>
                </div>
        
                <div class="form-group" id="taskCustomDaysWrap" style="display:none;">
                    <label class="form-label">Días específicos</label>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        ${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map((d,i)=>`
                            <label class="badge" style="cursor:pointer;">
                                <input type="checkbox" class="taskDay" value="${i}" style="margin-right:6px;"> ${d}
                            </label>
                        `).join('')}
                    </div>
                </div>
        
                <div class="form-group">
                    <label class="form-label">Link (opcional)</label>
                    <input class="form-input" id="taskLink" value="${linkVal}" placeholder="https://...">
                </div>
        
                <div class="form-group">
                    <label class="form-label">Adjuntos (imágenes o PDF) — múltiples</label>
                    <input type="file" id="taskFiles" class="form-input" multiple accept="image/*,application/pdf" onchange="handleFileSelect('task','taskFiles','taskFilesList')">
                    <div class="form-hint">Los padres podrán ver y descargar los archivos.</div>
                    <div id="taskFilesList"></div>
                </div>
        
                <div class="form-group">
                    <label class="form-label">Curso</label>
                    <select class="form-select" id="taskCourse">
                        <option value="">Todos</option>
                        ${courseOptions}
                    </select>
                </div>
        
                <button class="btn btn-primary" onclick="saveTask(${editId ? editId : 'null'})">Guardar</button>
            `);
        
            // Inicializar selección
            document.getElementById('taskRepeat').value = repeatVal || 'none';
            document.getElementById('taskCourse').value = courseVal || '';
            if (endDateVal) {
                document.getElementById('taskRange').checked = true;
                toggleRange('task');
            } else {
                toggleCustomDays('task');
            }
        
            // Marcar días custom si aplica
            if (t && Array.isArray(t.customDays) && t.customDays.length) {
                const set = new Set(t.customDays.map(x => parseInt(x)));
                document.querySelectorAll('.taskDay').forEach(ch => {
                    ch.checked = set.has(parseInt(ch.value));
                });
            }
        
            initFileStash('task', (t && t.files) ? t.files : [], 'taskFilesList');
        }
        
        function saveTask(editId) {
            const title = document.getElementById('taskTitle').value.trim();
            const desc = document.getElementById('taskDesc').value.trim();
            const date = document.getElementById('taskDate').value;
            const startTime = document.getElementById('taskStartTime').value || '';
            const endTime = document.getElementById('taskEndTime').value || '';
            const repeat = document.getElementById('taskRepeat').value || 'none';
            const interval = Math.max(1, parseInt(document.getElementById('taskInterval').value || 1));
            const useRange = document.getElementById('taskRange').checked;
            const endDate = useRange ? (document.getElementById('taskEndDate').value || '') : '';
            const linkUrl = document.getElementById('taskLink').value.trim();
            const courseId = parseInt(document.getElementById('taskCourse').value) || null;
            const files = getStashFiles('task');
        
            if (!title) return alert('Escribe un título');
            if (!date) return alert('Selecciona una fecha');
        
            const customDays = (!useRange && repeat === 'custom')
                ? Array.from(document.querySelectorAll('.taskDay:checked')).map(x => parseInt(x.value))
                : [];
        
            if (editId) {
                const t = DB.tasks.find(x => x.id === editId);
                if (!t) return alert('No se encontró la tarea');
                if (!canEditTask(t)) return alert('No tienes permiso para editar esta tarea');
        
                t.title = title;
                t.desc = desc;
                t.date = date;
                t.startTime = startTime;
                t.endTime = endTime;
                t.repeat = useRange ? 'none' : repeat;
                t.interval = interval;
                t.customDays = customDays;
                t.endDate = endDate;
                t.linkUrl = linkUrl;
                t.courseId = courseId;
                t.files = files;
                if (t.by === undefined || t.by === null) t.by = currentUser.id;
            } else {
                DB.tasks.push({
                    id: Date.now(),
                    title,
                    desc,
                    date,
                    endDate,
                    startTime,
                    endTime,
                    repeat: useRange ? 'none' : repeat,
                    interval,
                    customDays,
                    linkUrl,
                    files,
                    courseId,
                    by: currentUser.id,
                    done: false
                });
            }
        
            saveDB();
            closeModal();
            showAlert('✅ Tarea guardada');
            renderTasks();
        }
        
        function toggleTaskDone(id) {
            const t = DB.tasks.find(x => x.id === id);
            if (!t) return;
            if (currentUser.role === 'parent') return; // el padre solo marca hecha desde completeTask
            t.done = !t.done;
            saveDB();
            renderTasks();
        }
        
        function deleteTask(id) {
            const t = DB.tasks.find(x => x.id === id);
            if (!t) return;
            if (!canEditTask(t)) return alert('No tienes permiso para eliminar esta tarea');
            if (!confirm('¿Eliminar tarea?')) return;
            DB.tasks = DB.tasks.filter(x => x.id !== id);
            saveDB();
            showAlert('🗑️ Tarea eliminada');
            renderTasks();
        }
        
        function completeTask(id) {
            const t = DB.tasks.find(x => x.id === id);
            if (!t) return;
            t.done = true;
            saveDB();
            showAlert('✅ Tarea completada');
            renderTasks();
        }



                // ========== COMMUNICATIONS ==========
        function renderCommunications() {
            const c = document.getElementById('content');

            const commsAll = DB.communications || [];
            const msgsAll = DB.parentMessages || [];

            // Filtrado por rol
            let comms = commsAll;
            let msgs = msgsAll;

            if (currentUser.role === 'parent') {
                const stu = getStudentForParent();
                comms = commsAll.filter(x => (x.courseId == null) || (x.courseId === stu?.courseId));
                msgs = msgsAll.filter(m => m.parentId === currentUser.id && currentUser.studentIds?.includes(m.studentId));
            } else if (currentUser.role === 'teacher') {
                comms = commsAll.filter(x => !x.courseId || isCourseMatchForUser(x.courseId));
                msgs = []; // por ahora, mensajes directos solo familia/admin
            }

            // Orden por fecha desc
            const sortByDate = (a,b) => (b.date || '').localeCompare(a.date || '');
            comms = comms.slice().sort(sortByDate);
            msgs = msgs.slice().sort(sortByDate);

            const commCards = comms.length ? comms.map(co => {
                const course = co.courseId ? DB.courses.find(x => x.id === co.courseId) : null;
                const courseHtml = course ? `<div style="color:#555;margin-top:6px;">📚 ${course.icon} ${escapeHTML(course.name)}</div>` : `<div style="color:#777;margin-top:6px;">📚 Todos</div>`;
                const time = prettyTimeRange(co.startTime, co.endTime);
                const timeHtml = time ? `<div style="color:#666;margin-top:4px;">⏰ ${time}</div>` : '';
                const link = co.linkUrl ? `<div style="margin-top:8px;"><a href="${escapeHTML(co.linkUrl)}" target="_blank" rel="noopener">🔗 Abrir enlace</a></div>` : '';
                const btns = (currentUser.role !== 'parent') ? `
                    <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
                        ${(currentUser.role !== 'parent' && canEditComm(co)) ? `<button class="btn btn-secondary btn-small" onclick="editComm(${co.id})" title="Editar">✏️</button>` : ``}
                        ${(currentUser.role !== 'parent' && canEditComm(co)) ? `<button class="btn btn-info btn-small" onclick="sendEmailToParents(null, ${co.id})" title="Enviar por email">📧</button>` : ``}
                        ${(currentUser.role !== 'parent' && (currentUser.role==='admin' || currentUser.role==='teacher')) ? `<button class="btn btn-danger btn-small" onclick="deleteComm(${co.id})" title="Eliminar">🗑️</button>` : ``}
                    </div>
                ` : '';

                return `
                    <div class="card" style="margin-bottom:14px;">
                        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
                            <div>
                                <div style="font-size:16px;"><b>📢 ${escapeHTML(co.title || 'Comunicado')}</b></div>
                                <div style="color:#777;margin-top:4px;">📅 ${prettyDate(co.date || '')}</div>
                                ${timeHtml}
                                ${courseHtml}
                            </div>
                            <div>${eventBadge({source:'comm'})}</div>
                        </div>
                        ${co.text ? `<div style="margin-top:10px;white-space:pre-wrap;">${escapeHTML(co.text)}</div>` : ''}
                        ${link}
                        ${renderFiles(co.files)}
                        ${btns}
                    </div>
                `;
            }).join('') : '<p>No hay comunicados.</p>';

            const msgCards = msgs.length ? msgs.map(m => {
                const s = DB.students.find(st => st.id === m.studentId);
                const who = s ? `👧👦 ${escapeHTML(s.name)}` : 'Estudiante';
                const time = prettyTimeRange(m.startTime, m.endTime);
                const timeHtml = time ? `<div style="color:#666;margin-top:4px;">⏰ ${time}</div>` : '';
                const link = m.linkUrl ? `<div style="margin-top:8px;"><a href="${escapeHTML(m.linkUrl)}" target="_blank" rel="noopener">🔗 Abrir enlace</a></div>` : '';
                return `
                    <div class="card" style="margin-bottom:14px;">
                        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
                            <div>
                                <div style="font-size:16px;"><b>✉️ ${escapeHTML(m.title || 'Mensaje')}</b></div>
                                <div style="color:#777;margin-top:4px;">${who} · 📅 ${prettyDate(m.date || '')}</div>
                                ${timeHtml}
                            </div>
                            <div>${eventBadge({source:'msg'})}</div>
                        </div>
                        ${m.text ? `<div style="margin-top:10px;white-space:pre-wrap;">${escapeHTML(m.text)}</div>` : ''}
                        ${link}
                        ${renderFiles(m.files)}
                    </div>
                `;
            }).join('') : '<p>No tienes mensajes directos.</p>';

            c.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h3>📢 Comunicados</h3>
                        ${currentUser.role !== 'parent' ? '<button class="btn btn-primary" onclick="addComm()">➕ Nuevo</button>' : ''}
                    </div>
                    ${commCards}
                </div>

                ${currentUser.role === 'parent' ? `
                    <div class="card" style="margin-top:16px;">
                        <div class="card-header">
                            <h3>✉️ Mensajes para ti</h3>
                        </div>
                        ${msgCards}
                    </div>
                ` : ''}
            `;
        }

        // ========== VALIDACIONES ÚTILES ==========
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function isValidPhone(phone) {
            const cleaned = phone.replace(/\s/g, '');
            return /^[3][0-9]{9}$/.test(cleaned);
        }

        function validateFile(file, maxSize = 5 * 1024 * 1024) {
            const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp', 'application/pdf'];
            
            if (!validTypes.includes(file.type)) {
                showAlert('❌ Tipo de archivo no permitido. Solo imágenes (JPG, PNG, GIF, WebP) y PDF.');
                return false;
            }
            
            if (file.size > maxSize) {
                const sizeMB = (maxSize / (1024 * 1024)).toFixed(0);
                showAlert(`❌ Archivo muy grande. Máximo ${sizeMB}MB.`);
                return false;
            }
            
            return true;
        }

        function sanitizeInput(str) {
            if (!str) return '';
            return String(str).trim();
        }
    

        // ========== ONLINE/OFFLINE INDICATOR + PWA ==========
        function updateNetStatus() {
            const el = document.getElementById('netStatus');
            if (!el) return;
            const online = navigator.onLine;
            el.classList.toggle('online', online);
            el.classList.toggle('offline', !online);
            el.textContent = online ? '🟢 Online' : '🔴 Offline';
        }
        window.addEventListener('online', updateNetStatus);
        window.addEventListener('offline', updateNetStatus);
        setInterval(updateNetStatus, 5000);
        updateNetStatus();
        
        // Service Worker (PWA) — funciona cuando lo sirves por http(s)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        async function saveTeacher(editId) {
            const name = document.getElementById('tName').value.trim();
            const email = document.getElementById('tEmail').value.trim();
            let password = document.getElementById('tPass').value.trim();
        
            const phone = document.getElementById('tPhone').value.trim();
            const address = document.getElementById('tAddress').value.trim();
            const instagram = document.getElementById('tInstagram').value.trim();
            const facebook = document.getElementById('tFacebook').value.trim();
            const otherSocial = document.getElementById('tOther').value.trim();
            const eduUndergrad = document.getElementById('tUnder').value.trim();
            const eduPostgrad = document.getElementById('tPost').value.trim();
            const dataPolicyAccepted = !!document.getElementById('tDataPolicy').checked;
            const imageConsent = !!document.getElementById('tImageConsent').checked;
            const photoFiles = getStashFiles('tphoto');
        
            if (!name) return alert('Escribe el nombre del maestro');
            if (!email) return alert('Escribe el correo');
            if (!password) password = generatePassword();
        
            // Email único
            const other = DB.users.find(u => u.email === email && (!editId || u.id !== editId));
            if (other) return alert('Ese correo ya está registrado');
        
            if (editId) {
                const t = DB.users.find(u => u.id === editId && u.role === 'teacher');
                if (!t) return alert('No se encontró el maestro');
        
                t.name = name;
                t.email = email;
                t.password = password;
                t.phone = phone;
                t.address = address;
                t.instagram = instagram;
                t.facebook = facebook;
                t.otherSocial = otherSocial;
                t.eduUndergrad = eduUndergrad;
                t.eduPostgrad = eduPostgrad;
                t.dataPolicyAccepted = dataPolicyAccepted;
                t.imageConsent = imageConsent;
                if (photoFiles.length) t.photo = photoFiles[0];
            } else {
                DB.users.push({
                    id: Date.now(),
                    role: 'teacher',
                    name,
                    email,
                    password,
                    phone,
                    address,
                    instagram,
                    facebook,
                    otherSocial,
                    eduUndergrad,
                    eduPostgrad,
                    dataPolicyAccepted,
                    imageConsent,
                    photo: photoFiles.length ? photoFiles[0] : null,
                    studentIds: []
                });
            }
        
            saveDB();
            closeModal();
            showAlert('✅ Maestro guardado');
        
            // Mostrar credenciales (para copiar)
            alert(`Credenciales del maestro:\n\nUsuario: ${email}\nClave: ${password}\n\n(Usa "Credenciales" para descargar un TXT.)`);
        
            renderTeachers();
        }

        function exportToXLSX(data, filename, title) {
            if (!data || data.length === 0) {
                showAlert('⚠️ No hay datos para exportar');
                return;
            }
            
            // Crear XML para XLSX (formato SpreadsheetML)
            const headers = Object.keys(data[0]);
            
            let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
            xml += '<?mso-application progid="Excel.Sheet"?>\n';
            xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"\n';
            xml += ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n';
            xml += '<Worksheet ss:Name="Datos">\n';
            xml += '<Table>\n';
            
            // Headers
            xml += '<Row>\n';
            headers.forEach(h => {
                xml += `<Cell><Data ss:Type="String">${escapeXML(h)}</Data></Cell>\n`;
            });
            xml += '</Row>\n';
            
            // Data
            data.forEach(row => {
                xml += '<Row>\n';
                headers.forEach(h => {
                    const val = row[h] || '';
                    xml += `<Cell><Data ss:Type="String">${escapeXML(String(val))}</Data></Cell>\n`;
                });
                xml += '</Row>\n';
            });
            
            xml += '</Table>\n';
            xml += '</Worksheet>\n';
            xml += '</Workbook>';
            
            const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename + '.xls';
            link.click();
            showAlert('✅ Archivo Excel exportado');
        }
        
        function escapeXML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }
        
        function exportData(data, filename, title) {
            // Preguntar formato
            const format = confirm('¿Exportar como HTML?\n\nOK = HTML\nCancelar = Excel (XLS)');
            
            if (format) {
                exportToHTML(data, filename, title);
            } else {
                exportToXLSX(data, filename, title);
            }
        }

        function calculateAge(birthDate) {
            const today = new Date();
            const birth = new Date(birthDate);
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
                age--;
            }
            return age + ' años';
        }

        // ========== EXPORTAR A EXCEL ==========
        function exportToExcel(data, filename) {
            if (!data || data.length === 0) {
                showAlert('⚠️ No hay datos para exportar');
                return;
            }
            
            const headers = Object.keys(data[0]);
            let csv = '\ufeff'; // BOM para UTF-8
            csv += headers.join(',') + '\n';
            
            data.forEach(row => {
                const values = headers.map(h => {
                    const val = row[h] || '';
                    return `"${String(val).replace(/"/g, '""')}"`;
                });
                csv += values.join(',') + '\n';
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename + '.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showAlert('✅ Archivo exportado: ' + filename + '.csv');
        }
        
        function calculateAge(birthDate) {
            if (!birthDate) return 'N/A';
            const today = new Date();
            const birth = new Date(birthDate);
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age + ' años';
        }

            for (let i = 0; i < 8; i++) p += chars.charAt(Math.floor(Math.random() * chars.length));
            return p;
        }

            let parents = [];
            if (course) {
                const students = DB.students.filter(s => s.courseId === course.id);
                parents = students.map(s => ({
                    email: s.parent1Email,
                    name: s.parent1Name
                })).filter(p => p.email);

                parents = allStudents.map(s => ({

${isTask ? '📝 NUEVA TAREA' : '📢 COMUNICADO'}

${item.title}

${courseInfo}
${dateInfo}

${description}

---
Agenda Escolar Digital - ${DB.institution.name || 'Mi Granjita'}
Desarrollado por: PhD. José Andrade | 911psicologia@gmail.com`;
