<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="tg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
  </defs>
  <!-- Cerebro simplificado izquierda -->
  <path d="M 40,14 C 26,14 16,22 14,34 C 12,44 18,54 28,58 L 40,60 Z"
        fill="url(#tg)" opacity="0.8"/>
  <!-- Cerebro simplificado derecha -->
  <path d="M 40,14 C 54,14 64,22 66,34 C 68,44 62,54 52,58 L 40,60 Z"
        fill="url(#tg)" opacity="0.72"/>
  <!-- Surcos pensamiento -->
  <path d="M 22,26 C 28,22 34,22 38,26" stroke="rgba(255,255,255,0.25)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 18,38 C 24,34 30,34 36,38" stroke="rgba(255,255,255,0.2)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M 58,26 C 52,22 46,22 42,26" stroke="rgba(255,255,255,0.25)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Chispa de pensamiento / idea -->
  <circle cx="40" cy="10" r="5" fill="#fde68a" opacity="0.9"/>
  <path d="M 37,10 L 40,4 L 43,10" stroke="#fde68a" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Destellos -->
  <path d="M 50,6 L 52,2 M 54,10 L 58,8 M 54,16 L 58,18" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Puntos sinápticos de pensamiento -->
  <circle cx="26" cy="48" r="3" fill="#a78bfa" opacity="0.7"/>
  <circle cx="40" cy="52" r="3" fill="#a78bfa" opacity="0.7"/>
  <circle cx="54" cy="48" r="3" fill="#a78bfa" opacity="0.7"/>
  <path d="M 26,48 L 40,52 L 54,48" stroke="#a78bfa" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Tronco conexión -->
  <path d="M 40,60 L 40,68" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>
