<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" font-family="'Outfit','DM Sans',sans-serif">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a2e4a"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </radialGradient>
    <radialGradient id="human-brain" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#7ec8f7"/>
      <stop offset="60%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="16" fill="url(#bg4)"/>

  <!-- Glow exterior -->
  <ellipse cx="100" cy="105" rx="68" ry="62" fill="rgba(79,142,247,0.06)" filter="url(#glow4)"/>

  <!-- Telencéfalo completo — lóbulos integrados -->
  <!-- Hemisferio izquierdo base -->
  <path d="M 100,44 C 76,44 56,54 44,70 C 32,86 30,106 36,124 C 42,140 55,152 70,158 L 100,162 Z"
        fill="url(#human-brain)" opacity="0.82"/>
  <!-- Hemisferio derecho base -->
  <path d="M 100,44 C 124,44 144,54 156,70 C 168,86 170,106 164,124 C 158,140 145,152 130,158 L 100,162 Z"
        fill="url(#human-brain)" opacity="0.78"/>

  <!-- Circunvoluciones elaboradas (carácter humano) -->
  <!-- Giro frontal superior -->
  <path d="M 52,72 C 62,62 76,58 88,62 C 96,66 100,74 100,82" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 148,72 C 138,62 124,58 112,62 C 104,66 100,74 100,82" stroke="rgba(255,255,255,0.22)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cisura de Silvio -->
  <path d="M 46,114 C 60,108 78,106 96,108 C 106,110 110,116 112,122" stroke="rgba(255,255,255,0.28)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 154,114 C 140,108 122,106 104,108" stroke="rgba(255,255,255,0.24)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Surco central -->
  <path d="M 100,44 C 100,66 100,92 100,118" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Surcos frontales -->
  <path d="M 68,54 C 66,72 66,90 68,108" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 132,54 C 134,72 134,90 132,108" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Surcos parietales -->
  <path d="M 42,94 C 52,90 66,88 78,92" stroke="rgba(255,255,255,0.14)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M 158,94 C 148,90 134,88 122,92" stroke="rgba(255,255,255,0.14)" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Borde cortical -->
  <path d="M 100,44 C 76,44 56,54 44,70 C 32,86 30,106 36,124 C 42,140 55,152 70,158 L 100,162 L 130,158 C 145,152 158,140 164,124 C 170,106 168,86 156,70 C 144,54 124,44 100,44 Z"
        fill="none" stroke="#7ec8f7" stroke-width="1.8" opacity="0.35"/>

  <!-- Cerebelo (pequeño, debajo) -->
  <path d="M 75,160 C 75,158 80,155 100,155 C 120,155 125,158 125,160 C 128,170 122,180 100,182 C 78,180 72,170 75,160 Z"
        fill="#6ee7b7" opacity="0.55"/>
  <path d="M 80,163 C 90,159 110,159 120,163" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="none"/>
  <path d="M 79,170 C 89,166 111,166 121,170" stroke="rgba(255,255,255,0.18)" stroke-width="1" fill="none"/>

  <!-- Tronco (pequeño, aún más abajo) -->
  <rect x="93" y="180" width="14" height="14" rx="7" fill="#f472b6" opacity="0.45"/>

  <!-- Brillo cortical prefrontal -->
  <ellipse cx="76" cy="72" rx="14" ry="10" fill="rgba(126,200,247,0.18)" opacity="0.7"/>

  <text x="100" y="20" text-anchor="middle" fill="rgba(221,238,255,0.95)" font-size="12" font-weight="700">Etapa 4</text>
  <text x="100" y="36" text-anchor="middle" fill="#7ec8f7" font-size="11" font-weight="600">Telencéfalo Humano</text>
  <circle cx="100" cy="193" r="3" fill="#4f8ef7" opacity="0.9"/>
</svg>
