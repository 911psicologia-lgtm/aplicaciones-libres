<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" font-family="'Outfit','DM Sans',sans-serif">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a2e4a"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </radialGradient>
    <radialGradient id="limbic" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="trunk2" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="16" fill="url(#bg2)"/>

  <!-- Tronco (herencia) -->
  <ellipse cx="100" cy="118" rx="22" ry="38" fill="url(#trunk2)" opacity="0.65"/>

  <!-- Sistema límbico — anillo alrededor del tronco -->
  <ellipse cx="100" cy="106" rx="46" ry="52" fill="url(#limbic)" opacity="0.75"/>
  <ellipse cx="100" cy="106" rx="46" ry="52" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>

  <!-- Tronco visible dentro -->
  <ellipse cx="100" cy="118" rx="18" ry="30" fill="rgba(251,113,128,0.5)"/>

  <!-- Hipocampo simulado (curva) -->
  <path d="M 60,95 C 55,108 57,122 65,132 C 72,140 82,143 90,140" stroke="#fde68a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Amígdala simulada (pequeño óvalo) -->
  <ellipse cx="136" cy="115" rx="12" ry="9" fill="#fde68a" opacity="0.6"/>

  <!-- Surcos -->
  <path d="M 75,65 C 72,80 72,98 74,114" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M 125,65 C 128,80 128,98 126,114" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Médula -->
  <rect x="92" y="154" width="14" height="22" rx="7" fill="#f472b6" opacity="0.45"/>

  <!-- Etiqueta -->
  <text x="100" y="24" text-anchor="middle" fill="rgba(221,238,255,0.9)" font-size="12" font-weight="700">Etapa 2</text>
  <text x="100" y="40" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">Sistema Límbico</text>
  <text x="100" y="185" text-anchor="middle" fill="rgba(107,138,184,0.7)" font-size="9">~200 mill. años</text>
  <circle cx="100" cy="193" r="3" fill="#fbbf24" opacity="0.7"/>
</svg>
